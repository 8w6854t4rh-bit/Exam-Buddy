<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfungstrainer Automobilkaufleute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: eine Spalte, oben Reiterleiste wie Karteireiter, Inhalt als Arbeitsblatt */
  --bg:#eef1f4; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#d3dae0;
  --accent:#0b6e99; --accent-ink:#ffffff; --soft:#e2eef4;
  --good:#1c7f47; --bad:#b93a2b; --warn:#a86a00;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#17222a; --ink:#e7eef3; --muted:#9aabb8; --line:#2b3a45;
  --accent:#4fb4de; --accent-ink:#06202d; --soft:#1d3440; --good:#56c78a; --bad:#ef8375; --warn:#e3b04d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#17222a; --ink:#e7eef3; --muted:#9aabb8; --line:#2b3a45;
  --accent:#4fb4de; --accent-ink:#06202d; --soft:#1d3440; --good:#56c78a; --bad:#ef8375; --warn:#e3b04d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
h1{font-family:var(--display);font-size:26px;line-height:1;margin:0;letter-spacing:.3px;text-transform:uppercase}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 12px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0}
nav a[aria-current="page"]{color:var(--ink);background:var(--bg);border-color:var(--line)}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.3px;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.tile b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.good{border-color:var(--good);color:var(--good)}
button.bad{border-color:var(--bad);color:var(--bad)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input[type=text]{max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px}
.chip{border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.card{min-height:230px;justify-content:space-between;cursor:pointer}
.card .q{font-size:19px;font-weight:600;text-wrap:balance}
.card .a{border-top:1px dashed var(--line);padding-top:12px}
.opt{text-align:left;font-weight:500;width:100%}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.note{border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.note.ok{border-color:var(--good)} .note.no{border-color:var(--bad)}
.steps{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;overflow-x:auto}
.acct{font-family:var(--mono);font-size:13.5px;text-align:left;display:flex;gap:8px;align-items:center;width:100%;font-weight:400}
.acct b{font-weight:600}
.acct em{margin-left:auto;font-style:normal;font-family:var(--body);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line)}
.acct.S{border-color:var(--accent)} .acct.S em{background:var(--accent);color:var(--accent-ink)}
.acct.H{border-color:var(--warn)} .acct.H em{background:var(--warn);color:#fff}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.grow{flex:1 1 140px}
@media (prefers-reduced-motion:no-preference){.sheet{transition:border-color .15s}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><h1>Prüfungstrainer</h1><small>Automobilkaufleute · Teil 2</small></div>
  <nav id="nav" aria-label="Bereiche">
    <a href="#start">Start</a><a href="#karten">Karteikarten</a><a href="#quiz">Quiz</a><a href="#rechnen">Rechnen</a><a href="#buchen">Buchen</a><a href="#kannliste">Kann-Liste</a>
  </nav>
</div></header>
<main id="app"></main>
<script>
const D={"konten": {"0200": "Technische Anlagen, Maschinen", "0300": "Betriebs- und Geschäftsausstattung", "0480": "Geringwertige Wirtschaftsgüter", "1000": "Kasse", "1200": "Bank", "1400": "Forderungen aLuL", "1570": "Abziehbare Vorsteuer", "1600": "Verbindlichkeiten aLuL", "1770": "Umsatzsteuer", "2100": "Zinsaufwendungen", "3000": "Bestand Neuwagen", "3030": "Bestand Überführung", "3100": "Bestand GW regelbesteuert", "3110": "Bestand GW differenzbesteuert", "3300": "Bestand Teile", "4400": "Miete, Pacht", "4410": "Energiekosten", "4620": "Abschreibungen auf Sachanlagen", "4800": "Werbekosten", "7000": "VAK Neuwagen", "7030": "VAK Überführung", "7100": "VAK GW regelbesteuert", "7110": "VAK GW differenzbesteuert", "7300": "VAK Teile über Theke", "7310": "VAK Teile durch die Werkstatt", "8000": "Erlöse Neuwagen", "8030": "Erlöse Überführung", "8100": "Erlöse GW regelbesteuert", "8110": "Erlöse GW differenzbesteuert", "8111": "Mehrerlöse Differenzbesteuerung", "8200": "Erlöse Zulassungspauschale", "8300": "Erlöse Teile über Theke", "8310": "Erlöse Teile durch die Werkstatt", "8410": "Lohnerlöse", "8420": "Erlöse Fremdleistungen"}, "buchungen": [["Eingangsrechnung: Ersatzteile für 1.000,00 € netto auf Ziel gekauft.", [["3300", 1000], ["1570", 190]], [["1600", 1190]], "Karte 1: Einkauf."], ["Ausgangsrechnung: Zubehör über die Theke für 200,00 € netto auf Rechnung verkauft.", [["1400", 238]], [["8300", 200], ["1770", 38]], "Karte 2: Verkauf."], ["Lagerentnahme zum Thekenverkauf: Einstandspreis des Zubehörs 120,00 €.", [["7300", 120]], [["3300", 120]], "Karte 3: Lagerbestandskorrektur."], ["Der Kunde überweist die Rechnung über 238,00 €.", [["1200", 238]], [["1400", 238]], "Karte 4 b."], ["Wir überweisen eine Lieferantenrechnung über 1.190,00 € ohne Abzug.", [["1600", 1190]], [["1200", 1190]], "Karte 4 a."], ["Wir zahlen die Teilerechnung über 1.190,00 € mit 2 % Skonto per Bank. Im Kontenplan gibt es kein Skontokonto.", [["1600", 1190]], [["1200", 1166.2], ["3300", 20], ["1570", 3.8]], "Skonto netto mindert den Bestand, die Vorsteuer wird korrigiert."], ["Ein Kunde zahlt eine Teilerechnung (Theke) über 2.380,00 € mit 2 % Skonto per Bank. Im Kontenplan gibt es kein Skontokonto.", [["1200", 2332.4], ["8300", 40], ["1770", 7.6]], [["1400", 2380]], "Skonto netto mindert den Erlös, die Umsatzsteuer wird korrigiert."], ["Neuwagenverkauf auf Rechnung: Fahrzeug 30.000,00 €, Überführung 800,00 €, Zulassung 150,00 € (alles netto).", [["1400", 36830.5]], [["8000", 30000], ["8030", 800], ["8200", 150], ["1770", 5880.5]], "Drei Erlöskonten plus Umsatzsteuer."], ["Lagerentnahme zum Neuwagenverkauf: Einstandspreis Fahrzeug 26.000,00 €.", [["7000", 26000]], [["3000", 26000]], "VAK an Bestand."], ["Lagerentnahme der Überführung: vom Hersteller berechnet 600,00 € netto.", [["7030", 600]], [["3030", 600]], "VAK an Bestand."], ["Ankauf eines Gebrauchtwagens von einer Privatperson für 10.000,00 € per Überweisung.", [["3110", 10000]], [["1200", 10000]], "Von privat: kein Vorsteuerabzug, differenzbesteuerter Bestand."], ["Ankauf eines Gebrauchtwagens von einer GmbH für 15.000,00 € netto auf Ziel.", [["3100", 15000], ["1570", 2850]], [["1600", 17850]], "Vom Unternehmer: Vorsteuer, regelbesteuerter Bestand."], ["Verkauf des für 10.000,00 € von privat angekauften GW für 12.380,00 € an einen Privatkunden (§ 25a UStG).", [["1400", 12380]], [["8110", 10000], ["8111", 2000], ["1770", 380]], "Differenz 2.380 ist brutto: 380 USt, 2.000 Mehrerlös."], ["Lagerentnahme des differenzbesteuerten GW (Einkaufspreis 10.000,00 €).", [["7110", 10000]], [["3110", 10000]], "VAK an Bestand."], ["Werkstattrechnung an einen Privatkunden: Lohn 300,00 €, Teile 200,00 €, Fremdleistung 100,00 € (netto).", [["1400", 714]], [["8410", 300], ["8310", 200], ["8420", 100], ["1770", 114]], "Lohn, Teile durch Werkstatt, Fremdleistung getrennt."], ["Kontoauszug: Miete für die Ausstellungsfläche 7.500,00 € abgebucht.", [["4400", 7500]], [["1200", 7500]], "Aufwand an Bank, keine Vorsteuer im Beispiel."], ["Kontoauszug: Sollzinsen für die Kontoüberziehung 85,00 €.", [["2100", 85]], [["1200", 85]], "Zinsaufwand an Bank."], ["Kauf einer Hebebühne für 20.000,00 € netto auf Ziel.", [["0200", 20000], ["1570", 3800]], [["1600", 23800]], "Anlagevermögen wird aktiviert."], ["Jahresabschreibung auf die Hebebühne: 2.000,00 €.", [["4620", 2000]], [["0200", 2000]], "Abschreibung an Anlagekonto."]], "karten": [["KUP", "Buchen", "Wie lauten die 4 Grundbuchungen (4 Karten)?", "1 Einkauf: Bestand + Vorsteuer an Verbindlichkeiten. 2 Verkauf: Forderungen an Erlöse + Umsatzsteuer. 3 Lagerbestandskorrektur: VAK an Bestand. 4 Bezahlung: Verbindlichkeiten an Bank bzw. Bank an Forderungen."], ["KUP", "Buchen", "Was bedeutet VAK und wann wird gebucht?", "Verrechnete Anschaffungskosten = Wareneinsatz zum Einstandspreis. Bei jedem Verkauf: VAK an Bestand (Aufwandsbuchung)."], ["KUP", "Buchen", "Wie bucht man die Zahlung einer Eingangsrechnung mit Skonto?", "Verbindlichkeiten (voller Betrag) an Bank (Zahlbetrag), Skonto netto (Skontoertrag bzw. Bestandskonto) und Vorsteuerkorrektur."], ["KUP", "Buchen", "Wie bucht man den Zahlungseingang eines Kunden mit Skonto?", "Bank (Zahlbetrag), Skonto netto (Skontoaufwand bzw. Erlöskonto) und Umsatzsteuerkorrektur an Forderungen (voller Betrag)."], ["KUP", "Buchen", "Was ist die Differenzbesteuerung (§ 25a UStG)?", "Umsatzsteuer fällt nur auf die Differenz zwischen Verkaufs- und Einkaufspreis an. Voraussetzung: Ankauf ohne Vorsteuerabzug (z. B. von privat). USt = Differenz × 19/119. Kein Steuerausweis auf der Rechnung."], ["KUP", "Buchen", "Wie wird ein differenzbesteuerter GW-Verkauf gebucht?", "1400 Forderungen an 8110 (Einkaufspreis), 8111 Mehrerlöse (Marge netto), 1770 USt (aus der Marge). Danach 7110 an 3110."], ["KUP", "Buchen", "Was ist die Altteilsteuer?", "Beim Austauschteil gilt das Altteil als Teil der Gegenleistung: 10 % des Austauschteil-Preises × 19 % kommen zur normalen Umsatzsteuer dazu (Konto 1795)."], ["KUP", "Rechnen", "Wie rechnet man vom Überweisungsbetrag nach Skonto auf den Rechnungsbetrag zurück?", "Rechnungsbetrag = Zahlbetrag / (1 − Skontosatz), z. B. / 0,98 bei 2 %."], ["KUP", "Rechnen", "Wie kommt man von brutto auf netto und auf die enthaltene Umsatzsteuer?", "Netto = Brutto / 1,19. USt = Brutto × 19 / 119."], ["KUP", "Kalkulation", "Nenne die Stufen der Handelskalkulation.", "Listeneinkaufspreis − Rabatt = Zieleinkaufspreis − Skonto = Bareinkaufspreis + Bezugskosten = Bezugspreis + Gemeinkosten = Selbstkosten + Gewinn = Barverkaufspreis + Kundenskonto = Zielverkaufspreis + Kundenrabatt = Listenverkaufspreis netto + USt = Bruttoverkaufspreis."], ["KUP", "Kalkulation", "Wann Vorwärts-, Rückwärts-, Differenzkalkulation?", "Vorwärts: Verkaufspreis gesucht. Rückwärts: Verkaufspreis vorgegeben, höchster Einkaufspreis gesucht. Differenz: beide Preise fest, Gewinn gesucht."], ["KUP", "Kalkulation", "Kalkulationszuschlag, Kalkulationsfaktor, Handelsspanne?", "Zuschlag = (VK netto − Bezugspreis) / Bezugspreis × 100. Faktor = VK netto / Bezugspreis. Handelsspanne = (VK netto − Bezugspreis) / VK netto × 100."], ["KUP", "Kalkulation", "Warum rechnet man Kundenskonto und Kundenrabatt „im Hundert“?", "Weil der Kunde sie vom höheren Preis abzieht. Der Barverkaufspreis entspricht z. B. 98 % des Zielverkaufspreises, also durch 0,98 teilen."], ["KUP", "KLR", "Welche drei Stufen hat die KLR?", "Kostenartenrechnung (welche Kosten?), Kostenstellenrechnung (wo? BAB), Kostenträgerrechnung (wofür? Kalkulation)."], ["KUP", "KLR", "Unterschied Aufwand und Kosten?", "Aufwand: gesamter Werteverzehr laut GuV. Kosten: nur der betriebsbedingte, periodengerechte, gewöhnliche Werteverzehr."], ["KUP", "KLR", "Was sind neutrale Aufwendungen?", "Aufwand, der keine Kosten darstellt: betriebsfremd (Spende), periodenfremd (Steuernachzahlung), außerordentlich (Brandschaden)."], ["KUP", "KLR", "Grundkosten, Anderskosten, Zusatzkosten?", "Grundkosten: Aufwand = Kosten. Anderskosten: Aufwand in anderer Höhe (kalk. Abschreibung, kalk. Zinsen, Wagnisse). Zusatzkosten: kein Aufwand (kalk. Unternehmerlohn, kalk. Miete)."], ["KUP", "KLR", "Warum kalkulatorischer Unternehmerlohn?", "Bei e. K., OHG, KG erhält der Inhaber kein Gehalt. Damit seine Arbeit in die Preise eingeht und der Vergleich mit GmbH/AG stimmt, wird ein Lohn angesetzt."], ["KUP", "KLR", "Einzelkosten und Gemeinkosten mit Beispielen?", "Einzelkosten direkt zurechenbar: Einstandspreis Fahrzeug/Teil, produktiver Lohn, Provision. Gemeinkosten nur über Schlüssel: Miete, Verwaltungsgehälter, Energie, Werbung."], ["KUP", "KLR", "Welche Aufgaben hat der BAB?", "Gemeinkosten auf Kostenstellen verteilen, Hilfs- auf Hauptkostenstellen umlegen, Zuschlagssätze ermitteln, Kosten kontrollieren."], ["KUP", "KLR", "Welche vier Hauptkostenstellen hat ein Autohaus?", "Neuwagen, Gebrauchtwagen, Teile und Zubehör, Werkstatt (Kundendienst). Verwaltung ist Hilfskostenstelle."], ["KUP", "KLR", "Unterschied Haupt- und Hilfskostenstelle?", "Hauptkostenstellen erbringen Leistungen für den Markt und rechnen ihre Kosten auf Kostenträger ab. Hilfskostenstellen arbeiten für andere Stellen und werden auf sie umgelegt."], ["KUP", "KLR", "Wie berechnet man den Gemeinkostenzuschlagssatz?", "Gemeinkosten der Stelle / Einzelkosten der Stelle × 100. Werkstatt: Bezugsgröße produktive Löhne. Handel: VAK."], ["KUP", "KLR", "Passende Verteilungsschlüssel für Miete, Energie, Abschreibung, Werbung?", "Miete: Fläche. Energie: Verbrauch. Abschreibung: Anlagewerte. Werbung: Umsatz. Telefon: Anschlüsse. Unternehmerlohn: Zeitanteile."], ["KUP", "Deckungsbeitrag", "Unterschied Vollkosten- und Teilkostenrechnung?", "Vollkosten: alle Kosten auf die Kostenträger, für langfristige Preise. Teilkosten: nur variable Kosten, Fixkosten als Block, für kurzfristige Entscheidungen."], ["KUP", "Deckungsbeitrag", "Was ist ein Deckungsbeitrag?", "Erlös − variable Kosten. Der Betrag, der zur Deckung der Fixkosten und danach zum Gewinn beiträgt."], ["KUP", "Deckungsbeitrag", "Variable und fixe Kosten: je zwei Beispiele aus dem Autohaus?", "Variabel: Wareneinsatz, Verkäuferprovision, produktive Löhne. Fix: Miete, Gehälter der Verwaltung, Abschreibungen, Versicherungen."], ["KUP", "Deckungsbeitrag", "Kurzfristige und langfristige Preisuntergrenze?", "Kurzfristig: variable Stückkosten (DB = 0). Langfristig: Selbstkosten je Stück (alle Kosten gedeckt)."], ["KUP", "Deckungsbeitrag", "Aufbau der mehrstufigen Deckungsbeitragsrechnung (KER)?", "Erlöse − variable Kosten I = DB 1 (Bruttoertrag) − variable Kosten II (verkaufsabhängig) = DB 2 − geschäftsfeldbezogene Fixkosten = DB 3 − unternehmensbezogene Fixkosten = Betriebsergebnis."], ["KUP", "Deckungsbeitrag", "Was ist der Break-even-Point und wie berechnet man ihn?", "Gewinnschwelle: Erlöse = Gesamtkosten. Menge = Fixkosten / (Preis − variable Stückkosten)."], ["KUP", "Werkstatt", "Was ist der Stundenverrechnungssatz?", "Preis einer Werkstattstunde für den Kunden. Deckt Lohn, alle Gemeinkosten der Werkstatt, Wagnis und Gewinn."], ["KUP", "Werkstatt", "Was ist der Werkstattindex?", "Soll-Lohnerlöse / produktive Löhne bzw. Stundenverrechnungssatz / Schnittlohn. Er zeigt, das Wievielfache des Lohns erlöst werden muss."], ["KUP", "Werkstatt", "Wie ermittelt man den Stundenverrechnungssatz aus einer Rechnung mit Arbeitswerten?", "Lohnpreis netto / berechnete AW × AW je Stunde (z. B. 10 oder 100 AW je Stunde)."], ["KUP", "Werkstatt", "Produktive und unproduktive Löhne?", "Produktiv: direkt an Kundenaufträgen verrechenbare Monteurstunden. Unproduktiv: nicht verrechenbar, z. B. Aufräumen, Schulung, Wartezeit, Werkstattmeister, Lager."], ["KUP", "Werkstatt", "Warum ist der Garantie-Stundensatz niedriger?", "Der Hersteller gibt Vergütungssatz und Arbeitszeiten vor. Der Betrieb kann ihn nicht frei kalkulieren."], ["KUP", "Kennzahlen", "Eigenkapitalquote und ihre Aussage?", "EK / Gesamtkapital × 100. Je höher, desto unabhängiger und kreditwürdiger ist das Unternehmen."], ["KUP", "Kennzahlen", "Liquidität 1., 2., 3. Grades?", "1: flüssige Mittel / kurzfristiges FK. 2: (flüssige Mittel + Forderungen) / kurzfristiges FK. 3: Umlaufvermögen / kurzfristiges FK. Jeweils × 100."], ["KUP", "Kennzahlen", "Eigenkapital-, Gesamtkapital-, Umsatzrentabilität?", "EK-Rent.: Gewinn / EK. GK-Rent.: (Gewinn + FK-Zinsen) / Gesamtkapital. Umsatzrent.: Gewinn / Umsatz. Jeweils × 100."], ["KUP", "Kennzahlen", "Was sagt die Umsatzrentabilität aus?", "Wie viel Prozent vom Umsatz als Gewinn bleiben, also wie viel Cent Gewinn je Euro Umsatz."], ["KUP", "Kennzahlen", "Was besagt die goldene Bilanzregel?", "Langfristiges Vermögen soll langfristig finanziert sein. Streng: EK deckt das Anlagevermögen. Weniger streng: EK + langfristiges FK decken es."], ["KUP", "Kennzahlen", "Was ist der Leverage-Effekt?", "Liegt die Gesamtkapitalrentabilität über dem Fremdkapitalzins, steigert zusätzliches Fremdkapital die Eigenkapitalrentabilität."], ["KUP", "Kennzahlen", "Betriebsergebnis, neutrales Ergebnis, Unternehmensergebnis?", "Betriebsergebnis = Leistungen − Kosten. Neutrales Ergebnis = neutrale Erträge − neutrale Aufwendungen. Zusammen: Unternehmensergebnis (GuV)."], ["KUP", "Kennzahlen", "Lagerkennzahlen?", "Ø Lagerbestand = (Anfangs- + Endbestand) / 2. Umschlagshäufigkeit = Wareneinsatz / Ø Lagerbestand. Ø Lagerdauer = 360 / Umschlagshäufigkeit."], ["KUP", "Kennzahlen", "Horizontale und vertikale Bilanzanalyse?", "Vertikal: Aufbau einer Seite (z. B. EK-Quote, Anlagenintensität). Horizontal: Aktiva zu Passiva (Anlagendeckung, Liquidität)."], ["KUP", "Anlagen", "Wie setzen sich Anschaffungskosten zusammen?", "Kaufpreis netto − Preisnachlässe (Rabatt, Skonto) + Anschaffungsnebenkosten (Fracht, Montage, Zulassung)."], ["KUP", "Anlagen", "Lineare Abschreibung: Betrag und Satz?", "Betrag = Anschaffungskosten / Nutzungsdauer. Satz = 100 / Nutzungsdauer. Im ersten Jahr monatsgenau."], ["KUP", "Anlagen", "Was ist ein GWG?", "Geringwertiges Wirtschaftsgut: beweglich, abnutzbar, selbstständig nutzbar, bis 800 € netto. Darf sofort voll abgeschrieben werden."], ["KUP", "Anlagen", "Welche Ursachen kann eine Inventurdifferenz haben?", "Diebstahl, Schwund, Bruch, Zählfehler, Buchungsfehler, nicht erfasste Entnahme."], ["KUP", "Personal", "Wie berechnet man den Nettopersonalbedarf?", "Soll-Bestand − (Ist-Bestand + feststehende Zugänge − feststehende Abgänge)."], ["KUP", "Personal", "Ersatz-, Neu- und Minderbedarf?", "Ersatzbedarf: ausscheidende Mitarbeiter ersetzen. Neu-/Mehrbedarf: zusätzliche Stellen. Minderbedarf: Stellen fallen weg."], ["KUP", "Personal", "Stellenbeschreibung und Stellenausschreibung?", "Beschreibung: internes Dokument mit Aufgaben, Befugnissen, Einordnung, Anforderungen. Ausschreibung: Anzeige zur Bewerbersuche, zusätzlich Firmenprofil, Eintrittstermin, Leistungen, Bewerbungsweg."], ["KUP", "Personal", "Gesetzliche Kündigungsfristen (§ 622 BGB)?", "Grundfrist 4 Wochen zum 15. oder Monatsende. Probezeit 2 Wochen. Arbeitgeber: ab 2 Jahren 1 Monat, 5 → 2, 8 → 3, 10 → 4, 12 → 5, 15 → 6, 20 → 7 Monate zum Monatsende."], ["KUP", "Personal", "Was gilt für befristete Verträge ohne Sachgrund?", "Höchstens 2 Jahre, darin höchstens 3 Verlängerungen, schriftlich vor Arbeitsbeginn (TzBfG)."], ["KUP", "Personal", "Welche Arbeitspapiere erhält ein ausscheidender Mitarbeiter?", "Arbeitszeugnis, Lohnsteuerbescheinigung, Urlaubsbescheinigung, Arbeitsbescheinigung für die Agentur für Arbeit, Sozialversicherungsmeldung."], ["KUP", "Personal", "Mindesturlaub und Wartezeit?", "24 Werktage bei 6-Tage-Woche (= 20 Arbeitstage bei 5 Tagen). Voller Anspruch nach 6 Monaten, vorher 1/12 je vollem Monat."], ["KUP", "Personal", "Homeoffice und mobiles Arbeiten?", "Homeoffice: fest eingerichteter Arbeitsplatz zu Hause. Mobiles Arbeiten: Arbeit von beliebigen Orten."], ["WiSo", "Recht", "Stufen der Geschäftsfähigkeit?", "0–6 geschäftsunfähig. 7–17 beschränkt geschäftsfähig. Ab 18 voll geschäftsfähig."], ["WiSo", "Recht", "Was regelt der Taschengeldparagraf (§ 110 BGB)?", "Ein beschränkt Geschäftsfähiger schließt wirksam ab, wenn er die Leistung mit Mitteln bewirkt, die ihm zur freien Verfügung überlassen wurden."], ["WiSo", "Recht", "Rechtsfähigkeit?", "Fähigkeit, Träger von Rechten und Pflichten zu sein. Natürliche Personen ab Geburt, juristische ab Eintragung."], ["WiSo", "Recht", "Nichtige Rechtsgeschäfte?", "Geschäftsunfähigkeit, Formmangel, Gesetzesverstoß, Sittenwidrigkeit, Schein- und Scherzgeschäft. Von Anfang an unwirksam."], ["WiSo", "Recht", "Anfechtbare Rechtsgeschäfte?", "Irrtum, arglistige Täuschung, widerrechtliche Drohung. Gültig, bis angefochten wird."], ["WiSo", "Recht", "Besitz und Eigentum?", "Besitz: tatsächliche Herrschaft über die Sache. Eigentum: rechtliche Herrschaft."], ["WiSo", "Recht", "Wie geht Eigentum an einer beweglichen Sache über?", "Durch Einigung und Übergabe. Zahlung allein genügt nicht."], ["WiSo", "Recht", "Was gilt für AGB?", "Vorformulierte Bedingungen, sparen Verhandlungsaufwand. Müssen einbezogen sein. Individuelle Abreden haben Vorrang. Unwirksame Klauseln fallen weg, der Vertrag bleibt."], ["WiSo", "Recht", "Rechte des Käufers beim Sachmangel?", "Zuerst Nacherfüllung (Nachbesserung oder Ersatz). Danach Rücktritt, Minderung, Schadenersatz. Verjährung 2 Jahre."], ["WiSo", "Recht", "Beweislastumkehr beim Verbrauchsgüterkauf?", "Tritt der Mangel in den ersten 12 Monaten auf, wird vermutet, dass er schon bei Übergabe vorlag (§ 477 BGB)."], ["WiSo", "Recht", "Darf die Sachmängelhaftung gegenüber Verbrauchern verkürzt werden?", "Bei neuen Sachen nicht unter 2 Jahre. Bei gebrauchten Sachen auf mindestens 1 Jahr."], ["WiSo", "Recht", "Rügepflicht beim zweiseitigen Handelskauf?", "Ware unverzüglich prüfen und Mängel unverzüglich rügen. Versteckte Mängel unverzüglich nach Entdeckung, innerhalb der Verjährung."], ["WiSo", "Recht", "Wann kommt ein Käufer in Zahlungsverzug?", "Bei kalendermäßig bestimmtem Termin mit dessen Ablauf, sonst durch Mahnung, spätestens 30 Tage nach Fälligkeit und Rechnungszugang."], ["WiSo", "Recht", "Sicherungsübereignung?", "Die Bank wird Eigentümerin, der Kreditnehmer bleibt Besitzer und nutzt die Sache weiter."], ["WiSo", "Recht", "Haftung und Mindestkapital der GmbH?", "Es haftet nur das Gesellschaftsvermögen. Stammkapital mindestens 25.000 €."], ["WiSo", "Recht", "Gesetzliche Gewinnverteilung der GmbH?", "Nach dem Verhältnis der Geschäftsanteile."], ["WiSo", "Recht", "Haftung in der OHG?", "Alle Gesellschafter haften unbeschränkt (auch privat), unmittelbar und gesamtschuldnerisch."], ["WiSo", "Recht", "Was darf ein Prokurist nicht?", "Grundstücke verkaufen oder belasten (ohne besondere Befugnis), Bilanz unterschreiben, Prokura erteilen, Gesellschafter aufnehmen, Unternehmen verkaufen, Insolvenz anmelden."], ["WiSo", "Recht", "Was darf ein Handlungsbevollmächtigter ohne Sondervollmacht nicht?", "Darlehen aufnehmen, Prozesse führen, Grundstücke veräußern oder belasten, Wechselverbindlichkeiten eingehen."], ["WiSo", "Recht", "Einzel-, Gesamt-, Filialprokura?", "Einzel: allein vertretungsberechtigt. Gesamt: nur gemeinsam mit einem weiteren Berechtigten. Filial: auf eine Niederlassung beschränkt."], ["WiSo", "Arbeit", "Welches Gesetz regelt die duale Ausbildung?", "Das Berufsbildungsgesetz (BBiG)."], ["WiSo", "Arbeit", "Kündigung des Ausbildungsverhältnisses nach der Probezeit?", "Azubi: 4 Wochen Frist bei Aufgabe oder Wechsel des Berufs. Beide: fristlos aus wichtigem Grund. Schriftlich mit Gründen."], ["WiSo", "Arbeit", "Pausen und Arbeitszeit nach Jugendarbeitsschutzgesetz?", "Max. 8 Stunden täglich, 40 wöchentlich, 5-Tage-Woche. 30 min Pause bei mehr als 4,5 bis 6 Stunden, 60 min bei mehr als 6 Stunden."], ["WiSo", "Arbeit", "Betriebsratswahl: wann, wer wählt, wer ist wählbar?", "Alle 4 Jahre vom 1. März bis 31. Mai. Wahlberechtigt ab 16. Wählbar ab 18 nach 6 Monaten Betriebszugehörigkeit."], ["WiSo", "Arbeit", "JAV: Wahl und Wahlrecht?", "Alle 2 Jahre vom 1. Oktober bis 30. November. Wahlberechtigt: unter 18 und alle Azubis. Wählbar: unter 25 und Azubis."], ["WiSo", "Arbeit", "Reihenfolge einer Tarifauseinandersetzung?", "Kündigung und Verhandlung, Scheitern, Schlichtung, Scheitern, Urabstimmung, Streik, neue Verhandlung, Urabstimmung über das Ergebnis, neuer Tarifvertrag."], ["WiSo", "Arbeit", "Was bedeutet Friedenspflicht?", "Während der Laufzeit des Tarifvertrags sind Arbeitskämpfe um seine Inhalte unzulässig."], ["WiSo", "Arbeit", "Wer überwacht den Arbeitsschutz?", "Staatliche Gewerbeaufsicht und Berufsgenossenschaften."], ["WiSo", "Arbeit", "Wie lange Entgeltfortzahlung bei Krankheit?", "6 Wochen durch den Arbeitgeber, danach Krankengeld von der Krankenkasse."], ["WiSo", "Soziales", "Die fünf Zweige der Sozialversicherung und ihre Träger?", "Kranken (Krankenkassen), Pflege (Pflegekassen), Renten (Deutsche Rentenversicherung), Arbeitslosen (Bundesagentur für Arbeit), Unfall (Berufsgenossenschaften)."], ["WiSo", "Soziales", "Wer zahlt die Unfallversicherung und was deckt sie?", "Nur der Arbeitgeber. Arbeitsunfälle, Wegeunfälle, Berufskrankheiten."], ["WiSo", "Soziales", "Was bedeutet Beitragsbemessungsgrenze?", "Bis zu diesem Bruttoentgelt werden Beiträge berechnet. Der Teil darüber bleibt beitragsfrei."], ["WiSo", "Soziales", "Werbungskosten und Sonderausgaben?", "Werbungskosten: Ausgaben für den Beruf (Fahrten, Arbeitsmittel, Fortbildung). Sonderausgaben: Vorsorgeaufwendungen, Kirchensteuer, Spenden."], ["WiSo", "Markt", "Bedingungen des vollkommenen Marktes?", "Homogene Güter, keine Präferenzen (sachlich, persönlich, räumlich, zeitlich), vollständige Transparenz, sofortige Reaktion, viele Anbieter und Nachfrager."], ["WiSo", "Markt", "Funktionen des Gleichgewichtspreises?", "Ausgleich (Markträumung), Signal (Knappheit), Lenkung (Produktionsfaktoren), Auslese (unwirtschaftliche Anbieter)."], ["WiSo", "Markt", "Angebotsüberhang und Käufermarkt?", "Preis über dem Gleichgewicht: Angebot größer als Nachfrage. Käufer sind in der stärkeren Position, Preise geraten unter Druck."], ["WiSo", "Markt", "Nachfrageüberhang und Verkäufermarkt?", "Preis unter dem Gleichgewicht: Nachfrage größer als Angebot. Verkäufer sind in der stärkeren Position."], ["WiSo", "Markt", "Was passiert, wenn die Nachfrage steigt (Kurve nach rechts)?", "Gleichgewichtspreis und Gleichgewichtsmenge steigen."], ["WiSo", "Markt", "Was passiert, wenn das Angebot steigt (Kurve nach rechts)?", "Der Gleichgewichtspreis sinkt, die Menge steigt."], ["WiSo", "Markt", "Konsumenten- und Produzentenrente?", "Konsumentenrente: Vorteil der Käufer, die mehr gezahlt hätten. Produzentenrente: Vorteil der Anbieter, die billiger verkauft hätten."], ["WiSo", "Markt", "Polypol, Angebotsoligopol, Angebotsmonopol?", "Viele Anbieter und viele Nachfrager. Wenige Anbieter und viele Nachfrager. Ein Anbieter und viele Nachfrager."], ["WiSo", "Markt", "Folgen von Höchst- und Mindestpreis?", "Höchstpreis (unter Gleichgewicht): Nachfrageüberhang, Schwarzmarkt. Mindestpreis (über Gleichgewicht): Angebotsüberhang, Staat muss Überschüsse abnehmen."], ["WiSo", "Markt", "Marktkonforme und marktkonträre Eingriffe?", "Marktkonform: Preisbildung bleibt frei (Subventionen, Steuern, Transfers). Marktkonträr: Preis wird vorgeschrieben (Höchst-, Mindest-, Festpreis)."], ["WiSo", "VWL", "Akteure im erweiterten Wirtschaftskreislauf?", "Private Haushalte, Unternehmen, Staat, Banken (Kapitalsammelstellen), Ausland."], ["WiSo", "VWL", "Maximal- und Minimalprinzip?", "Maximal: mit gegebenen Mitteln den größten Erfolg. Minimal: ein gegebenes Ziel mit geringstem Mitteleinsatz."], ["WiSo", "VWL", "Merkmale der sozialen Marktwirtschaft?", "Privateigentum mit Sozialbindung, freie Preisbildung, Wettbewerbsschutz, Vertrags- und Gewerbefreiheit, Tarifautonomie, soziale Sicherung und Umverteilung."], ["WiSo", "VWL", "Kooperation und Konzentration?", "Kooperation: Zusammenarbeit rechtlich selbstständiger Unternehmen in Teilbereichen. Konzentration: wirtschaftliche Selbstständigkeit geht verloren (Konzern, Fusion)."], ["WiSo", "VWL", "Horizontaler, vertikaler, diagonaler Zusammenschluss?", "Horizontal: gleiche Produktions-/Handelsstufe. Vertikal: vor- und nachgelagerte Stufen. Diagonal: verschiedene Branchen."], ["WiSo", "VWL", "Aufgaben des Bundeskartellamts?", "Kartellverbot durchsetzen, Missbrauch marktbeherrschender Stellungen verfolgen, Fusionen kontrollieren."], ["WiSo", "VWL", "Das magische Viereck?", "Preisniveaustabilität, hoher Beschäftigungsstand, außenwirtschaftliches Gleichgewicht, stetiges und angemessenes Wirtschaftswachstum (Stabilitätsgesetz 1967)."], ["WiSo", "VWL", "Womit misst man die vier Ziele?", "Inflationsrate (Verbraucherpreisindex), Arbeitslosenquote, Außenbeitrag, Wachstum des realen BIP."], ["WiSo", "VWL", "Was ist das BIP und wie berechnet man es nach der Verwendung?", "Wert aller im Inland in einem Jahr erzeugten Waren und Dienstleistungen. Konsum privat + Konsum Staat + Bruttoinvestitionen + (Exporte − Importe)."], ["WiSo", "VWL", "Nominales und reales BIP?", "Nominal: zu aktuellen Preisen. Real: preisbereinigt, zeigt das tatsächliche Wachstum."], ["WiSo", "VWL", "Lohnquote?", "Arbeitnehmerentgelt / Volkseinkommen × 100. Gegenstück: Gewinnquote."], ["WiSo", "VWL", "Warum ist das BIP als Wohlstandsmaß umstritten?", "Unbezahlte Arbeit und Schattenwirtschaft fehlen, Umweltschäden und Unfälle erhöhen es, Verteilung und Lebensqualität bleiben offen."], ["WiSo", "VWL", "Die vier Konjunkturphasen?", "Aufschwung (Expansion), Hochkonjunktur (Boom), Abschwung (Rezession), Tiefstand (Depression)."], ["WiSo", "VWL", "Früh-, Präsenz- und Spätindikatoren?", "Früh: Auftragseingänge, Geschäftsklimaindex, Baugenehmigungen. Präsenz: BIP, Produktion, Kapazitätsauslastung. Spät: Arbeitslosenquote, Preise, Löhne."], ["WiSo", "VWL", "Antizyklische Fiskalpolitik?", "Der Staat steuert gegen den Zyklus: im Abschwung mehr ausgeben und Steuern senken, im Boom sparen und Steuern erhöhen."], ["WiSo", "VWL", "Hauptziel und Instrumente der EZB?", "Preisstabilität (2 % mittelfristig). Offenmarktgeschäfte, ständige Fazilitäten (Spitzenrefinanzierung, Einlage), Mindestreserve."], ["WiSo", "VWL", "Expansive und kontraktive Geldpolitik?", "Expansiv: Zinsen und Mindestreserve senken, Wertpapiere kaufen, Geldmenge steigt. Kontraktiv: das Gegenteil, um Inflation zu bremsen."], ["WiSo", "VWL", "Inflation und Deflation?", "Inflation: anhaltend steigendes Preisniveau, Kaufkraft sinkt. Deflation: anhaltend sinkendes Preisniveau, Käufe werden aufgeschoben, Wirtschaft schrumpft."], ["WiSo", "VWL", "Was ist der Warenkorb?", "Auswahl typischer Güter und Dienstleistungen eines Haushalts. Seine Preisentwicklung ergibt den Verbraucherpreisindex."], ["WiSo", "VWL", "Aufbau der Zahlungsbilanz?", "Leistungsbilanz (Handel, Dienstleistungen, Primär- und Sekundäreinkommen), Vermögensänderungsbilanz, Kapitalbilanz."], ["WiSo", "VWL", "Was ist der Außenbeitrag?", "Exporte minus Importe von Waren und Dienstleistungen. Ein positiver Außenbeitrag erhöht das BIP und stützt die Beschäftigung."], ["FF", "Vertrieb", "Was ist ein Vertragshändler?", "Ein selbstständiger Händler, der Neufahrzeuge im eigenen Namen und auf eigene Rechnung verkauft."], ["FF", "Vertrieb", "Direkter und indirekter Vertrieb?", "Direkt: Hersteller verkauft selbst (Niederlassung, Online, Agentur). Indirekt: über selbstständige Händler."], ["FF", "Vertrieb", "Merkmale des echten Agentursystems?", "Verkauf im Namen und auf Rechnung des Herstellers, Hersteller setzt den Preis und trägt Lager- und Absatzrisiko, Autohaus erhält Provision."], ["FF", "Vertrieb", "Vorteile des Agentursystems für das Autohaus?", "Kein Kapital im Fahrzeuglager, kein Absatz- und Restwertrisiko, kein Rabattwettbewerb, planbare Provision."], ["FF", "Vertrieb", "Mehrstufiges Vertriebssystem?", "Hersteller liefert an Importeur oder Haupthändler, dieser an Unterhändler, erst dieser an den Kunden."], ["FF", "Vertrieb", "Wer vertritt die Interessen der Autohäuser?", "Der ZDK (Zentralverband Deutsches Kraftfahrzeuggewerbe) und die Markenhändlerverbände."], ["FF", "Vertrieb", "Was ist ein Reimport?", "Ein für einen anderen EU-Markt produziertes Fahrzeug, das nach Deutschland eingeführt wird. Meist günstiger, Ausstattung kann abweichen."], ["FF", "Vertrieb", "Tageszulassung: Vorteil und Nachteil für das Autohaus?", "Vorteil: Zulassungsziele und Boni erreichen. Nachteil: Verkauf mit hohem Nachlass, Kosten der Zulassung."], ["FF", "Vertrieb", "Woraus besteht die Händlermarge?", "Grundmarge (Grundrabatt), leistungsabhängige Marge und Boni (Menge, Kundenzufriedenheit CSI, Corporate Design, Standards)."], ["FF", "Vertrieb", "Bruttoertrag und Rohüberschuss beim Neuwagen?", "Bruttoertrag = Marge − Ertragsminderungen (Rabatt, Zugaben, Überzahlung GW). Rohüberschuss = Bruttoertrag − Verkäuferprovision."], ["FF", "Vertrieb", "Welche Unterlagen erhält der Kunde bei der Übergabe?", "Zulassungsbescheinigung Teil I (und II), CoC, Betriebsanleitung, Serviceheft, Garantieunterlagen, Rechnung, Übergabeprotokoll."], ["FF", "Vertrieb", "Was braucht man für die Zulassung?", "Ausweis, eVB-Nummer, ZB II, CoC, SEPA-Mandat für die Kfz-Steuer. Firmen zusätzlich Gewerbeanmeldung oder Handelsregisterauszug."], ["FF", "GW", "Bezugsquellen für Gebrauchtwagen?", "Inzahlungnahme, Leasingrückläufer, freier Ankauf, Händlerkollegen, Auktionen, Werks- und Mietwagen, Internetbörsen."], ["FF", "GW", "Beispiele für Standkosten?", "Zinsen für gebundenes Kapital, Wertverlust, Platzkosten, Pflege und Aufbereitung, Versicherung."], ["FF", "GW", "Ursachen überlanger Standzeiten?", "Zu hoher Preis, nicht marktgerechter Bestand, schlechte Aufbereitung oder Präsentation, schwache Inserate, technische Mängel."], ["FF", "GW", "Wie berechnet man den Kapitalbedarf im GW-Geschäft?", "Stückzahl pro Jahr × Ø Einkaufspreis × (Standtage + Tage bis Zahlungseingang) / 360."], ["FF", "GW", "Vorteile des GW-Kaufs im Autohaus gegenüber Privatkauf?", "Sachmängelhaftung, geprüftes Fahrzeug, Garantie, Finanzierung, Inzahlungnahme, Service."], ["FF", "Vertrag", "Wie kommt der Neuwagenkaufvertrag zustande?", "Die er ist beim Leasing Eigentümer und wer bilanziert?", "Der Leasinggeber ist Eigentümer und bilanziert. Der Leasingnehmer ist Besitzer und bucht die Raten als Aufwand."], ["FF", "Leasing", "Kilometer- und Restwertleasing?", "Kilometerleasing: Abrechnung nach gefahrenen Kilometern, Restwertrisiko beim Leasinggeber. Restwertleasing: Leasingnehmer trägt das Restwertrisiko."], ["FF", "Leasing", "Welche Versicherungen sind beim Leasing Pflicht?", "Kfz-Haftpflicht und Vollkasko."], ["FF", "Versicherung", "Was deckt die Kfz-Haftpflicht?", "Personen-, Sach- und Vermögensschäden, die man Dritten zufügt."], ["FF", "Versicherung", "Was deckt die Teilkasko?", "Brand, Explosion, Diebstahl, Sturm, Hagel, Blitz, Überschwemmung, Glasbruch, Wildunfall, Marderbiss, Kurzschluss."], ["FF", "Versicherung", "Was deckt die Vollkasko zusätzlich?", "Selbst verschuldete Unfallschäden am eigenen Fahrzeug und Vandalismus."], ["FF", "Versicherung", "Warum gibt es in der Teilkasko keine Schadenfreiheitsklassen?", "Die versicherten Schäden hängen nicht vom Fahrverhalten des Versicherten ab."], ["FF", "Versicherung", "Wirtschaftlicher Totalschaden?", "Die Reparaturkosten übersteigen den Wiederbeschaffungswert abzüglich Restwert."], ["FF", "Versicherung", "Was leistet die GAP-Versicherung?", "Sie deckt bei Totalschaden oder Diebstahl die Lücke zwischen Wiederbeschaffungswert und offener Restschuld bzw. Leasingablöse."], ["FF", "Versicherung", "Vorteile einer Garantieversicherung für das Autohaus?", "Kundenbindung, Werkstattauslastung, Provision, Verkaufsargument, weniger Kulanzkosten."]], "quiz": [["WiSo", "Ein 15-Jähriger kauft ohne Wissen der Eltern von seinem Taschengeld ein Spiel für 30 €. Der Vertrag ist …", ["nichtig, weil er minderjährig ist", "schwebend unwirksam bis zur Genehmigung", "wirksam, weil er mit eigenen Mitteln zahlt", "anfechtbar durch den Händler"], 2, "§ 110 BGB: mit frei überlassenen Mitteln bewirkt."], ["WiSo", "Eine Kundin hat ein Fahrrad bezahlt, holt es aber erst in drei Ta let cur=null, shown=false;

  if(c.length>1&&cur)c=c.filter(x=>x.i!==cur.i);cur=pick(c);shown=false}
function vKarten(){
  if(!cur||!cardPool().some(x=>x.i===cur.i))nextCard();

  const p=cardPool(), sure=p.filter(x=>(S.box[x.i]||0)>=2).length;

      B.state?sol():null,
      B.state?$('div',{class:'row'},$('button',{class:'primary',onclick:()=>{newBuch();vBuchen()}},'Nächster Beleg')):null),
    $('details',{class:'sheet'},$('summary',{text:'Die 4 Karten für alle Buchungssätze'}),

        $('tr',{},$('td',{text:'4 Bezahlung Ausgangsrechnung'}),$('td',{text:'Bank 238'}),$('td',{text:'Forderungen 238'})),
        $('tr',{},$('td',{text:'mit 2 % Skonto, Eingangsrechnung'}),$('td',{text:'Verbindlichkeiten 119,00'}),$('td',{text:'Bank 116,62, Skontoertrag 2,00, Vorsteuer 0,38'})),

/* ---------- Kann-Liste ---------- */
function vKann(){
  const all=D.kann.reduce((n,s)=>n+s[1].length,0),done=Object.values(S.kann).filter(Boolean).length;
  R($('h2',{text:'Kann-Liste LF 10 und LF 11'}),

    $('div',{class:'meter'},$('i',{style:'width:'+(done/all*100)+'%'})),
    D.kann.map((s,si)=>{const d=s[1].filter((_,i)=>S.kann[si+'-'+i]).length;
      return $('details',{class:'sheet',open:d<s[1].length&&si===D.kann.findIndex((x,xi)=>x[1].some((_,i)=>!S.kann[xi+'-'+i]))?'':null},
        $('summary',{text:s[0]+'  ('+d+'/'+s[1].length+')'}),
        $('div',{},s[1].map((t,i)=>$('label',{class:'check'},$('input',Object.assign({type:'checkbox',id:'k'+si+'-'+i,onchange:e=>{S.kann[si+'-'+i]=e.target.checked;save();vKann()}},S.kann[si+'-'+i]?{checked:''}:{})),$('span',{text:'Ich kann '+t+'.'})))))}).map(x=>{if(x.getAttribute('open')===null)x.removeAttribute('open');return x}));

const V={start:vStart,karten:vKarten,quiz:vQuiz,rechnen:vRechnen,buchen:vBuchen,kannliste:vKann};
