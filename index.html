, ["KUP", "Personal", "Rolle des Betriebsrats bei Kündigungen?", "Er muss vor jeder Kündigung angehört werden, sonst ist sie unwirksam. Er kann innerhalb einer Woche widersprechen (bei fristloser Kündigung 3 Tage)."], ["WiSo", "Arbeit", "Mantel- und Entgelttarifvertrag?", "Manteltarif: langfristige Arbeitsbedingungen (Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge). Entgelttarif: Höhe der Löhne und Ausbildungsvergütungen, kurze Laufzeit, weil sie regelmäßig an Preise und Konjunktur angepasst werden."], ["WiSo", "Arbeit", "Was heißt Allgemeinverbindlichkeit?", "Das Arbeitsministerium erklärt einen Tarifvertrag für alle Arbeitgeber und Arbeitnehmer der Branche für gültig, auch für nicht tarifgebundene."], ["WiSo", "Arbeit", "Streik, Aussperrung, Schlichtung?", "Streik: Arbeitsniederlegung der Arbeitnehmer. Aussperrung: Arbeitgeber verweigern Arbeit und Lohn. Schlichtung: Ein neutraler Schlichter macht einen Einigungsvorschlag."], ["WiSo", "Soziales", "Welche Risiken deckt die Sozialversicherung nicht und was hilft?", "Berufsunfähigkeit, Haftung für Schäden bei anderen, Unfälle in der Freizeit, Versorgungslücke im Alter. Abhilfe: Berufsunfähigkeits-, private Haftpflicht-, private Unfallversicherung, private Altersvorsorge."], ["WiSo", "Soziales", "Formen der privaten Altersvorsorge und ihre Förderung?", "Riester-Rente (Zulagen und Sonderausgabenabzug), betriebliche Altersversorgung (steuer- und beitragsfreie Entgeltumwandlung), Basisrente/Rürup (Sonderausgabenabzug)."], ["WiSo", "Soziales", "Die sieben Einkunftsarten?", "Land- und Forstwirtschaft, Gewerbebetrieb, selbstständige Arbeit, nichtselbstständige Arbeit, Kapitalvermögen, Vermietung und Verpachtung, sonstige Einkünfte."], ["WiSo", "Soziales", "Wie berechnet man das zu versteuernde Einkommen?", "Einnahmen − Werbungskosten (mindestens Pauschbetrag 1.230 €) = Einkünfte − Sonderausgaben − außergewöhnliche Belastungen = zu versteuerndes Einkommen. Erstattung = einbehaltene Lohnsteuer − festgesetzte Steuer."]], "quiz": [["WiSo", "Ein 15-Jähriger kauft ohne Wissen der Eltern von seinem Taschengeld ein Spiel für 30 €. Der Vertrag ist …", ["nichtig, weil er minderjährig ist", "schwebend unwirksam bis zur Genehmigung", "wirksam, weil er mit eigenen Mitteln zahlt", "anfechtbar durch den Händler"], 2, "§ 110 BGB: mit frei überlassenen Mitteln bewirkt."], ["WiSo", "Eine Kundin hat ein Fahrrad bezahlt, holt es aber erst in drei Tagen ab. Bis dahin ist …", ["sie Eigentümerin und Besitzerin", "sie Eigentümerin, der Händler Besitzer", "der Händler Eigentümer und Besitzer", "der Händler Eigentümer, sie Besitzerin"], 2, "Eigentum geht erst mit Einigung und Übergabe über."], ["WiSo", "Welche Aussage zu AGB trifft zu?", ["AGB haben Vorrang vor individuellen Abreden", "Eine unwirksame Klausel macht den ganzen Vertrag nichtig", "AGB sparen Verhandlungsaufwand", "Kaufleute müssen fremde AGB immer akzeptieren"], 2, "Rationalisierungseffekt. Individuelle Abreden gehen vor."], ["WiSo", "Welches Recht hat ein Käufer bei einem Sachmangel zuerst?", ["Rücktritt", "Minderung", "Nacherfüllung", "Schadenersatz statt der Leistung"], 2, "Vorrang der Nacherfüllung."], ["WiSo", "Ein Händler will die Sachmängelhaftung für Neuware gegenüber Verbrauchern auf 1 Jahr verkürzen. Das ist …", ["zulässig per AGB", "zulässig mit Zustimmung des Kunden", "unzulässig", "nur bei Waren unter 500 € zulässig"], 2, "Bei Neuware gelten zwingend 2 Jahre."], ["WiSo", "Bei der Sicherungsübereignung …", ["erhält die Bank den Besitz, der Kreditnehmer bleibt Eigentümer", "wird die Bank Eigentümerin, der Kreditnehmer bleibt Besitzer", "wird eine Forderung abgetreten", "wird das Grundstück belastet"], 1, "Eigentum an die Bank, Nutzung bleibt beim Kreditnehmer."], ["WiSo", "Wie wird der Gewinn einer GmbH ohne besondere Regelung verteilt?", ["nach Köpfen", "4 % auf die Einlage, Rest nach Köpfen", "nach Geschäftsanteilen", "in angemessenem Verhältnis"], 2, "§ 29 GmbHG: nach Geschäftsanteilen."], ["WiSo", "Was darf ein Prokurist ohne besondere Befugnis nicht?", ["Darlehen aufnehmen", "Mitarbeiter einstellen", "ein Betriebsgrundstück verkaufen", "Ware einkaufen"], 2, "Grundstücke veräußern oder belasten nur mit besonderer Befugnis."], ["WiSo", "Eine Angestellte mit allgemeiner Handlungsvollmacht darf ohne Sondervollmacht …", ["ein Darlehen aufnehmen", "einen Prozess führen", "Rechnungen ausstellen", "mit ppa. unterschreiben"], 2, "Gewöhnliche Geschäfte sind gedeckt."], ["WiSo", "Ein Arbeitnehmer ist 6 Jahre im Betrieb. Der Arbeitgeber will zum 30.06. kündigen. Die Kündigung muss spätestens zugehen am …", ["31.03.", "30.04.", "31.05.", "02.06."], 1, "Ab 5 Jahren: 2 Monate zum Monatsende."], ["WiSo", "In welchem Zeitraum finden die regelmäßigen Betriebsratswahlen statt?", ["1. Januar bis 31. März", "1. März bis 31. Mai", "1. Oktober bis 30. November", "jederzeit"], 1, "Alle 4 Jahre, 1. März bis 31. Mai."], ["WiSo", "Welche Versicherung zahlt bei einem Unfall auf dem direkten Weg zur Arbeit?", ["Krankenversicherung", "Unfallversicherung (Berufsgenossenschaft)", "Rentenversicherung", "Haftpflicht des Arbeitgebers"], 1, "Wegeunfall = gesetzliche Unfallversicherung."], ["WiSo", "Das Gehalt übersteigt die Beitragsbemessungsgrenze der Rentenversicherung. Folge:", ["Die Versicherungspflicht endet", "Für den übersteigenden Teil fällt kein Beitrag an", "Der Beitragssatz steigt", "Der Arbeitgeber zahlt allein"], 1, "Beiträge nur bis zur Grenze."], ["WiSo", "Ein Lohnsteuer-Freibetrag von 150 € im Monat bewirkt, dass …", ["150 € weniger Lohnsteuer anfallen", "die Lohnsteuer von einem um 150 € geringeren Betrag berechnet wird", "das Bruttogehalt um 150 € steigt", "keine Sozialabgaben auf 150 € anfallen"], 1, "Der Freibetrag mindert die Bemessungsgrundlage."], ["WiSo", "Was zählt zu den Werbungskosten?", ["Kirchensteuer", "Beiträge zur Rentenversicherung", "Fahrten zwischen Wohnung und Arbeitsstätte", "Spenden"], 2, "Die anderen sind Sonderausgaben."], ["WiSo", "Auf einem vollkommenen Markt sinkt der Preis, wenn … ng", ["Grundlage: Betriebsverfassungsgesetz. Betriebsrat ab 5 Wahlberechtigten, Amtszeit 4 Jahre; JAV 2 Jahre.", "Betriebsrat: wählen ab 16, wählbar ab 18 nach 6 Monaten. JAV: wählen unter 18 und alle Azubis; wählbar unter 25 und Azubis.", "Rechte: Information, Anhörung, Mitwirkung, Mitbestimmung (soziale Angelegenheiten).", "Betriebsvereinbarung: Vertrag Arbeitgeber und Betriebsrat. Betriebsversammlung: vierteljährlich, alle Beschäftigten."]], ["Grundlagen des Wirtschaftens", ["Bedürfnis → Bedarf (mit Kaufkraft) → Nachfrage (am Markt).", "Freie Güter kosten nichts, wirtschaftliche Güter sind knapp.", "Maximalprinzip: feste Mittel, größter Erfolg. Minimalprinzip: festes Ziel, kleinster Einsatz.", "Sektoren: Urerzeugung, Verarbeitung, Dienstleistung.", "Einfacher Kreislauf: Haushalte und Unternehmen, Güter- und Geldstrom gegenläufig."]], ["Rechtsformen, Handelsregister, Vollmachten", ["Personengesellschaften: OHG, KG, GmbH & Co. KG. Kapitalgesellschaften: GmbH (25.000 €), AG (50.000 €).", "OHG: alle haften voll. KG: Komplementär voll, Kommanditist mit Einlage. GmbH/AG: nur Gesellschaftsvermögen.", "Handelsregister beim Amtsgericht: A Personenunternehmen, B Kapitalgesellschaften. Deklaratorisch oder konstitutiv.", "Ist-, Kann-, Formkaufmann. Firma = Name des Kaufmanns im Geschäftsverkehr.", "Rangfolge der Vollmachten: Prokura (ppa., ins Register) vor allgemeiner Handlungsvollmacht (i. V.), Art- und Einzelvollmacht."]]]], ["LF 3 · Teile beschaffen und lagern", [["Rechtliche Grundlagen", ["Rechtsfähig ab Geburt; geschäftsfähig: 0–6 nicht, 7–17 beschränkt, ab 18 voll.", "Anfrage unverbindlich, Angebot bindend, Anpreisung kein Angebot. Freizeichnung: „freibleibend“.", "Kaufvertrag: Antrag + Annahme. Verpflichtung (Vertrag) und Erfüllung (liefern, übereignen, zahlen, abnehmen).", "Nichtig: Geschäftsunfähigkeit, Formmangel, Gesetzes- oder Sittenverstoß, Schein, Scherz. Anfechtbar: Irrtum, Täuschung, Drohung.", "Form: Schriftform, Beglaubigung, notarielle Beurkundung. AGB: vorformuliert, Individualabrede geht vor.", "Besitz = tatsächliche, Eigentum = rechtliche Herrschaft. Eigentumsvorbehalt bis zur vollständigen Zahlung."]], ["Beschaffung", ["Bezugsquellen: Lieferantendatei, Messen, Internet, Fachzeitschriften, Vertreter.", "Quantitativ: Bezugspreis vergleichen. Qualitativ: Kriterien gewichten (Scoring).", "Optimale Bestellmenge: Bestell- + Lagerkosten minimal.", "Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand. Höchstbestand = Mindestbestand + Bestellmenge.", "Bestellpunktverfahren (bei Meldebestand) oder Bestellrhythmus (feste Termine)."]], ["Lager", ["Funktionen: Sicherung, Überbrückung, Spekulation, Umformung, Veredelung.", "Wareneingang: sofort äußere Prüfung, dann unverzüglich Art, Menge, Güte.", "Festplatz oder Freiplatz (chaotisch); FiFo oder LiFo; zentral oder dezentral; Eigen- oder Fremdlager; Just-in-time.", "Kennzahlen: Ø Lagerbestand, Umschlagshäufigkeit, Lagerdauer, Lagerzinssatz. Hoher Umschlag = kurze Lagerdauer = wenig gebundenes Kapital."]], ["Zahlung und Störungen", ["Lastschrift: Empfänger zieht ein. Dauerauftrag: fester Betrag, fester Termin.", "Skonto fast immer nutzen: 2 % für 20 Tage entsprechen etwa 36 % Jahreszins.", "Sachmängel: Beschaffenheit, Falsch-, Minderlieferung, Montage, Anleitung, Werbeaussage. Offen, versteckt, arglistig verschwiegen.", "Erst Nacherfüllung, dann Rücktritt, Minderung, Schadenersatz. Kaufleute rügen unverzüglich.", "Lieferungsverzug: Fälligkeit, Mahnung, Verschulden. Rechte: Lieferung + Verzögerungsschaden; nach Nachfrist Rücktritt oder Schadenersatz statt der Leistung."]]]], ["LF 4 · Teile und Zubehör verkaufen", [["Sortiment", ["Breit = viele Warengruppen, tief = viel Auswahl je Warengruppe.", "Kernsortiment bringt den Hauptumsatz, Randsortiment ergänzt.", "Regalzonen: Reck-, Sicht- (verkaufsstark), Greif-, Bückzone."]], ["Verkaufsgespräch", ["Phasen: Begrüßung, Bedarfsermittlung, Warendemonstration, Verkaufsargumentation, Abschluss, Verabschiedung.", "Fragen: offen (W-Fragen) zur Bedarfsermittlung, geschlossen zum Abschluss, Alternativ-, Suggestiv-, rhetorische Frage.", "Argumentation: Merkmal → Vorteil → Kundennutzen.", "Ergänzungsverkauf: passenden Zusatzartikel mit Nutzen anbieten.", "Nonverbal: Mimik, Gestik, Haltung, Blickkontakt."]]]], ["LF 5 · Full-Service-Unfallabwicklung", [["Versicherung", ["Haftpflichtschaden: Verursacher bzw. seine Versicherung zahlt. Kaskoschaden: eigene Versicherung zahlt.", "Haftpflichtansprüche: Reparatur, Gutachter, Wertminderung, Mietwagen oder Nutzungsausfall, Abschleppen, Pauschale.", "Kasko: nur Vertragsleistung abzüglich Selbstbeteiligung. Teilkasko ohne Schadenfreiheitsklasse.", "Beitrag: Schadenfreiheits-, Typ-, Regionalklasse, Fahrleistung, Fahrerkreis, Selbstbeteiligung, Werkstattbindung.", "Gefährdungshaftung: Halter haftet für die Betriebsgefahr."]], ["Abwicklung", ["Ablauf: Schadenaufnahme, RKÜ unterschreiben lassen, Gutachter, Freigabe der Versicherung, Mietwagen, Reparatur, Abrechnung mit der Versicherung.", "RKÜ/Sicherungsabtretung: Kunde tritt Anspruch ab, Autohaus rechnet direkt ab.", "Vorsteuerabzugsberechtigter Kunde: Versicherung zahlt netto, Kunde die Umsatzsteuer.", "Gutachter: bei Haftpflicht wählt der Geschädigte, bei Kasko der Versicherer."]], ["Schadenbegriffe", ["Technischer Totalschaden: nicht reparierbar. Wirtschaftlicher: Reparatur teurer als Wiederbeschaffungswert − Restwert.", "130-%-Regel: Reparatur bis 130 % des Wiederbeschaffungswerts bei fachgerechter Reparatur und Weiternutzung.", "Integritätsinteresse: Interesse, das eigene Fahrzeug zu behalten.", "Merkantile Wertminderung: Minderwert als Unfallwagen. Nutzungsausfall: Tagessatz ohne Mietwagen.", "Totalschaden Haftpflicht: Wiederbeschaffungswert − Restwert."]]]], ["LF 7 · Gebrauchtwagen", [["Bewertung", ["Hereinnahmepreis: vom Marktpreis rückwärts abzüglich Bruttoertrag, Reparatur, Aufbereitung, Standkosten.", "Einflüsse: Alter, Kilometer, Zustand, Ausstattung, Farbe, Vorbesitzer, Marktlage.", "Technische Bewertung durch die Werkstatt, kaufmännische durch den GW-Verkauf (DAT, Schwacke).", "Zukaufquellen: Leasingrückläufer, Auktionen, Händler, Werkswagen, Börsen."]], ["Besteuerung und Kalkulation", ["Differenzbesteuerung § 25a: Ankauf ohne Vorsteuer; USt = Differenz × 19/119; kein Steuerausweis.", "Regelbesteuerung („MwSt ausweisbar“): Ankauf mit Vorsteuer, 19 % auf den Nettopreis.", "Erfolg = Marge netto − Reparatur − Aufbereitung − Standkosten.", "Verdeckter Preisnachlass: Überzahlung der Inzahlungnahme, trägt die Neuwagenabteilung.", "Buchungen: 3110 an 1200 · 1400 an 8110 + 8111 + 1770 · 7110 an 3110."]]]], ["LF 8 · Finanzdienstleistungen", [["Finanzierung", ["Standardfinanzierung: gleiche Raten bis null. Ballon-/Drei-Wege-Finanzierung: niedrige Raten + Schlussrate.", "Kreditfähig = geschäftsfähig. Kreditwürdig = Bonität (Einkommen, SCHUFA, Selbstauskunft).", "Sicherheiten: Sicherungsübereignung (ZB II bei der Bank), Gehaltsabtretung, Bürgschaft, Restschuldversicherung.", "Effektiver Jahreszins = alle Kosten pro Jahr. Annuität: Rate gleich, Zins sinkt, Tilgung steigt.", "Verbundgeschäft: Widerruf des Darlehens kippt auch den Kauf.", "Herstellerbank: Absatzförderung, Provision und Kundenbindung, günstige Zinsen und schnelle Zusage."]], ["Leasing", ["Leasinggeber Eigentümer, Leasingnehmer Besitzer; Raten = Aufwand, keine Bilanzierung beim Nehmer.", "Erlasskonform: Grundmietzeit 40–90 % der Nutzungsdauer.", "Kilometerleasing: Mehr-/Minderkilometer. Restwertleasing: Restwertrisiko beim Kunden, Andienungsrecht.", "Umsatzsteuer auf jede Rate. Vorzeitiges Ende: Aufhebung, Totalschaden, Diebstahl.", "Rückgabe: Protokoll mit Kilometern und Schäden. Full-Service: Wartung, Reifen, Versicherung inklusive."]], ["Absicherung", ["Haftpflicht (Pflicht), Teilkasko, Vollkasko. Laufzeit 1 Jahr, Kündigung bis 30.11.", "GAP: Differenz zwischen Ablösewert und Wiederbeschaffungswert. Restschuldversicherung: Tod, Arbeitsunfähigkeit, Arbeitslosigkeit.", "Sicherungsschein: Kaskoleistung geht an Bank oder Leasinggeber.", "Gewährleistung gesetzlich, Garantie freiwillig, Kulanz ohne Anspruch."]]]], ["LF 9 · Personal", [["Planung und Beschaffung", ["Quantitativ (wie viele) und qualitativ (welche Qualifikation). Ersatz-, Neu-, Minderbedarf.", "Bedarf = Soll − (Ist + Zugänge − Abgänge).", "Intern: schnell, günstig, motivierend. Extern: neue Ideen, größere Auswahl.", "Unzulässige Fragen: Schwangerschaft, Religion, Partei, Gewerkschaft.", "Arbeitsvertrag: Parteien, Beginn, Tätigkeit, Ort, Entgelt, Arbeitszeit, Urlaub, Probezeit, Fristen."]], ["Tarif und Schutzgesetze", ["Tarifautonomie, Friedenspflicht. Manteltarif (Bedingungen) und Entgelttarif (Geld).", "Ablauf: Verhandlung, Schlichtung, Urabstimmung 75 %, Streik, Einigung, Urabstimmung 25 %.", "Arbeitszeit: 8 Stunden, max. 10; Pause 30/45 Minuten; Ruhezeit 11 Stunden.", "Mutterschutz: 6 Wochen vor, 8 Wochen nach der Geburt; Kündigungsverbot.", "Urlaub: 24 Werktage, voll nach 6 Monaten, sonst 1/12 je Monat."]], ["Gehalt und Steuern", ["Brutto (+ geldwerter Vorteil) − Lohnsteuer − Soli − Kirchensteuer − Sozialversicherung = Netto − private Abzüge = Auszahlung.", "Sozialversicherung je zur Hälfte: KV 14,6 % + Zusatz, PV 3,6 %, RV 18,6 %, AV 2,6 %; Unfall nur Arbeitgeber.", "Firmenwagen: 1 % vom Bruttolistenpreis + 0,03 % je Entfernungskilometer.", "Zu versteuerndes Einkommen: Einkünfte − Werbungskosten − Sonderausgaben − außergewöhnliche Belastungen.", "Private Vorsorge: Berufsunfähigkeit, Haftpflicht, Riester, Betriebsrente."]], ["Beendigung", ["Kündigung, Aufhebungsvertrag, Fristablauf, Rente. Immer schriftlich.", "Ordentlich mit Frist; außerordentlich aus wichtigem Grund binnen 2 Wochen.", "Gründe: personen-, verhaltens- (Abmahnung), betriebsbedingt (Sozialauswahl).", "Besonderer Schutz: Schwangere, Betriebsrat, Schwerbehinderte, Azubis.", "Betriebsrat anhören; Klage binnen 3 Wochen; Zeugnis einfach oder qualifiziert."]]]], ["LF 10 · Wertschöpfung steuern", [["Kosten- und Leistungsrechnung", ["Stufen: Kostenarten, Kostenstellen (BAB), Kostenträger (Kalkulation).", "Aufwand ≠ Kosten: neutral (betriebsfremd, periodenfremd, außerordentlich), Grund-, Anders-, Zusatzkosten.", "Einzelkosten direkt, Gemeinkosten über Schlüssel. Hauptkostenstellen: NW, GW, Teile, Werkstatt.", "Zuschlagssatz = Gemeinkosten / Einzelkosten × 100.", "Kalkulation vorwärts, rückwärts, Differenz; Zuschlag, Faktor, Handelsspanne."]], ["Deckungsbeitrag und Werkstatt", ["DB = Erlös − variable Kosten; Betriebsergebnis = DB − Fixkosten.", "Kurzfristige Preisuntergrenze = variable Kosten. Break-even = Fixkosten / Stück-DB.", "Mehrstufig: DB 1 (Bruttoertrag), DB 2, DB 3, Betriebsergebnis.", "Stundenverrechnungssatz = Schnittlohn × Werkstattindex; Index = Soll-Lohnerlöse / produktive Löhne."]], ["Controlling", ["Strukturbilanz: Anlage-/Umlaufvermögen, Eigen-/Fremdkapital.", "EK-Quote, Anlagendeckung, Liquidität 1 bis 3, Rentabilitäten.", "Goldene Bilanzregel, Leverage-Effekt.", "Betriebsergebnis + neutrales Ergebnis = Unternehmensergebnis.", "Lagerkennzahlen und Kennzahlen der Geschäftsfelder (Bruttoertrag, Standzeit)."]]]], ["LF 11 · Wirtschaftspolitik", [["Markt und Preis", ["Vollkommener Markt: homogene Güter, keine Präferenzen, Transparenz, schnelle Reaktion.", "Gleichgewichtspreis räumt den Markt. Darüber Angebotsüberhang (Käufermarkt), darunter Nachfrageüberhang.", "Preisfunktionen: Ausgleich, Signal, Lenkung, Auslese.", "Marktformen: Polypol, Oligopol, Monopol. Höchstpreis unter, Mindestpreis über dem Gleichgewicht."]], ["Ordnung und Wettbewerb", ["Soziale Marktwirtschaft: Markt + sozialer Ausgleich + Wettbewerbsschutz.", "Kooperation (Teilbereiche) und Konzentration (Konzern, Fusion); horizontal, vertikal, diagonal.", "Kartelle grundsätzlich verboten; Kartellamt: Kartellverbot, Missbrauchsaufsicht, Fusionskontrolle."]], ["Ziele, BIP, Konjunktur", ["Magisches Viereck: Preisstabilität, Beschäftigung, Außenwirtschaft, Wachstum. Sechseck: + Verteilung, Umwelt.", "BIP = Konsum + Staat + Investitionen + Außenbeitrag; nominal und real; Lohnquote.", "Phasen: Aufschwung, Boom, Abschwung, Tiefstand. Früh-, Präsenz-, Spätindikatoren.", "Antizyklische Fiskalpolitik: im Abschwung ausgeben, im Boom sparen."]], ["Geld und Außenwirtschaft", ["Inflation senkt die Kaufkraft; gemessen am Verbraucherpreisindex (Warenkorb).", "EZB: Preisstabilität; Offenmarkt, Fazilitäten, Mindestreserve; expansiv oder kontraktiv.", "Zahlungsbilanz: Leistungs-, Vermögensänderungs-, Kapitalbilanz. Außenbeitrag = Export − Import.", "Globalisierung: größere Märkte, aber Lohndruck und Abhängigkeit."]]]]]};

/* ---------- Karteikarten ---------- */
let cur=null, shown=false;

function nextCard(){const p=cardPool();if(!p.length){cur=null;return}
  const min=Math.min(...p.map(x=>S.box[x.i]||0));let c=p.filter(x=>(S.box[x.i]||0)===min);
  if(c.length>1&&cur)c=c.filter(x=>x.i!==cur.i);cur=pick(c);shown=false}
function vKarten(){
  if(!cur||!cardPool().some(x=>x.i===cur.i))nextCard();
  const topics=['Alle',...new Set(D.karten.filter(c=>inArea(c[0])).map(c=>c[1]))];
  const p=cardPool(), sure=p.filter(x=>(S.box[x.i]||0)>=2).length;

  const mark=d=>{S.box[cur.i]=d<0?0:Math.min(3,(S.box[cur.i]||0)+1);save();nextCard();vKarten()};
  R(areaChips(()=>{cur=null;vKarten()}),
    $('div',{class:'row'},sel,$('span',{class:'muted',text:sure+' von '+p.length+' sicher'})),
    $('div',{class:'meter'},$('i',{style:'width:'+(p.length?sure/p.length*100:0)+'%'})),
    cur?$('div',{class:'sheet card',tabindex:'0',role:'button','aria-label':'Karte umdrehen',onclick:()=>{shown=!shown;vKarten()},onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();shown=!shown;vKarten()}}},
      $('div',{},$('div',{class:'tag',text:cur.c[0]+' · '+cur.c[1]}),$('p',{class:'q',text:cur.c[2]})),
      shown?$('p',{class:'a',text:cur.c[3]}):$('p',{class:'muted',text:'Antwort überlegen, dann tippen zum Umdrehen'})):$('p',{text:'Keine Karten in dieser Auswahl.'}),
    cur&&shown?$('div',{class:'row'},$('button',{class:'bad grow',onclick:()=>mark(-1)},'Noch nicht'),$('button',{class:'good grow',onclick:()=>mark(1)},'Wusste ich')):null,
