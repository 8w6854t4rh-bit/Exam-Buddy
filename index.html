<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1120">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exam Buddy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: farbige Kopfleiste je Modus, Inhalt als Karten, feste Tab-Leiste unten wie in einer Handy-App */
  --bg:#f1f2f7; --surface:#ffffff; --ink:#161a2e; --muted:#5d6480; --line:#dcdfeb; --raise:#e9ebf4;
  --on:#ffffff; --good:#12805c; --bad:#c9372c;
  --c-start:#e4472b; --c-karten:#6a4ce0; --c-quiz:#d12f6f; --c-rechnen:#b9650a; --c-buchen:#0a8a73; --c-wissen:#1f6bd6; --c-pruefung:#4a7a0c;
  --accent:var(--c-start);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1120; --surface:#191c30; --ink:#eceefa; --muted:#a1a7c4; --line:#2c3050; --raise:#22263f;
  --on:#0f1120; --good:#4fd6a4; --bad:#ff8577;
  --c-start:#ff7455; --c-karten:#a493ff; --c-quiz:#ff74a6; --c-rechnen:#ffb650; --c-buchen:#45d6b6; --c-wissen:#6fadff; --c-pruefung:#b4e264; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1120; --surface:#191c30; --ink:#eceefa; --muted:#a1a7c4; --line:#2c3050; --raise:#22263f;
  --on:#0f1120; --good:#4fd6a4; --bad:#ff8577;
  --c-start:#ff7455; --c-karten:#a493ff; --c-quiz:#ff74a6; --c-rechnen:#ffb650; --c-buchen:#45d6b6; --c-wissen:#6fadff; --c-pruefung:#b4e264; color-scheme:dark}
body[data-mode="karten"]{--accent:var(--c-karten)} body[data-mode="quiz"]{--accent:var(--c-quiz)}
body[data-mode="rechnen"]{--accent:var(--c-rechnen)} body[data-mode="buchen"]{--accent:var(--c-buchen)}
body[data-mode="wissen"]{--accent:var(--c-wissen)} body[data-mode="pruefung"]{--accent:var(--c-pruefung)}
*{box-sizing:border-box}
html,body{margin:0}
/* iOS-Web-App: ohne diese Zeile bleibt unter der Tab-Leiste ein Streifen frei */
html{min-height:calc(100% + env(safe-area-inset-top))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.top{background:var(--accent);color:var(--on);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.top div{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top svg{width:26px;height:26px;flex:0 0 auto}
h1{font-family:var(--display);font-size:28px;line-height:1;margin:0;letter-spacing:.4px;text-transform:uppercase}
.top h1{margin-right:auto}
.top a.gear{color:inherit;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:0 0 auto}
.top small{font-size:12px;font-weight:600;opacity:.85;text-align:right;line-height:1.2;white-space:nowrap}
@media (max-width:480px){body:not([data-mode="start"]) .top small{display:none}}
main{max-width:760px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.3px;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs a{--accent:var(--c);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tabs svg{width:24px;height:24px}
.tabs a i{display:grid;place-items:center;width:46px;height:30px;border-radius:15px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] i{background:var(--c);color:var(--on)}
/* Start */
.hero{background:var(--accent);color:var(--on);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center}
.ring{flex:0 0 auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px}
.ring span{background:var(--accent);width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.hero b{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05;display:block}
.hero p{font-size:14px;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{--accent:var(--c);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--c);color:var(--on);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile .hd{display:flex;align-items:center;gap:10px;font-weight:600}
.tile b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.meter{height:7px;background:var(--raise);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:46px}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}
button.good{background:var(--good);border-color:var(--good);color:var(--on)}
button.bad{border-color:var(--bad);color:var(--bad)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{font:inherit;color:inherit;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;resize:vertical}
select,input[type=text],input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;max-width:100%}
.chip{border-radius:999px;padding:6px 14px;min-height:38px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tag{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.card{min-height:250px;justify-content:space-between;cursor:pointer;border-top:6px solid var(--accent)}
.card .q{font-size:20px;font-weight:600;text-wrap:balance}
.card .a{border-top:1px dashed var(--line);padding-top:12px}
.qt{font-weight:600;font-size:18px;text-wrap:balance}
.opt{text-align:left;font-weight:500;width:100%}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.note{border-left:4px solid var(--accent);background:var(--raise);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.note.ok{border-color:var(--good)} .note.no{border-color:var(--bad)}
.steps{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;overflow-x:auto}
/* Buchen: T-Konto */
.tk{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;position:relative}
.tk h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0 6px;border-bottom:3px solid var(--ink)}
.tk .side+.side{border-left:3px solid var(--ink)}
.tk .an{position:absolute;left:50%;top:-2px;transform:translateX(-50%);background:var(--accent);color:var(--on);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.zone{min-height:118px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;border-radius:0 0 10px 10px}
.zone.over,.zone.target{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.zone:empty::after{content:"hierher ziehen";color:var(--muted);font-size:13px;text-align:center;margin:auto}
.pool{flex-direction:row;flex-wrap:wrap;min-height:60px;border:1px dashed var(--line);border-radius:12px;padding:8px}
.pool:empty::after{content:"alle Konten verteilt"}
.kc{touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--mono);font-size:12.5px;font-weight:400;text-align:left;padding:7px 9px;min-height:40px;border-radius:10px;background:var(--raise);border-color:var(--line);line-height:1.25;cursor:grab}
.kc b{font-weight:600;margin-right:5px}
.kc.pick{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.kc.dragging{opacity:.35}
.kc.ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3);border-color:var(--accent);opacity:.95}
.kc.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.kc.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:pre-line}
th{background:var(--raise)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:13px}
.frow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow b{font-size:14px}
.frow code{font-family:var(--mono);font-size:13.5px;color:var(--accent);overflow-wrap:anywhere}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.lfb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600;padding:2px 0}
details[open] summary{margin-bottom:10px}
.grow{flex:1 1 140px}
.wide{grid-column:1/-1}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:5px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);border-color:var(--bad);color:var(--on)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{min-height:34px;min-width:38px;padding:0 6px;border-radius:9px;font-size:13px;font-weight:600}
.dots .done{background:var(--raise)}
.dots .cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.grade{font-family:var(--display);font-size:56px;line-height:1}
.rev{border-left:4px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.rev.ok{border-color:var(--good)} .rev.no{border-color:var(--bad)}
.pick{text-align:left;display:flex;flex-direction:column;gap:2px;width:100%;font-weight:400}
.pick b{font-size:16px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}.kc{font-size:13.5px}}
</style>
</head>
<body data-mode="start">
<header class="top"><div><span id="hic"></span><h1 id="htitle">Start</h1><small>Exam Buddy<br>Automobilkaufleute</small><a class="gear" id="gear" href="#einstellungen" aria-label="Einstellungen"></a></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Modus wechseln"><div id="nav"></div></nav>
<script>
const D={"konten": {"0200": "Technische Anlagen, Maschinen", "0300": "Betriebs- und Geschäftsausstattung", "0480": "Geringwertige Wirtschaftsgüter", "1000": "Kasse", "1200": "Bank", "1400": "Forderungen aLuL", "1570": "Abziehbare Vorsteuer", "1600": "Verbindlichkeiten aLuL", "1770": "Umsatzsteuer", "2100": "Zinsaufwendungen", "3000": "Bestand Neuwagen", "3030": "Bestand Überführung", "3100": "Bestand GW regelbesteuert", "3110": "Bestand GW differenzbesteuert", "3300": "Bestand Teile", "4400": "Miete, Pacht", "4410": "Energiekosten", "4620": "Abschreibungen auf Sachanlagen", "4800": "Werbekosten", "7000": "VAK Neuwagen", "7030": "VAK Überführung", "7100": "VAK GW regelbesteuert", "7110": "VAK GW differenzbesteuert", "7300": "VAK Teile über Theke", "7310": "VAK Teile durch die Werkstatt", "8000": "Erlöse Neuwagen", "8030": "Erlöse Überführung", "8100": "Erlöse GW regelbesteuert", "8110": "Erlöse GW differenzbesteuert", "8111": "Mehrerlöse Differenzbesteuerung", "8200": "Erlöse Zulassungspauschale", "8300": "Erlöse Teile über Theke", "8310": "Erlöse Teile durch die Werkstatt", "8410": "Lohnerlöse", "8420": "Erlöse Fremdleistungen"}, "buchungen": [["Eingangsrechnung: Ersatzteile für 1.000,00 € netto auf Ziel gekauft.", [["3300", 1000], ["1570", 190]], [["1600", 1190]], "Karte 1: Einkauf."], ["Ausgangsrechnung: Zubehör über die Theke für 200,00 € netto auf Rechnung verkauft.", [["1400", 238]], [["8300", 200], ["1770", 38]], "Karte 2: Verkauf."], ["Lagerentnahme zum Thekenverkauf: Einstandspreis des Zubehörs 120,00 €.", [["7300", 120]], [["3300", 120]], "Karte 3: Lagerbestandskorrektur."], ["Der Kunde überweist die Rechnung über 238,00 €.", [["1200", 238]], [["1400", 238]], "Karte 4 b."], ["Wir überweisen eine Lieferantenrechnung über 1.190,00 € ohne Abzug.", [["1600", 1190]], [["1200", 1190]], "Karte 4 a."], ["Wir zahlen die Teilerechnung über 1.190,00 € mit 2 % Skonto per Bank. Im Kontenplan gibt es kein Skontokonto.", [["1600", 1190]], [["1200", 1166.2], ["3300", 20], ["1570", 3.8]], "Skonto netto mindert den Bestand, die Vorsteuer wird korrigiert."], ["Ein Kunde zahlt eine Teilerechnung (Theke) über 2.380,00 € mit 2 % Skonto per Bank. Im Kontenplan gibt es kein Skontokonto.", [["1200", 2332.4], ["8300", 40], ["1770", 7.6]], [["1400", 2380]], "Skonto netto mindert den Erlös, die Umsatzsteuer wird korrigiert."], ["Neuwagenverkauf auf Rechnung: Fahrzeug 30.000,00 €, Überführung 800,00 €, Zulassung 150,00 € (alles netto).", [["1400", 36830.5]], [["8000", 30000], ["8030", 800], ["8200", 150], ["1770", 5880.5]], "Drei Erlöskonten plus Umsatzsteuer."], ["Lagerentnahme zum Neuwagenverkauf: Einstandspreis Fahrzeug 26.000,00 €.", [["7000", 26000]], [["3000", 26000]], "VAK an Bestand."], ["Lagerentnahme der Überführung: vom Hersteller berechnet 600,00 € netto.", [["7030", 600]], [["3030", 600]], "VAK an Bestand."], ["Ankauf eines Gebrauchtwagens von einer Privatperson für 10.000,00 € per Überweisung.", [["3110", 10000]], [["1200", 10000]], "Von privat: kein Vorsteuerabzug, differenzbesteuerter Bestand."], ["Ankauf eines Gebrauchtwagens von einer GmbH für 15.000,00 € netto auf Ziel.", [["3100", 15000], ["1570", 2850]], [["1600", 17850]], "Vom Unternehmer: Vorsteuer, regelbesteuerter Bestand."], ["Verkauf des für 10.000,00 € von privat angekauften GW für 12.380,00 € an einen Privatkunden (§ 25a UStG).", [["1400", 12380]], [["8110", 10000], ["8111", 2000], ["1770", 380]], "Differenz 2.380 ist brutto: 380 USt, 2.000 Mehrerlös."], ["Lagerentnahme des differenzbesteuerten GW (Einkaufspreis 10.000,00 €).", [["7110", 10000]], [["3110", 10000]], "VAK an Bestand."], ["Werkstattrechnung an einen Privatkunden: Lohn 300,00 €, Teile 200,00 €, Fremdleistung 100,00 € (netto).", [["1400", 714]], [["8410", 300], ["8310", 200], ["8420", 100], ["1770", 114]], "Lohn, Teile durch Werkstatt, Fremdleistung getrennt."], ["Kontoauszug: Miete für die Ausstellungsfläche 7.500,00 € abgebucht.", [["4400", 7500]], [["1200", 7500]], "Aufwand an Bank, keine Vorsteuer im Beispiel."], ["Kontoauszug: Sollzinsen für die Kontoüberziehung 85,00 €.", [["2100", 85]], [["1200", 85]], "Zinsaufwand an Bank."], ["Kauf einer Hebebühne für 20.000,00 € netto auf Ziel.", [["0200", 20000], ["1570", 3800]], [["1600", 23800]], "Anlagevermögen wird aktiviert."], ["Jahresabschreibung auf die Hebebühne: 2.000,00 €.", [["4620", 2000]], [["0200", 2000]], "Abschreibung an Anlagekonto."]], "karten": [["KUP", "Buchen", "Wie lauten die 4 Grundbuchungen (4 Karten)?", "1 Einkauf: Bestand + Vorsteuer an Verbindlichkeiten. 2 Verkauf: Forderungen an Erlöse + Umsatzsteuer. 3 Lagerbestandskorrektur: VAK an Bestand. 4 Bezahlung: Verbindlichkeiten an Bank bzw. Bank an Forderungen."], ["KUP", "Buchen", "Was bedeutet VAK und wann wird gebucht?", "Verrechnete Anschaffungskosten = Wareneinsatz zum Einstandspreis. Bei jedem Verkauf: VAK an Bestand (Aufwandsbuchung)."], ["KUP", "Buchen", "Wie bucht man die Zahlung einer Eingangsrechnung mit Skonto?", "Verbindlichkeiten (voller Betrag) an Bank (Zahlbetrag), Skonto netto (Skontoertrag bzw. Bestandskonto) und Vorsteuerkorrektur."], ["KUP", "Buchen", "Wie bucht man den Zahlungseingang eines Kunden mit Skonto?", "Bank (Zahlbetrag), Skonto netto (Skontoaufwand bzw. Erlöskonto) und Umsatzsteuerkorrektur an Forderungen (voller Betrag)."], ["KUP", "Buchen", "Was ist die Differenzbesteuerung (§ 25a UStG)?", "Umsatzsteuer fällt nur auf die Differenz zwischen Verkaufs- und Einkaufspreis an. Voraussetzung: Ankauf ohne Vorsteuerabzug (z. B. von privat). USt = Differenz × 19/119. Kein Steuerausweis auf der Rechnung."], ["KUP", "Buchen", "Wie wird ein differenzbesteuerter GW-Verkauf gebucht?", "1400 Forderungen an 8110 (Einkaufspreis), 8111 Mehrerlöse (Marge netto), 1770 USt (aus der Marge). Danach 7110 an 3110."], ["KUP", "Buchen", "Was ist die Altteilsteuer?", "Beim Austauschteil gilt das Altteil als Teil der Gegenleistung: 10 % des Austauschteil-Preises × 19 % kommen zur normalen Umsatzsteuer dazu (Konto 1795)."], ["KUP", "Rechnen", "Wie rechnet man vom Überweisungsbetrag nach Skonto auf den Rechnungsbetrag zurück?", "Rechnungsbetrag = Zahlbetrag / (1 − Skontosatz), z. B. / 0,98 bei 2 %."], ["KUP", "Rechnen", "Wie kommt man von brutto auf netto und auf die enthaltene Umsatzsteuer?", "Netto = Brutto / 1,19. USt = Brutto × 19 / 119."], ["KUP", "Kalkulation", "Nenne die Stufen der Handelskalkulation.", "Listeneinkaufspreis − Rabatt = Zieleinkaufspreis − Skonto = Bareinkaufspreis + Bezugskosten = Bezugspreis + Gemeinkosten = Selbstkosten + Gewinn = Barverkaufspreis + Kundenskonto = Zielverkaufspreis + Kundenrabatt = Listenverkaufspreis netto + USt = Bruttoverkaufspreis."], ["KUP", "Kalkulation", "Wann Vorwärts-, Rückwärts-, Differenzkalkulation?", "Vorwärts: Verkaufspreis gesucht. Rückwärts: Verkaufspreis vorgegeben, höchster Einkaufspreis gesucht. Differenz: beide Preise fest, Gewinn gesucht."], ["KUP", "Kalkulation", "Kalkulationszuschlag, Kalkulationsfaktor, Handelsspanne?", "Zuschlag = (VK netto − Bezugspreis) / Bezugspreis × 100. Faktor = VK netto / Bezugspreis. Handelsspanne = (VK netto − Bezugspreis) / VK netto × 100."], ["KUP", "Kalkulation", "Warum rechnet man Kundenskonto und Kundenrabatt „im Hundert“?", "Weil der Kunde sie vom höheren Preis abzieht. Der Barverkaufspreis entspricht z. B. 98 % des Zielverkaufspreises, also durch 0,98 teilen."], ["KUP", "KLR", "Welche drei Stufen hat die KLR?", "Kostenartenrechnung (welche Kosten?), Kostenstellenrechnung (wo? BAB), Kostenträgerrechnung (wofür? Kalkulation)."], ["KUP", "KLR", "Unterschied Aufwand und Kosten?", "Aufwand: gesamter Werteverzehr laut GuV. Kosten: nur der betriebsbedingte, periodengerechte, gewöhnliche Werteverzehr."], ["KUP", "KLR", "Was sind neutrale Aufwendungen?", "Aufwand, der keine Kosten darstellt: betriebsfremd (Spende), periodenfremd (Steuernachzahlung), außerordentlich (Brandschaden)."], ["KUP", "KLR", "Grundkosten, Anderskosten, Zusatzkosten?", "Grundkosten: Aufwand = Kosten. Anderskosten: Aufwand in anderer Höhe (kalk. Abschreibung, kalk. Zinsen, Wagnisse). Zusatzkosten: kein Aufwand (kalk. Unternehmerlohn, kalk. Miete)."], ["KUP", "KLR", "Warum kalkulatorischer Unternehmerlohn?", "Bei e. K., OHG, KG erhält der Inhaber kein Gehalt. Damit seine Arbeit in die Preise eingeht und der Vergleich mit GmbH/AG stimmt, wird ein Lohn angesetzt."], ["KUP", "KLR", "Einzelkosten und Gemeinkosten mit Beispielen?", "Einzelkosten direkt zurechenbar: Einstandspreis Fahrzeug/Teil, produktiver Lohn, Provision. Gemeinkosten nur über Schlüssel: Miete, Verwaltungsgehälter, Energie, Werbung."], ["KUP", "KLR", "Welche Aufgaben hat der BAB?", "Gemeinkosten auf Kostenstellen verteilen, Hilfs- auf Hauptkostenstellen umlegen, Zuschlagssätze ermitteln, Kosten kontrollieren."], ["KUP", "KLR", "Welche vier Hauptkostenstellen hat ein Autohaus?", "Neuwagen, Gebrauchtwagen, Teile und Zubehör, Werkstatt (Kundendienst). Verwaltung ist Hilfskostenstelle."], ["KUP", "KLR", "Unterschied Haupt- und Hilfskostenstelle?", "Hauptkostenstellen erbringen Leistungen für den Markt und rechnen ihre Kosten auf Kostenträger ab. Hilfskostenstellen arbeiten für andere Stellen und werden auf sie umgelegt."], ["KUP", "KLR", "Wie berechnet man den Gemeinkostenzuschlagssatz?", "Gemeinkosten der Stelle / Einzelkosten der Stelle × 100. Werkstatt: Bezugsgröße produktive Löhne. Handel: VAK."], ["KUP", "KLR", "Passende Verteilungsschlüssel für Miete, Energie, Abschreibung, Werbung?", "Miete: Fläche. Energie: Verbrauch. Abschreibung: Anlagewerte. Werbung: Umsatz. Telefon: Anschlüsse. Unternehmerlohn: Zeitanteile."], ["KUP", "Deckungsbeitrag", "Unterschied Vollkosten- und Teilkostenrechnung?", "Vollkosten: alle Kosten auf die Kostenträger, für langfristige Preise. Teilkosten: nur variable Kosten, Fixkosten als Block, für kurzfristige Entscheidungen."], ["KUP", "Deckungsbeitrag", "Was ist ein Deckungsbeitrag?", "Erlös − variable Kosten. Der Betrag, der zur Deckung der Fixkosten und danach zum Gewinn beiträgt."], ["KUP", "Deckungsbeitrag", "Variable und fixe Kosten: je zwei Beispiele aus dem Autohaus?", "Variabel: Wareneinsatz, Verkäuferprovision, produktive Löhne. Fix: Miete, Gehälter der Verwaltung, Abschreibungen, Versicherungen."], ["KUP", "Deckungsbeitrag", "Kurzfristige und langfristige Preisuntergrenze?", "Kurzfristig: variable Stückkosten (DB = 0). Langfristig: Selbstkosten je Stück (alle Kosten gedeckt)."], ["KUP", "Deckungsbeitrag", "Aufbau der mehrstufigen Deckungsbeitragsrechnung (KER)?", "Erlöse − variable Kosten I = DB 1 (Bruttoertrag) − variable Kosten II (verkaufsabhängig) = DB 2 − geschäftsfeldbezogene Fixkosten = DB 3 − unternehmensbezogene Fixkosten = Betriebsergebnis."], ["KUP", "Deckungsbeitrag", "Was ist der Break-even-Point und wie berechnet man ihn?", "Gewinnschwelle: Erlöse = Gesamtkosten. Menge = Fixkosten / (Preis − variable Stückkosten)."], ["KUP", "Werkstatt", "Was ist der Stundenverrechnungssatz?", "Preis einer Werkstattstunde für den Kunden. Deckt Lohn, alle Gemeinkosten der Werkstatt, Wagnis und Gewinn."], ["KUP", "Werkstatt", "Was ist der Werkstattindex?", "Soll-Lohnerlöse / produktive Löhne bzw. Stundenverrechnungssatz / Schnittlohn. Er zeigt, das Wievielfache des Lohns erlöst werden muss."], ["KUP", "Werkstatt", "Wie ermittelt man den Stundenverrechnungssatz aus einer Rechnung mit Arbeitswerten?", "Lohnpreis netto / berechnete AW × AW je Stunde (z. B. 10 oder 100 AW je Stunde)."], ["KUP", "Werkstatt", "Produktive und unproduktive Löhne?", "Produktiv: direkt an Kundenaufträgen verrechenbare Monteurstunden. Unproduktiv: nicht verrechenbar, z. B. Aufräumen, Schulung, Wartezeit, Werkstattmeister, Lager."], ["KUP", "Werkstatt", "Warum ist der Garantie-Stundensatz niedriger?", "Der Hersteller gibt Vergütungssatz und Arbeitszeiten vor. Der Betrieb kann ihn nicht frei kalkulieren."], ["KUP", "Kennzahlen", "Eigenkapitalquote und ihre Aussage?", "EK / Gesamtkapital × 100. Je höher, desto unabhängiger und kreditwürdiger ist das Unternehmen."], ["KUP", "Kennzahlen", "Liquidität 1., 2., 3. Grades?", "1: flüssige Mittel / kurzfristiges FK. 2: (flüssige Mittel + Forderungen) / kurzfristiges FK. 3: Umlaufvermögen / kurzfristiges FK. Jeweils × 100."], ["KUP", "Kennzahlen", "Eigenkapital-, Gesamtkapital-, Umsatzrentabilität?", "EK-Rent.: Gewinn / EK. GK-Rent.: (Gewinn + FK-Zinsen) / Gesamtkapital. Umsatzrent.: Gewinn / Umsatz. Jeweils × 100."], ["KUP", "Kennzahlen", "Was sagt die Umsatzrentabilität aus?", "Wie viel Prozent vom Umsatz als Gewinn bleiben, also wie viel Cent Gewinn je Euro Umsatz."], ["KUP", "Kennzahlen", "Was besagt die goldene Bilanzregel?", "Langfristiges Vermögen soll langfristig finanziert sein. Streng: EK deckt das Anlagevermögen. Weniger streng: EK + langfristiges FK decken es."], ["KUP", "Kennzahlen", "Was ist der Leverage-Effekt?", "Liegt die Gesamtkapitalrentabilität über dem Fremdkapitalzins, steigert zusätzliches Fremdkapital die Eigenkapitalrentabilität."], ["KUP", "Kennzahlen", "Betriebsergebnis, neutrales Ergebnis, Unternehmensergebnis?", "Betriebsergebnis = Leistungen − Kosten. Neutrales Ergebnis = neutrale Erträge − neutrale Aufwendungen. Zusammen: Unternehmensergebnis (GuV)."], ["KUP", "Kennzahlen", "Lagerkennzahlen?", "Ø Lagerbestand = (Anfangs- + Endbestand) / 2. Umschlagshäufigkeit = Wareneinsatz / Ø Lagerbestand. Ø Lagerdauer = 360 / Umschlagshäufigkeit."], ["KUP", "Kennzahlen", "Horizontale und vertikale Bilanzanalyse?", "Vertikal: Aufbau einer Seite (z. B. EK-Quote, Anlagenintensität). Horizontal: Aktiva zu Passiva (Anlagendeckung, Liquidität)."], ["KUP", "Anlagen", "Wie setzen sich Anschaffungskosten zusammen?", "Kaufpreis netto − Preisnachlässe (Rabatt, Skonto) + Anschaffungsnebenkosten (Fracht, Montage, Zulassung)."], ["KUP", "Anlagen", "Lineare Abschreibung: Betrag und Satz?", "Betrag = Anschaffungskosten / Nutzungsdauer. Satz = 100 / Nutzungsdauer. Im ersten Jahr monatsgenau."], ["KUP", "Anlagen", "Was ist ein GWG?", "Geringwertiges Wirtschaftsgut: beweglich, abnutzbar, selbstständig nutzbar, bis 800 € netto. Darf sofort voll abgeschrieben werden."], ["KUP", "Anlagen", "Welche Ursachen kann eine Inventurdifferenz haben?", "Diebstahl, Schwund, Bruch, Zählfehler, Buchungsfehler, nicht erfasste Entnahme."], ["KUP", "Personal", "Wie berechnet man den Nettopersonalbedarf?", "Soll-Bestand − (Ist-Bestand + feststehende Zugänge − feststehende Abgänge)."], ["KUP", "Personal", "Ersatz-, Neu- und Minderbedarf?", "Ersatzbedarf: ausscheidende Mitarbeiter ersetzen. Neu-/Mehrbedarf: zusätzliche Stellen. Minderbedarf: Stellen fallen weg."], ["KUP", "Personal", "Stellenbeschreibung und Stellenausschreibung?", "Beschreibung: internes Dokument mit Aufgaben, Befugnissen, Einordnung, Anforderungen. Ausschreibung: Anzeige zur Bewerbersuche, zusätzlich Firmenprofil, Eintrittstermin, Leistungen, Bewerbungsweg."], ["KUP", "Personal", "Gesetzliche Kündigungsfristen (§ 622 BGB)?", "Grundfrist 4 Wochen zum 15. oder Monatsende. Probezeit 2 Wochen. Arbeitgeber: ab 2 Jahren 1 Monat, 5 → 2, 8 → 3, 10 → 4, 12 → 5, 15 → 6, 20 → 7 Monate zum Monatsende."], ["KUP", "Personal", "Was gilt für befristete Verträge ohne Sachgrund?", "Höchstens 2 Jahre, darin höchstens 3 Verlängerungen, schriftlich vor Arbeitsbeginn (TzBfG)."], ["KUP", "Personal", "Welche Arbeitspapiere erhält ein ausscheidender Mitarbeiter?", "Arbeitszeugnis, Lohnsteuerbescheinigung, Urlaubsbescheinigung, Arbeitsbescheinigung für die Agentur für Arbeit, Sozialversicherungsmeldung."], ["KUP", "Personal", "Mindesturlaub und Wartezeit?", "24 Werktage bei 6-Tage-Woche (= 20 Arbeitstage bei 5 Tagen). Voller Anspruch nach 6 Monaten, vorher 1/12 je vollem Monat."], ["KUP", "Personal", "Homeoffice und mobiles Arbeiten?", "Homeoffice: fest eingerichteter Arbeitsplatz zu Hause. Mobiles Arbeiten: Arbeit von beliebigen Orten."], ["WiSo", "Recht", "Stufen der Geschäftsfähigkeit?", "0–6 geschäftsunfähig. 7–17 beschränkt geschäftsfähig. Ab 18 voll geschäftsfähig."], ["WiSo", "Recht", "Was regelt der Taschengeldparagraf (§ 110 BGB)?", "Ein beschränkt Geschäftsfähiger schließt wirksam ab, wenn er die Leistung mit Mitteln bewirkt, die ihm zur freien Verfügung überlassen wurden."], ["WiSo", "Recht", "Rechtsfähigkeit?", "Fähigkeit, Träger von Rechten und Pflichten zu sein. Natürliche Personen ab Geburt, juristische ab Eintragung."], ["WiSo", "Recht", "Nichtige Rechtsgeschäfte?", "Geschäftsunfähigkeit, Formmangel, Gesetzesverstoß, Sittenwidrigkeit, Schein- und Scherzgeschäft. Von Anfang an unwirksam."], ["WiSo", "Recht", "Anfechtbare Rechtsgeschäfte?", "Irrtum, arglistige Täuschung, widerrechtliche Drohung. Gültig, bis angefochten wird."], ["WiSo", "Recht", "Besitz und Eigentum?", "Besitz: tatsächliche Herrschaft über die Sache. Eigentum: rechtliche Herrschaft."], ["WiSo", "Recht", "Wie geht Eigentum an einer beweglichen Sache über?", "Durch Einigung und Übergabe. Zahlung allein genügt nicht."], ["WiSo", "Recht", "Was gilt für AGB?", "Vorformulierte Bedingungen, sparen Verhandlungsaufwand. Müssen einbezogen sein. Individuelle Abreden haben Vorrang. Unwirksame Klauseln fallen weg, der Vertrag bleibt."], ["WiSo", "Recht", "Rechte des Käufers beim Sachmangel?", "Zuerst Nacherfüllung (Nachbesserung oder Ersatz). Danach Rücktritt, Minderung, Schadenersatz. Verjährung 2 Jahre."], ["WiSo", "Recht", "Beweislastumkehr beim Verbrauchsgüterkauf?", "Tritt der Mangel in den ersten 12 Monaten auf, wird vermutet, dass er schon bei Übergabe vorlag (§ 477 BGB)."], ["WiSo", "Recht", "Darf die Sachmängelhaftung gegenüber Verbrauchern verkürzt werden?", "Bei neuen Sachen nicht unter 2 Jahre. Bei gebrauchten Sachen auf mindestens 1 Jahr."], ["WiSo", "Recht", "Rügepflicht beim zweiseitigen Handelskauf?", "Ware unverzüglich prüfen und Mängel unverzüglich rügen. Versteckte Mängel unverzüglich nach Entdeckung, innerhalb der Verjährung."], ["WiSo", "Recht", "Wann kommt ein Käufer in Zahlungsverzug?", "Bei kalendermäßig bestimmtem Termin mit dessen Ablauf, sonst durch Mahnung, spätestens 30 Tage nach Fälligkeit und Rechnungszugang."], ["WiSo", "Recht", "Sicherungsübereignung?", "Die Bank wird Eigentümerin, der Kreditnehmer bleibt Besitzer und nutzt die Sache weiter."], ["WiSo", "Recht", "Haftung und Mindestkapital der GmbH?", "Es haftet nur das Gesellschaftsvermögen. Stammkapital mindestens 25.000 €."], ["WiSo", "Recht", "Gesetzliche Gewinnverteilung der GmbH?", "Nach dem Verhältnis der Geschäftsanteile."], ["WiSo", "Recht", "Haftung in der OHG?", "Alle Gesellschafter haften unbeschränkt (auch privat), unmittelbar und gesamtschuldnerisch."], ["WiSo", "Recht", "Was darf ein Prokurist nicht?", "Grundstücke verkaufen oder belasten (ohne besondere Befugnis), Bilanz unterschreiben, Prokura erteilen, Gesellschafter aufnehmen, Unternehmen verkaufen, Insolvenz anmelden."], ["WiSo", "Recht", "Was darf ein Handlungsbevollmächtigter ohne Sondervollmacht nicht?", "Darlehen aufnehmen, Prozesse führen, Grundstücke veräußern oder belasten, Wechselverbindlichkeiten eingehen."], ["WiSo", "Recht", "Einzel-, Gesamt-, Filialprokura?", "Einzel: allein vertretungsberechtigt. Gesamt: nur gemeinsam mit einem weiteren Berechtigten. Filial: auf eine Niederlassung beschränkt."], ["WiSo", "Arbeit", "Welches Gesetz regelt die duale Ausbildung?", "Das Berufsbildungsgesetz (BBiG)."], ["WiSo", "Arbeit", "Kündigung des Ausbildungsverhältnisses nach der Probezeit?", "Azubi: 4 Wochen Frist bei Aufgabe oder Wechsel des Berufs. Beide: fristlos aus wichtigem Grund. Schriftlich mit Gründen."], ["WiSo", "Arbeit", "Pausen und Arbeitszeit nach Jugendarbeitsschutzgesetz?", "Max. 8 Stunden täglich, 40 wöchentlich, 5-Tage-Woche. 30 min Pause bei mehr als 4,5 bis 6 Stunden, 60 min bei mehr als 6 Stunden."], ["WiSo", "Arbeit", "Betriebsratswahl: wann, wer wählt, wer ist wählbar?", "Alle 4 Jahre vom 1. März bis 31. Mai. Wahlberechtigt ab 16. Wählbar ab 18 nach 6 Monaten Betriebszugehörigkeit."], ["WiSo", "Arbeit", "JAV: Wahl und Wahlrecht?", "Alle 2 Jahre vom 1. Oktober bis 30. November. Wahlberechtigt: unter 18 und alle Azubis. Wählbar: unter 25 und Azubis."], ["WiSo", "Arbeit", "Reihenfolge einer Tarifauseinandersetzung?", "Kündigung und Verhandlung, Scheitern, Schlichtung, Scheitern, Urabstimmung, Streik, neue Verhandlung, Urabstimmung über das Ergebnis, neuer Tarifvertrag."], ["WiSo", "Arbeit", "Was bedeutet Friedenspflicht?", "Während der Laufzeit des Tarifvertrags sind Arbeitskämpfe um seine Inhalte unzulässig."], ["WiSo", "Arbeit", "Wer überwacht den Arbeitsschutz?", "Staatliche Gewerbeaufsicht und Berufsgenossenschaften."], ["WiSo", "Arbeit", "Wie lange Entgeltfortzahlung bei Krankheit?", "6 Wochen durch den Arbeitgeber, danach Krankengeld von der Krankenkasse."], ["WiSo", "Soziales", "Die fünf Zweige der Sozialversicherung und ihre Träger?", "Kranken (Krankenkassen), Pflege (Pflegekassen), Renten (Deutsche Rentenversicherung), Arbeitslosen (Bundesagentur für Arbeit), Unfall (Berufsgenossenschaften)."], ["WiSo", "Soziales", "Wer zahlt die Unfallversicherung und was deckt sie?", "Nur der Arbeitgeber. Arbeitsunfälle, Wegeunfälle, Berufskrankheiten."], ["WiSo", "Soziales", "Was bedeutet Beitragsbemessungsgrenze?", "Bis zu diesem Bruttoentgelt werden Beiträge berechnet. Der Teil darüber bleibt beitragsfrei."], ["WiSo", "Soziales", "Werbungskosten und Sonderausgaben?", "Werbungskosten: Ausgaben für den Beruf (Fahrten, Arbeitsmittel, Fortbildung). Sonderausgaben: Vorsorgeaufwendungen, Kirchensteuer, Spenden."], ["WiSo", "Markt", "Bedingungen des vollkommenen Marktes?", "Homogene Güter, keine Präferenzen (sachlich, persönlich, räumlich, zeitlich), vollständige Transparenz, sofortige Reaktion, viele Anbieter und Nachfrager."], ["WiSo", "Markt", "Funktionen des Gleichgewichtspreises?", "Ausgleich (Markträumung), Signal (Knappheit), Lenkung (Produktionsfaktoren), Auslese (unwirtschaftliche Anbieter)."], ["WiSo", "Markt", "Angebotsüberhang und Käufermarkt?", "Preis über dem Gleichgewicht: Angebot größer als Nachfrage. Käufer sind in der stärkeren Position, Preise geraten unter Druck."], ["WiSo", "Markt", "Nachfrageüberhang und Verkäufermarkt?", "Preis unter dem Gleichgewicht: Nachfrage größer als Angebot. Verkäufer sind in der stärkeren Position."], ["WiSo", "Markt", "Was passiert, wenn die Nachfrage steigt (Kurve nach rechts)?", "Gleichgewichtspreis und Gleichgewichtsmenge steigen."], ["WiSo", "Markt", "Was passiert, wenn das Angebot steigt (Kurve nach rechts)?", "Der Gleichgewichtspreis sinkt, die Menge steigt."], ["WiSo", "Markt", "Konsumenten- und Produzentenrente?", "Konsumentenrente: Vorteil der Käufer, die mehr gezahlt hätten. Produzentenrente: Vorteil der Anbieter, die billiger verkauft hätten."], ["WiSo", "Markt", "Polypol, Angebotsoligopol, Angebotsmonopol?", "Viele Anbieter und viele Nachfrager. Wenige Anbieter und viele Nachfrager. Ein Anbieter und viele Nachfrager."], ["WiSo", "Markt", "Folgen von Höchst- und Mindestpreis?", "Höchstpreis (unter Gleichgewicht): Nachfrageüberhang, Schwarzmarkt. Mindestpreis (über Gleichgewicht): Angebotsüberhang, Staat muss Überschüsse abnehmen."], ["WiSo", "Markt", "Marktkonforme und marktkonträre Eingriffe?", "Marktkonform: Preisbildung bleibt frei (Subventionen, Steuern, Transfers). Marktkonträr: Preis wird vorgeschrieben (Höchst-, Mindest-, Festpreis)."], ["WiSo", "VWL", "Akteure im erweiterten Wirtschaftskreislauf?", "Private Haushalte, Unternehmen, Staat, Banken (Kapitalsammelstellen), Ausland."], ["WiSo", "VWL", "Maximal- und Minimalprinzip?", "Maximal: mit gegebenen Mitteln den größten Erfolg. Minimal: ein gegebenes Ziel mit geringstem Mitteleinsatz."], ["WiSo", "VWL", "Merkmale der sozialen Marktwirtschaft?", "Privateigentum mit Sozialbindung, freie Preisbildung, Wettbewerbsschutz, Vertrags- und Gewerbefreiheit, Tarifautonomie, soziale Sicherung und Umverteilung."], ["WiSo", "VWL", "Kooperation und Konzentration?", "Kooperation: Zusammenarbeit rechtlich selbstständiger Unternehmen in Teilbereichen. Konzentration: wirtschaftliche Selbstständigkeit geht verloren (Konzern, Fusion)."], ["WiSo", "VWL", "Horizontaler, vertikaler, diagonaler Zusammenschluss?", "Horizontal: gleiche Produktions-/Handelsstufe. Vertikal: vor- und nachgelagerte Stufen. Diagonal: verschiedene Branchen."], ["WiSo", "VWL", "Aufgaben des Bundeskartellamts?", "Kartellverbot durchsetzen, Missbrauch marktbeherrschender Stellungen verfolgen, Fusionen kontrollieren."], ["WiSo", "VWL", "Das magische Viereck?", "Preisniveaustabilität, hoher Beschäftigungsstand, außenwirtschaftliches Gleichgewicht, stetiges und angemessenes Wirtschaftswachstum (Stabilitätsgesetz 1967)."], ["WiSo", "VWL", "Womit misst man die vier Ziele?", "Inflationsrate (Verbraucherpreisindex), Arbeitslosenquote, Außenbeitrag, Wachstum des realen BIP."], ["WiSo", "VWL", "Was ist das BIP und wie berechnet man es nach der Verwendung?", "Wert aller im Inland in einem Jahr erzeugten Waren und Dienstleistungen. Konsum privat + Konsum Staat + Bruttoinvestitionen + (Exporte − Importe)."], ["WiSo", "VWL", "Nominales und reales BIP?", "Nominal: zu aktuellen Preisen. Real: preisbereinigt, zeigt das tatsächliche Wachstum."], ["WiSo", "VWL", "Lohnquote?", "Arbeitnehmerentgelt / Volkseinkommen × 100. Gegenstück: Gewinnquote."], ["WiSo", "VWL", "Warum ist das BIP als Wohlstandsmaß umstritten?", "Unbezahlte Arbeit und Schattenwirtschaft fehlen, Umweltschäden und Unfälle erhöhen es, Verteilung und Lebensqualität bleiben offen."], ["WiSo", "VWL", "Die vier Konjunkturphasen?", "Aufschwung (Expansion), Hochkonjunktur (Boom), Abschwung (Rezession), Tiefstand (Depression)."], ["WiSo", "VWL", "Früh-, Präsenz- und Spätindikatoren?", "Früh: Auftragseingänge, Geschäftsklimaindex, Baugenehmigungen. Präsenz: BIP, Produktion, Kapazitätsauslastung. Spät: Arbeitslosenquote, Preise, Löhne."], ["WiSo", "VWL", "Antizyklische Fiskalpolitik?", "Der Staat steuert gegen den Zyklus: im Abschwung mehr ausgeben und Steuern senken, im Boom sparen und Steuern erhöhen."], ["WiSo", "VWL", "Hauptziel und Instrumente der EZB?", "Preisstabilität (2 % mittelfristig). Offenmarktgeschäfte, ständige Fazilitäten (Spitzenrefinanzierung, Einlage), Mindestreserve."], ["WiSo", "VWL", "Expansive und kontraktive Geldpolitik?", "Expansiv: Zinsen und Mindestreserve senken, Wertpapiere kaufen, Geldmenge steigt. Kontraktiv: das Gegenteil, um Inflation zu bremsen."], ["WiSo", "VWL", "Inflation und Deflation?", "Inflation: anhaltend steigendes Preisniveau, Kaufkraft sinkt. Deflation: anhaltend sinkendes Preisniveau, Käufe werden aufgeschoben, Wirtschaft schrumpft."], ["WiSo", "VWL", "Was ist der Warenkorb?", "Auswahl typischer Güter und Dienstleistungen eines Haushalts. Seine Preisentwicklung ergibt den Verbraucherpreisindex."], ["WiSo", "VWL", "Aufbau der Zahlungsbilanz?", "Leistungsbilanz (Handel, Dienstleistungen, Primär- und Sekundäreinkommen), Vermögensänderungsbilanz, Kapitalbilanz."], ["WiSo", "VWL", "Was ist der Außenbeitrag?", "Exporte minus Importe von Waren und Dienstleistungen. Ein positiver Außenbeitrag erhöht das BIP und stützt die Beschäftigung."], ["FF", "Vertrieb", "Was ist ein Vertragshändler?", "Ein selbstständiger Händler, der Neufahrzeuge im eigenen Namen und auf eigene Rechnung verkauft."], ["FF", "Vertrieb", "Direkter und indirekter Vertrieb?", "Direkt: Hersteller verkauft selbst (Niederlassung, Online, Agentur). Indirekt: über selbstständige Händler."], ["FF", "Vertrieb", "Merkmale des echten Agentursystems?", "Verkauf im Namen und auf Rechnung des Herstellers, Hersteller setzt den Preis und trägt Lager- und Absatzrisiko, Autohaus erhält Provision."], ["FF", "Vertrieb", "Vorteile des Agentursystems für das Autohaus?", "Kein Kapital im Fahrzeuglager, kein Absatz- und Restwertrisiko, kein Rabattwettbewerb, planbare Provision."], ["FF", "Vertrieb", "Mehrstufiges Vertriebssystem?", "Hersteller liefert an Importeur oder Haupthändler, dieser an Unterhändler, erst dieser an den Kunden."], ["FF", "Vertrieb", "Wer vertritt die Interessen der Autohäuser?", "Der ZDK (Zentralverband Deutsches Kraftfahrzeuggewerbe) und die Markenhändlerverbände."], ["FF", "Vertrieb", "Was ist ein Reimport?", "Ein für einen anderen EU-Markt produziertes Fahrzeug, das nach Deutschland eingeführt wird. Meist günstiger, Ausstattung kann abweichen."], ["FF", "Vertrieb", "Tageszulassung: Vorteil und Nachteil für das Autohaus?", "Vorteil: Zulassungsziele und Boni erreichen. Nachteil: Verkauf mit hohem Nachlass, Kosten der Zulassung."], ["FF", "Vertrieb", "Woraus besteht die Händlermarge?", "Grundmarge (Grundrabatt), leistungsabhängige Marge und Boni (Menge, Kundenzufriedenheit CSI, Corporate Design, Standards)."], ["FF", "Vertrieb", "Bruttoertrag und Rohüberschuss beim Neuwagen?", "Bruttoertrag = Marge − Ertragsminderungen (Rabatt, Zugaben, Überzahlung GW). Rohüberschuss = Bruttoertrag − Verkäuferprovision."], ["FF", "Vertrieb", "Welche Unterlagen erhält der Kunde bei der Übergabe?", "Zulassungsbescheinigung Teil I (und II), CoC, Betriebsanleitung, Serviceheft, Garantieunterlagen, Rechnung, Übergabeprotokoll."], ["FF", "Vertrieb", "Was braucht man für die Zulassung?", "Ausweis, eVB-Nummer, ZB II, CoC, SEPA-Mandat für die Kfz-Steuer. Firmen zusätzlich Gewerbeanmeldung oder Handelsregisterauszug."], ["FF", "GW", "Bezugsquellen für Gebrauchtwagen?", "Inzahlungnahme, Leasingrückläufer, freier Ankauf, Händlerkollegen, Auktionen, Werks- und Mietwagen, Internetbörsen."], ["FF", "GW", "Beispiele für Standkosten?", "Zinsen für gebundenes Kapital, Wertverlust, Platzkosten, Pflege und Aufbereitung, Versicherung."], ["FF", "GW", "Ursachen überlanger Standzeiten?", "Zu hoher Preis, nicht marktgerechter Bestand, schlechte Aufbereitung oder Präsentation, schwache Inserate, technische Mängel."], ["FF", "GW", "Wie berechnet man den Kapitalbedarf im GW-Geschäft?", "Stückzahl pro Jahr × Ø Einkaufspreis × (Standtage + Tage bis Zahlungseingang) / 360."], ["FF", "GW", "Vorteile des GW-Kaufs im Autohaus gegenüber Privatkauf?", "Sachmängelhaftung, geprüftes Fahrzeug, Garantie, Finanzierung, Inzahlungnahme, Service."], ["FF", "Vertrag", "Wie kommt der Neuwagenkaufvertrag zustande?", "Die verbindliche Bestellung ist der Antrag. Der Vertrag entsteht durch schriftliche Annahme oder Lieferung innerhalb von 3 Wochen (Nutzfahrzeuge 6 Wochen, Lagerfahrzeuge 10 Tage)."], ["FF", "Vertrag", "Wann ist der Kaufpreis fällig?", "Bei Übergabe des Fahrzeugs und Aushändigung der Rechnung."], ["FF", "Vertrag", "Verbindlicher und unverbindlicher Liefertermin?", "Verbindlich: Verzug sofort bei Überschreiten. Unverbindlich: Käufer kann 6 Wochen danach zur Lieferung auffordern, dann Verzug."], ["FF", "Vertrag", "Eigentumsvorbehalt und ZB II?", "Das Fahrzeug bleibt bis zur vollständigen Zahlung Eigentum des Verkäufers. So lange darf er die Zulassungsbescheinigung Teil II behalten."], ["FF", "Vertrag", "Sachmängelhaftung und Garantie?", "Sachmängelhaftung: gesetzlich, Verkäufer, Mangel bei Übergabe, 2 Jahre. Garantie: freiwillig, Hersteller oder Garantiegeber, Funktion während der Laufzeit."], ["FF", "Finanzierung", "Die drei Wege der Drei-Wege-Finanzierung?", "Schlussrate zahlen, Schlussrate weiterfinanzieren oder Fahrzeug zurückgeben."], ["FF", "Finanzierung", "Rechenschema der Finanzierung?", "Preis − Anzahlung − Inzahlungnahme = Restbetrag + Versicherungen = Nettodarlehen + Zinsen = Gesamtdarlehen − Schlussrate = Ratensumme / Laufzeit = Monatsrate."], ["FF", "Finanzierung", "Sicherheiten bei der Kfz-Finanzierung?", "Sicherungsübereignung (ZB II bei der Bank), Gehaltsabtretung, Bürgschaft, Restschuldversicherung, Vollkasko, Anzahlung."], ["FF", "Finanzierung", "Was steht im SECCI-Formular?", "Kreditgeber, Kreditart, Nettodarlehensbetrag, Laufzeit, Sollzins, effektiver Jahreszins, Gesamtbetrag, Raten, Sicherheiten, Widerrufsrecht, vorzeitige Rückzahlung."], ["FF", "Finanzierung", "Negativmerkmale der SCHUFA?", "Gekündigter Kredit, Mahnbescheid oder Vollstreckung, Vermögensauskunft, Privatinsolvenz."], ["FF", "Finanzierung", "Was gilt bei Barzahlung ab 10.000 €?", "Geldwäschegesetz: Kunde identifizieren, Vorgang dokumentieren, bei Verdacht melden."], ["FF", "Leasing", "Wer ist beim Leasing Eigentümer und wer bilanziert?", "Der Leasinggeber ist Eigentümer und bilanziert. Der Leasingnehmer ist Besitzer und bucht die Raten als Aufwand."], ["FF", "Leasing", "Kilometer- und Restwertleasing?", "Kilometerleasing: Abrechnung nach gefahrenen Kilometern, Restwertrisiko beim Leasinggeber. Restwertleasing: Leasingnehmer trägt das Restwertrisiko."], ["FF", "Leasing", "Welche Versicherungen sind beim Leasing Pflicht?", "Kfz-Haftpflicht und Vollkasko."], ["FF", "Versicherung", "Was deckt die Kfz-Haftpflicht?", "Personen-, Sach- und Vermögensschäden, die man Dritten zufügt."], ["FF", "Versicherung", "Was deckt die Teilkasko?", "Brand, Explosion, Diebstahl, Sturm, Hagel, Blitz, Überschwemmung, Glasbruch, Wildunfall, Marderbiss, Kurzschluss."], ["FF", "Versicherung", "Was deckt die Vollkasko zusätzlich?", "Selbst verschuldete Unfallschäden am eigenen Fahrzeug und Vandalismus."], ["FF", "Versicherung", "Warum gibt es in der Teilkasko keine Schadenfreiheitsklassen?", "Die versicherten Schäden hängen nicht vom Fahrverhalten des Versicherten ab."], ["FF", "Versicherung", "Wirtschaftlicher Totalschaden?", "Die Reparaturkosten übersteigen den Wiederbeschaffungswert abzüglich Restwert."], ["FF", "Versicherung", "Was leistet die GAP-Versicherung?", "Sie deckt bei Totalschaden oder Diebstahl die Lücke zwischen Wiederbeschaffungswert und offener Restschuld bzw. Leasingablöse."], ["FF", "Versicherung", "Vorteile einer Garantieversicherung für das Autohaus?", "Kundenbindung, Werkstattauslastung, Provision, Verkaufsargument, weniger Kulanzkosten."], ["KUP", "KLR", "Wann ist eine Ausgabe (noch) kein Aufwand?", "Wenn der Werteverzehr erst später eintritt: Kauf von Waren auf Lager oder eines Anlageguts. Aufwand entsteht erst beim Verkauf/Verbrauch bzw. über die Abschreibung."], ["KUP", "KLR", "Wie berechnet man kalkulatorische Zinsen?", "Betriebsnotwendiges Kapital × kalkulatorischer Zinssatz. Angesetzt für das gesamte betriebsnotwendige Kapital, auch für das Eigenkapital."], ["KUP", "KLR", "Beispiele für kalkulatorische Wagnisse?", "Forderungsausfälle, Gewährleistung und Kulanz, Schwund und Diebstahl im Lager, Wertverlust bei Gebrauchtwagen. Das allgemeine Unternehmerrisiko gehört nicht dazu, es wird über den Gewinn abgegolten."], ["KUP", "Deckungsbeitrag", "Was ist Fixkostendegression?", "Die fixen Kosten verteilen sich bei steigender Menge auf mehr Einheiten. Die fixen Stückkosten und damit die gesamten Stückkosten sinken."], ["KUP", "Deckungsbeitrag", "Wie verlaufen fixe und variable Kosten im Diagramm?", "Fixe Gesamtkosten: waagerechte Linie. Variable Gesamtkosten: steigende Gerade aus dem Ursprung. Gesamtkosten: steigende Gerade, die bei den Fixkosten beginnt. Wo die Erlösgerade sie schneidet, liegt der Break-even-Point."], ["KUP", "Deckungsbeitrag", "Soll ein Produkt mit Verlust bei Vollkosten aus dem Sortiment?", "Nur wenn sein Deckungsbeitrag negativ ist. Bei positivem Deckungsbeitrag hilft es, die Fixkosten zu decken. Würde es gestrichen, fiele das Betriebsergebnis schlechter aus."], ["KUP", "Kennzahlen", "Zeit-, Betriebs- und Branchenvergleich?", "Zeitvergleich: eigene Werte verschiedener Perioden. Betriebsvergleich: mit anderen Betrieben. Branchenvergleich: mit dem Durchschnitt der Branche."], ["KUP", "Kennzahlen", "Verschuldungsgrad und Anlagendeckung II?", "Verschuldungsgrad = Fremdkapital / Eigenkapital × 100. Anlagendeckung II = (Eigenkapital + langfristiges Fremdkapital) / Anlagevermögen × 100, sollte mindestens 100 % sein."], ["KUP", "Kennzahlen", "Was sagt der Bruttoertrag in Prozent aus?", "Bruttoertrag / Nettoerlöse × 100. Wie viel Prozent vom Erlös nach Abzug des Wareneinsatzes bleiben, um Kosten zu decken und Gewinn zu erzielen."], ["WiSo", "Markt", "Wovon hängt die Nachfrage ab?", "Preis des Gutes, Einkommen, Preise anderer Güter (Ersatz- und Ergänzungsgüter), Bedürfnisse und Mode, Zukunftserwartungen."], ["WiSo", "Markt", "Wovon hängt das Angebot ab?", "Preis des Gutes, Kosten der Produktionsfaktoren, Stand der Technik, Gewinnerwartungen, Zahl der Anbieter, staatliche Abgaben und Subventionen."], ["WiSo", "Markt", "Substitutions- und Komplementärgüter?", "Substitutionsgüter ersetzen einander (Butter und Margarine): Wird das eine teurer, steigt die Nachfrage nach dem anderen. Komplementärgüter ergänzen sich (Auto und Kraftstoff): Wird das eine teurer, sinkt auch die Nachfrage nach dem anderen."], ["WiSo", "Markt", "Wie wirkt eine Subvention an die Anbieter auf den Markt?", "Die Kosten der Anbieter sinken, das Angebot steigt (Kurve nach rechts). Der Preis sinkt, die Menge steigt. Der Preis bildet sich weiter frei: marktkonform."], ["WiSo", "VWL", "Wer sind die Träger der Wirtschaftspolitik?", "Bund, Länder und Gemeinden, die EU, die EZB und die Bundesbank sowie die Tarifparteien."], ["WiSo", "VWL", "Nenne einen Zielkonflikt und eine Zielharmonie.", "Konflikt: hoher Beschäftigungsstand und Preisstabilität; Wachstum und Umweltschutz. Harmonie: Wirtschaftswachstum und hoher Beschäftigungsstand."], ["WiSo", "VWL", "Entstehungs-, Verwendungs- und Verteilungsrechnung des BIP?", "Entstehung: Wertschöpfung der Wirtschaftsbereiche. Verwendung: Konsum, Investitionen, Außenbeitrag. Verteilung: Arbeitnehmerentgelt sowie Unternehmens- und Vermögenseinkommen."], ["WiSo", "VWL", "Primäre und sekundäre Einkommensverteilung?", "Primär: Verteilung, die der Markt ergibt (Lohnquote, Gewinnquote). Sekundär: Verteilung nach staatlicher Umverteilung durch Steuern, Sozialabgaben und Transfers."], ["WiSo", "VWL", "Konjunkturelle und saisonale Schwankungen?", "Konjunkturell: mittelfristig über mehrere Jahre, betreffen die ganze Wirtschaft. Saisonal: kurzfristig und jahreszeitlich bedingt, z. B. Bau im Winter, Weihnachtsgeschäft."], ["WiSo", "VWL", "Beispiele für staatliche Einnahmen- und Ausgabenpolitik?", "Einnahmen: Steuersätze ändern, Abschreibungsmöglichkeiten erweitern oder kürzen. Ausgaben: öffentliche Aufträge, Investitionsprogramme, Subventionen, Transferzahlungen."], ["WiSo", "VWL", "Was ist der Leitzins und wie wirkt eine Senkung?", "Zinssatz, zu dem sich Banken bei der EZB Geld leihen. Senkung: Kredite werden billiger, Investitionen und Konsum steigen, die Konjunktur wird angeregt, die Inflationsgefahr steigt."], ["WiSo", "VWL", "Aufgaben der Deutschen Bundesbank?", "Geldpolitik der EZB in Deutschland umsetzen, Bargeldversorgung, Abwicklung des Zahlungsverkehrs, Mitwirkung an der Bankenaufsicht, Verwaltung der Währungsreserven."], ["WiSo", "VWL", "Nennwert und Kaufkraft des Geldes?", "Nennwert: der aufgedruckte Betrag. Kaufkraft: die Gütermenge, die man dafür kaufen kann. Bei Inflation bleibt der Nennwert gleich, die Kaufkraft sinkt."], ["WiSo", "VWL", "Chancen und Risiken der Globalisierung?", "Chancen: größere Absatzmärkte, günstiger Einkauf, mehr Auswahl, Arbeitsteilung. Risiken: Verlagerung von Arbeitsplätzen, Lohn- und Preisdruck, Abhängigkeit von Lieferketten."], ["WiSo", "VWL", "Arten von Kartellen?", "Preiskartell (einheitliche Preise), Gebietskartell (Aufteilung der Absatzgebiete), Quotenkartell (Mengen), Submissionskartell (Absprachen bei Ausschreibungen)."], ["FF", "Vertrieb", "Was regelt die Vertikal-GVO?", "Eine EU-Verordnung, die Vereinbarungen zwischen Hersteller und Händler (vertikal) unter Bedingungen vom Kartellverbot freistellt. Sie erlaubt damit selektive und exklusive Vertriebssysteme im Automobilhandel."], ["FF", "Vertrieb", "Selektives und exklusives Vertriebssystem?", "Selektiv: Der Hersteller wählt Händler nach festen Kriterien aus (Standards, Anzahl); verkauft wird nur an Endkunden und zugelassene Händler. Exklusiv: Der Händler erhält ein Gebiet allein zugewiesen (Gebietsschutz)."], ["FF", "Vertrieb", "Wer sind die Partner im Vertriebsnetz?", "Hersteller oder Importeur, Niederlassungen, Vertragshändler (A- und B-Händler), Agenten, Servicepartner (autorisierte Werkstätten)."], ["FF", "Vertrieb", "Was ist ein Servicepartner?", "Eine vom Hersteller autorisierte Werkstatt, die Wartung, Reparatur, Garantiearbeiten und Originalteile anbietet, aber keine Neuwagen im eigenen Namen verkauft (höchstens vermittelt)."], ["FF", "Vertrieb", "Wesentliche Inhalte eines Händlervertrags?", "Vertragsgebiet, Verkaufsziele und Mindestabnahme, Standards (Ausstattung, Corporate Design, Schulung), Margen- und Bonussystem, Lager- und Vorführwagenpflicht, Laufzeit und Kündigung."], ["WiSo", "Arbeit", "Ausbildungsberufsbild, Ausbildungsrahmenplan, Rahmenlehrplan?", "Berufsbild: Fertigkeiten und Kenntnisse, die zu vermitteln sind. Ausbildungsrahmenplan: sachliche und zeitliche Gliederung für den Betrieb. Rahmenlehrplan: Lerninhalte der Berufsschule (Lernfelder)."], ["WiSo", "Arbeit", "Pflichten des Auszubildenden und des Ausbildenden?", "Azubi: Lernpflicht, Berufsschule besuchen, Weisungen befolgen, Ausbildungsnachweis führen, Schweigepflicht. Ausbildender: ausbilden, Ausbildungsmittel kostenlos stellen, für Berufsschule freistellen, Vergütung zahlen, Zeugnis ausstellen."], ["WiSo", "Arbeit", "An wen wendet man sich bei Problemen in der Ausbildung?", "An Ausbilder, JAV oder Betriebsrat, den Ausbildungsberater der IHK, die Berufsschule; im Streitfall an den Schlichtungsausschuss der Kammer."], ["WiSo", "Arbeit", "Was regelt eine Betriebsvereinbarung?", "Ein schriftlicher Vertrag zwischen Arbeitgeber und Betriebsrat für alle Beschäftigten des Betriebs, z. B. Arbeitszeit, Gleitzeit, Urlaubsgrundsätze, Pausen, Überwachung."], ["WiSo", "Arbeit", "Aktives und passives Wahlrecht?", "Aktiv: wählen dürfen. Passiv: gewählt werden können."], ["WiSo", "Arbeit", "Rechte des Betriebsrats?", "Informationsrecht, Beratungs- und Anhörungsrecht (z. B. vor Kündigungen), Mitwirkung bei personellen Maßnahmen (Einstellung, Versetzung), Mitbestimmung in sozialen Angelegenheiten."], ["WiSo", "VWL", "Bedürfnis, Bedarf, Nachfrage?", "Bedürfnis: Gefühl eines Mangels. Bedarf: mit Kaufkraft ausgestattetes Bedürfnis. Nachfrage: am Markt tatsächlich geäußerter Bedarf."], ["WiSo", "VWL", "Die drei Wirtschaftssektoren?", "Primär: Urerzeugung (Rohstoffe, Landwirtschaft). Sekundär: Weiterverarbeitung (Automobilhersteller, Zulieferer). Tertiär: Dienstleistungen (Autohaus, Bank, Versicherung)."], ["WiSo", "VWL", "Güterarten?", "Sachgüter, Dienstleistungen, Rechte. Konsum- und Produktionsgüter. Gebrauchs- und Verbrauchsgüter."], ["WiSo", "Recht", "Personen- und Kapitalgesellschaften zuordnen?", "Personengesellschaften: OHG, KG, GmbH & Co. KG. Kapitalgesellschaften: GmbH, AG. Der e. K. ist ein Einzelunternehmen."], ["WiSo", "Recht", "Was ist eine GmbH & Co. KG?", "Eine KG, deren Vollhafter (Komplementär) eine GmbH ist. So ist die Haftung faktisch auf das Vermögen der GmbH und die Einlagen der Kommanditisten begrenzt."], ["WiSo", "Recht", "Gewinnverteilung in der KG?", "Nach dem Gesellschaftsvertrag; fehlt eine Regelung, seit 2024 nach den vereinbarten Beteiligungsverhältnissen. Kommanditisten nehmen am Verlust nur bis zur Höhe ihrer Einlage teil."], ["WiSo", "Recht", "Was ist das Handelsregister?", "Ein öffentliches Verzeichnis der Kaufleute, geführt beim Amtsgericht. Abteilung A: Einzelkaufleute und Personengesellschaften. Abteilung B: Kapitalgesellschaften."], ["WiSo", "Recht", "Deklaratorische und konstitutive Wirkung?", "Deklaratorisch (rechtsbezeugend): Die Tatsache gilt schon vorher, die Eintragung macht sie bekannt, z. B. Istkaufmann, Prokura. Konstitutiv (rechtserzeugend): Erst die Eintragung schafft das Recht, z. B. GmbH, AG, Kannkaufmann."], ["WiSo", "Recht", "Ist-, Kann- und Formkaufmann?", "Istkaufmann: betreibt ein Handelsgewerbe, das einen kaufmännisch eingerichteten Geschäftsbetrieb erfordert. Kannkaufmann: Kleingewerbe oder Land- und Forstwirtschaft, freiwillig eingetragen. Formkaufmann: kraft Rechtsform, z. B. GmbH, AG."], ["WiSo", "Recht", "Was ist die Firma?", "Der Name, unter dem ein Kaufmann seine Geschäfte betreibt, unterschreibt, klagt und verklagt werden kann."], ["WiSo", "Recht", "Arten der Handlungsvollmacht?", "Allgemeine Handlungsvollmacht (alle gewöhnlichen Geschäfte), Artvollmacht (eine bestimmte Art von Geschäften, z. B. Einkauf), Einzelvollmacht (ein einzelnes Geschäft); jeweils auch als Gesamtvollmacht mit anderen möglich."], ["WiSo", "Recht", "Rechtssubjekte und Rechtsobjekte?", "Rechtssubjekte: Träger von Rechten und Pflichten (natürliche und juristische Personen). Rechtsobjekte: Gegenstände des Rechtsverkehrs (Sachen und Rechte)."], ["WiSo", "Recht", "Juristische Personen des privaten und des öffentlichen Rechts?", "Privat: GmbH, AG, eingetragener Verein. Öffentlich: Bund, Länder, Gemeinden, IHK, Rentenversicherung."], ["WiSo", "Recht", "Anfrage, Angebot, Anpreisung?", "Anfrage: unverbindlich. Angebot: verbindliche Willenserklärung an eine bestimmte Person. Anpreisung (Prospekt, Schaufenster, Onlineshop): richtet sich an die Allgemeinheit, kein Angebot."], ["WiSo", "Recht", "Wie lange ist ein Angebot bindend?", "Unter Anwesenden und am Telefon: nur sofort. Unter Abwesenden: so lange, wie eine Antwort üblicherweise dauert (Brief etwa eine Woche, E-Mail ein bis zwei Tage). Befristetes Angebot: bis Fristende."], ["WiSo", "Recht", "Was bewirken Freizeichnungsklauseln?", "Sie schränken die Bindung an das Angebot ein oder heben sie auf: „freibleibend“, „unverbindlich“, „solange Vorrat reicht“, „Preis freibleibend“."], ["WiSo", "Recht", "Wie kommt ein Kaufvertrag zustande?", "Durch Antrag und Annahme: Angebot + Bestellung, oder Bestellung ohne Angebot + Auftragsbestätigung bzw. Lieferung."], ["WiSo", "Recht", "Verpflichtungs- und Erfüllungsgeschäft?", "Verpflichtung: der Vertragsschluss. Erfüllung: Verkäufer liefert mangelfrei und übereignet; Käufer nimmt ab und zahlt."], ["WiSo", "Recht", "Welche Formvorschriften gibt es?", "Schriftform (eigenhändige Unterschrift, z. B. Kündigung, Bürgschaft), öffentliche Beglaubigung (Unterschrift bestätigt, z. B. Handelsregisteranmeldung), notarielle Beurkundung (Inhalt und Unterschrift, z. B. Grundstückskauf)."], ["WiSo", "Recht", "Vertragsfreiheit und ihre Grenzen?", "Abschluss-, Inhalts- und Formfreiheit. Grenzen: Gesetze, gute Sitten, Formvorschriften, Kontrahierungszwang (z. B. Kfz-Haftpflicht), AGB-Recht."], ["WiSo", "Recht", "Die sechs Sachmangelarten?", "Mangel in der Beschaffenheit, Falschlieferung, Minderlieferung, Montagemangel, mangelhafte Montageanleitung, Abweichung von Werbeaussagen."], ["WiSo", "Recht", "Mängel nach Erkennbarkeit?", "Offener Mangel (sofort sichtbar), versteckter Mangel (zeigt sich erst später), arglistig verschwiegener Mangel (Verkäufer kannte ihn; Verjährung 3 Jahre)."], ["WiSo", "Recht", "Nachrangige Rechte beim Sachmangel und ihre Voraussetzung?", "Rücktritt (nicht bei unerheblichem Mangel), Minderung, Schadenersatz statt der Leistung (bei Verschulden), Ersatz vergeblicher Aufwendungen. Voraussetzung: Nacherfüllung ist gescheitert (Frist abgelaufen, zwei Fehlversuche) oder verweigert."], ["WiSo", "Recht", "Verbrauchsgüterkauf, bürgerlicher Kauf, ein- und zweiseitiger Handelskauf?", "Verbrauchsgüterkauf: Unternehmer verkauft bewegliche Sache an Verbraucher (zugleich einseitiger Handelskauf). Bürgerlicher Kauf: privat an privat. Zweiseitiger Handelskauf: Kaufmann an Kaufmann."], ["WiSo", "Recht", "Rechte beim Lieferungsverzug?", "Ohne Nachfrist: Lieferung verlangen und Ersatz des Verzögerungsschadens. Nach erfolgloser Nachfrist: Rücktritt und/oder Schadenersatz statt der Leistung."], ["WiSo", "Recht", "Konkreter und abstrakter Schaden?", "Konkret: genau nachweisbar, z. B. Mehrpreis eines Deckungskaufs. Abstrakt: nur schätzbar, z. B. entgangener Gewinn."], ["KUP", "Beschaffung und Lager", "Quantitativer und qualitativer Angebotsvergleich?", "Quantitativ: Bezugspreise vergleichen (Listenpreis − Rabatt − Skonto + Bezugskosten). Qualitativ: weitere Kriterien gewichten und bepunkten (Scoring: Qualität, Lieferzeit, Zuverlässigkeit, Service)."], ["KUP", "Beschaffung und Lager", "Was ist die optimale Bestellmenge?", "Die Menge, bei der die Summe aus Bestellkosten und Lagerkosten am geringsten ist. Große Mengen: wenig Bestell-, hohe Lagerkosten; kleine Mengen umgekehrt."], ["KUP", "Beschaffung und Lager", "Mindest-, Melde- und Höchstbestand?", "Mindestbestand: eiserne Reserve. Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand, löst die Bestellung aus. Höchstbestand = Mindestbestand + Bestellmenge."], ["KUP", "Beschaffung und Lager", "Bestellpunkt- und Bestellrhythmusverfahren?", "Bestellpunkt: bestellt wird, wenn der Meldebestand erreicht ist. Bestellrhythmus: bestellt wird in festen Zeitabständen."], ["KUP", "Beschaffung und Lager", "Die fünf Funktionen des Lagers?", "Sicherung (Lieferbereitschaft), Überbrückung (Zeit zwischen Einkauf und Verkauf), Spekulation (günstig einkaufen), Umformung (sortieren, portionieren), Veredelung (Reifung)."], ["KUP", "Beschaffung und Lager", "Arten von Lagerkosten?", "Raumkosten (Miete, Energie, Abschreibung), Personalkosten, Kosten der Vorräte (Kapitalbindung/Zinsen, Schwund, Versicherung)."], ["KUP", "Beschaffung und Lager", "Ablauf der Wareneingangskontrolle?", "Sofort in Anwesenheit des Fahrers: Anschrift, Anzahl und Zustand der Packstücke. Dann unverzüglich: Lieferschein mit Bestellung vergleichen, Art, Menge und Güte prüfen, Mängel rügen, Ware einlagern und buchen."], ["KUP", "Beschaffung und Lager", "Festplatz- und Freiplatzsystem?", "Festplatz: jeder Artikel hat seinen festen Lagerplatz (übersichtlich, braucht mehr Platz). Freiplatz (chaotisch): die EDV vergibt den nächsten freien Platz (platzsparend, ohne EDV nichts auffindbar)."], ["KUP", "Beschaffung und Lager", "FiFo und LiFo?", "First in, first out: zuerst Eingelagertes geht zuerst raus (wichtig bei Alterung). Last in, first out: zuletzt Eingelagertes geht zuerst raus."], ["KUP", "Beschaffung und Lager", "Just-in-time?", "Ware wird genau zum Bedarfszeitpunkt geliefert. Kaum Lagerkosten, aber Abhängigkeit vom Lieferanten und von den Verkehrswegen."], ["KUP", "Beschaffung und Lager", "Lastschrift und Dauerauftrag?", "Lastschrift: Der Empfänger zieht ein, Betrag und Termin können wechseln (SEPA-Mandat). Dauerauftrag: Der Zahler beauftragt seine Bank mit gleichbleibendem Betrag zu festen Terminen."], ["KUP", "Beschaffung und Lager", "Lohnt sich Skonto mit Kredit?", "Effektiver Jahreszins des Lieferantenkredits ≈ Skontosatz × 360 / (Zahlungsziel − Skontofrist). Liegt er über dem Kreditzins der Bank, lohnt es sich, mit Kredit unter Skontoabzug zu zahlen."], ["FF", "Verkauf", "Sortimentsbreite und Sortimentstiefe?", "Breite: Zahl der Warengruppen (breit oder schmal). Tiefe: Auswahl innerhalb einer Warengruppe (tief oder flach). Weitere Varianten eines vorhandenen Artikels machen das Sortiment tiefer."], ["FF", "Verkauf", "Kern- und Randsortiment?", "Kernsortiment: Artikel, die den Hauptumsatz bringen und zum Geschäftszweck gehören (z. B. Scheibenwischer). Randsortiment: ergänzende Artikel (z. B. Tasse mit Logo)."], ["FF", "Verkauf", "Die Phasen eines Verkaufsgesprächs?", "Begrüßung, Bedarfsermittlung, Warendemonstration, Verkaufsargumentation, Abschluss herbeiführen, Verabschiedung."], ["FF", "Verkauf", "Welche Frageformen gibt es?", "Offene Frage (W-Frage), geschlossene Frage (Ja/Nein), Alternativfrage (dies oder das), Suggestivfrage (legt die Antwort nahe), rhetorische Frage (beantwortet man selbst)."], ["FF", "Verkauf", "Die kundenbezogene Argumentationskette?", "Warenmerkmal nennen, Warenvorteil beschreiben, Kundennutzen ableiten."], ["FF", "Verkauf", "Verbale und nonverbale Kommunikation?", "Verbal: das gesprochene Wort. Nonverbal: Körpersprache wie Mimik, Gestik, Haltung, Blickkontakt, Kleidung."], ["FF", "Verkauf", "Die vier Regalzonen?", "Reckzone (über Kopf), Sichtzone (Augenhöhe, verkaufsstärkste Zone), Greifzone (Hüft- bis Brusthöhe), Bückzone (unten)."], ["FF", "Verkauf", "Was ist ein Ergänzungsverkauf?", "Zum Hauptartikel wird gezielt ein passender Zusatzartikel empfohlen, mit konkretem Nutzen für den Kunden."], ["FF", "Unfall", "Haftpflicht- und Kaskoschaden?", "Haftpflichtschaden: Ein anderer hat den Schaden verursacht, seine Versicherung zahlt. Kaskoschaden: Die eigene Kasko zahlt den Schaden am eigenen Fahrzeug."], ["FF", "Unfall", "Ansprüche des Geschädigten beim Haftpflichtschaden?", "Reparaturkosten oder Wiederbeschaffungsaufwand, Gutachterkosten, merkantile Wertminderung, Mietwagen oder Nutzungsausfall, Abschleppkosten, Kostenpauschale, Anwaltskosten."], ["FF", "Unfall", "Ansprüche beim Kaskoschaden?", "Nur die Vertragsleistung: Reparaturkosten bzw. Wiederbeschaffungswert abzüglich Restwert und Selbstbeteiligung. In der Regel keine Wertminderung und kein Nutzungsausfall."], ["FF", "Unfall", "Was ist die RKÜ mit Sicherungsabtretung?", "Reparaturkostenübernahme: Der Kunde tritt seinen Anspruch gegen die Versicherung an das Autohaus ab. Das Autohaus rechnet direkt mit der Versicherung ab und sichert so seine Bezahlung. Zahlt die Versicherung nicht, bleibt der Kunde Schuldner."], ["FF", "Unfall", "Was gilt, wenn der Kunde vorsteuerabzugsberechtigt ist?", "Die Versicherung ersetzt nur den Nettobetrag. Die Umsatzsteuer zahlt der Kunde selbst an das Autohaus und holt sie sich als Vorsteuer vom Finanzamt zurück."], ["FF", "Unfall", "Technischer und wirtschaftlicher Totalschaden?", "Technisch: Reparatur ist nicht mehr möglich. Wirtschaftlich: Reparatur lohnt sich nicht, weil die Kosten den Wiederbeschaffungswert (abzüglich Restwert) übersteigen."], ["FF", "Unfall", "Was besagt die 130-%-Regel?", "Beim Haftpflichtschaden darf die Reparatur bis zu 130 % des Wiederbeschaffungswerts kosten, wenn vollständig und fachgerecht repariert und das Fahrzeug weitergenutzt wird (in der Regel mindestens 6 Monate)."], ["FF", "Unfall", "Was ist das Integritätsinteresse?", "Das Interesse des Geschädigten, sein vertrautes Fahrzeug zu behalten. Es rechtfertigt die 130-%-Regel."], ["FF", "Unfall", "Merkantile Wertminderung?", "Der Minderwert, der trotz fachgerechter Reparatur bleibt, weil das Fahrzeug als Unfallwagen am Markt weniger erzielt."], ["FF", "Unfall", "Nutzungsausfall?", "Entschädigung je Tag für den Geschädigten eines Haftpflichtschadens, der auf einen Mietwagen verzichtet. Voraussetzung: Nutzungswille und Nutzungsmöglichkeit."], ["FF", "Unfall", "Gefährdungshaftung?", "Der Halter haftet schon für die Betriebsgefahr seines Fahrzeugs, auch ohne eigenes Verschulden. Deshalb ist die Kfz-Haftpflicht Pflicht."], ["FF", "Unfall", "Wer beauftragt den Gutachter?", "Beim Haftpflichtschaden der Geschädigte selbst (oberhalb der Bagatellgrenze), die Kosten trägt die gegnerische Versicherung. Beim Kaskoschaden entscheidet der Versicherer."], ["FF", "Unfall", "Was zählt in der Teilkasko als Haarwild?", "Zum Beispiel Reh, Hirsch, Wildschwein, Hase, Wildkaninchen, Fuchs, Dachs, Marder. Vögel und Haustiere gehören nicht dazu, sofern der Tarif nicht „Tiere aller Art“ einschließt."], ["FF", "Unfall", "Vor- und Nachteile der Werkstattbindung?", "Vorteil: niedrigerer Kaskobeitrag, oft Hol- und Bringservice. Nachteil: Die Versicherung bestimmt die Werkstatt; bei Leasing, Finanzierung oder Herstellergarantie kann das Probleme machen."], ["FF", "Unfall", "Warum ist Full-Service-Unfallabwicklung für das Autohaus wichtig?", "Der Kunde bekommt alles aus einer Hand (Gutachter, Mietwagen, Reparatur, Abrechnung). Das bindet ihn, lastet Werkstatt und Lackiererei aus und bringt Teile- und Mietwagenumsatz."], ["FF", "Unfall", "Risiken der fiktiven Abrechnung auf Gutachtenbasis?", "Ersetzt wird nur netto ohne Umsatzsteuer; Versicherer kürzen häufig Stundensätze; versteckte Schäden bleiben unentdeckt; für das Autohaus entfällt der Reparaturauftrag."], ["FF", "GW", "Wie ermittelt man den Hereinnahmepreis eines GW?", "Vom erzielbaren Verkaufspreis rückwärts: netto umrechnen, dann Bruttoertrag (Gewinn und Kosten), Reparatur, Aufbereitung, Garantie und Standkosten abziehen."], ["FF", "GW", "Welche Faktoren beeinflussen den Hereinnahmepreis?", "Alter, Laufleistung, Zustand, Unfallfreiheit, Ausstattung, Farbe, Zahl der Vorbesitzer, Serviceheft, HU, Marktlage und Saison."], ["FF", "GW", "Wer bewertet den GW im Autohaus?", "Technische Bewertung: Werkstatt oder GW-Meister (Zustand, Instandsetzungskosten). Kaufmännische Bewertung: GW-Verkaufsleiter mit DAT oder Schwacke und Marktbeobachtung."], ["FF", "GW", "Was bedeutet „Mehrwertsteuer ausweisbar“?", "Das Fahrzeug ist regelbesteuert, die Rechnung weist 19 % Umsatzsteuer aus. Interessant für Gewerbekunden, die die Vorsteuer abziehen können."], ["FF", "GW", "Warum gibt es die Differenzbesteuerung?", "Um eine Doppelbesteuerung zu vermeiden: Im Einkaufspreis von privat steckt bereits Umsatzsteuer, die der Händler nicht als Vorsteuer abziehen kann."], ["FF", "GW", "Was ist ein verdeckter Preisnachlass und wer trägt ihn?", "Die Inzahlungnahme wird über ihrem tatsächlichen Wert angerechnet, um den Neuwagen zu verkaufen. Die Überzahlung trägt die Neuwagenabteilung; der GW wird mit dem echten Wert eingebucht."], ["FF", "GW", "Warum wird ein kalkulierter GW-Preis oft nicht erzielt?", "Lange Standzeit, fallende Marktpreise, Modellwechsel, unentdeckte Mängel, Saison, starke Konkurrenzangebote."], ["FF", "GW", "Gründe für aktiven GW-Zukauf?", "Sortimentslücken schließen, gefragte Modelle anbieten, Nachfrage bedienen, Auslastung von Verkauf und Werkstatt, zusätzlicher Ertrag."], ["FF", "Finanzierung", "Kreditfähigkeit und Kreditwürdigkeit?", "Kreditfähigkeit: rechtlich Kreditverträge schließen können (voll geschäftsfähig). Kreditwürdigkeit (Bonität): persönliche und wirtschaftliche Verhältnisse lassen die Rückzahlung erwarten."], ["FF", "Finanzierung", "Unterlagen zur Kreditwürdigkeitsprüfung?", "Privatperson: Gehaltsnachweise, Selbstauskunft, SCHUFA-Auskunft, Ausweis. Unternehmen: Bilanz und GuV, betriebswirtschaftliche Auswertung, Handelsregisterauszug, Auskunftei."], ["FF", "Finanzierung", "Was ist die Legitimationsprüfung?", "Die Feststellung der Identität des Kunden anhand von Personalausweis oder Reisepass (bei Firmen zusätzlich Handelsregisterauszug). Pflicht nach dem Geldwäschegesetz."], ["FF", "Finanzierung", "Ausfallbürgschaft und selbstschuldnerische Bürgschaft?", "Ausfall: Der Bürge zahlt erst, wenn beim Schuldner erfolglos vollstreckt wurde. Selbstschuldnerisch: Die Bank kann sich sofort an den Bürgen halten (bankübliche Form)."], ["FF", "Finanzierung", "Was sagt der effektive Jahreszins?", "Die gesamten Kreditkosten pro Jahr in Prozent einschließlich Gebühren. Nur mit ihm lassen sich Angebote vergleichen."], ["FF", "Finanzierung", "Was ist ein Annuitätendarlehen?", "Ein Darlehen mit gleichbleibender Rate. Der Zinsanteil sinkt mit der Restschuld, der Tilgungsanteil steigt."], ["FF", "Finanzierung", "Wie lässt sich die Monatsrate senken?", "Höhere Anzahlung, längere Laufzeit, höhere Schlussrate, niedrigerer Zins, günstigeres Fahrzeug oder weniger Ausstattung."], ["FF", "Finanzierung", "Was ist ein Verbundgeschäft?", "Kaufvertrag und Darlehen bilden eine wirtschaftliche Einheit. Widerruft der Kunde das Darlehen (14 Tage), ist auch der Kaufvertrag hinfällig."], ["FF", "Finanzierung", "Warum gibt es oft keinen Barzahlerrabatt?", "Das Autohaus erhält für vermittelte Finanzierungen und Leasing Provision und bindet den Kunden bis zum Vertragsende. Barzahlung bringt ihm keinen Vorteil."], ["FF", "Finanzierung", "Zwei- und Drei-Wege-Finanzierung?", "Zwei Wege: Schlussrate zahlen oder weiterfinanzieren. Drei Wege: zusätzlich Rückgabe des Fahrzeugs an den Händler."], ["FF", "Leasing", "Leasing und Miete: drei Unterschiede?", "Leasing hat eine feste, längere Laufzeit ohne ordentliche Kündigung; der Leasingnehmer trägt Wartung, Versicherung und das Risiko von Untergang und Beschädigung; das Fahrzeug wird für ihn angeschafft."], ["FF", "Leasing", "Was ist erlasskonformes Leasing?", "Die Grundmietzeit liegt zwischen 40 % und 90 % der betriebsgewöhnlichen Nutzungsdauer. Dann wird das Fahrzeug steuerlich dem Leasinggeber zugerechnet und die Raten sind beim Leasingnehmer Betriebsausgaben."], ["FF", "Leasing", "Was ist das Andienungsrecht?", "Der Leasinggeber kann den Leasingnehmer am Vertragsende verpflichten, das Fahrzeug zum vereinbarten Restwert zu kaufen. Der Leasingnehmer selbst hat kein Recht auf den Kauf."], ["FF", "Leasing", "Voll- und Teilamortisation?", "Vollamortisation: Die Raten decken Anschaffungskosten, Zinsen und Gewinn des Leasinggebers komplett. Teilamortisation: Es bleibt ein Restwert offen, der am Ende gedeckt werden muss."], ["FF", "Leasing", "Welche Rolle spielt die Umsatzsteuer beim Leasing?", "Sie fällt auf jede Rate und die Sonderzahlung an, nicht auf einmal auf den Kaufpreis. Das schont die Liquidität; Unternehmer ziehen sie als Vorsteuer ab."], ["FF", "Leasing", "Warum bieten Autohäuser fast nur Kilometerleasing an?", "Der Kunde hat kein Restwertrisiko und klare Kosten. Abgerechnet werden nur Mehr- und Minderkilometer sowie Schäden über den normalen Verschleiß hinaus."], ["FF", "Leasing", "Was steht im Rückgabeprotokoll?", "Kilometerstand, Schäden außen und innen, Reifenzustand, Vollständigkeit von Zubehör, Schlüsseln und Papieren, Serviceheft, Unterschriften."], ["FF", "Leasing", "Was umfasst Full-Service-Leasing?", "Neben der Nutzung auch Wartung und Verschleißreparaturen, Reifen, oft Versicherung, Steuer und Ersatzwagen. Vorteil: feste, planbare Monatskosten."], ["FF", "Versicherung", "Laufzeit und Kündigung der Kfz-Versicherung?", "Ein Jahr, meist bis 31.12., Kündigung bis 30.11. Sonderkündigung bei Beitragserhöhung, nach einem Schaden und beim Fahrzeugwechsel."], ["FF", "Versicherung", "Was senkt den Kfz-Versicherungsbeitrag?", "Hohe Schadenfreiheitsklasse, günstige Typ- und Regionalklasse, wenig Kilometer, Garage, eingeschränkter Fahrerkreis, Selbstbeteiligung, Werkstattbindung."], ["FF", "Versicherung", "Was ist der Rabattschutz?", "Gegen Mehrbeitrag bleibt die Schadenfreiheitsklasse nach einem Schaden pro Jahr erhalten."], ["FF", "Versicherung", "Was bedeutet der Sicherungsschein?", "Die Kaskoleistung wird im Schadenfall an den Leasinggeber oder die Bank gezahlt, weil ihnen das Fahrzeug gehört bzw. sicherungsübereignet ist."], ["FF", "Versicherung", "Garantie, Gewährleistung, Kulanz?", "Gewährleistung (Sachmängelhaftung): gesetzliche Pflicht des Verkäufers. Garantie: freiwilliges Versprechen. Kulanz: freiwilliges Entgegenkommen ohne Rechtsanspruch, meist nach Ablauf der Fristen."], ["KUP", "Personal", "Quantitativer und qualitativer Personalbedarf?", "Quantitativ: wie viele Mitarbeiter gebraucht werden. Qualitativ: welche Qualifikationen sie haben müssen."], ["KUP", "Personal", "Interne und externe Personalbeschaffung: Vor- und Nachteile?", "Intern: schnell, günstig, motivierend, Bewerber bekannt; aber Betriebsblindheit, die alte Stelle wird frei, Neid. Extern: große Auswahl, neue Ideen; aber teurer, längere Einarbeitung, Risiko der Fehlbesetzung."], ["KUP", "Personal", "Ablauf der Personalbeschaffung?", "Bedarf feststellen, Stellenbeschreibung und Ausschreibung, Bewerbungen sichten, Vorstellungsgespräche, Auswahl mit Beteiligung des Betriebsrats, Arbeitsvertrag, Einarbeitung."], ["KUP", "Personal", "Wesentliche Inhalte eines Arbeitsvertrags?", "Vertragsparteien, Beginn (und Befristung), Arbeitsort, Tätigkeit, Entgelt, Arbeitszeit, Urlaub, Probezeit, Kündigungsfristen, Hinweis auf Tarifvertrag und Betriebsvereinbarungen."], ["KUP", "Personal", "Rechte und Pflichten des Arbeitnehmers?", "Rechte: Vergütung, Urlaub, Fürsorge, Zeugnis, Entgeltfortzahlung. Pflichten: Arbeitsleistung, Weisungen befolgen, Verschwiegenheit, Treue und Wettbewerbsverbot."], ["KUP", "Personal", "Einfaches und qualifiziertes Arbeitszeugnis?", "Einfach: Art und Dauer der Tätigkeit. Qualifiziert: zusätzlich Leistung und Verhalten. Es muss wahr und wohlwollend sein; bei Fehlern kann Berichtigung verlangt werden, notfalls vor dem Arbeitsgericht."], ["KUP", "Personal", "Wichtige Regeln des Arbeitszeitgesetzes?", "Werktäglich 8 Stunden, bis 10 Stunden mit Ausgleich; Pause 30 Minuten bei mehr als 6 Stunden, 45 Minuten bei mehr als 9 Stunden; 11 Stunden Ruhezeit."], ["KUP", "Personal", "Mutterschutz: Fristen?", "Schutzfrist 6 Wochen vor und 8 Wochen nach der Geburt (12 Wochen bei Früh- und Mehrlingsgeburten). Kündigungsverbot ab Beginn der Schwangerschaft bis 4 Monate nach der Entbindung."], ["KUP", "Personal", "Geldwerter Vorteil beim Firmenwagen (1-%-Methode)?", "Monatlich 1 % des Bruttolistenpreises plus 0,03 % je Entfernungskilometer zur Arbeit. Der Betrag erhöht das steuer- und sozialversicherungspflichtige Brutto und wird vom Netto wieder abgezogen."], ["KUP", "Personal", "Wer erhält welche Zahlung aus der Gehaltsabrechnung?", "Arbeitnehmer: Auszahlungsbetrag. Finanzamt: Lohnsteuer, Soli, Kirchensteuer. Krankenkasse: alle Sozialversicherungsbeiträge (Einzugsstelle). Bank oder Bausparkasse: vermögenswirksame Leistungen."], ["KUP", "Personal", "Personalkosten des Arbeitgebers?", "Bruttoentgelt + Arbeitgeberanteile zur Sozialversicherung + Beitrag zur Unfallversicherung + freiwillige Leistungen."], ["KUP", "Personal", "Ordentliche und außerordentliche Kündigung, Aufhebungsvertrag?", "Ordentlich: mit Frist. Außerordentlich: fristlos aus wichtigem Grund, innerhalb von 2 Wochen ab Kenntnis. Aufhebungsvertrag: einvernehmlich, ohne Frist, schriftlich."], ["KUP", "Personal", "Personen-, verhaltens- und betriebsbedingte Kündigung?", "Personenbedingt: Grund in der Person (lange Krankheit, Verlust der Fahrerlaubnis). Verhaltensbedingt: Pflichtverletzung, vorher Abmahnung. Betriebsbedingt: Arbeitsplatz fällt weg, Sozialauswahl nötig."], ["KUP", "Personal", "Kriterien der Sozialauswahl?", "Dauer der Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten, Schwerbehinderung."], ["KUP", "Personal", "Funktion der Abmahnung?", "Sie rügt ein konkretes Fehlverhalten, fordert zur Änderung auf und droht für den Wiederholungsfall die Kündigung an. Zum Beweis schriftlich."], ["KUP", "Personal", "Mit welcher Frist kündigt der Arbeitnehmer?", "Immer mit der Grundfrist von 4 Wochen zum 15. oder zum Monatsende, wenn Vertrag oder Tarif nichts anderes regeln. Die verlängerten Fristen gelten nur für den Arbeitgeber."]
