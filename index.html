debt / equity × 100. Fixed asset coverage II = (equity + long-term debt) / fixed assets × 100, should be at least 100 %."], ["What does gross profit in percent tell you?", "Gross profit / net revenue × 100. What percentage of revenue remains after cost of goods to cover costs and make a profit."], ["What does demand depend on?", "Price of the good, income, prices of other goods (substitutes and complements), needs and fashion, expectations."], ["What does supply depend on?", "Price of the good, cost of production factors, state of technology, profit expectations, number of suppliers, state levies and subsidies."], ["Substitute and complementary goods?", "Substitutes replace each other (butter and margarine): if one gets more expensive, demand for the other rises. Complements go together (car and fuel): if one gets more expensive, demand for the other falls too."], ["How does a subsidy to suppliers affect the market?", "Suppliers' costs fall, supply rises (curve shifts right). The price falls, quantity rises. The price still forms freely: market-conforming."], ["Who makes economic policy?", "Federal government, states and municipalities, the EU, the ECB and the Bundesbank, and the collective bargaining parties."], ["Name a goal conflict and a goal harmony.", "Conflict: high employment and price stability; growth and environmental protection. Harmony: economic growth and high employment."], ["GDP by production, expenditure and distribution?", "Production: value added by economic sectors. Expenditure: consumption, investment, net exports. Distribution: employee compensation and business and property income."], ["Primary and secondary income distribution?", "Primary: the distribution the market produces (wage share, profit share). Secondary: distribution after state redistribution through taxes, social contributions and transfers."], ["Cyclical and seasonal fluctuations?", "Cyclical: medium term over several years, affect the whole economy. Seasonal: short term and due to the time of year, e.g. construction in winter, Christmas business."], ["Examples of state revenue and spending policy?", "Revenue: change tax rates, extend or reduce depreciation options. Spending: public contracts, investment programmes, subsidies, transfer payments."], ["What is the key interest rate and what does a cut do?", "The rate at which banks borrow money from the ECB. Cut: loans get cheaper, investment and consumption rise, the economy is stimulated, the risk of inflation rises."], ["Tasks of the Deutsche Bundesbank?", "Implement ECB monetary policy in Germany, supply cash, process payments, take part in banking supervision, manage currency reserves."], ["Face value and purchasing power of money?", "Face value: the printed amount. Purchasing power: the amount of goods you can buy with it. With inflation, the face value stays the same, purchasing power falls."], ["Opportunities and risks of globalisation?", "Opportunities: larger sales markets, cheaper purchasing, more choice, division of labour. Risks: relocation of jobs, wage and price pressure, dependence on supply chains."], ["Types of cartels?", "Price cartel (uniform prices), territorial cartel (division of sales areas), quota cartel (quantities), bid-rigging cartel (agreements in tenders)."], ["What does the Vertical Block Exemption Regulation (Vertikal-GVO) govern?", "An EU regulation that exempts agreements between manufacturer and dealer (vertical) from the cartel ban under certain conditions. It thus allows selective and exclusive distribution systems in car retail."], ["Selective and exclusive distribution system?", "Selective: the manufacturer chooses dealers according to fixed criteria (standards, number); sales only to end customers and approved dealers. Exclusive: the dealer is assigned an area alone (territorial protection)."], ["Who are the partners in the sales network?", "Manufacturer or importer, branches, authorised dealers (A and B dealers), agents, service partners (authorised workshops)."], ["What is a service partner?", "A workshop authorised by the manufacturer that offers maintenance, repair, warranty work and original parts but does not sell new cars in its own name (at most brokers them)."], ["Key contents of a dealer contract?", "Contract territory, sales targets and minimum purchase, standards (equipment, corporate design, training), margin and bonus system, stock and demo car obligations, term and termination."], ["Training profile, framework training plan, framework curriculum?", "Profile: skills and knowledge to be taught. Framework training plan: content and time structure for the company. Framework curriculum: vocational school content (learning fields)."], ["Duties of the apprentice and the training company?", "Apprentice: duty to learn, attend vocational school, follow instructions, keep a training record, confidentiality. Training company: train, provide training materials free of charge, release for vocational school, pay remuneration, issue a reference."], ["Who do you turn to with problems during training?", "Trainer, youth representation (JAV) or works council, the IHK training adviser, the vocational school; in a dispute, the chamber's arbitration committee."], ["What does a works agreement govern?", "A written agreement between employer and works council for all employees, e.g. working hours, flexitime, leave principles, breaks, monitoring."], ["Active and passive voting rights?", "Active: being allowed to vote. Passive: being eligible for election."], ["Rights of the works council?", "Right to information, consultation and hearing (e.g. before dismissals), participation in personnel measures (hiring, transfer), co-determination in social matters."], ["Need, requirement, demand?", "Need: feeling of lack. Requirement: need backed by purchasing power. Demand: requirement actually expressed on the market."], ["The three economic sectors?", "Primary: raw production (raw materials, agriculture). Secondary: processing (carmakers, suppliers). Tertiary: services (dealership, bank, insurance)."], ["Types of goods?", "Physical goods, services, rights. Consumer and capital goods. Durable and consumable goods."], ["Classify partnerships and corporations?", "Partnerships: OHG, KG, GmbH & Co. KG. Corporations: GmbH, AG. The e. K. is a sole proprietorship."], ["What is a GmbH & Co. KG?", "A KG whose fully liable partner (Komplementär) is a GmbH. This effectively limits liability to the GmbH's assets and the limited partners' contributions."], ["Profit distribution in a KG?", "According to the partnership agreement; without a provision, since 2024 according to the agreed shareholdings. Limited partners share in losses only up to their contribution."], ["What is the commercial register?", "A public register of merchants kept at the local court. Section A: sole traders and partnerships. Section B: corporations."], ["Declaratory and constitutive effect?", "Declaratory: the fact applies before, registration makes it known, e.g. „Istkaufmann“ (merchant by nature of business), „Prokura“. Constitutive: only registration creates the right, e.g. GmbH, AG, „Kannkaufmann“ (optional merchant)."], ["„Ist-“, „Kann-“ and „Formkaufmann“?", "„Istkaufmann“: runs a commercial business that requires commercial organisation. „Kannkaufmann“: small business or agriculture/forestry, registered voluntarily. „Formkaufmann“: by virtue of legal form, e.g. GmbH, AG."], ["What is the „Firma“?", "The name under which a merchant does business, signs, sues and can be sued."], ["Types of „Handlungsvollmacht“?", "General (all ordinary business), specific type (a certain type of business, e.g. purchasing), single (one single transaction); each also possible as joint authority with others."], ["Legal subjects and legal objects?", "Legal subjects: bearers of rights and obligations (natural and legal persons). Legal objects: items of legal transactions (things and rights)."], ["Legal persons under private and public law?", "Private: GmbH, AG, registered association. Public: federal government, states, municipalities, IHK, pension insurance."], ["Enquiry, offer, advertisement?", "Enquiry: non-binding. Offer: binding declaration of intent to a specific person. Advertisement (brochure, shop window, online shop): aimed at the general public, not an offer."], ["How long is an offer binding?", "Between people present and on the phone: only immediately. Between absent parties: as long as an answer usually takes (letter about a week, e-mail one to two days). Offer with a deadline: until the deadline."], ["What do exclusion clauses do?", "They restrict or remove the binding nature of the offer: „subject to change“, „non-binding“, „while stocks last“, „price subject to change“."], ["How is a purchase contract concluded?", "Through offer and acceptance: offer + order, or order without offer + order confirmation or delivery."], ["Obligation and fulfilment transaction?", "Obligation: concluding the contract. Fulfilment: the seller delivers free of defects and transfers ownership; the buyer accepts and pays."], ["What form requirements exist?", "Written form (handwritten signature, e.g. dismissal, guarantee), public certification (signature confirmed, e.g. commercial register application), notarial certification (content and signature, e.g. property purchase)."], ["Freedom of contract and its limits?", "Freedom to conclude, determine content and form. Limits: laws, good morals, form requirements, obligation to contract (e.g. motor liability), AGB law."], ["The six types of material defects?", "Defect in quality, wrong delivery, short delivery, installation defect, faulty installation instructions, deviation from advertising claims."], ["Defects by recognisability?", "Obvious defect (visible immediately), hidden defect (only appears later), fraudulently concealed defect (seller knew; limitation 3 years)."], ["Secondary rights for material defects and their requirement?", "Withdrawal (not for a minor defect), price reduction, damages instead of performance (if at fault), reimbursement of wasted expenses. Requirement: supplementary performance has failed (deadline passed, two failed attempts) or was refused."], ["Consumer sale, civil sale, one-sided and two-sided commercial sale?", "Consumer sale: a business sells a movable item to a consumer (also a one-sided commercial sale). Civil sale: private to private. Two-sided commercial sale: merchant to merchant."], ["Rights in case of late delivery?", "Without grace period: demand delivery and compensation for damage caused by delay. After an unsuccessful grace period: withdrawal and/or damages instead of performance."], ["Concrete and abstract damage?", "Concrete: exactly provable, e.g. extra price of a cover purchase. Abstract: only estimable, e.g. lost profit."], ["Quantitative and qualitative comparison of offers?", "Quantitative: compare landed costs (list price − discount − cash discount + delivery costs). Qualitative: weight and score other criteria (scoring: quality, delivery time, reliability, service)."], ["What is the optimal order quantity?", "The quantity at which the sum of ordering and storage costs is lowest. Large quantities: low ordering, high storage costs; small quantities the reverse."], ["Minimum, reorder and maximum stock?", "Minimum stock: safety reserve. Reorder point = daily usage × delivery time + minimum stock, triggers the order. Maximum stock = minimum stock + order quantity."], ["Reorder point and fixed-interval ordering?", "Reorder point: order when the reorder level is reached. Fixed interval: order at fixed time intervals."], ["The five functions of a warehouse?", "Security (availability), bridging (time between purchase and sale), speculation (buy cheaply), transformation (sort, portion), refinement (ripening)."], ["Types of storage costs?", "Space costs (rent, energy, depreciation), personnel costs, inventory costs (capital tied up/interest, shrinkage, insurance)."], ["Procedure for incoming goods inspection?", "Immediately in the driver's presence: address, number and condition of packages. Then without delay: compare delivery note with order, check type, quantity and quality, report defects, store and book goods."], ["Fixed and free location system?", "Fixed location: each item has its fixed place (clear, needs more space). Free location (chaotic): the IT system assigns the next free place (space-saving, nothing can be found without IT)."], ["FiFo and LiFo?", "First in, first out: what was stored first goes out first (important for ageing). Last in, first out: what was stored last goes out first."], ["Just-in-time?", "Goods are delivered exactly when needed. Hardly any storage costs, but dependence on the supplier and transport routes."], ["Direct debit and standing order?", "Direct debit: the recipient collects, amount and date can vary (SEPA mandate). Standing order: the payer instructs their bank to pay a fixed amount on fixed dates."], ["Is cash discount worth it with a loan?", "Effective annual rate of supplier credit ≈ discount rate × 360 / (payment term − discount period). If it is above the bank's loan rate, it is worth paying with a loan and taking the discount."], ["Range width and depth?", "Width: number of product groups (wide or narrow). Depth: choice within a product group (deep or shallow). More variants of an existing item make the range deeper."], ["Core and peripheral range?", "Core range: items that bring the main revenue and belong to the business purpose (e.g. wiper blades). Peripheral range: supplementary items (e.g. mug with logo)."], ["The phases of a sales conversation?", "Greeting, needs analysis, product demonstration, sales arguments, closing the sale, farewell."], ["What types of questions are there?", "Open question (W question), closed question (yes/no), alternative question (this or that), leading question (suggests the answer), rhetorical question (you answer it yourself)."], ["The customer-oriented chain of arguments?", "Name the product feature, describe the product advantage, derive the customer benefit."], ["Verbal and non-verbal communication?", "Verbal: the spoken word. Non-verbal: body language such as facial expression, gestures, posture, eye contact, clothing."], ["The four shelf zones?", "Stretch zone (overhead), eye level zone (best-selling zone), grab zone (hip to chest height), bend zone (bottom)."], ["What is an add-on sale?", "A suitable additional item is specifically recommended with the main item, with a concrete benefit for the customer."], ["Liability and comprehensive damage?", "Liability damage: someone else caused the damage, their insurance pays. Comprehensive damage: your own comprehensive cover pays the damage to your own vehicle."], ["Claims of the injured party in a liability case?", "Repair costs or replacement cost, expert fees, reduction in market value, rental car or loss of use, towing costs, flat-rate expenses, lawyer's fees."], ["Claims in a comprehensive cover case?", "Only the contractual benefit: repair costs or replacement value minus residual value and deductible. Usually no reduction in value and no loss of use."], ["What is the repair cost assumption (RKÜ) with assignment by way of security?", "The customer assigns their claim against the insurer to the dealership. The dealership invoices the insurer directly and thus secures payment. If the insurer doesn't pay, the customer remains the debtor."], ["What applies if the customer is entitled to deduct input VAT?", "The insurer only reimburses the net amount. The customer pays the VAT to the dealership and reclaims it as input VAT from the tax office."], ["Technical and economic total loss?", "Technical: repair is no longer possible. Economic: repair isn't worth it because the costs exceed the replacement value (minus residual value)."], ["What does the 130 % rule say?", "In a liability case, the repair may cost up to 130 % of the replacement value if the car is fully and professionally repaired and kept in use (usually at least 6 months)."], ["What is the integrity interest?", "The injured party's interest in keeping their familiar vehicle. It justifies the 130 % rule."], ["Reduction in market value (merkantile Wertminderung)?", "The loss in value that remains despite professional repair, because the vehicle fetches less on the market as an accident car."], ["Loss of use (Nutzungsausfall)?", "Daily compensation for the injured party in a liability case who does without a rental car. Requirement: will and ability to use the car."], ["Strict liability (Gefährdungshaftung)?", "The keeper is liable for the operating risk of their vehicle even without own fault. That's why motor liability insurance is compulsory."], ["Who commissions the expert?", "In a liability case the injured party (above the minor damage limit); the other side's insurer pays. In a comprehensive cover case the insurer decides."], ["What counts as game (Haarwild) under partial cover?", "For example deer, stag, wild boar, hare, wild rabbit, fox, badger, marten. Birds and pets are not included unless the policy covers „animals of all kinds“."], ["Pros and cons of a workshop commitment clause?", "Pro: lower comprehensive premium, often pick-up and delivery. Con: the insurer chooses the workshop; with leasing, financing or a manufacturer warranty this can cause problems."], ["Why is full-service accident handling important for the dealership?", "The customer gets everything from one source (expert, rental car, repair, settlement). That retains them, keeps the workshop and paint shop busy and brings parts and rental revenue."], ["Risks of a notional settlement based on the expert report?", "Only the net amount without VAT is paid; insurers often cut hourly rates; hidden damage goes undetected; the dealership loses the repair order."], ["How do you determine the purchase price of a used car?", "Backwards from the achievable selling price: convert to net, then deduct gross profit (profit and costs), repairs, reconditioning, warranty and holding costs."], ["Which factors affect the purchase price?", "Age, mileage, condition, accident-free, equipment, colour, number of previous owners, service book, MOT (HU), market situation and season."], ["Who values the used car at the dealership?", "Technical valuation: workshop or used car master (condition, repair costs). Commercial valuation: used car sales manager with DAT or Schwacke and market observation."], ["What does „VAT deductible“ (Mehrwertsteuer ausweisbar) mean?", "The vehicle is standard-taxed; the invoice shows 19 % VAT. Interesting for business customers who can deduct input VAT."], ["Why does margin taxation exist?", "To avoid double taxation: the purchase price from a private seller already contains VAT that the dealer cannot deduct as input VAT."], ["What is a hidden price discount and who bears it?", "The trade-in is credited above its actual value in order to sell the new car. The overpayment is borne by the new car department; the used car is booked at its real value."], ["Why is a calculated used car price often not achieved?", "Long holding time, falling market prices, model change, undetected defects, season, strong competing offers."], ["Reasons for actively buying in used cars?", "Fill gaps in the range, offer models in demand, meet demand, keep sales and workshop busy, additional profit."], ["Capacity to borrow and creditworthiness?", "Capacity: legally able to conclude loan contracts (full legal capacity). Creditworthiness: personal and economic circumstances make repayment likely."], ["Documents for checking creditworthiness?", "Private person: proof of salary, self-disclosure, SCHUFA report, ID. Company: balance sheet and P&L, business analysis, commercial register extract, credit agency."], ["What is the identity check (Legitimationsprüfung)?", "Establishing the customer's identity using ID card or passport (for companies also the commercial register extract). Required under the Money Laundering Act."], ["Deficiency guarantee and absolute guarantee?", "Deficiency: the guarantor only pays after unsuccessful enforcement against the debtor. Absolute (selbstschuldnerisch): the bank can turn to the guarantor immediately (usual bank form)."], ["What does the effective annual rate tell you?", "The total cost of credit per year in percent including fees. Only with it can offers be compared."], ["What is an annuity loan?", "A loan with a constant instalment. The interest portion falls with the outstanding balance, the repayment portion rises."], ["How can the monthly instalment be lowered?", "Higher down payment, longer term, higher final instalment, lower interest, cheaper vehicle or less equipment."], ["What is a linked transaction?", "Purchase contract and loan form an economic unit. If the customer withdraws from the loan (14 days), the purchase contract also lapses."], ["Why is there often no cash discount for cash buyers?", "The dealership receives commission for brokered financing and leasing and retains the customer until the end of the contract. Cash payment brings it no advantage."], ["Two-way and three-way financing?", "Two ways: pay the final instalment or refinance. Three ways: additionally return the vehicle to the dealer."], ["Leasing and renting: three differences?", "Leasing has a fixed, longer term without ordinary termination; the lessee bears maintenance, insurance and the risk of loss and damage; the vehicle is purchased for them."], ["What is tax-compliant leasing (erlasskonform)?", "The basic lease term is between 40 % and 90 % of the normal useful life. Then the vehicle is attributed to the lessor for tax purposes and the instalments are operating expenses for the lessee."], ["What is the tender right (Andienungsrecht)?", "The lessor can oblige the lessee to buy the vehicle at the agreed residual value at the end of the contract. The lessee has no right to buy."], ["Full and partial amortisation?", "Full: the instalments fully cover acquisition cost, interest and the lessor's profit. Partial: a residual value remains open, which must be covered at the end."], ["What role does VAT play in leasing?", "It is due on each instalment and the special payment, not all at once on the purchase price. That protects liquidity; businesses deduct it as input VAT."], ["Why do dealerships offer almost only mileage leasing?", "The customer has no residual value risk and clear costs. Only extra and fewer kilometres and damage beyond normal wear are settled."], ["What is in the return record?", "Mileage, damage outside and inside, tyre condition, completeness of accessories, keys and papers, service book, signatures."], ["What does full-service leasing include?", "Besides use, also maintenance and wear repairs, tyres, often insurance, tax and a replacement car. Advantage: fixed, predictable monthly costs."], ["Term and cancellation of motor insurance?", "One year, usually until 31 Dec, cancellation by 30 Nov. Special cancellation after a premium increase, after a claim and when changing vehicles."], ["What lowers the motor insurance premium?", "High no-claims class, favourable type and regional class, low mileage, garage, restricted drivers, deductible, workshop commitment."], ["What is no-claims protection (Rabattschutz)?", "For an extra premium, the no-claims class is kept after one claim per year."], ["What does the security certificate (Sicherungsschein) mean?", "In a claim, the comprehensive payout goes to the lessor or bank because they own the vehicle or it was transferred to them as security."], ["Guarantee, statutory warranty, goodwill?", "Statutory warranty (liability for defects): the seller's legal duty. Guarantee: voluntary promise. Goodwill: voluntary accommodation without legal claim, usually after deadlines have passed."], ["Quantitative and qualitative staffing requirement?", "Quantitative: how many employees are needed. Qualitative: which qualifications they must have."], ["Internal and external recruitment: pros and cons?", "Internal: fast, cheap, motivating, applicant known; but tunnel vision, the old position becomes vacant, envy. External: large choice, new ideas; but more expensive, longer onboarding, risk of a wrong hire."], ["Recruitment process?", "Determine need, job description and posting, screen applications, interviews, selection with works council involvement, employment contract, onboarding."], ["Key contents of an employment contract?", "Parties, start (and fixed term), place of work, job, pay, working hours, leave, probation, notice periods, reference to collective agreement and works agreements."], ["Rights and duties of the employee?", "Rights: pay, leave, welfare, reference, continued pay when sick. Duties: work performance, follow instructions, confidentiality, loyalty and non-competition."], ["Simple and qualified job reference?", "Simple: type and duration of work. Qualified: also performance and conduct. It must be true and benevolent; errors can be corrected on request, if necessary at the labour court."], ["Key rules of the Working Hours Act?", "8 hours per working day, up to 10 hours with compensation; break 30 minutes for more than 6 hours, 45 minutes for more than 9 hours; 11 hours rest."], ["Maternity protection: periods?", "Protection period 6 weeks before and 8 weeks after birth (12 weeks for premature and multiple births). Ban on dismissal from the start of pregnancy until 4 months after delivery."], ["Taxable benefit of a company car (1 % method)?", "Monthly 1 % of the gross list price plus 0,03 % per km of distance to work. The amount increases taxable and social security gross pay and is deducted again from net pay."], ["Who receives which payment from the payslip?", "Employee: payout amount. Tax office: income tax, solidarity surcharge, church tax. Health insurance fund: all social security contributions (collection agency). Bank or building society: capital-forming benefits."], ["Employer's personnel costs?", "Gross pay + employer social security shares + accident insurance contribution + voluntary benefits."], ["Ordinary and extraordinary dismissal, termination agreement?", "Ordinary: with notice. Extraordinary: without notice for good cause, within 2 weeks of knowledge. Termination agreement: by mutual consent, without notice, in writing."], ["Personal, conduct-related and operational dismissal?", "Personal: reason lies in the person (long illness, loss of driving licence). Conduct-related: breach of duty, warning first. Operational: job is cut, social selection necessary."], ["Criteria for social selection?", "Length of service, age, maintenance obligations, severe disability."], ["Function of a formal warning (Abmahnung)?", "It criticises specific misconduct, demands change and threatens dismissal if repeated. In writing as proof."], ["What notice does the employee give?", "Always the basic period of 4 weeks to the 15th or end of month, unless the contract or collective agreement says otherwise. The extended periods only apply to the employer."], ["Role of the works council in dismissals?", "It must be consulted before every dismissal, otherwise it is invalid. It can object within one week (3 days for dismissal without notice)."], ["Framework and pay agreement?", "Framework agreement: long-term working conditions (hours, leave, notice periods, bonuses). Pay agreement: amount of wages and training pay, short term because adjusted regularly to prices and the economy."], ["What does general applicability mean?", "The Ministry of Labour declares a collective agreement valid for all employers and employees in the industry, including those not bound by it."], ["Strike, lockout, arbitration?", "Strike: employees stop work. Lockout: employers refuse work and pay. Arbitration: a neutral arbitrator proposes a settlement."], ["Which risks does social insurance not cover and what helps?", "Occupational disability, liability for damage to others, accidents in leisure time, pension gap in old age. Remedy: disability, private liability and private accident insurance, private pension provision."], ["Forms of private pension provision and their support?", "Riester pension (allowances and special expense deduction), occupational pension (tax and contribution-free salary conversion), basic pension/Rürup (special expense deduction)."], ["The seven types of income?", "Agriculture and forestry, trade or business, self-employment, employment, capital assets, renting and leasing, other income."], ["How do you calculate taxable income?", "Income − income-related expenses (at least the 1.230 € allowance) = earnings − special expenses − extraordinary burdens = taxable income. Refund = income tax withheld − tax assessed."], ["Stocktaking (Inventur) and inventory list (Inventar)?", "Stocktaking: the activity, i.e. counting, measuring, weighing and valuing all assets and debts. Inventory list: the result, a detailed list by type, quantity and value."], ["Physical and book stocktaking?", "Physical: stock is actually counted, measured or weighed (vehicles, parts). Book: intangible values are determined from documents and books (receivables, bank balances, debts)."], ["Which stocktaking methods are there?", "Cut-off date: within 10 days around the balance sheet date. Shifted: up to 3 months before or 2 months after, rolled forward or back. Perpetual: ongoing stock records, each item counted once a year."], ["When is stocktaking required?", "On founding or takeover, at the end of each financial year and on dissolution or sale of the company."], ["What does the lower of cost or market principle say?", "Of acquisition cost and current value on the reporting date, the lower one is used. Example: a part bought for 100 € is only worth 80 €, so 80 € is recognised. Unrealised gains may not be shown."], ["How is the inventory list structured?", "A assets: fixed assets, then current assets, ordered by increasing liquidity. B debts: long-term, then short-term, ordered by due date. C net worth (equity) = assets − debts."], ["Link between stocktaking, inventory list and balance sheet?", "Stocktaking provides the data, the inventory list lists them in detail, the balance sheet summarises them briefly in account form: assets and liabilities/equity."], ["How is the balance sheet structured and why are both sides equal?", "Assets: fixed assets, current assets (use of funds). Liabilities: equity, debt (source of funds). Both sides show the same capital from two angles; equity balances as the residual."], ["The four balance sheet changes?", "Asset exchange: only asset accounts, total stays (cash withdrawal). Liability exchange: only liability accounts, total stays (payable becomes loan). Increase on both sides (purchase on credit). Decrease on both sides (invoice paid by bank)."], ["Debt ratio?", "Debt / total capital × 100. The higher, the more dependent the company is on creditors. Equity and debt ratio together make 100 %."], ["How do you book on asset and liability accounts?", "Asset account: opening balance and increases on the debit side, decreases and closing balance on the credit side. Liability account exactly the reverse: opening balance and increases on the credit side."], ["Journal and general ledger?", "Journal: all booking records in chronological order. General ledger: the same bookings sorted by account (T-accounts)."], ["Balance sheet accounts and income statement accounts?", "Balance sheet accounts show assets and debts and are closed via the closing balance sheet account. Income statement accounts (expenses and income) change equity and are closed via the P&L account."], ["Not affecting profit and affecting profit?", "Not affecting profit: only balance sheet accounts are involved, equity stays the same (purchase on credit). Affecting profit: an expense or income account is involved, equity changes (rent, sale)."], ["Why is there a VAK booking?", "On sale, revenue is booked. The VAK booking sets the cost of goods at cost price against it as an expense and reduces stock. Only revenue minus VAK shows the gross profit."], ["How do income statement accounts flow into the closing?", "Operating expenses and income give the operating result, neutral ones the neutral result. Both flow into the P&L account. Its balance (profit or loss) goes to equity."], ["How do you check a booking record?", "Total debit = total credit; at least one account on the debit and one on the credit side; increase or decrease on the correct side; does the booking match the document? Order: debit first, then credit."], ["What VAT rates are there?", "Standard rate 19 %. Reduced rate 7 % for basic goods such as food, books, newspapers and local transport. Exempt are e.g. insurance, bank interest, residential rent, letter postage."], ["Why is VAT also called value added tax?", "At each stage, only the value added is taxed, i.e. the difference between selling and purchase price. The basis is the net amount. It is borne by the end consumer."], ["Why is VAT a transitory item for the company?", "It collects VAT from the customer, deducts the input VAT paid and only pays the difference to the tax office. It is neither expense nor income and doesn't change profit."], ["Input VAT, output VAT, VAT payable?", "Input VAT: tax on incoming invoices, a receivable from the tax office. Output VAT: tax on outgoing invoices, a debt to the tax office. VAT payable = output VAT − input VAT. If input VAT is higher, there is an input VAT surplus (refund)."], ["How are the tax accounts closed?", "The input VAT account is closed via the output VAT account (1770 to 1570). The VAT payable is transferred (1770 to 1200), at year end carried into the closing balance sheet as a liability."], ["What is the advance VAT return?", "The regular report of VAT payable to the tax office, usually monthly or quarterly, electronically by the 10th day after the end of the period."], ["What does portfolio analysis show?", "It classifies models by market growth and relative market share: question marks (high growth, small share), stars (both high), cash cows (low growth, high share, bring money), poor dogs (both low)."], ["Which strategy fits which portfolio field?", "Question marks: invest or give up. Stars: invest and expand. Cash cows: skim profits. Poor dogs: let them run out."], ["Market potential, market volume, market share?", "Market potential: maximum possible sales in the market. Market volume: actual sales of all suppliers. Market share: own sales as a percentage of market volume."], ["How do you plan next year's sales figure?", "Expected market volume in the market area × target market share = planned sales. Compared with previous year's figures, new models and manufacturer targets."], ["Simple and real capital requirement in the new car business?", "Simple: sales × cost price × days in stock / 360. Real: capital tie-up is extended by the payment term granted to customers and shortened by the manufacturer's payment term and by down payments."], ["Process of a new car order up to order confirmation?", "Needs analysis and advice, test drive, configuration and offer, binding customer order, credit and availability check, order with the manufacturer, written order confirmation within the binding period."], ["What does a salesperson's pay consist of?", "Fixed salary, commission, bonuses (e.g. for financing, target achievement), often plus a company car as a taxable benefit."], ["Revenue commission and gross profit commission?", "Revenue commission: percentage of the net selling price; tempts to give high discounts. Gross profit commission: percentage of gross profit; the salesperson earns more by giving little discount."], ["Why is a timely written order confirmation important?", "Only it accepts the customer's order and creates the purchase contract. If it comes after the binding period, the customer is no longer bound; it then counts as a new offer."], ["Mandatory details on a new car outgoing invoice?", "Name and address of dealership and customer, tax number or VAT ID, invoice number and date, delivery date, exact vehicle description with VIN, net amount, tax rate, tax amount, gross amount."], ["Why is there no VAT on registration fees?", "The dealership pays the official fee to the authority in the name and for the account of the customer. It is a transitory item. The dealership's own registration service fee, however, is subject to VAT."], ["What is an internal order?", "A workshop service for another department of the same company, e.g. pre-delivery inspection of a new car or reconditioning of a used car. It is charged internally without VAT and debited to the receiving department."], ["How do you book the purchase of a new car with delivery?", "3000 new car stock + 3030 delivery stock + 1570 input VAT to 1600 payables."], ["When may general terms and conditions deviate from the law?", "Only where the law is not mandatory and only without unreasonable disadvantage to the customer. For consumers, the protective rules (e.g. 2 years' liability for defects on new goods) cannot be waived; between merchants more is possible."], ["Warranty periods for new and used cars?", "New cars: 2 years. Used cars to consumers: can be shortened to 1 year. Used cars between businesses: can be excluded. Private to private: can be excluded, except for fraud."], ["How can return on sales be improved?", "Cut costs or increase earnings per sale (better margins, more service and parts business). More revenue alone only helps if profit grows too."], ["What is the „Kfz-Potenzial“ (vehicle potential) and how is it calculated?", "All cars registered in the market area, regardless of brand. Kfz-Potenzial = inhabitants / 1.000 × cars per 1.000 inhabitants. Example: 530.000 / 1.000 × 481 = 254.930 cars."], ["How do you get from the „Kfz-Potenzial“ to the annual demand for new cars?", "Divide the „Kfz-Potenzial“ by the average useful life, because each vehicle is then replaced by a new car. Example: 254.930 / 5 = 50.986 new cars per year. For one month, divide by 12 again."], ["How do you calculate the previous year's value from a percentage change?", "Current value / (1 + change / 100). Example: 230 cars at +15 % → 230 / 1,15 = 200 cars. Do not simply subtract 15 %."], ["What phases does a model's product life cycle have?", "Introduction, growth, maturity, saturation, decline. Sales rise slowly at first, then strongly, peak in the maturity phase and fall afterwards."], ["A model's sales already collapse in the growth phase. What can the manufacturer do?", "Check the causes (price, competition, quality, image) and counteract: model update or facelift, special editions, better equipment, price or financing offers, more advertising."], ["How do you calculate the planned figure for a quarter?", "Annual plan × quarter share, usually rounded up to whole units. Example: 800 cars × 28 % = 224 cars in the 1st quarter."], ["Vehicle financing: which contractual relationships exist between customer, dealership and bank?", "Customer and dealership: purchase contract (both sides), down payment to the dealership, handover of the vehicle to the customer. Customer and bank: loan agreement (both sides), instalments to the bank. Bank to dealership: payout of the loan."], ["What is the final instalment of three-way financing based on?", "The expected residual value (used car value) of the vehicle at the end of the term. It depends on model, equipment, term and mileage. That way the customer can return the car and the final instalment is covered."], ["What data does the SCHUFA store?", "Personal data (name, date of birth, addresses) as well as current accounts, credit cards, loans and instalment purchases (amount, term, repayment), leasing contracts, mobile phone and telecom contracts, guarantees and negative entries such as payment defaults."], ["For what reasons can the bank terminate a car loan?", "Payment default: at least two consecutive instalments wholly or partly unpaid, plus 10 % (5 % for terms over 3 years) of the loan, and a 2-week deadline has passed without payment. Also: significant deterioration of financial circumstances, false information in the loan application, loss of the security (e.g. vehicle sold without consent, no comprehensive cover)."], ["What advantages do leasing contracts bring the dealership?", "Commission from the leasing company, immediate payment for the vehicle without own default risk, customer loyalty and follow-up business after the contract ends, workshop utilisation during the term, a predictable supply of young used cars (lease returns), low instalments as a sales argument."], ["How does the leasing company calculate the result of a contract (final calculation)?", "Income: all lease payments (payment × term), extra kilometres (driven − agreed km − allowance, × rate) and the sale proceeds of the vehicle. Expenses: acquisition cost and costs before the sale (e.g. tyres, appraisal). Surplus = income − expenses. Fewer kilometres would reduce the income."]], "quiz": [["A 15-year-old buys a game for 30 € with his pocket money without his parents knowing. The contract is …", ["void because he is a minor", "provisionally ineffective until approved", "valid because he pays with his own funds", "voidable by the retailer"], "§ 110 BGB: paid with funds given for free use."], ["A customer has paid for a bike but will only collect it in three days. Until then …", ["she is owner and possessor", "she is owner, the dealer is possessor", "the dealer is owner and possessor", "the dealer is owner, she is possessor"], "Ownership only passes with agreement and handover."], ["Which statement about general terms and conditions (AGB) is correct?", ["AGB take precedence over individual agreements", "An invalid clause makes the whole contract void", "AGB save negotiation effort", "Merchants must always accept others' AGB"], "Rationalisation effect. Individual agreements take precedence."], ["Which right does a buyer have first in case o ], "Contribution margin equals zero."], ["In cost accounting, a donation to the Red Cross is …", ["basic costs", "additional costs", "non-operational (neutral) expense", "direct costs"], "No connection to the business purpose."], ["What does a level 1 liquidity of 20 % tell you?", ["20 % of assets are liquid", "Cash covers 20 % of short-term debts", "20 % of revenue is profit", "Equity covers 20 % of fixed assets"], "Cash / short-term debt."], ["A used car is bought from a private seller and sold under margin taxation. VAT is due on …", ["the selling price", "the purchase price", "the difference between selling and purchase price", "nothing"], "§ 25a UStG."], ["Which booking belongs to the withdrawal from stock of a sold new car?", ["8000 to 3000", "7000 to 3000", "3000 to 7000", "1400 to 3000"], "VAK to stock."], ["Lease for a parking area belongs to account …", ["0050 Land", "2300 Other expenses", "4400 Rent, lease", "2100 Interest expense"], "Ongoing expense and cost, not fixed assets."], ["An authorised dealer sells new cars …", ["in the name and for the account of the manufacturer", "in its own name and for its own account", "in its own name for the account of the manufacturer", "only as a broker"], "Independent trader."], ["In the genuine agency model, the sales risk is borne by …", ["the dealership", "the manufacturer", "the bank", "the customer"], "The agent only brokers."], ["How long is a private customer bound by a binding order for a car not in stock?", ["10 days", "2 weeks", "3 weeks", "6 weeks"], "New car sales conditions: 3 weeks."], ["The reversal of the burden of proof in consumer sales applies for …", ["6 months", "12 months", "24 months", "not at all for vehicles"], "Since 2022: 12 months."], ["A collision with game is covered by …", ["liability", "partial cover", "only comprehensive cover", "passenger accident insurance"], "Partial cover."], ["How does leasing affect the lessee's balance sheet?", ["Fixed assets and debt rise", "No effect on fixed oach", "balance of payments"], "What GDP is used for."], ["Who tends to gain from inflation?", ["Savers", "Debtors", "Pensioners with a fixed pension", "Creditors"], "The debt loses value in real terms."], ["The ECB's primary objective is …", ["full employment", "price stability", "economic growth", "a high euro exchange rate"], "2 % inflation in the medium term."], ["In the extended economic cycle, household savings flow to …", ["the state", "the banks", "foreign countries", "companies directly as consumption"], "Banks pass them on as loans for investment."], ["The trade balance is part of the …", ["financial account", "current account", "capital account", "company balance sheet"], "Current account: trade, services, primary and secondary income."], ["A product makes a loss on a full-cost basis, its contribution margin is positive. In the short term, you should …", ["drop it immediately", "keep it in the range", "only sell it below variable costs", "give it away"], "It helps cover fixed costs."], ["At the break-even point:", ["Revenue = variable costs", "Revenue = total costs", "Contribution margin = 0", "Fixed costs = 0"], "Neither profit nor loss."], ["The leverage effect is positive when …", ["the interest on debt is above the return on total capital", "the return on total capital is above the interest on debt", "there is no debt", "liquidity is above 100 %"], "Then debt earns more than it costs."], ["Imputed depreciation is calculated from the …", ["acquisition value", "replacement value", "book value", "scrap value"], "The replacement purchase should be earned through prices."], ["Which cost centre is a service cost centre at a dealership?", ["Workshop", "New cars", "Administration", "Parts and accessories"], "It is allocated to the main cost centres."], ["A workshop index of 3,85 means:", ["3,85 % profit", "For each 1 € of productive wages, 3,85 € labour revenue must be earned", "The workshop is 38,5 % utilised", "385 € hourly rate"], "Target labour revenue / u like the winter tyres better too, don't you?“ is …", ["an open question", "a closed question", "a leading question", "an alternative question"], "The answer is suggested."], ["What directly follows the greeting in a sales conversation?", ["Sales arguments", "Needs analysis", "Closing", "Product demonstration"], "First find out what the customer needs."], ["What is the order of customer-oriented arguments?", ["Benefit, feature, advantage", "Feature, advantage, benefit", "Advantage, benefit, feature", "Price, feature, benefit"], "From the product to the customer."], ["Which shelf zone sells best?", ["Bend zone", "Stretch zone", "Eye level zone", "Base zone"], "Goods at eye level."], ["What is non-verbal communication?", ["a friendly greeting with words", "a smile", "price information", "a question"], "Body language."], ["Accident not your fault: which claim does the injured party have only in a liability case, not with comprehensive cover?", ["Repair costs", "Reduction in market value", "Glass breakage", "Deductible"], "Comprehensive cover only pays according to contract."], ["Replacement value 10.000 €. Up to which repair costs may the car be repaired under the 130 % rule?", ["10.000 €", "11.300 €", "13.000 €", "7.000 €"], "130 % of 10.000 €."], ["The customer is entitled to deduct input VAT. The other party's insurer pays the repair …", ["gross", "net", "not at all", "half"], "He reclaims the VAT from the tax office."], ["With the assignment by way of security (RKÜ) …", ["the customer waives damages", "the customer assigns their claim against the insurer to the dealership", "the dealership accepts blame for the accident", "the deductible is waived"], "The dealership invoices directly."], ["The keeper is liable for the operating risk of their vehicle even without fault. This is called …", ["fault-based liability", "strict liability", "product liability", "guarantee"], "Reason for compulsory insurance."], ["A used car invoice says „VAT deductible“. The vehicle is …" tify the customer (Money Laundering Act)"]}, {"k": "l", "head": "Loans, SCHUFA, leasing at a glance", "items": ["Contractual relationships: purchase contract customer–dealership, loan agreement customer–bank. Down payment customer → dealership, vehicle dealership → customer, loan bank → dealership, instalments customer → bank", "Final instalment: based on the expected residual value (used car value) at the end of the term", "SCHUFA stores: personal data, current accounts, credit cards, loans and instalment purchases, leasing contracts, mobile phone contracts, guarantees", "SCHUFA negative entries: terminated loan, payment order or enforcement, statement of assets („Vermögensauskunft“), personal insolvency", "SECCI form: lender, type of credit, net loan amount, term, borrowing rate, annual percentage rate, total amount, instalments, securities, right of withdrawal", "Termination by the bank: default on 2 instalments and at least 10 % (over 3 years: 5 %) after a 2-week deadline, deterioration of financial situation, false information, loss of the security", "Leasing advantages for the dealership: commission, immediate payment without default risk, customer loyalty, workshop utilisation, lease returns as young used cars"]}]]], "lf": [["LF 2 · Commercial management and control", [["Stocktaking and inventory", ["Stocktaking = counting and valuing, inventory = the list that results.", "Physical stocktaking (counting) and book stocktaking (documents).", "Methods: reporting date (±10 days), shifted (3 months before, 2 months after), permanent.", "Occasions: founding, end of the financial year, dissolution.", "Lower of cost or market: the lower value counts.", "Inventory: assets (by liquidity), debts (by due date), net worth = assets − debts."]], ["Balance sheet", ["Assets: fixed and current assets. Liabilities: equity and debt. Totals always equal.", "Ratios: equity ratio, debt ratio, fixed asset coverage I and II.", "Asset exchange and liability exchange: total stays. Increase and decrease on both sides: total rises or falls."]], ["Accounts and closing", ["Asset account: opening balance and increases on the debit side. Liability account: on the credit side.", "Journal = chronological (booking records), ledger = by subject (T-accounts).", "Balance sheet accounts → closing balance sheet. Income statement accounts → P&L → equity.", "Affects profit if an expense or income account is involved.", "Every sale: revenue booking + VAK booking. Revenue − VAK = gross profit.", "Operating result + neutral result = profit or loss."]], ["VAT", ["19 % standard rate, 7 % reduced; insurance, interest, residential rent tax-exempt.", "Value added tax: the value added at each stage is taxed, it is borne by the end consumer.", "Transitory item: no expense, no income.", "VAT payable = output VAT − input VAT; advance return usually monthly.", "Closing: 1770 to 1570, VAT payable 1770 to 1200."]]]], ["LF 9 · Personnel", [["Planning and recruitment", ["Quantitative (how many) and qualitative (which qualification). Replacement, new, reduced demand.", "Requirement = target − (current + arrivals − departures).", "Internal: fast, cheap, motivating. External: new ideas, wider choice.", "Inadmissible questions: pregnancy, religion, party, trade union.", "Employment contract: parties, start, job, place, pay, working hours, leave, probation, notice periods."]], ["Collective agreements and protective laws", ["Free collective bargaining, peace obligation. Framework agreement (conditions) and pay agreement (money).", "Process: negotiation, arbitration, strike ballot 75 %, strike, agreement, ballot 25 %.", "Working hours: 8 hours, max. 10; break 30/45 minutes; rest period 11 hours.", "Maternity protection: 6 weeks before, 8 weeks after birth; ban on dismissal.", "Leave: 24 working days, full after 6 months, otherwise 1/12 per month."]], ["Salary and taxes", ["Gross (+ taxable benefit) − income tax − solidarity surcharge − church tax − social insurance = net − private deductions = payout.", "Social insurance split half and half: health 14,6 % + additional, care 3,6 %, pension 18,6 %, unemployment 2,6 %; accident employer only.", "Company car: 1 % of gross list price + 0,03 % per km of commute distance.", "Taxable income: income − income-related expenses − special expenses − extraordinary burdens.", "Private provision: occupational disability, liability, „Riester“, company pension."]], ["Termination", ["Dismissal, termination agreement, expiry of term, retirement. Always in writing.", "Ordinary with notice; extraordinary for good cause within 2 weeks.", "Reasons: personal, conduct-related (warning), operational (social selection).", "Special protection: pregnant women, works council, severely disabled, apprentices.", "Consult the works council; lawsuit within 3 weeks; reference simple or qualified."]]]], ["LF 10 · Managing value creation", [["Cost and performance accounting", ["Stages: cost types, cost centres (BAB), cost units (pricing).", "Expense ≠ cost: neutral (non-operational, other periods, extraordinary), basic, different, additional costs.", "Direct costs directly, overheads via keys. Main cost centres: new cars, used cars, parts, workshop.", "Overhead rate = overheads / direct costs × 100.", "Pricing forward, backward, difference; markup, factor, trade margin."]], ["Contribution margin and workshop", ["CM = revenue − variable costs; operating result = CM − fixed costs.", "Short-term price floor = variable costs. Break-even = fixed costs / unit CM.", "Multi-level: CM 1 (gross profit), CM 2, CM 3, operating result.", "Hourly labour rate = average wage × workshop index; index = target labour revenue / productive wages."]], ["Controlling", ["Structured balance sheet: fixed/current assets, equity/debt.", "Equity ratio, fixed asset coverage, liquidity 1 to 3.", "Returns: equity (profit / equity), total capital ((profit + interest on debt) / total capital), sales (profit / revenue), each × 100.", "Return on sales: how many cents of profit remain from each euro of revenue? Example: 45.000 € profit / 3.000.000 € revenue × 100 = 1,5 %.", "Golden balance sheet rule, leverage effect.", "Operating result + neutral result = company result.", "Stock ratios and ratios of the business areas (gross profit, days in stock)."]]]], ["LF 6 · Planning and selling new cars", [["Market and planning", ["Portfolio: question marks, stars, cash cows, poor dogs (market growth and market share).", "Market potential (possible), market volume (actual), market share (own share).", "„Kfz-Potenzial“ = inhabitants / 1.000 × cars per 1.000 inhabitants. New car demand per year = „Kfz-Potenzial“ / Ø useful life.", "Product life cycle: introduction, growth, maturity (highest sales), saturation, decline. Quarterly planned figure = annual plan × quarter share.", "Planned sales = expected market volume × target market share.", "Capital requirement = sales × cost price × capital tie-up in days / 360."]], ["Sale and contract", ["Process: advice, test drive, offer, binding order, check, order confirmation.", "The contract only arises with the order confirmation or delivery within the binding period (3 weeks).", "Salesperson pay: fixed salary + commission + bonuses. Gross profit commission curbs discounts.", "Gross profit = margin − customer discount − extras; commission as a percentage of it."]], ["Invoice and booking", ["Invoice: names, tax number, number, date, VIN, net, tax rate, tax, gross.", "Purchase: 3000 + 3030 + 1570 to 1600. Sale: 1400 to 8000 + 8030 + 8200 + 1770. Plus 7000 to 3000.", "Official registration fee: transitory item without VAT.", "Internal order: workshop for own department, without VAT."]], ["Complaints", ["Liability for defects: new cars 2 years, used cars to consumers at least 1 year.", "Reversal of burden of proof 12 months. First supplementary performance, then withdrawal or price reduction.", "AGB must not unreasonably disadvantage consumers.", "Statutory warranty is legal, guarantee voluntary, goodwill without entitlement."]]]], ["LF 7 · Used cars", [["Valuation", ["Purchase price: backwards from the market price minus gross profit, repair, reconditioning, holding costs.", "Factors: age, mileage, condition, equipment, colour, previous owners, market situation.", "Technical valuation by the workshop, commercial by used car sales (DAT, Schwacke).", "Sources: lease returns, auctions, dealers, company cars, online marketplaces."]], ["Taxation and pricing", ["Margin taxation § 25a: purchase without input VAT; VAT = difference × 19/119; no tax shown.", "Standard taxation („MwSt ausweisbar“): purchase with input VAT, 19 % on the net price.", "Profit = net margin − repair − reconditioning − holding costs.", "Hidden price discount: overpayment on the trade-in, borne by the new car department.", "Bookings: 3110 to 1200 · 1400 to 8110 + 8111 + 1770 · 7110 to 3110."]]]], ["LF 8 · Financial services", [["Financing", ["Standard financing: equal instalments down to zero. Balloon/three-way financing: low instalments + final instalment.", "Capacity to borrow = legal capacity. Creditworthiness = credit rating (income, SCHUFA, self-disclosure).", "Securities: transfer of ownership by way of security (registration certificate II at the bank), salary assignment, guarantee, payment protection insurance.", "Effective annual rate = all costs per year. Annuity: instalment equal, interest falls, repayment rises.", "Linked transaction: revoking the loan also cancels the purchase.", "Captive bank: sales promotion, commission and customer loyalty, low interest and quick approval.", "Contractual relationships: purchase contract with the dealership, loan agreement with the bank; the bank pays the loan out to the dealership. Final instalment = expected residual value.", "SCHUFA stores accounts, loans, leasing and phone contracts, guarantees. Termination by the bank e.g. for default on 2 instalments, false information or loss of the security."]], ["Leasing", ["Lessor is owner, lessee is possessor; instalments = expense, not capitalised by the lessee.", "Compliant with the tax decree: basic lease term 40–90 % of useful life.", "Mileage leasing: extra/fewer kilometres. Residual value leasing: residual value risk with the customer, tender right.", "VAT on every instalment. Early end: cancellation, total loss, theft.", "Return: report with mileage and damage. Full service: maintenance, tyres, insurance included.", "Advantages for the dealership: commission, no default risk, customer loyalty, workshop utilisation, lease returns for the used car business."]], ["Protection", ["Liability (compulsory), partial cover, comprehensive. Term 1 year, cancel by 30 November.", "GAP: difference between settlement value and replacement value. Payment protection insurance: death, incapacity, unemployment.", "Security certificate: comprehensive cover payment goes to the bank or lessor.", "Statutory warranty is legal, guarantee voluntary, goodwill without entitlement."]]]], ["LF 1 · Company and cooperation", [["Distribution structures", ["Direct: manufacturer sells itself (branch, agency, online). Indirect: via authorised dealers in their own name and for their own account.", "Partners: manufacturer/importer, branch, authorised dealer, agent, service partner.", "Vertical Block Exemption Regulation: EU rule exempting manufacturer-dealer contracts from the cartel ban.", "Selective: dealers chosen by criteria. Exclusive: territorial protection.", "Dealer contract: territory, targets, standards, margin and bonuses, term."]], ["Vocational training", ["Dual system: company (training framework plan) + vocational school (framework curriculum). Basis BBiG.", "Contract in writing before the start, registered with the IHK. Probation 1 to 4 months.", "End: passing the exam or expiry; after probation, termination only for good cause or by the apprentice with 4 weeks' notice.", "Youth employment protection: 8 hours per day, 40 hours per week, leave 30/27/25 working days."]], ["Co-determination", ["Basis: Works Constitution Act. Works council from 5 eligible voters, term 4 years; JAV 2 years.", "Works council: vote from 16, eligible from 18 after 6 months. JAV: vote under 18 and all apprentices; eligible under 25 and apprentices.", "Rights: information, consultation, participation, co-determination (social matters).", "Works agreement: contract between employer and works council. Works meeting: quarterly, all employees."]], ["Economic basics", ["Need → demand with purchasing power → demand on the market.", "Free goods cost nothing, economic goods are scarce.", "Maximum principle: fixed means, greatest success. Minimum principle: fixed goal, least input.", "Sectors: primary production, processing, services.", "Simple circular flow: households and companies, flows of goods and money in opposite directions."]], ["Legal forms, commercial register, powers of attorney", ["Partnerships: OHG, KG, GmbH & Co. KG. Corporations: GmbH (25.000 €), AG (50.000 €).", "OHG: all fully liable. KG: general partner fully, limited partner with contribution. GmbH/AG: only company assets.", "Commercial register at the local court: A sole traders and partnerships, B corporations. Declaratory or constitutive.", "„Istkaufmann“, „Kannkaufmann“, „Formkaufmann“. Firm = name of the merchant in business.", "Order of powers: „Prokura“ (ppa., registered) before general „Handlungsvollmacht“ (i. V.), type and individual authority."]]]], ["LF 11 · Economic policy", [["Market and price", ["Perfect market: homogeneous goods, no preferences, transparency, fast reaction.", "The equilibrium price clears the market. Above it excess supply (buyer's market), below it excess demand.", "Price functions: balancing, signalling, steering, selection.", "Market forms: polypoly, oligopoly, monopoly. Maximum price below, minimum price above equilibrium."]], ["Order and competition", ["Social market economy: market + social balance + protection of competition.", "Cooperation (sub-areas) and concentration (group, merger); horizontal, vertical, diagonal.", "Cartels banned in principle; Federal Cartel Office: cartel ban, abuse control, merger control."]], ["Goals, GDP, business cycle", ["Magic square: price stability, employment, external balance, growth. Hexagon: + distribution, environment.", "GDP = consumption + state + investment + net exports; nominal and real; wage share.", "Phases: upswing, boom, downturn, trough. Leading, coincident, lagging indicators.", "Anticyclical fiscal policy: spend in a downturn, save in a boom."]], ["Money and foreign trade", ["Inflation reduces purchasing power; measured by the consumer price index (basket of goods).", "ECB: price stability; open market, facilities, minimum reserve; expansionary or contractionary.", "Balance of payments: current account, capital account, financial account. Net exports = exports − imports.", "Globalisation: larger markets, but wage pressure and dependency."]]]], ["LF 3 · Procuring and storing parts", [["Legal basics", ["Legal capacity from birth; capacity to contract: 0–6 none, 7–17 limited, from 18 full.", "Enquiry non-binding, offer binding, advertisement not an offer. Exclusion: „freibleibend“ (subject to change).", "Purchase contract: offer + acceptance. Obligation (contract) and performance (deliver, transfer ownership, pay, accept).", "Void: incapacity, lack of form, breach of law or morality, sham, joke. Voidable: error, deceit, threat.", "Form: written form, certification, notarial deed. AGB: pre-formulated, individual agreement takes precedence.", "Possession = actual, ownership = legal control. Retention of title until full payment."]], ["Procurement", ["Sources: supplier database, trade fairs, internet, trade journals, sales reps.", "Quantitative: compare landed cost. Qualitative: weight criteria (scoring).", "Optimal order quantity: ordering + storage costs minimal.", "Reorder point = daily usage × delivery time + minimum stock. Maximum stock = minimum stock + order quantity.", "Reorder point method (at reorder level) or order cycle (fixed dates)."]], ["Warehouse", ["Functions: security, bridging, speculation, conversion, refinement.", "Goods receipt: immediate external check, then promptly type, quantity, quality.", "Fixed location or free location (chaotic); FiFo or LiFo; central or decentral; own or third-party warehouse; just-in-time.", "Ratios: Ø stock, turnover rate, storage period, storage interest rate. High turnover = short storage = little tied-up capital."]], ["Payment and disruptions", ["Direct debit: recipient collects. Standing order: fixed amount, fixed date.", "Almost always use cash discount: 2 % for 20 days corresponds to about 36 % annual interest.", "Material defects: condition, wrong or short delivery, installation, instructions, advertising claim. Obvious, hidden, fraudulently concealed.", "First supplementary performance, then withdrawal, price reduction, damages. Merchants must give notice of defects promptly.", "Late delivery: due date, reminder, fault. Rights: delivery + damages for delay; after a grace period withdrawal or damages instead of performance."]]]], ["LF 4 · Selling parts and accessories", [["Product range", ["Wide = many product groups, deep = much choice per product group.", "The core range brings the main revenue, the peripheral range complements it.", "Shelf zones: stretch, eye level (strongest sales), grip, bend zone."]], ["Sales conversation", ["Phases: greeting, needs analysis, product demonstration, sales arguments, closing, farewell.", "Questions: open (W-questions) for needs analysis, closed for closing, alternative, leading, rhetorical question.", "Arguments: feature → advantage → customer benefit.", "Add-on selling: offer a matching extra item with its benefit.", "Non-verbal: facial expression, gestures, posture, eye contact."]]]], ["LF 5 · Full-service accident handling", [["Insurance", ["Liability claim: the party at fault or their insurer pays. Comprehensive claim: your own insurer pays.", "Liability claims: repair, assessor, reduction in value, rental car or loss of use, towing, flat fee.", "Comprehensive: only contractual cover minus deductible. Partial cover without no-claims class.", "Premium: no-claims, type, regional class, mileage, drivers, deductible, workshop tie-in.", "Strict liability: the keeper is liable for the operating risk."]], ["Handling", ["Process: record damage, have the RKÜ signed, assessor, insurer approval, rental car, repair, invoice the insurer.", "RKÜ / assignment by way of security: customer assigns the claim, the dealership invoices directly.", "Customer entitled to deduct input VAT: insurer pays net, customer pays the VAT.", "Assessor: in liability cases the injured party chooses, in comprehensive cases the insurer."]], ["Damage terms", ["Technical total loss: cannot be repaired. Economic: repair more expensive than replacement value − residual value.", "130 % rule: repair up to 130 % of replacement value if repaired professionally and kept in use.", "Integrity interest: interest in keeping your own vehicle.", "Reduction in market value: lower value as an accident car. Loss of use: daily rate without rental car.", "Total loss liability: replacement value − residual value."]]]]]};

"Das Inventar": "The inventory list",
"Das Inventar ist die ausführliche Aufstellung: Vermögen (nach Flüssigkeit geordnet) minus Schulden (nach Fälligkeit geordnet) ergibt das Reinvermögen, also das Eigenkapital.": "The inventory list is the detailed statement: assets (sorted by liquidity) minus debts (sorted by due date) gives the net worth, i.e. equity.",

"Der Arbeitsvertrag": "The employment contract",
"Der Betrieb überweist drei Mal: das Netto an die Mitarbeiterin, die Steuern ans Finanzamt und sämtliche Sozialversicherungsbeiträge an die Krankenkasse, die sie weiterverteilt.": "The company makes three transfers: net pay to the employee, taxes to the tax office and all social security contributions to the health insurance fund, which distributes them.",
"Der Betriebsrat muss vor jeder Kündigung angehört werden, sonst ist sie unwirksam. Wer klagen will, hat drei Wochen Zeit. Außerdem: sofort bei der Agentur für Arbeit arbeitsuchend melden.": "The works council must be consulted before every dismissal, otherwise it is invalid. Anyone who wants to sue has three weeks. Also: register as a job seeker with the employment agency immediately.",
"Der Erlös ist immer der Nettobetrag, die Umsatzsteuer steht auf einem eigenen Konto.": "Revenue is always the net amount; VAT has its own account.",
"Der Gesellschaftsvertrag der GmbH wird notariell beurkundet. Das Handelsregister führt das Amtsgericht, jeder darf es einsehen. Abteilung A: Einzelkaufleute, OHG, KG. Abteilung B: GmbH und AG.": "The GmbH's articles of association are notarised. The commercial register is kept by the local court and anyone may view it. Section A: sole traders, OHG, KG. Section B: GmbH and AG.",
"Der Gewinn aus der GuV erhöht das Eigenkapital. Die Schlussbestände aller Konten ergeben die Schlussbilanz, und die muss zu den Werten der Inventur passen.": "The profit from the profit and loss account increases equity. The closing balances of all accounts form the closing balance sheet, which must match the stocktaking figures.",

"Der Käufer kann Nachbesserung oder Ersatzlieferung verlangen. Die Kosten trägt der Verkäufer. Nach dem zweiten erfolglosen Versuch gilt die Nachbesserung in der Regel als gescheitert.": "The buyer can demand repair or replacement. The seller bears the costs. After the second failed attempt, repair is usually considered to have failed.",

"Der Verkäufer ist Privatperson. Auf seinem Kaufvertrag steht keine Umsatzsteuer, also kann das Autohaus auch keine Vorsteuer abziehen.": "The seller is a private person. There is no VAT on his purchase contract, so the dealership cannot deduct input VAT either.",
"Der Verkäufer übergibt das Auto mangelfrei und verschafft das Eigentum. Der Käufer zahlt und nimmt ab. Beim Eigentumsvorbehalt bleibt das Autohaus Eigentümer, bis alles bezahlt ist.": "The seller hands over the car free of defects and transfers ownership. The buyer pays and accepts delivery. With retention of title, the dealership remains owner until everything is paid.",
"Der Vertragshändler kauft und verkauft im eigenen Namen auf eigene Rechnung und trägt das Absatzrisiko. Der Agent vermittelt im Namen und auf Rechnung des Herstellers und erhält dafür Provision.": "The authorised dealer buys and sells in its own name and for its own account and bears the sales risk. The agent brokers in the name and for the account of the manufacturer and receives commission.",
"Der Wagen kommt mit dem vollen Kaufpreis in den Bestand der differenzbesteuerten Gebrauchtwagen.": "The car goes into the stock of margin-taxed used cars at the full purchase price.",

"Der effektive Jahreszins enthält alle Kreditkosten und macht Angebote vergleichbar. Varianten: klassischer Ratenkredit, Schlussratenfinanzierung und Drei-Wege-Finanzierung (am Ende zahlen, weiterfinanzieren oder zurückgeben).": "The effective annual rate includes all loan costs and makes offers comparable. Variants: classic instalment loan, balloon financing and three-way financing (pay at the end, refinance or return).",

"Die Bank zahlt den Kaufpreis ans Autohaus. Die Kundin ist Halterin und Besitzerin, die Bank bis zur letzten Rate Sicherungseigentümerin. Deshalb behält sie die Zulassungsbescheinigung Teil II.": "The bank pays the purchase price to the dealership. The customer is registered keeper and possessor, the bank is the owner by way of security until the last instalment. That's why it keeps the registration certificate part II.",
"Die Bilanz": "The balance sheet",
"Die Bilanz ist die Kurzfassung in Kontenform. Links die Aktiva: Wofür wurde das Geld verwendet? Rechts die Passiva: Woher stammt es?": "The balance sheet is the summary in account form. On the left, assets: what was the money used for? On the right, liabilities: where does it come from?",

"Die Entgeltabrechnung ist eine typische Rechenaufgabe. Du musst wissen, was abgezogen wird, wer es bezahlt und wohin es fließt.": "The payslip is a typical calculation task. You need to know what is deducted, who pays it and where it goes.",
"Die Firma": "The company name",
"Die Firma ist der Name, unter dem ein Kaufmann seine Geschäfte betreibt und unterschreibt. Sie muss wahr und klar sein, sich von anderen am Ort unterscheiden und den Rechtsformzusatz tragen.": "The company name („Firma“) is the name under which a merchant does business and signs. It must be true and clear, differ from others in the area and carry the legal form suffix.",
"Die Konjunktur verläuft in Wellen um den langfristigen Wachstumstrend: Aufschwung, Boom (Hochkonjunktur), Abschwung (Rezession) und Tiefstand (Depression). Gemessen wird am realen Bruttoinlandsprodukt.": "The economy moves in waves around the long-term growth trend: upswing, boom, downturn (recession) and trough (depression). It is measured by real gross domestic product.",

"Die Leasinggesellschaft kauft das Auto und bleibt Eigentümerin. Die Kundin zahlt für die Nutzung: oft eine Sonderzahlung, dann feste Monatsraten über die vereinbarte Laufzeit.": "The leasing company buys the car and remains the owner. The customer pays for its use: often a special down payment, then fixed monthly instalments over the agreed term.",
"Die Nachfrage sinkt, Lager füllen sich, es wird weniger investiert. Arbeitslosigkeit und Preise reagieren erst mit Verzögerung, sie sind Spätindikatoren.": "Demand falls, stocks build up, investment drops. Unemployment and prices react with a delay; they are lagging indicators.",
"Die Personalabteilung braucht unter anderem Steuer-ID, Sozialversicherungsnummer, Krankenkasse und Bankverbindung und meldet die Neue an. Dann beginnt die Einarbeitung.": "HR needs, among other things, the tax ID, social security number, health insurance and bank details and registers the new employee. Then onboarding begins.",
"Die Rechtsform entscheidet über Haftung, Startkapital, Leitung und Gewinnverteilung.": "The legal form determines liability, start-up capital, management and profit distribution.",

"Die Wirtschaft schwankt": "The economy fluctuates",
"Die unterschriebene Bestellung ist der Antrag des Kunden. Der Vertrag steht, sobald das Autohaus annimmt: durch Auftragsbestätigung oder durch Lieferung.": "The signed order is the customer's offer. The contract is concluded as soon as the dealership accepts: by order confirmation or by delivery.",
"Die vier Ziele der Wirtschaftspolitik lassen sich nie alle zugleich voll erreichen, deshalb „magisch“. Mit gerechter Verteilung und Umweltschutz wird daraus das magische Sechseck.": "The four goals of economic policy can never all be fully achieved at the same time, hence „magic“. Adding fair distribution and environmental protection makes it the magic hexagon.",

"Ein Höchstpreis liegt unter dem Gleichgewichtspreis (Beispiel Mietpreisbremse), ein Mindestpreis darüber (Beispiel Mindestlohn). Das Kartellamt verbietet Absprachen und kontrolliert Fusionen.": "A maximum price is below the equilibrium price (example: rent cap), a minimum price above it (example: minimum wage). The Federal Cartel Office prohibits price fixing and controls mergers.",

"Eine Kündigung muss schriftlich erfolgen: auf Papier und eigenhändig unterschrieben. Mündlich, per E-Mail oder per Messenger ist sie unwirksam.": "A dismissal must be in writing: on paper and signed by hand. Verbally, by e-mail or by messenger it is invalid.",

"Erlös minus Wareneinsatz ergibt den Bruttoertrag. Gewinn ist das erst, wenn auch alle übrigen Kosten gedeckt sind.": "Revenue minus cost of goods sold gives the gross profit. It only becomes profit once all other costs are covered too.",

"Für die außerordentliche Kündigung braucht es einen wichtigen Grund, etwa Diebstahl. Sie muss innerhalb von zwei Wochen nach Bekanntwerden erklärt werden. Bei Fehlverhalten ist vorher in der Regel eine Abmahnung nötig.": "Extraordinary dismissal requires an important reason, such as theft. It must be declared within two weeks of becoming known. For misconduct, a formal warning is usually required first.",

"Gewinn {0}, Fremdkapitalzinsen {1}, Umsatz {2}. Umsatzrentabilität = Gewinn ÷ Umsatzerlöse × {3}: Von jedem Euro Umsatz bleiben hier {4} Cent Gewinn. Gesamtkapitalrentabilität = (Gewinn + Zinsen) ÷ Gesamtkapital. Solange sie über dem Fremdkapitalzins liegt, hebt zusätzliches Fremdkapital die Eigenkapitalrendite (Leverage-Effekt). Kippt das Verhältnis, wirkt der Hebel nach unten.": "Profit {0}, interest on debt {1}, revenue {2}. Return on sales = profit ÷ revenue × {3}: from every euro of revenue, {4} cents of profit remain here. Return on total capital = (profit + interest) ÷ total capital. As long as it is above the interest rate on debt, additional debt raises the return on equity (leverage effect). If the ratio flips, the lever works downwards.",

const KSTOP=new Set('which where there their these those other about after before would could should being because during within without between through under also into from with that this than then they them have been were will your'.split(' ').concat('werden wurde wurden eines einer einem einen nicht durch sowie dabei diese dieser dieses diesem immer schon jeweils zwischen danach bevor haben hatte koennen muessen sollte sollten weniger allem unter ueber gegen ohne beispiel sich ihre ihren ihrer seine seinen deren dessen welche welcher welches andere anderen anderer gibt steht eigenen eigene ganze ganz sondern damit daher deshalb jedoch etwas meist meistens grundsaetzlich bereits gilt also bzw. heisst nennt bleibt kommt kommen macht machen zahlt zahlen werden. darf duerfen'.split(' ')));
const knorm=t=>t.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
const KRE=/[0-9A-Za-zÄÖÜäöüß][0-9A-Za-zÄÖÜäöüß%]*(?:[.,-][0-9A-Za-zÄÖÜäöüß%]+)*/g;
const kstem=n=>/\d/.test(n)?n.replace(/[.\s]/g,''):n.slice(0,Math.max(5,Math.min(n.length-2,8)));
function keywords(ans){const seen=new Set(),out=[];
  for(const m of ans.matchAll(KRE)){const raw=m[0],n=knorm(raw);const num=/\d/.test(n);
    if(!num&&(n.length<5||KSTOP.has(n)))continue;const st=kstem(n);if(seen.has(st))continue;seen.add(st);
    out.push({raw,st,score:(num?3:0)+(/^[A-ZÄÖÜ]/.test(raw)?2:0)+Math.min(n.length,12)/6})}
  if(out.length>8){const keep=new Set(out.slice().sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.st));return out.filter(x=>keep.has(x.st))}
  return out}
function kcheck(ans,user){const kw=keywords(ans),u=knorm(user).replace(/(\d)\.(?=\d{3})/g,'$1');
  const hits=new Set(kw.filter(k=>u.includes(k.st)).map(k=>k.st));return{kw,hits}}
function kmark(ans,hits){const out=[];let last=0;
  for(const m of ans.matchAll(KRE)){const st=kstem(knorm(m[0]));if(!hits.has(st))continue;out.push(ans.slice(last,m.index),$('mark',{text:m[0]}));last=m.index+m[0].length}
  out.push(ans.slice(last));return out}
