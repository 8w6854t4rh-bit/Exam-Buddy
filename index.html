nung auf Gutachtenbasis?", "Ersetzt wird nur netto ohne Umsatzsteuer; Versicherer kürzen häufig Stundensätze; versteckte Schäden bleiben unentdeckt; für das Autohaus entfällt der Reparaturauftrag."], ["FF", "GW", "Wie ermittelt man den Hereinnahmepreis eines GW?", "Vom erzielbaren Verkaufspreis rückwärts: netto umrechnen, dann Bruttoertrag (Gewinn und Kosten), Reparatur, Aufbereitung, Garantie und Standkosten abziehen."], ["FF", "GW", "Welche Faktoren beeinflussen den Hereinnahmepreis?", "Alter, Laufleistung, Zustand, Unfallfreiheit, Ausstattung, Farbe, Zahl der Vorbesitzer, Serviceheft, HU, Marktlage und Saison."], ["FF", "GW", "Wer bewertet den GW im Autohaus?", "Technische Bewertung: Werkstatt oder GW-Meister (Zustand, Instandsetzungskosten). Kaufmännische Bewertung: GW-Verkaufsleiter mit DAT oder Schwacke und Marktbeobachtung."], ["FF", "GW", "Was bedeutet „Mehrwertsteuer ausweisbar“?", "Das Fahrzeug ist regelbesteuert, die Rechnung weist 19 % Umsatzsteuer aus. Interessant für Gewerbekunden, die die Vorsteuer abziehen können."], ["FF", "GW", "Warum gibt es die Differenzbesteuerung?", "Um eine Doppelbesteuerung zu vermeiden: Im Einkaufspreis von privat steckt bereits Umsatzsteuer, die der Händler nicht als Vorsteuer abziehen kann."], ["FF", "GW", "Was ist ein verdeckter Preisnachlass und wer trägt ihn?", "Die Inzahlungnahme wird über ihrem tatsächlichen Wert angerechnet, um den Neuwagen zu verkaufen. Die Überzahlung trägt die Neuwagenabteilung; der GW wird mit dem echten Wert eingebucht."], ["FF", "GW", "Warum wird ein kalkulierter GW-Preis oft nicht erzielt?", "Lange Standzeit, fallende Marktpreise, Modellwechsel, unentdeckte Mängel, Saison, starke Konkurrenzangebote."], ["FF", "GW", "Gründe für aktiven GW-Zukauf?", "Sortimentslücken schließen, gefragte Modelle anbieten, Nachfrage bedienen, Auslastung von Verkauf und Werkstatt, zusätzlicher Ertrag."], ["FF", "Finanzierung", "Kreditfähigkeit und Kreditwürdigkeit?", "Kreditfähigkeit: rechtlich Kreditverträge schließen können (voll geschäftsfähig). Kreditwürdigkeit (Bonität): persönliche und wirtschaftliche Verhältnisse lassen die Rückzahlung erwarten."], ["FF", "Finanzierung", "Unterlagen zur Kreditwürdigkeitsprüfung?", "Privatperson: Gehaltsnachweise, Selbstauskunft, SCHUFA-Auskunft, Ausweis. Unternehmen: Bilanz und GuV, betriebswirtschaftliche Auswertung, Handelsregisterauszug, Auskunftei."], ["FF", "Finanzierung", "Was ist die Legitimationsprüfung?", "Die Feststellung der Identität des Kunden anhand von Personalausweis oder Reisepass (bei Firmen zusätzlich Handelsregisterauszug). Pflicht nach dem Geldwäschegesetz."], ["FF", "Finanzierung", "Ausfallbürgschaft und selbstschuldnerische Bürgschaft?", "Ausfall: Der Bürge zahlt erst, wenn beim Schuldner erfolglos vollstreckt wurde. Selbstschuldnerisch: Die Bank kann sich sofort an den Bürgen halten (bankübliche Form)."], ["FF", "Finanzierung", "Was sagt der effektive Jahreszins?", "Die gesamten Kreditkosten pro Jahr in Prozent einschließlich Gebühren. Nur mit ihm lassen sich Angebote vergleichen."], ["FF", "Finanzierung", "Was ist ein Annuitätendarlehen?", "Ein Darlehen mit gleichbleibender Rate. Der Zinsanteil sinkt mit der Restschuld, der Tilgungsanteil steigt."], ["FF", "Finanzierung", "Wie lässt sich die Monatsrate senken?", "Höhere Anzahlung, längere Laufzeit, höhere Schlussrate, niedrigerer Zins, günstigeres Fahrzeug oder weniger Ausstattung."], ["FF", "Finanzierung", "Was ist ein Verbundgeschäft?", "Kaufvertrag und Darlehen bilden eine wirtschaftliche Einheit. Widerruft der Kunde das Darlehen (14 Tage), ist auch der Kaufvertrag hinfällig."], ["FF", "Finanzierung", "Warum gibt es oft keinen Barzahlerrabatt?", "Das Autohaus erhält für vermittelte Finanzierungen und Leasing Provision und bindet den Kunden bis zum Vertragsende. Barzahlung bringt ihm keinen Vorteil."], ["FF", "Finanzierung", "Zwei- und Drei-Wege-Finanzierung?", "Zwei Wege: Schlussrate zahlen oder weiterfinanzieren. Drei Wege: zusätzlich Rückgabe des Fahrzeugs an den Händler."], ["FF", "Leasing", "Leasing und Miete: drei Unterschiede?", "Leasing hat eine feste, längere Laufzeit ohne ordentliche Kündigung; der Leasingnehmer trägt Wartung, Versicherung und das Risiko von Untergang und Beschädigung; das Fahrzeug wird für ihn angeschafft."], ["FF", "Leasing", "Was ist erlasskonformes Leasing?", "Die Grundmietzeit liegt zwischen 40 % und 90 % der betriebsgewöhnlichen Nutzungsdauer. Dann wird das Fahrzeug steuerlich dem Leasinggeber zugerechnet und die Raten sind beim Leasingnehmer Betriebsausgaben."], ["FF", "Leasing", "Was ist das Andienungsrecht?", "Der Leasinggeber kann den Leasingnehmer am Vertragsende verpflichten, das Fahrzeug zum vereinbarten Restwert zu kaufen. Der Leasingnehmer selbst hat kein Recht auf den Kauf."], ["FF", "Leasing", "Voll- und Teilamortisation?", "Vollamortisation: Die Raten decken Anschaffungskosten, Zinsen und Gewinn des Leasinggebers komplett. Teilamortisation: Es bleibt ein Restwert offen, der am Ende gedeckt werden muss."], ["FF", "Leasing", "Welche Rolle spielt die Umsatzsteuer beim Leasing?", "Sie fällt auf jede Rate und die Sonderzahlung an, nicht auf einmal auf den Kaufpreis. Das schont die Liquidität; Unternehmer ziehen sie als Vorsteuer ab."], ["FF", "Leasing", "Warum bieten Autohäuser fast nur Kilometerleasing an?", "Der Kunde hat kein Restwertrisiko und klare Kosten. Abgerechnet werden nur Mehr- und Minderkilometer sowie Schäden über den normalen Verschleiß hinaus."], ["FF", "Leasing", "Was steht im Rückgabeprotokoll?", "Kilometerstand, Schäden außen und innen, Reifenzustand, Vollständigkeit von Zubehör, Schlüsseln und Papieren, Serviceheft, Unterschriften."], ["FF", "Leasing", "Was umfasst Full-Service-Leasing?", "Neben der Nutzung auch Wartung und Verschleißreparaturen, Reifen, oft Versicherung, Steuer und Ersatzwagen. Vorteil: feste, planbare Monatskosten."], ["FF", "Versicherung", "Laufzeit und Kündigung der Kfz-Versicherung?", "Ein Jahr, meist bis 31.12., Kündigung bis 30.11. Sonderkündigung bei Beitragserhöhung, nach einem Schaden und beim Fahrzeugwechsel."], ["FF", "Versicherung", "Was senkt den Kfz-Versicherungsbeitrag?", "Hohe Schadenfreiheitsklasse, günstige Typ- und Regionalklasse, wenig Kilometer, Garage, eingeschränkter Fahrerkreis, Selbstbeteiligung, Werkstattbindung."], ["FF", "Versicherung", "Was ist der Rabattschutz?", "Gegen Mehrbeitrag bleibt die Schadenfreiheitsklasse nach einem Schaden pro Jahr erhalten."], ["FF", "Versicherung", "Was bedeutet der Sicherungsschein?", "Die Kaskoleistung wird im Schadenfall an den Leasinggeber oder die Bank gezahlt, weil ihnen das Fahrzeug gehört bzw. sicherungsübereignet ist."], ["FF", "Versicherung", "Garantie, Gewährleistung, Kulanz?", "Gewährleistung (Sachmängelhaftung): gesetzliche Pflicht des Verkäufers. Garantie: freiwilliges Versprechen. Kulanz: freiwilliges Entgegenkommen ohne Rechtsanspruch, meist nach Ablauf der Fristen."], ["KUP", "Personal", "Quantitativer und qualitativer Personalbedarf?", "Quantitativ: wie viele Mitarbeiter gebraucht werden. Qualitativ: welche Qualifikationen sie haben müssen."], ["KUP", "Personal", "Interne und externe Personalbeschaffung: Vor- und Nachteile?", "Intern: schnell, günstig, motivierend, Bewerber bekannt; aber Betriebsblindheit, die alte Stelle wird frei, Neid. Extern: große Auswahl, neue Ideen; aber teurer, längere Einarbeitung, Risiko der Fehlbesetzung."], ["KUP", "Personal", "Ablauf der Personalbeschaffung?", "Bedarf feststellen, Stellenbeschreibung und Ausschreibung, Bewerbungen sichten, Vorstellungsgespräche, Auswahl mit Beteiligung des Betriebsrats, Arbeitsvertrag, Einarbeitung."], ["KUP", "Personal", "Wesentliche Inhalte eines Arbeitsvertrags?", "Vertragsparteien, Beginn (und Befristung), Arbeitsort, Tätigkeit, Entgelt, Arbeitszeit, Urlaub, Probezeit, Kündigungsfristen, Hinweis auf Tarifvertrag und Betriebsvereinbarungen."], ["KUP", "Personal", "Rechte und Pflichten des Arbeitnehmers?", "Rechte: Vergütung, Urlaub, Fürsorge, Zeugnis, Entgeltfortzahlung. Pflichten: Arbeitsleistung, Weisungen befolgen, Verschwiegenheit, Treue und Wettbewerbsverbot."], ["KUP", "Personal", "Einfaches und qualifiziertes Arbeitszeugnis?", "Einfach: Art und Dauer der Tätigkeit. Qualifiziert: zusätzlich Leistung und Verhalten. Es muss wahr und wohlwollend sein; bei Fehlern kann Berichtigung verlangt werden, notfalls vor dem Arbeitsgericht."], ["KUP", "Personal", "Wichtige Regeln des Arbeitszeitgesetzes?", "Werktäglich 8 Stunden, bis 10 Stunden mit Ausgleich; Pause 30 Minuten bei mehr als 6 Stunden, 45 Minuten bei mehr als 9 Stunden; 11 Stunden Ruhezeit."], ["KUP", "Personal", "Mutterschutz: Fristen?", "Schutzfrist 6 Wochen vor und 8 Wochen nach der Geburt (12 Wochen bei Früh- und Mehrlingsgeburten). Kündigungsverbot ab Beginn der Schwangerschaft bis 4 Monate nach der Entbindung."], ["KUP", "Personal", "Geldwerter Vorteil beim Firmenwagen (1-%-Methode)?", "Monatlich 1 % des Bruttolistenpreises plus 0,03 % je Entfernungskilometer zur Arbeit. Der Betrag erhöht das steuer- und sozialversicherungspflichtige Brutto und wird vom Netto wieder abgezogen."], ["KUP", "Personal", "Wer erhält welche Zahlung aus der Gehaltsabrechnung?", "Arbeitnehmer: Auszahlungsbetrag. Finanzamt: Lohnsteuer, Soli, Kirchensteuer. Krankenkasse: alle Sozialversicherungsbeiträge (Einzugsstelle). Bank oder Bausparkasse: vermögenswirksame Leistungen."], ["KUP", "Personal", "Personalkosten des Arbeitgebers?", "Bruttoentgelt + Arbeitgeberanteile zur Sozialversicherung + Beitrag zur Unfallversicherung + freiwillige Leistungen."], ["KUP", "Personal", "Ordentliche und außerordentliche Kündigung, Aufhebungsvertrag?", "Ordentlich: mit Frist. Außerordentlich: fristlos aus wichtigem Grund, innerhalb von 2 Wochen ab Kenntnis. Aufhebungsvertrag: einvernehmlich, ohne Frist, schriftlich."], ["KUP", "Personal", "Personen-, verhaltens- und betriebsbedingte Kündigung?", "Personenbedingt: Grund in der Person (lange Krankheit, Verlust der Fahrerlaubnis). Verhaltensbedingt: Pflichtverletzung, vorher Abmahnung. Betriebsbedingt: Arbeitsplatz fällt weg, Sozialauswahl nötig."], ["KUP", "Personal", "Kriterien der Sozialauswahl?", "Dauer der Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten, Schwerbehinderung."], ["KUP", "Personal", "Funktion der Abmahnung?", "Sie rügt ein konkretes Fehlverhalten, fordert zur Änderung auf und droht für den Wiederholungsfall die Kündigung an. Zum Beweis schriftlich."], ["KUP", "Personal", "Mit welcher Frist kündigt der Arbeitnehmer?", "Immer mit der Grundfrist von 4 Wochen zum 15. oder zum Monatsende, wenn Vertrag oder Tarif nichts anderes regeln. Die verlängerten Fristen gelten nur für den Arbeitgeber."], ["KUP", "Personal", "Rolle des Betriebsrats bei Kündigungen?", "Er muss vor jeder Kündigung angehört werden, sonst ist sie unwirksam. Er kann innerhalb einer Woche widersprechen (bei fristloser Kündigung 3 Tage)."], ["WiSo", "Arbeit", "Mantel- und Entgelttarifvertrag?", "Manteltarif: langfristige Arbeitsbedingungen (Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge). Entgelttarif: Höhe der Löhne und Ausbildungsvergütungen, kurze Laufzeit, weil sie regelmäßig an Preise und Konjunktur angepasst werden."], ["WiSo", "Arbeit", "Was heißt Allgemeinverbindlichkeit?", "Das Arbeitsministerium erklärt einen Tarifvertrag für alle Arbeitgeber und Arbeitnehmer der Branche für gültig, auch für nicht tarifgebundene."], ["WiSo", "Arbeit", "Streik, Aussperrung, Schlichtung?", "Streik: Arbeitsniederlegung der Arbeitnehmer. Aussperrung: Arbeitgeber verweigern Arbeit und Lohn. Schlichtung: Ein neutraler Schlichter macht einen Einigungsvorschlag."], ["WiSo", "Soziales", "Welche Risiken deckt die Sozialversicherung nicht und was hilft?", "Berufsunfähigkeit, Haftung für Schäden bei anderen, Unfälle in der Freizeit, Versorgungslücke im Alter. Abhilfe: Berufsunfähigkeits-, private Haftpflicht-, private Unfallversicherung, private Altersvorsorge."], ["WiSo", "Soziales", "Formen der privaten Altersvorsorge und ihre Förderung?", "Riester-Rente (Zulagen und Sonderausgabenabzug), betriebliche Altersversorgung (steuer- und beitragsfreie Entgeltumwandlung), Basisrente/Rürup (Sonderausgabenabzug)."], ["WiSo", "Soziales", "Die sieben Einkunftsarten?", "Land- und Forstwirtschaft, Gewerbebetrieb, selbstständige Arbeit, nichtselbstständige Arbeit, Kapitalvermögen, Vermietung und Verpachtung, sonstige Einkünfte."], ["WiSo", "Soziales", "Wie berechnet man das zu versteuernde Einkommen?", "Einnahmen − Werbungskosten (mindestens Pauschbetrag 1.230 €) = Einkünfte − Sonderausgaben − außergewöhnliche Belastungen = zu versteuerndes Einkommen. Erstattung = einbehaltene Lohnsteuer − festgesetzte Steuer."], ["KUP", "Inventur und Bilanz", "Inventur und Inventar?", "Inventur: die Tätigkeit, also das Zählen, Messen, Wiegen und Bewerten aller Vermögensteile und Schulden. Inventar: das Ergebnis, ein ausführliches Verzeichnis nach Art, Menge und Wert."], ["KUP", "Inventur und Bilanz", "Körperliche Inventur und Buchinventur?", "Körperlich: Bestände werden tatsächlich gezählt, gemessen oder gewogen (Fahrzeuge, Teile). Buchinventur: nicht greifbare Werte werden anhand von Belegen und Büchern ermittelt (Forderungen, Bankguthaben, Schulden)."], ["KUP", "Inventur und Bilanz", "Welche Inventurverfahren gibt es?", "Stichtagsinventur: innerhalb von 10 Tagen um den Bilanzstichtag. Verlegte Inventur: bis 3 Monate vorher oder 2 Monate danach, mit Fortschreibung oder Rückrechnung. Permanente Inventur: laufende Bestandsführung, jeder Artikel wird einmal im Jahr gezählt."], ["KUP", "Inventur und Bilanz", "Wann ist eine Inventur vorgeschrieben?", "Bei Gründung oder Übernahme, am Ende jedes Geschäftsjahres und bei Auflösung oder Verkauf des Unternehmens."], ["KUP", "Inventur und Bilanz", "Was besagt das Niederstwertprinzip?", "Von Anschaffungskosten und aktuellem Wert am Stichtag wird der niedrigere angesetzt. Beispiel: Ein Teil wurde für 100 € gekauft und ist nur noch 80 € wert, bilanziert werden 80 €. Nicht realisierte Gewinne dürfen nicht ausgewiesen werden."], ["KUP", "Inventur und Bilanz", "Wie ist das Inventar gegliedert?", "A Vermögen: Anlagevermögen, dann Umlaufvermögen, geordnet nach steigender Flüssigkeit. B Schulden: langfristige, dann kurzfristige, geordnet nach Fälligkeit. C Reinvermögen (Eigenkapital) = Vermögen − Schulden."], ["KUP", "Inventur und Bilanz", "Zusammenhang von Inventur, Inventar und Bilanz?", "Die Inventur liefert die Daten, das Inventar listet sie ausführlich auf, die Bilanz fasst sie in Kontoform kurz zusammen: Aktiva (Vermögen) und Passiva (Kapital)."], ["KUP", "Inventur und Bilanz", "Wie ist die Bilanz aufgebaut und warum sind beide Seiten gleich?", "Aktiva: Anlagevermögen, Umlaufvermögen (Mittelverwendung). Passiva: Eigenkapital, Fremdkapital (Mittelherkunft). Beide Seiten zeigen dasselbe Kapital aus zwei Blickwinkeln, das Eigenkapital gleicht als Restgröße aus."], ["KUP", "Inventur und Bilanz", "Die vier Bilanzveränderungen?", "Aktivtausch: nur Aktivkonten, Summe bleibt (Barabhebung). Passivtausch: nur Passivkonten, Summe bleibt (Verbindlichkeit wird Darlehen). Aktiv-Passiv-Mehrung: beide Seiten steigen (Kauf auf Ziel). Aktiv-Passiv-Minderung: beide sinken (Rechnung per Bank bezahlt)."], ["KUP", "Inventur und Bilanz", "Fremdkapitalquote?", "Fremdkapital / Gesamtkapital × 100. Je höher, desto abhängiger ist das Unternehmen von Gläubigern. Eigen- und Fremdkapitalquote ergeben zusammen 100 %."], ["KUP", "Konten und Abschluss", "Wie bucht man auf aktiven und passiven Bestandskonten?", "Aktivkonto: Anfangsbestand und Zugänge im Soll, Abgänge und Schlussbestand im Haben. Passivkonto genau umgekehrt: Anfangsbestand und Zugänge im Haben."], ["KUP", "Konten und Abschluss", "Grundbuch und Hauptbuch?", "Grundbuch (Journal): alle Buchungssätze in zeitlicher Reihenfolge. Hauptbuch: dieselben Buchungen sachlich geordnet auf den Konten (T-Konten)."], ["KUP", "Konten und Abschluss", "Bestandskonten und Erfolgskonten?", "Bestandskonten zeigen Vermögen und Schulden und werden über das Schlussbilanzkonto abgeschlossen. Erfolgskonten (Aufwand und Ertrag) verändern das Eigenkapital und werden über das GuV-Konto abgeschlossen."], ["KUP", "Konten und Abschluss", "Erfolgsneutral und erfolgswirksam?", "Erfolgsneutral: Nur Bestandskonten sind betroffen, das Eigenkapital bleibt gleich (Kauf auf Ziel). Erfolgswirksam: Ein Aufwands- oder Ertragskonto ist beteiligt, das Eigenkapital ändert sich (Miete, Verkauf)."], ["KUP", "Konten und Abschluss", "Warum gibt es die VAK-Buchung?", "Beim Verkauf wird der Erlös gebucht. Die VAK-Buchung stellt den Wareneinsatz zum Einstandspreis als Aufwand dagegen und mindert den Bestand. Erst Erlös minus VAK zeigt den Bruttoertrag."], ["KUP", "Konten und Abschluss", "Wie laufen die Erfolgskonten in den Abschluss?", "Betriebliche Aufwendungen und Erträge ergeben das Betriebsergebnis, neutrale das neutrale Ergebnis. Beide fließen ins GuV-Konto. Dessen Saldo (Gewinn oder Verlust) geht auf das Eigenkapital."], ["KUP", "Konten und Abschluss", "Wie prüft man einen Buchungssatz?", "Summe Soll = Summe Haben; mindestens ein Konto im Soll und eines im Haben; Zugang oder Abgang auf der richtigen Seite; passt die Buchung zum Beleg? Reihenfolge: erst Soll, dann Haben."], ["KUP", "Umsatzsteuer", "Welche Umsatzsteuersätze gibt es?", "Regelsatz 19 %. Ermäßigt 7 % für Güter des Grundbedarfs wie Lebensmittel, Bücher, Zeitungen und Nahverkehr. Steuerfrei sind z. B. Versicherungen, Bankzinsen, Mieten für Wohnraum, Briefporto."], ["KUP", "Umsatzsteuer", "Warum heißt die Umsatzsteuer auch Mehrwertsteuer?", "Besteuert wird auf jeder Stufe nur der Mehrwert, also die Differenz zwischen Verkaufs- und Einkaufspreis. Bemessungsgrundlage ist das Nettoentgelt. Getragen wird sie vom Endverbraucher."], ["KUP", "Umsatzsteuer", "Warum ist die Umsatzsteuer für das Unternehmen ein durchlaufender Posten?", "Es nimmt die Umsatzsteuer vom Kunden ein, zieht die gezahlte Vorsteuer ab und führt nur die Differenz an das Finanzamt ab. Sie ist weder Aufwand noch Ertrag und ändert den Gewinn nicht."], ["KUP", "Umsatzsteuer", "Vorsteuer, Umsatzsteuer, Zahllast?", "Vorsteuer: Steuer auf Eingangsrechnungen, Forderung an das Finanzamt. Umsatzsteuer: Steuer auf Ausgangsrechnungen, Schuld an das Finanzamt. Zahllast = Umsatzsteuer − Vorsteuer. Ist die Vorsteuer höher, entsteht ein Vorsteuerüberhang (Erstattung)."], ["KUP", "Umsatzsteuer", "Wie werden die Steuerkonten abgeschlossen?", "Das Konto Vorsteuer wird über das Konto Umsatzsteuer abgeschlossen (1770 an 1570). Die Zahllast wird überwiesen (1770 an 1200), am Jahresende als Verbindlichkeit in die Schlussbilanz übernommen."], ["KUP", "Umsatzsteuer", "Was ist die Umsatzsteuer-Voranmeldung?", "Die regelmäßige Meldung der Zahllast an das Finanzamt, in der Regel monatlich oder vierteljährlich, elektronisch bis zum 10. Tag nach Ablauf des Zeitraums."], ["FF", "Neuwagen", "Was zeigt die Portfolio-Analyse?", "Sie ordnet Modelle nach Marktwachstum und relativem Marktanteil: Fragezeichen (hohes Wachstum, kleiner Anteil), Stars (beides hoch), Cashcows (wenig Wachstum, hoher Anteil, bringen Geld), arme Hunde (beides niedrig)."], ["FF", "Neuwagen", "Welche Strategie passt zu welchem Portfolio-Feld?", "Fragezeichen: investieren oder aufgeben. Stars: investieren und ausbauen. Cashcows: Gewinne abschöpfen. Arme Hunde: auslaufen lassen."], ["FF", "Neuwagen", "Marktpotenzial, Marktvolumen, Marktanteil?", "Marktpotenzial: maximal mögliche Absatzmenge im Markt. Marktvolumen: tatsächlicher Absatz aller Anbieter. Marktanteil: eigener Absatz in Prozent des Marktvolumens."], ["FF", "Neuwagen", "Wie plant man die Verkaufszahl für das nächste Jahr?", "Erwartetes Marktvolumen im Marktgebiet × angestrebter Marktanteil = Planabsatz. Abgeglichen wird mit Vorjahreszahlen, Modellneuheiten und den Vorgaben des Herstellers."], ["FF", "Neuwagen", "Einfacher und realer Kapitalbedarf im Neuwagengeschäft?", "Einfach: Absatz × Einstandspreis × Standtage / 360. Real: Die Kapitalbindung verlängert sich um das Zahlungsziel an Kunden und verkürzt sich um das Zahlungsziel des Herstellers und um Anzahlungen."], ["FF", "Neuwagen", "Ablauf einer Neuwagenbestellung bis zur Auftragsbestätigung?", "Bedarfsermittlung und Beratung, Probefahrt, Konfiguration und Angebot, verbindliche Bestellung des Kunden, Prüfung von Bonität und Lieferbarkeit, Bestellung beim Hersteller, schriftliche Auftragsbestätigung innerhalb der Bindefrist."], ["FF", "Neuwagen", "Woraus besteht ein Verkäufergehalt?", "Fixum (Grundgehalt), Provision, Prämien und Boni (z. B. für Finanzierungen, Zielerreichung), dazu oft ein Dienstwagen als geldwerter Vorteil."], ["FF", "Neuwagen", "Umsatzprovision und Bruttoertragsprovision?", "Umsatzprovision: Prozentsatz vom Nettoverkaufspreis; verleitet zu hohen Nachlässen. Bruttoertragsprovision: Prozentsatz vom Bruttoertrag; der Verkäufer verdient mehr, wenn er wenig Nachlass gibt."], ["FF", "Neuwagen", "Warum ist die fristgemäße schriftliche Auftragsbestätigung wichtig?", "Erst sie nimmt die Bestellung des Kunden an und lässt den Kaufvertrag entstehen. Kommt sie nach Ablauf der Bindefrist, ist der Kunde nicht mehr gebunden; sie gilt dann als neues Angebot."], ["FF", "Neuwagen", "Pflichtangaben einer Neuwagen-Ausgangsrechnung?", "Name und Anschrift von Autohaus und Kunde, Steuernummer oder USt-IdNr., Rechnungsnummer und -datum, Lieferdatum, genaue Bezeichnung des Fahrzeugs mit Fahrgestellnummer, Nettobetrag, Steuersatz, Steuerbetrag, Bruttobetrag."], ["FF", "Neuwagen", "Warum fällt auf Zulassungsgebühren keine Umsatzsteuer an?", "Die amtliche Gebühr zahlt das Autohaus im Namen und für Rechnung des Kunden an die Behörde. Sie ist ein durchlaufender Posten. Die eigene Zulassungspauschale für den Service ist dagegen umsatzsteuerpflichtig."], ["FF", "Neuwagen", "Was ist ein interner Auftrag?", "Eine Leistung der Werkstatt für eine andere Abteilung des eigenen Hauses, z. B. Übergabeinspektion eines Neuwagens oder Aufbereitung eines GW. Sie wird intern ohne Umsatzsteuer verrechnet und belastet die empfangende Abteilung."], ["FF", "Neuwagen", "Wie bucht man den Einkauf eines Neuwagens mit Überführung?", "3000 Bestand Neuwagen + 3030 Bestand Überführung + 1570 Vorsteuer an 1600 Verbindlichkeiten."], ["FF", "Neuwagen", "Wann dürfen AGB vom Gesetz abweichen?", "Nur dort, wo das Gesetz nicht zwingend ist, und nur ohne unangemessene Benachteiligung des Kunden. Gegenüber Verbrauchern sind die Schutzvorschriften (z. B. 2 Jahre Sachmängelhaftung bei Neuware) nicht abdingbar; unter Kaufleuten ist mehr möglich."], ["FF", "Neuwagen", "Gewährleistungsfristen bei Neu- und Gebrauchtwagen?", "Neuwagen: 2 Jahre. Gebrauchtwagen an Verbraucher: Verkürzung auf 1 Jahr möglich. Gebrauchtwagen unter Unternehmern: Ausschluss möglich. Privat an privat: Ausschluss möglich, außer bei Arglist."], ["KUP", "Kennzahlen", "Wie lässt sich die Umsatzrentabilität verbessern?", "Kosten senken oder Erträge je Verkauf erhöhen (bessere Margen, mehr Service- und Teilegeschäft). Mehr Umsatz allein hilft nur, wenn auch der Gewinn mitwächst."], ["FF", "Neuwagen", "Was ist das Kfz-Potenzial und wie berechnet man es?", "Alle im Marktgebiet zugelassenen Pkw, egal welcher Marke. Kfz-Potenzial = Einwohner / 1.000 × Pkw je 1.000 Einwohner. Beispiel: 530.000 / 1.000 × 481 = 254.930 Pkw."], ["FF", "Neuwagen", "Wie kommt man vom Kfz-Potenzial zum jährlichen Neuwagenbedarf?", "Kfz-Potenzial durch die durchschnittliche Nutzungsdauer teilen, weil jedes Fahrzeug danach durch einen Neuwagen ersetzt wird. Beispiel: 254.930 / 5 = 50.986 Neuwagen pro Jahr. Pro Monat noch einmal durch 12."], ["FF", "Neuwagen", "Wie berechnet man den Vorjahreswert aus einer prozentualen Veränderung?", "Aktueller Wert / (1 + Veränderung / 100). Beispiel: 230 Pkw bei +15 % → 230 / 1,15 = 200 Pkw. Nicht einfach 15 % abziehen."], ["FF", "Neuwagen", "Welche Phasen hat der Produktlebenszyklus eines Modells?", "Einführung, Wachstum, Reife, Sättigung, Rückgang. Der Absatz steigt erst langsam, dann stark, erreicht in der Reifephase den Höhepunkt und sinkt danach."], ["FF", "Neuwagen", "Der Absatz eines Modells bricht schon in der Wachstumsphase ein. Was kann der Hersteller tun?", "Ursachen prüfen (Preis, Konkurrenz, Qualität, Image) und gegensteuern: Modellpflege oder Facelift, Sondermodelle, bessere Ausstattung, Preis- oder Finanzierungsaktionen, mehr Werbung."], ["FF", "Neuwagen", "Wie berechnet man die Planzahl für ein Quartal?", "Jahresplanung × Quartalsanteil, meist auf volle Stück aufrunden. Beispiel: 800 Pkw × 28 % = 224 Pkw im 1. Quartal."], ["FF", "Finanzierung", "Fahrzeugfinanzierung: Welche Vertragsbeziehungen gibt es zwischen Kunde, Autohaus und Bank?", "Kunde und Autohaus: Kaufvertrag (beidseitig), Anzahlung an das Autohaus, Übergabe des Fahrzeugs an den Kunden. Kunde und Bank: Darlehensvertrag (beidseitig), Ratenzahlung an die Bank. Bank an Autohaus: Auszahlung des Darlehens."], ["FF", "Finanzierung", "Woran orientiert sich die Schlussrate bei der Drei-Wege-Finanzierung?", "Am voraussichtlichen Restwert (Gebrauchtwagenwert) des Fahrzeugs am Ende der Laufzeit. Er hängt von Modell, Ausstattung, Laufzeit und Kilometerleistung ab. So kann der Kunde das Auto zurückgeben und die Schlussrate ist gedeckt."], ["FF", "Finanzierung", "Welche Daten speichert die SCHUFA?", "Personendaten (Name, Geburtsdatum, Anschriften) sowie Girokonten, Kreditkarten, Kredite und Ratenkäufe (Betrag, Laufzeit, Rückzahlung), Leasingverträge, Handy- und Telekommunikationsverträge, Bürgschaften und Negativmerkmale wie Zahlungsausfälle."], ["FF", "Finanzierung", "Aus welchen Gründen kann die Bank einen Fahrzeugkredit kündigen?", "Zahlungsverzug: mindestens zwei aufeinanderfolgende Raten ganz oder teilweise offen, dazu 10 % (bei über 3 Jahren Laufzeit 5 %) des Darlehens, und eine Frist von 2 Wochen ist erfolglos abgelaufen. Außerdem: wesentliche Verschlechterung der Vermögensverhältnisse, falsche Angaben im Kreditantrag, Wegfall der Sicherheit (z. B. Fahrzeug ohne Zustimmung verkauft, keine Vollkasko)."], ["FF", "Leasing", "Welche Vorteile hat das Autohaus durch Leasingverträge?", "Provision von der Leasinggesellschaft, sofortiges Geld für das Fahrzeug ohne eigenes Ausfallrisiko, Kundenbindung und Folgegeschäft nach Vertragsende, Werkstattauslastung während der Laufzeit, planbarer Nachschub an jungen Gebrauchtwagen (Leasingrückläufer), niedrige Raten als Verkaufsargument."], ["FF", "Leasing", "Wie berechnet die Leasinggesellschaft den Erfolg aus einem Vertrag (Abschlusskalkulation)?", "Erträge: alle Leasingraten (Rate × Laufzeit), Mehrkilometer (gefahrene − vereinbarte km − Freigrenze, × Satz) und der Verkaufserlös des Fahrzeugs. Aufwendungen: Anschaffungskosten und Kosten vor dem Verkauf (z. B. Reifen, Bewertung). Überschuss = Erträge − Aufwendungen. Minderkilometer würden den Ertrag senken."]], "quiz": [["WiSo", "Ein 15-Jähriger kauft ohne Wissen der Eltern von seinem Taschengeld ein Spiel für 30 €. Der Vertrag ist …", ["nichtig, weil er minderjährig ist", "schwebend unwirksam bis zur Genehmigung", "wirksam, weil er mit eigenen Mitteln zahlt", "anfechtbar durch den Händler"], 2, "§ 110 BGB: mit frei überlassenen Mitteln bewirkt."], ["WiSo", "Eine Kundin hat ein Fahrrad bezahlt, holt es aber erst in drei Tagen ab. Bis dahin ist …", ["sie Eigentümerin und Besitzerin", "sie Eigentümerin, der Händler Besitzer", "der Händler Eigentümer und Besitzer", "der Händler Eigentümer, sie Besitzerin"], 2, "Eigentum geht erst mit Einigung und Übergabe über."], ["WiSo", "Welche Aussage zu AGB trifft zu?", ["AGB haben Vorrang vor individuellen Abreden", "Eine unwirksame Klausel macht den ganzen Vertrag nichtig", "AGB sparen Verhandlungsaufwand", "Kaufleute müssen fremde AGB immer akzeptieren"], 2, "Rationalisierungseffekt. Individuelle Abreden gehen vor."], ["WiSo", "Welches Recht hat ein Käufer bei einem Sachmangel zuerst?", ["Rücktritt", "Minderung", "Nacherfüllung", "Schadenersatz statt der Leistung"], 2, "Vorrang der Nacherfüllung."], ["WiSo", "Ein Händler will die Sachmängelhaftung für Neuware g arzahlung ab 10.000 €: Kunde identifizieren (Geldwäschegesetz)"]}, {"k": "l", "head": "Kredit, SCHUFA, Leasing kompakt", "items": ["Vertragsbeziehungen: Kaufvertrag Kunde–Autohaus, Darlehensvertrag Kunde–Bank. Anzahlung Kunde → Autohaus, Fahrzeug Autohaus → Kunde, Darlehen Bank → Autohaus, Raten Kunde → Bank", "Schlussrate: orientiert sich am voraussichtlichen Restwert (Gebrauchtwagenwert) am Laufzeitende", "SCHUFA speichert: Personendaten, Girokonten, Kreditkarten, Kredite und Ratenkäufe, Leasingverträge, Handyverträge, Bürgschaften", "SCHUFA-Negativmerkmale: gekündigter Kredit, Mahnbescheid oder Vollstreckung, Vermögensauskunft, Privatinsolvenz", "SECCI-Formular: Kreditgeber, Kreditart, Nettodarlehensbetrag, Laufzeit, Sollzins, effektiver Jahreszins, Gesamtbetrag, Raten, Sicherheiten, Widerrufsrecht", "Kündigung durch die Bank: Verzug mit 2 Raten und mind. 10 % (über 3 Jahre: 5 %) nach 2 Wochen Frist, Verschlechterung der Vermögenslage, falsche Angaben, Wegfall der Sicherheit", "Leasing-Vorteile fürs Autohaus: Provision, sofort Geld ohne Ausfallrisiko, Kundenbindung, Werkstattauslastung, Leasingrückläufer als junge Gebrauchtwagen"]}]]], "lf": [["LF 2 · Kaufmännisch steuern und kontrollieren", [["Inventur und Inventar", ["Inventur = zählen und bewerten, Inventar = das Verzeichnis dazu.", "Körperliche Inventur (zählen) und Buchinventur (Belege).", "Verfahren: Stichtag (±10 Tage), verlegt (3 Monate vor, 2 Monate nach), permanent.", "Anlässe: Gründung, Ende des Geschäftsjahres, Auflösung.", "Niederstwertprinzip: der niedrigere Wert zählt.", "Inventar: Vermögen (nach Flüssigkeit), Schulden (nach Fälligkeit), Reinvermögen = Vermögen − Schulden."]], ["Bilanz", ["Aktiva: Anlage- und Umlaufvermögen. Passiva: Eigen- und Fremdkapital. Summen immer gleich.", "Kennzahlen: Eigenkapitalquote, Fremdkapitalquote, Anlagendeckung I und II.", "Aktivtausch und Passivtausch: Bilanzsumme bleibt. Aktiv-Passiv-Mehrung und -Minderung: Summe steigt oder sinkt."]], ["Konten und Abschluss", ["Aktivkonto: Anfangsbestand und Zugang im Soll. Passivkonto: im Haben.", "Grundbuch = zeitlich (Buchungssätze), Hauptbuch = sachlich (T-Konten).", "Bestandskonten → Schlussbilanz. Erfolgskonten → GuV → Eigenkapital.", "Erfolgswirksam, wenn Aufwand oder Ertrag beteiligt ist.", "Jeder Verkauf: Erlösbuchung + VAK-Buchung. Erlös − VAK = Bruttoertrag.", "Betriebsergebnis + neutrales Ergebnis = Gewinn oder Verlust."]], ["Umsatzsteuer", ["19 % Regelsatz, 7 % ermäßigt; Versicherungen, Zinsen, Wohnungsmiete steuerfrei.", "Mehrwertsteuer: besteuert wird der Mehrwert jeder Stufe, Träger ist der Endverbraucher.", "Durchlaufender Posten: kein Aufwand, kein Ertrag.", "Zahllast = Umsatzsteuer − Vorsteuer; Voranmeldung meist monatlich.", "Abschluss: 1770 an 1570, Zahllast 1770 an 1200."]]], "KUP"], ["LF 9 · Personal", [["Planung und Beschaffung", ["Quantitativ (wie viele) und qualitativ (welche Qualifikation). Ersatz-, Neu-, Minderbedarf.", "Bedarf = Soll − (Ist + Zugänge − Abgänge).", "Intern: schnell, günstig, motivierend. Extern: neue Ideen, größere Auswahl.", "Unzulässige Fragen: Schwangerschaft, Religion, Partei, Gewerkschaft.", "Arbeitsvertrag: Parteien, Beginn, Tätigkeit, Ort, Entgelt, Arbeitszeit, Urlaub, Probezeit, Fristen."]], ["Tarif und Schutzgesetze", ["Tarifautonomie, Friedenspflicht. Manteltarif (Bedingungen) und Entgelttarif (Geld).", "Ablauf: Verhandlung, Schlichtung, Urabstimmung 75 %, Streik, Einigung, Urabstimmung 25 %.", "Arbeitszeit: 8 Stunden, max. 10; Pause 30/45 Minuten; Ruhezeit 11 Stunden.", "Mutterschutz: 6 Wochen vor, 8 Wochen nach der Geburt; Kündigungsverbot.", "Urlaub: 24 Werktage, voll nach 6 Monaten, sonst 1/12 je Monat."]], ["Gehalt und Steuern", ["Brutto (+ geldwerter Vorteil) − Lohnsteuer − Soli − Kirchensteuer − Sozialversicherung = Netto − private Abzüge = Auszahlung.", "Sozialversicherung je zur Hälfte: KV 14,6 % + Zusatz, PV 3,6 %, RV 18,6 %, AV 2,6 %; Unfall nur Arbeitgeber.", "Firmenwagen: 1 % vom Bruttolistenpreis + 0,03 % je Entfernungskilometer.", "Zu versteuerndes Einkommen: Einkünfte − Werbungskosten − Sonderausgaben − außergewöhnliche Belastungen.", "Private Vorsorge: Berufsunfähigkeit, Haftpflicht, Riester, Betriebsrente."]], ["Beendigung", ["Kündigung, Aufhebungsvertrag, Fristablauf, Rente. Immer schriftlich.", "Ordentlich mit Frist; außerordentlich aus wichtigem Grund binnen 2 Wochen.", "Gründe: personen-, verhaltens- (Abmahnung), betriebsbedingt (Sozialauswahl).", "Besonderer Schutz: Schwangere, Betriebsrat, Schwerbehinderte, Azubis.", "Betriebsrat anhören; Klage binnen 3 Wochen; Zeugnis einfach oder qualifiziert."]]], "KUP"], ["LF 10 · Wertschöpfung steuern", [["Kosten- und Leistungsrechnung", ["Stufen: Kostenarten, Kostenstellen (BAB), Kostenträger (Kalkulation).", "Aufwand ≠ Kosten: neutral (betriebsfremd, periodenfremd, außerordentlich), Grund-, Anders-, Zusatzkosten.", "Einzelkosten direkt, Gemeinkosten über Schlüssel. Hauptkostenstellen: NW, GW, Teile, Werkstatt.", "Zuschlagssatz = Gemeinkosten / Einzelkosten × 100.", "Kalkulation vorwärts, rückwärts, Differenz; Zuschlag, Faktor, Handelsspanne."]], ["Deckungsbeitrag und Werkstatt", ["DB = Erlös − variable Kosten; Betriebsergebnis = DB − Fixkosten.", "Kurzfristige Preisuntergrenze = variable Kosten. Break-even = Fixkosten / Stück-DB.", "Mehrstufig: DB 1 (Bruttoertrag), DB 2, DB 3, Betriebsergebnis.", "Stundenverrechnungssatz = Schnittlohn × Werkstattindex; Index = Soll-Lohnerlöse / produktive Löhne."]], ["Controlling", ["Strukturbilanz: Anlage-/Umlaufvermögen, Eigen-/Fremdkapital.", "EK-Quote, Anlagendeckung, Liquidität 1 bis 3.", "Rentabilitäten: Eigenkapital (Gewinn / EK), Gesamtkapital ((Gewinn + FK-Zinsen) / GK), Umsatz (Gewinn / Umsatz), jeweils × 100.", "Umsatzrentabilität: Wie viel Cent Gewinn bleiben von jedem Euro Umsatz? Beispiel: 45.000 € Gewinn / 3.000.000 € Umsatz × 100 = 1,5 %.", "Goldene Bilanzregel, Leverage-Effekt.", "Betriebsergebnis + neutrales Ergebnis = Unternehmensergebnis.", "Lagerkennzahlen und Kennzahlen der Geschäftsfelder (Bruttoertrag, Standzeit)."]]], "KUP"], ["LF 6 · Neuwagen disponieren und verkaufen", [["Markt und Planung", ["Portfolio: Fragezeichen, Stars, Cashcows, arme Hunde (Marktwachstum und Marktanteil).", "Marktpotenzial (möglich), Marktvolumen (tatsächlich), Marktanteil (eigener Anteil).", "Kfz-Potenzial = Einwohner / 1.000 × Pkw je 1.000 Einwohner. Neuwagenbedarf pro Jahr = Kfz-Potenzial / Ø Nutzungsdauer.", "Produktlebenszyklus: Einführung, Wachstum, Reife (höchster Absatz), Sättigung, Rückgang. Quartalsplanzahl = Jahresplanung × Quartalsanteil.", "Planabsatz = erwartetes Marktvolumen × angestrebter Marktanteil.", "Kapitalbedarf = Absatz × Einstandspreis × Kapitalbindung in Tagen / 360."]], ["Verkauf und Vertrag", ["Ablauf: Beratung, Probefahrt, Angebot, verbindliche Bestellung, Prüfung, Auftragsbestätigung.", "Vertrag entsteht erst durch Auftragsbestätigung oder Lieferung in der Bindefrist (3 Wochen).", "Verkäufergehalt: Fixum + Provision + Prämien. Bruttoertragsprovision bremst Nachlässe.", "Bruttoertrag = Marge − Kundennachlass − Zugaben; Provision in Prozent davon."]], ["Rechnung und Buchung", ["Rechnung: Namen, Steuernummer, Nummer, Datum, Fahrgestellnummer, Netto, Steuersatz, Steuer, Brutto.", "Einkauf: 3000 + 3030 + 1570 an 1600. Verkauf: 1400 an 8000 + 8030 + 8200 + 1770. Dazu 7000 an 3000.", "Amtliche Zulassungsgebühr: durchlaufender Posten ohne Umsatzsteuer.", "Interner Auftrag: Werkstatt für eigene Abteilung, ohne Umsatzsteuer."]], ["Reklamation", ["Sachmängelhaftung: Neuwagen 2 Jahre, GW an Verbraucher mindestens 1 Jahr.", "Beweislastumkehr 12 Monate. Erst Nacherfüllung, dann Rücktritt oder Minderung.", "AGB dürfen Verbraucher nicht unangemessen benachteiligen.", "Gewährleistung gesetzlich, Garantie freiwillig, Kulanz ohne Anspruch."]]], "FF"], ["LF 7 · Gebrauchtwagen", [["Bewertung", ["Hereinnahmepreis: vom Marktpreis rückwärts abzüglich Bruttoertrag, Reparatur, Aufbereitung, Standkosten.", "Einflüsse: Alter, Kilometer, Zustand, Ausstattung, Farbe, Vorbesitzer, Marktlage.", "Technische Bewertung durch die Werkstatt, kaufmännische durch den GW-Verkauf (DAT, Schwacke).", "Zukaufquellen: Leasingrückläufer, Auktionen, Händler, Werkswagen, Börsen."]], ["Besteuerung und Kalkulation", ["Differenzbesteuerung § 25a: Ankauf ohne Vorsteuer; USt = Differenz × 19/119; kein Steuerausweis.", "Regelbesteuerung („MwSt ausweisbar“): Ankauf mit Vorsteuer, 19 % auf den Nettopreis.", "Erfolg = Marge netto − Reparatur − Aufbereitung − Standkosten.", "Verdeckter Preisnachlass: Überzahlung der Inzahlungnahme, trägt die Neuwagenabteilung.", "Buchungen: 3110 an 1200 · 1400 an 8110 + 8111 + 1770 · 7110 an 3110."]]], "FF"], ["LF 8 · Finanzdienstleistungen", [["Finanzierung", ["Standardfinanzierung: gleiche Raten bis null. Ballon-/Drei-Wege-Finanzierung: niedrige Raten + Schlussrate.", "Kreditfähig = geschäftsfähig. Kreditwürdig = Bonität (Einkommen, SCHUFA, Selbstauskunft).", "Sicherheiten: Sicherungsübereignung (ZB II bei der Bank), Gehaltsabtretung, Bürgschaft, Restschuldversicherung.", "Effektiver Jahreszins = alle Kosten pro Jahr. Annuität: Rate gleich, Zins sinkt, Tilgung steigt.", "Verbundgeschäft: Widerruf des Darlehens kippt auch den Kauf.", "Herstellerbank: Absatzförderung, Provision und Kundenbindung, günstige Zinsen und schnelle Zusage.", "Vertragsbeziehungen: Kaufvertrag mit dem Autohaus, Darlehensvertrag mit der Bank; die Bank zahlt das Darlehen ans Autohaus aus. Schlussrate = erwarteter Restwert.", "SCHUFA speichert Konten, Kredite, Leasing- und Handyverträge, Bürgschaften. Kündigung durch die Bank z. B. bei Verzug mit 2 Raten, falschen Angaben oder Wegfall der Sicherheit."]], ["Leasing", ["Leasinggeber Eigentümer, Leasingnehmer Besitzer; Raten = Aufwand, keine Bilanzierung beim Nehmer.", "Erlasskonform: Grundmietzeit 40–90 % der Nutzungsdauer.", "Kilometerleasing: Mehr-/Minderkilometer. Restwertleasing: Restwertrisiko beim Kunden, Andienungsrecht.", "Umsatzsteuer auf jede Rate. Vorzeitiges Ende: Aufhebung, Totalschaden, Diebstahl.", "Rückgabe: Protokoll mit Kilometern und Schäden. Full-Service: Wartung, Reifen, Versicherung inklusive.", "Vorteile fürs Autohaus: Provision, kein Ausfallrisiko, Kundenbindung, Werkstattauslastung, Leasingrückläufer für den GW-Handel."]], ["Absicherung", ["Haftpflicht (Pflicht), Teilkasko, Vollkasko. Laufzeit 1 Jahr, Kündigung bis 30.11.", "GAP: Differenz zwischen Ablösewert und Wiederbeschaffungswert. Restschuldversicherung: Tod, Arbeitsunfähigkeit, Arbeitslosigkeit.", "Sicherungsschein: Kaskoleistung geht an Bank oder Leasinggeber.", "Gewährleistung gesetzlich, Garantie freiwillig, Kulanz ohne Anspruch."]]], "FF"], ["LF 1 · Betrieb und Zusammenarbeit", [["Vertriebsstrukturen", ["Direkt: Hersteller verkauft selbst (Niederlassung, Agentur, online). Indirekt: über Vertragshändler im eigenen Namen und auf eigene Rechnung.", "Partner: Hersteller/Importeur, Niederlassung, Vertragshändler, Agent, Servicepartner.", "Vertikal-GVO: EU-Regel, die Hersteller-Händler-Verträge vom Kartellverbot freistellt.", "Selektiv: Händler nach Kriterien ausgewählt. Exklusiv: Gebietsschutz.", "Händlervertrag: Gebiet, Ziele, Standards, Marge und Boni, Laufzeit."]], ["Berufsausbildung", ["Duales System: Betrieb (Ausbildungsrahmenplan) + Berufsschule (Rahmenlehrplan). Grundlage BBiG.", "Vertrag schriftlich vor Beginn, Eintrag bei der IHK. Probezeit 1 bis 4 Monate.", "Ende: Bestehen der Prüfung oder Fristablauf; Kündigung nach der Probezeit nur aus wichtigem Grund oder vom Azubi mit 4 Wochen Frist.", "Jugendarbeitsschutz: 8 Stunden täglich, 40 Stunden pro Woche, Urlaub 30/27/25 Werktage."]], ["Mitbestimmung", ["Grundlage: Betriebsverfassungsgesetz. Betriebsrat ab 5 Wahlberechtigten, Amtszeit 4 Jahre; JAV 2 Jahre.", "Betriebsrat: wählen ab 16, wählbar ab 18 nach 6 Monaten. JAV: wählen unter 18 und alle Azubis; wählbar unter 25 und Azubis.", "Rechte: Information, Anhörung, Mitwirkung, Mitbestimmung (soziale Angelegenheiten).", "Betriebsvereinbarung: Vertrag Arbeitgeber und Betriebsrat. Betriebsversammlung: vierteljährlich, alle Beschäftigten."]], ["Grundlagen des Wirtschaftens", ["Bedürfnis → Bedarf (mit Kaufkraft) → Nachfrage (am Markt).", "Freie Güter kosten nichts, wirtschaftliche Güter sind knapp.", "Maximalprinzip: feste Mittel, größter Erfolg. Minimalprinzip: festes Ziel, kleinster Einsatz.", "Sektoren: Urerzeugung, Verarbeitung, Dienstleistung.", "Einfacher Kreislauf: Haushalte und Unternehmen, Güter- und Geldstrom gegenläufig."]], ["Rechtsformen, Handelsregister, Vollmachten", ["Personengesellschaften: OHG, KG, GmbH & Co. KG. Kapitalgesellschaften: GmbH (25.000 €), AG (50.000 €).", "OHG: alle haften voll. KG: Komplementär voll, Kommanditist mit Einlage. GmbH/AG: nur Gesellschaftsvermögen.", "Handelsregister beim Amtsgericht: A Personenunternehmen, B Kapitalgesellschaften. Deklaratorisch oder konstitutiv.", "Ist-, Kann-, Formkaufmann. Firma = Name des Kaufmanns im Geschäftsverkehr.", "Rangfolge der Vollmachten: Prokura (ppa., ins Register) vor allgemeiner Handlungsvollmacht (i. V.), Art- und Einzelvollmacht."]]], "WiSo"], ["LF 11 · Wirtschaftspolitik", [["Markt und Preis", ["Vollkommener Markt: homogene Güter, keine Präferenzen, Transparenz, schnelle Reaktion.", "Gleichgewichtspreis räumt den Markt. Darüber Angebotsüberhang (Käufermarkt), darunter Nachfrageüberhang.", "Preisfunktionen: Ausgleich, Signal, Lenkung, Auslese.", "Marktformen: Polypol, Oligopol, Monopol. Höchstpreis unter, Mindestpreis über dem Gleichgewicht."]], ["Ordnung und Wettbewerb", ["Soziale Marktwirtschaft: Markt + sozialer Ausgleich + Wettbewerbsschutz.", "Kooperation (Teilbereiche) und Konzentration (Konzern, Fusion); horizontal, vertikal, diagonal.", "Kartelle grundsätzlich verboten; Kartellamt: Kartellverbot, Missbrauchsaufsicht, Fusionskontrolle."]], ["Ziele, BIP, Konjunktur", ["Magisches Viereck: Preisstabilität, Beschäftigung, Außenwirtschaft, Wachstum. Sechseck: + Verteilung, Umwelt.", "BIP = Konsum + Staat + Investitionen + Außenbeitrag; nominal und real; Lohnquote.", "Phasen: Aufschwung, Boom, Abschwung, Tiefstand. Früh-, Präsenz-, Spätindikatoren.", "Antizyklische Fiskalpolitik: im Abschwung ausgeben, im Boom sparen."]], ["Geld und Außenwirtschaft", ["Inflation senkt die Kaufkraft; gemessen am Verbraucherpreisindex (Warenkorb).", "EZB: Preisstabilität; Offenmarkt, Fazilitäten, Mindestreserve; expansiv oder kontraktiv.", "Zahlungsbilanz: Leistungs-, Vermögensänderungs-, Kapitalbilanz. Außenbeitrag = Export − Import.", "Globalisierung: größere Märkte, aber Lohndruck und Abhängigkeit."]]], "WiSo"], ["LF 3 · Teile beschaffen und lagern", [["Rechtliche Grundlagen", ["Rechtsfähig ab Geburt; geschäftsfähig: 0–6 nicht, 7–17 beschränkt, ab 18 voll.", "Anfrage unverbindlich, Angebot bindend, Anpreisung kein Angebot. Freizeichnung: „freibleibend“.", "Kaufvertrag: Antrag + Annahme. Verpflichtung (Vertrag) und Erfüllung (liefern, übereignen, zahlen, abnehmen).", "Nichtig: Geschäftsunfähigkeit, Formmangel, Gesetzes- oder Sittenverstoß, Schein, Scherz. Anfechtbar: Irrtum, Täuschung, Drohung.", "Form: Schriftform, Beglaubigung, notarielle Beurkundung. AGB: vorformuliert, Individualabrede geht vor.", "Besitz = tatsächliche, Eigentum = rechtliche Herrschaft. Eigentumsvorbehalt bis zur vollständigen Zahlung."]], ["Beschaffung", ["Bezugsquellen: Lieferantendatei, Messen, Internet, Fachzeitschriften, Vertreter.", "Quantitativ: Bezugspreis vergleichen. Qualitativ: Kriterien gewichten (Scoring).", "Optimale Bestellmenge: Bestell- + Lagerkosten minimal.", "Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand. Höchstbestand = Mindestbestand + Bestellmenge.", "Bestellpunktverfahren (bei Meldebestand) oder Bestellrhythmus (feste Termine)."]], ["Lager", ["Funktionen: Sicherung, Überbrückung, Spekulation, Umformung, Veredelung.", "Wareneingang: sofort äußere Prüfung, dann unverzüglich Art, Menge, Güte.", "Festplatz oder Freiplatz (chaotisch); FiFo oder LiFo; zentral oder dezentral; Eigen- oder Fremdlager; Just-in-time.", "Kennzahlen: Ø Lagerbestand, Umschlagshäufigkeit, Lagerdauer, Lagerzinssatz. Hoher Umschlag = kurze Lagerdauer = wenig gebundenes Kapital."]], ["Zahlung und Störungen", ["Lastschrift: Empfänger zieht ein. Dauerauftrag: fester Betrag, fester Termin.", "Skonto fast immer nutzen: 2 % für 20 Tage entsprechen etwa 36 % Jahreszins.", "Sachmängel: Beschaffenheit, Falsch-, Minderlieferung, Montage, Anleitung, Werbeaussage. Offen, versteckt, arglistig verschwiegen.", "Erst Nacherfüllung, dann Rücktritt, Minderung, Schadenersatz. Kaufleute rügen unverzüglich.", "Lieferungsverzug: Fälligkeit, Mahnung, Verschulden. Rechte: Lieferung + Verzögerungsschaden; nach Nachfrist Rücktritt oder Schadenersatz statt der Leistung."]]], "T1"], ["LF 4 · Teile und Zubehör verkaufen", [["Sortiment", ["Breit = viele Warengruppen, tief = viel Auswahl je Warengruppe.", "Kernsortiment bringt den Hauptumsatz, Randsortiment ergänzt.", "Regalzonen: Reck-, Sicht- (verkaufsstark), Greif-, Bückzone."]], ["Verkaufsgespräch", ["Phasen: Begrüßung, Bedarfsermittlung, Warendemonstration, Verkaufsargumentation, Abschluss, Verabschiedung.", "Fragen: offen (W-Fragen) zur Bedarfsermittlung, geschlossen zum Abschluss, Alternativ-, Suggestiv-, rhetorische Frage.", "Argumentation: Merkmal → Vorteil → Kundennutzen.", "Ergänzungsverkauf: passenden Zusatzartikel mit Nutzen anbieten.", "Nonverbal: Mimik, Gestik, Haltung, Blickkontakt."]]], "T1"], ["LF 5 · Full-Service-Unfallabwicklung", [["Versicherung", ["Haftpflichtschaden: Verursacher bzw. seine Versicherung zahlt. Kaskoschaden: eigene Versicherung zahlt.", "Haftpflichtansprüche: Reparatur, Gutachter, Wertminderung, Mietwagen oder Nutzungsausfall, Abschleppen, Pauschale.", "Kasko: nur Vertragsleistung abzüglich Selbstbeteiligung. Teilkasko ohne Schadenfreiheitsklasse.", "Beitrag: Schadenfreiheits-, Typ-, Regionalklasse, Fahrleistung, Fahrerkreis, Selbstbeteiligung, Werkstattbindung.", "Gefährdungshaftung: Halter haftet für die Betriebsgefahr."]], ["Abwicklung", ["Ablauf: Schadenaufnahme, RKÜ unterschreiben lassen, Gutachter, Freigabe der Versicherung, Mietwagen, Reparatur, Abrechnung mit der Versicherung.", "RKÜ/Sicherungsabtretung: Kunde tritt Anspruch ab, Autohaus rechnet direkt ab.", "Vorsteuerabzugsberechtigter Kunde: Versicherung zahlt netto, Kunde die Umsatzsteuer.", "Gutachter: bei Haftpflicht wählt der Geschädigte, bei Kasko der Versicherer."]], ["Schadenbegriffe", ["Technischer Totalschaden: nicht reparierbar. Wirtschaftlicher: Reparatur teurer als Wiederbeschaffungswert − Restwert.", "130-%-Regel: Reparatur bis 130 % des Wiederbeschaffungswerts bei fachgerechter Reparatur und Weiternutzung.", "Integritätsinteresse: Interesse, das eigene Fahrzeug zu behalten.", "Merkantile Wertminderung: Minderwert als Unfallwagen. Nutzungsausfall: Tagessatz ohne Mietwagen.", "Totalschaden Haftpflicht: Wiederbeschaffungswert − Restwert."]]], "T1"]]};
const D_EN={"konten": {"0200": "Technical equipment, machinery", "0300": "Operating and office equipment", "0480": "Low-value assets", "1000": "Cash", "1200": "Bank", "1400": "Trade receivables", "1570": "Deductible input VAT", "1600": "Trade payables", "1770": "Output VAT", "2100": "Interest expense", "3000": "New car stock", "3030": "Delivery stock", "3100": "Used car stock (standard taxed)", "3110": "Used car stock (margin taxed)", "3300": "Parts stock", "4400": "Rent, lease", "4410": "Energy costs", "4620": "Depreciation of tangible assets", "4800": "Advertising costs", "7000": "VAK new cars", "7030": "VAK delivery", "7100": "VAK used cars (standard taxed)", "7110": "VAK used cars (margin taxed)", "7300": "VAK parts over the counter", "7310": "VAK parts via workshop", "8000": "Revenue new cars", "8030": "Revenue delivery", "8100": "Revenue used cars (standard taxed)", "8110": "Revenue used cars (margin taxed)", "8111": "Extra revenue margin taxation", "8200": "Revenue registration fee", "8300": "Revenue parts over the counter", "8310": "Revenue parts via workshop", "8410": "Labour revenue", "8420": "Revenue third-party services", "1705": "Loan"}, "buchungen": [["Incoming invoice: spare parts bought on credit for 1.000,00 € net.", "Card 1: purchase."], ["Outgoing invoice: accessories sold over the counter on account for 200,00 € net.", "Card 2: sale."], ["Withdrawal from stock for counter sale: cost price of the accessories 120,00 €.", "Card 3: stock adjustment."], ["The customer transfers the invoice amount of 238,00 €.", "Card 4 b."], ["We transfer a supplier invoice of 1.190,00 € without deduction.", "Card 4 a."], ["We pay the parts invoice of 1.190,00 € with 2 % cash discount by bank. The chart of accounts has no cash discount account.", "Net cash discount reduces the stock, input VAT is corrected."], ["A customer pays a parts invoice (counter) of 2.380,00 € with 2 % cash discount by bank. The chart of accounts has no cash discount account.", "Net cash discount reduces revenue, output VAT is corrected."], ["New car sale on account: vehicle 30.000,00 €, delivery 800,00 €, registration 150,00 € (all net).", "Three revenue accounts plus output VAT."], ["Withdrawal from stock for the new car sale: cost price of the vehicle 26.000,00 €.", "VAK to stock."], ["Withdrawal of the delivery from stock: charged by the manufacturer 600,00 € net.", "VAK to stock."], ["Purchase of a used car from a private person for 10.000,00 € by bank transfer.", "From a private seller: no input VAT deduction, margin-taxed stock."], ["Purchase of a used car from a GmbH for 15.000,00 € net on credit.", "From a business: input VAT, standard-taxed stock."], ["Sale of the used car bought privately for 10.000,00 € to a private customer for 12.380,00 € (§ 25a UStG).", "Difference 2.380 is gross: 380 VAT, 2.000 extra revenue."], ["Withdrawal from stock of the margin-taxed used car (purchase price 10.000,00 €).", "VAK to stock."], ["Workshop invoice to a private customer: labour 300,00 €, parts 200,00 €, third-party service 100,00 € (net).", "Labour, parts via workshop and third-party service booked separately."], ["Bank statement: rent for the showroom area 7.500,00 € debited.", "Expense to bank, no input VAT in this example."], ["Bank statement: overdraft interest 85,00 €.", "Interest expense to bank."], ["Purchase of a vehicle lift for 20.000,00 € net on credit.", "Fixed assets are capitalised."], ["Annual depreciation on the vehicle lift: 2.000,00 €.", "Depreciation to asset account."], ["Cash withdrawal from the bank account for the till: 500,00 €.", "Asset exchange: cash to bank."], ["A loan repayment instalment is debited from the bank account: 2.000,00 €.", "Decrease in assets and liabilities: debts and bank go down."], ["The VAT payable of 3.300,00 € is transferred to the tax office.", "The debt to the tax office is settled."], ["Incoming invoice from the manufacturer: new car 26.000,00 € and delivery 600,00 € (net).", "Card 1 with two stock accounts."]], "karten": [["What are the 4 basic bookings (4 cards)?", "1 Purchase: stock + input VAT to payables. 2 Sale: receivables to revenue + output VAT. 3 Stock adjustment: VAK to stock. 4 Payment: payables to bank or bank to receivables."], ["What does VAK mean and when is it booked?", "„Verrechnete Anschaffungskosten“ = cost of goods sold at cost price. With every sale: VAK to stock (expense booking)."], ["How do you book payment of an incoming invoice with cash discount?", "Payables (full amount) to bank (amount paid), net cash discount (cash discount income or stock account) and input VAT correction."], ["How do you book a customer payment with cash discount?", "Bank (amount paid), net cash discount (cash discount expense or revenue account) and output VAT correction to receivables (full amount)."], ["What is margin taxation (§ 25a UStG, „Differenzbesteuerung“)?", "VAT is only due on the difference between selling and purchase price. Requirement: purchase without input VAT deduction (e.g. from a private seller). VAT = difference × 19/119. No VAT shown on the invoice."], ["How is a margin-taxed used car sale booked?", "1400 receivables to 8110 (purchase price), 8111 extra revenue (net margin), 1770 VAT (from the margin). Then 7110 to 3110."], ["What is the old-part tax („Altteilsteuer“)?", "For exchange parts, the old part counts as part of the payment: 10 % of the exchange part price × 19 % is added to the normal VAT (account 1795)."], ["How do you work back from the amount transferred after cash discount to the invoice amount?", "Invoice amount = amount paid / (1 − discount rate), e.g. / 0,98 for 2 %."], ["How do you get from gross to net and to the VAT included?", "Net = gross / 1,19. VAT = gross × 19 / 119."], ["Name the steps of trade pricing.", "List purchase price − discount = purchase price on credit − cash discount = cash purchase price + delivery costs = landed cost + overheads = cost price + profit = cash selling price + customer cash discount = selling price on credit + customer discount = net list selling price + VAT = gross selling price."], ["When forward, backward or difference pricing?", "Forward: selling price wanted. Backward: selling price given, highest purchase price wanted. Difference: both prices fixed, profit wanted."], ["Markup, pricing factor, trade margin?", "Markup = (net SP − landed cost) / landed cost × 100. Factor = net SP / landed cost. Trade margin = (net SP − landed cost) / net SP × 100."], ["Why are customer cash discount and customer discount calculated „im Hundert“ (on the higher base)?", "Because the customer deducts them from the higher price. The cash selling price is e.g. 98 % of the selling price on credit, so divide by 0,98."], ["What are the three stages of cost accounting (KLR)?", "Cost type accounting (which costs?), cost centre accounting (where? overhead sheet BAB), cost unit accounting (for what? pricing)."], ["Difference between expense and cost?", "Expense: total consumption of value per P&L. Cost: only the operational, period-appropriate, ordinary consumption of value."], ["What are neutral expenses?", "Expenses that are not costs: non-operational (donation), relating to other periods (tax back payment), extraordinary (fire damage)."], ["Basic costs, different costs, additional costs?", "Basic costs: expense = cost. Different costs: expense in a different amount (imputed depreciation, imputed interest, risks). Additional costs: no expense (imputed entrepreneur's salary, imputed rent)."], ["Why an imputed entrepreneur's salary?", "In an e. K., OHG or KG the owner receives no salary. So that his work goes into prices and comparison with a GmbH/AG is fair, a salary is set."], ["Direct costs and overheads with examples?", "Direct costs can be assigned directly: cost price of vehicle/part, productive wages, commission. Overheads only via an allocation key: rent, admin salaries, energy, advertising."], ["What are the tasks of the overhead sheet (BAB)?", "Distribute overheads to cost centres, allocate service cost centres to main cost centres, determine overhead rates, control costs."], ["Which four main cost centres does a dealership have?", "New cars, used cars, parts and accessories, workshop (customer service). Administration is a service cost centre."], ["Difference between main and service cost centres?", "Main cost centres provide services for the market and charge their costs to cost units. Service cost centres work for other centres and are allocated to them."], ["How do you calculate the overhead rate?", "Overheads of the cost centre / direct costs of the cost centre × 100. Workshop: base is productive wages. Trade: VAK."], ["Suitable allocation keys for rent, energy, depreciation, advertising?", "Rent: floor space. Energy: consumption. Depreciation: asset values. Advertising: revenue. Phone: lines. Entrepreneur's salary: time shares."], ["Difference between full cost and partial cost accounting?", "Full cost: all costs to cost units, for long-term prices. Partial cost: only variable costs, fixed costs as a block, for short-term decisions."], ["What is a contribution margin?", "Revenue − variable costs. The amount that contributes to covering fixed costs and then to profit."], ["Variable and fixed costs: two examples each from a dealership?", "Variable: cost of goods, salesperson commission, productive wages. Fixed: rent, admin salaries, depreciation, insurance."], ["Short-term and long-term price floor?", "Short-term: variable unit costs (CM = 0). Long-term: full cost per unit (all costs covered)."], ["Structure of multi-level contribution margin accounting (KER)?", "Revenue − variable costs I = CM 1 (gross profit) − variable costs II (sales-related) = CM 2 − division fixed costs = CM 3 − company fixed costs = operating result."], ["What is the break-even point and how is it calculated?", "Break-even: revenue = total costs. Quantity = fixed costs / (price − variable unit costs)."], ["What is the hourly labour rate?", "Price of one workshop hour for the customer. Covers wages, all workshop overheads, risk and profit."], ["What is the workshop index?", "Target labour revenue / productive wages or hourly rate / average wage. It shows what multiple of wages must be earned."], ["How do you get the hourly rate from an invoice with labour units (AW)?", "Net labour price / AW charged × AW per hour (e.g. 10 or 100 AW per hour)."], ["Productive and unproductive wages?", "Productive: mechanic hours chargeable directly to customer orders. Unproductive: not chargeable, e.g. tidying, training, waiting time, workshop master, stores."], ["Why is the warranty hourly rate lower?", "The manufacturer sets the payment rate and labour times. The business cannot calculate it freely."], ["Equity ratio and what it tells you?", "Equity / total capital × 100. The higher it is, the more independent and creditworthy the company."], ["Liquidity levels 1, 2, 3?", "1: cash / short-term debt. 2: (cash + receivables) / short-term debt. 3: current assets / short-term debt. Each × 100."], ["Return on equity, on total capital, on sales?", "ROE: profit / equity. ROTC: (profit + interest on debt) / total capital. Return on sales: profit / revenue. Each × 100."], ["What does return on sales tell you?", "What percentage of revenue remains as profit, i.e. how many cents of profit per euro of revenue."], ["What does the golden balance sheet rule say?", "Long-term assets should be financed long term. Strict: equity covers fixed assets. Less strict: equity + long-term debt cover them."], ["What is the leverage effect?", "If the return on total capital is above the interest rate on debt, additional debt increases the return on equity."], ["Operating result, neutral result, company result?", "Operating result = output − costs. Neutral result = neutral income − neutral expenses. Together: company result (P&L)."], ["Stock ratios?", "Ø stock = (opening + closing stock) / 2. Turnover rate = cost of goods / Ø stock. Ø storage period = 360 / turnover rate."], ["Horizontal and vertical balance sheet analysis?", "Vertical: structure of one side (e.g. equity ratio, fixed asset intensity). Horizontal: assets to liabilities (fixed asset coverage, liquidity)."], ["What makes up the acquisition cost?", "Net purchase price − price reductions (discount, cash discount) + incidental acquisition costs (freight, installation, registration)."], ["Straight-line depreciation: amount and rate?", "Amount = acquisition cost / useful life. Rate = 100 / useful life. In the first year, pro rata by month."], ["What is a low-value asset (GWG)?", "„Geringwertiges Wirtschaftsgut“: movable, wears out, usable on its own, up to 800 € net. May be written off in full immediately."], ["What can cause a stocktaking difference?", "Theft, shrinkage, breakage, counting errors, booking errors, unrecorded withdrawals."], ["How do you calculate net staffing requirement?", "Target headcount − (current headcount + confirmed arrivals − confirmed departures)."], ["Replacement, new and reduced requirement?", "Replacement: replace leaving employees. New/additional: extra positions. Reduced: positions are cut."], ["Job description and job posting?", "Description: internal document with tasks, authority, position, requirements. Posting: ad to find applicants, also with company profile, start date, benefits, how to apply."], ["Statutory notice periods (§ 622 BGB)?", "Basic period 4 weeks to the 15th or end of month. Probation 2 weeks. Employer: from 2 years 1 month, 5 → 2, 8 → 3, 10 → 4, 12 → 5, 15 → 6, 20 → 7 months to the end of the month."], ["What applies to fixed-term contracts without objective reason?", "At most 2 years, with at most 3 extensions within that, in writing before work starts (TzBfG)."], ["Which employment papers does a leaving employee receive?", "Job reference, income tax certificate, holiday certificate, employment certificate for the employment agency, social security notification."], ["Minimum leave and qualifying period?", "24 working days with a 6-day week (= 20 days with 5 days). Full entitlement after 6 months, before that 1/12 per full month."], ["Home office and mobile working?", "Home office: permanently set up workplace at home. Mobile working: work from any location."], ["Levels of legal capacity to contract?", "0–6 no capacity. 7–17 limited capacity. From 18 full capacity."], ["What does the pocket money rule (§ 110 BGB) say?", "A person with limited capacity concludes a valid contract if they pay with funds given to them for free use."], ["Legal capacity?", "Ability to have rights and obligations. Natural persons from birth, legal persons from registration."], ["Void legal transactions?", "Incapacity, lack of form, violation of law, immorality, sham and joke transactions. Invalid from the start."], ["Voidable legal transactions?", "Mistake, fraudulent deception, unlawful threat. Valid until contested."], ["Possession and ownership?", "Possession: actual control over the item. Ownership: legal control."], ["How does ownership of a movable item pass?", "By agreement and handover. Payment alone is not enough."], ["What applies to general terms and conditions (AGB)?", "Pre-formulated terms that save negotiation effort. Must be incorporated. Individual agreements take precedence. Invalid clauses drop out, the contract remains."], ["Buyer's rights in case of a material defect?", "First supplementary performance (repair or replacement). Then withdrawal, price reduction, damages. Limitation 2 years."], ["Reversal of the burden of proof in consumer sales?", "If the defect appears in the first 12 months, it is presumed to have existed at handover (§ 477 BGB)."], ["May liability for defects be shortened for consumers?", "For new items not below 2 years. For used items to at least 1 year."], ["Duty to inspect and notify in a commercial sale between merchants?", "Inspect goods without delay and report defects without delay. Hidden defects without delay after discovery, within the limitation period."], ["When is a buyer in default of payment?", "With a fixed calendar date when it passes, otherwise by reminder, at the latest 30 days after due date and receipt of invoice."], ["Transfer of ownership by way of security?", "The bank becomes owner, the borrower remains possessor and continues to use the item."], ["Liability and minimum capital of a GmbH?", "Only the company's assets are liable. Share capital at least 25.000 €."], ["Statutory profit distribution in a GmbH?", "In proportion to the shares held."], ["Liability in an OHG?", "All partners have unlimited liability (including private assets), directly and jointly."], ["What may a „Prokurist“ (holder of general commercial power of attorney) not do?", "Sell or encumber land (without special authority), sign the balance sheet, grant „Prokura“, admit partners, sell the company, file for insolvency."], ["What may a holder of „Handlungsvollmacht“ not do without special authority?", "Take out loans, conduct lawsuits, sell or encumber land, enter into bill of exchange liabilities."], ["Sole, joint and branch „Prokura“?", "Sole: may represent alone. Joint: only together with another authorised person. Branch: limited to one branch."], ["Which law governs dual vocational training?", "The Vocational Training Act (BBiG)."], ["Terminating an apprenticeship after probation?", "Apprentice: 4 weeks' notice when giving up or changing occupation. Both: without notice for good cause. In writing with reasons."], ["Breaks and working hours under the Youth Employment Protection Act?", "Max. 8 hours a day, 40 a week, 5-day week. 30 min break for more than 4,5 to 6 hours, 60 min for more than 6 hours."], ["Works council election: when, who votes, who can be elected?", "Every 4 years from 1 March to 31 May. Voting from age 16. Eligible from 18 after 6 months of employment."], ["Youth and apprentice representation (JAV): election and voting rights?", "Every 2 years from 1 October to 30 November. Voters: under 18 and all apprentices. Eligible: under 25 and apprentices."], ["Sequence of a collective bargaining dispute?", "Termination and negotiation, failure, arbitration, failure, strike ballot, strike, new negotiation, ballot on the result, new collective agreement."], ["What does the peace obligation mean?", "During the term of the collective agreement, industrial action over its content is not allowed."], ["Who monitors occupational safety?", "State trade supervisory authority and employers' liability insurance associations (Berufsgenossenschaften)."], ["How long is sick pay continued?", "6 weeks by the employer, then sickness benefit from the health insurance fund."], ["The five branches of social insurance and their providers?", "Health (health insurance funds), long-term care (care funds), pension (Deutsche Rentenversicherung), unemployment (Federal Employment Agency), accident (Berufsgenossenschaften)."], ["Who pays accident insurance and what does it cover?", "Only the employer. Accidents at work, commuting accidents, occupational diseases."], ["What does the contribution assessment ceiling mean?", "Contributions are calculated up to this gross pay. The part above it remains contribution-free."], ["Income-related expenses and special expenses?", "Income-related expenses: costs for the job (travel, work equipment, training). Special expenses: provision expenses, church tax, donations."], ["Conditions of a perfect market?", "Homogeneous goods, no preferences (factual, personal, spatial, temporal), full transparency, immediate reaction, many suppliers and buyers."], ["Functions of the equilibrium price?", "Balancing (market clearing), signalling (scarcity), steering (factors of production), selection (inefficient suppliers)."], ["Excess supply and buyer's market?", "Price above equilibrium: supply greater than demand. Buyers are in the stronger position, prices come under pressure."], ["Excess demand and seller's market?", "Price below equilibrium: demand greater than supply. Sellers are in the stronger position."], ["What happens when demand rises (curve shifts right)?", "Equilibrium price and quantity rise."], ["What happens when supply rises (curve shifts right)?", "The equilibrium price falls, the quantity rises."], ["Consumer and producer surplus?", "Consumer surplus: benefit for buyers who would have paid more. Producer surplus: benefit for suppliers who would have sold for less."], ["Polypoly, supply oligopoly, supply monopoly?", "Many suppliers and many buyers. Few suppliers and many buyers. One supplier and many buyers."], ["Effects of maximum and minimum prices?", "Maximum price (below equilibrium): excess demand, black market. Minimum price (above equilibrium): excess supply, the state must buy up surpluses."], ["Market-conforming and market-contrary interventions?", "Market-conforming: price formation stays free (subsidies, taxes, transfers). Market-contrary: price is prescribed (maximum, minimum, fixed price)."], ["Actors in the extended economic cycle?", "Private households, companies, state, banks (capital collection points), foreign countries."], ["Maximum and minimum principle?", "Maximum: greatest success with given means. Minimum: a given goal with the least use of means."], ["Features of the social market economy?", "Private property with social obligation, free price formation, protection of competition, freedom of contract and trade, free collective bargaining, social security and redistribution."], ["Cooperation and concentration?", "Cooperation: legally independent companies work together in some areas. Concentration: economic independence is lost (group, merger)."], ["Horizontal, vertical, diagonal merger?", "Horizontal: same production/trade level. Vertical: upstream and downstream levels. Diagonal: different industries."], ["Tasks of the Federal Cartel Office?", "Enforce the cartel ban, pursue abuse of dominant market positions, control mergers."], ["The magic square?", "Price stability, high employment, external economic balance, steady and appropriate economic growth (Stability Act 1967)."], ["How are the four goals measured?", "Inflation rate (consumer price index), unemployment rate, net exports, growth of real GDP."], ["What is GDP and how is it calculated by expenditure?", "Value of all goods and services produced in the country in a year. Private consumption + government consumption + gross investment + (exports − imports)."], ["Nominal and real GDP?", "Nominal: at current prices. Real: adjusted for prices, shows actual growth."], ["Wage share?", "Employee compensation / national income × 100. Counterpart: profit share."], ["Why is GDP controversial as a measure of prosperity?", "Unpaid work and the shadow economy are missing, environmental damage and accidents increase it, distribution and quality of life are left open."], ["The four phases of the business cycle?", "Upswing (expansion), boom, downturn (recession), trough (depression)."], ["Leading, coincident and lagging indicators?", "Leading: incoming orders, business climate index, building permits. Coincident: GDP, production, capacity utilisation. Lagging: unemployment rate, prices, wages."], ["Anticyclical fiscal policy?", "The state counteracts the cycle: in a downturn spend more and cut taxes, in a boom save and raise taxes."], ["Main goal and instruments of the ECB?", "Price stability (2 % in the medium term). Open market operations, standing facilities (marginal lending, deposit), minimum reserves."], ["Expansionary and contractionary monetary policy?", "Expansionary: lower interest rates and minimum reserves, buy securities, money supply rises. Contractionary: the opposite, to slow inflation."], ["Inflation and deflation?", "Inflation: persistently rising price level, purchasing power falls. Deflation: persistently falling price level, purchases are postponed, the economy shrinks."], ["What is the shopping basket?", "Selection of typical goods and services of a household. Its price development gives the consumer price index."], ["Structure of the balance of payments?", "Current account (trade, services, primary and secondary income), capital account, financial account."], ["What are net exports?", "Exports minus imports of goods and services. Positive net exports increase GDP and support employment."], ["What is an authorised dealer?", "An independent dealer who sells new vehicles in their own name and for their own account."], ["Direct and indirect sales?", "Direct: the manufacturer sells itself (branch, online, agency). Indirect: via independent dealers."], ["Features of the genuine agency model?", "Sale in the name and for the account of the manufacturer, the manufacturer sets the price and bears stock and sales risk, the dealership receives commission."], ["Advantages of the agency model for the dealership?", "No capital tied up in vehicle stock, no sales or residual value risk, no discount competition, predictable commission."], ["Multi-level distribution system?", "The manufacturer delivers to an importer or main dealer, who delivers to sub-dealers, who then sell to the customer."], ["Who represents the interests of dealerships?", "The ZDK (Central Association of the German Motor Trade) and the brand dealer associations."], ["What is a re-import?", "A vehicle produced for another EU market that is imported into Germany. Usually cheaper, equipment may differ."], ["Pre-registration (Tageszulassung): advantage and disadvantage for the dealership?", "Advantage: reach registration targets and bonuses. Disadvantage: sale at a high discount, costs of registration."], ["What does the dealer margin consist of?", "Base margin (base discount), performance-related margin and bonuses (volume, customer satisfaction CSI, corporate design, standards)."], ["Gross profit and gross surplus on new cars?", "Gross profit = margin − revenue reductions (discount, extras, overpayment on trade-in). Gross surplus = gross profit − salesperson commission."], ["Which documents does the customer receive at handover?", "Registration certificate part I (and II), CoC, owner's manual, service book, warranty documents, invoice, handover record."], ["What do you need for registration?", "ID, eVB number (insurance confirmation), registration certificate II, CoC, SEPA mandate for vehicle tax. Companies also trade registration or commercial register extract."], ["Sources of used cars?", "Trade-ins, lease returns, free purchase, dealer colleagues, auctions, company and rental cars, online marketplaces."], ["Examples of holding costs?", "Interest on tied-up capital, loss in value, space costs, care and reconditioning, insurance."], ["Causes of excessively long holding times?", "Price too high, stock not in line with the market, poor reconditioning or presentation, weak ads, technical defects."], ["How do you calculate the capital requirement in the used car business?", "Units per year × Ø purchase price × (days in stock + days until payment) / 360."], ["Advantages of buying a used car from a dealership compared to a private sale?", "Liability for defects, inspected vehicle, warranty, financing, trade-in, service."], ["How is a new car purchase contract concluded?", "The binding order is the offer. The contract is formed by written acceptance or delivery within 3 weeks (commercial vehicles 6 weeks, stock vehicles 10 days)."], ["When is the purchase price due?", "On handover of the vehicle and delivery of the invoice."], ["Binding and non-binding delivery date?", "Binding: default immediately when exceeded. Non-binding: the buyer can demand delivery 6 weeks later, then default."], ["Retention of title and registration certificate II?", "The vehicle remains the seller's property until full payment. Until then, the seller may keep registration certificate part II."], ["Liability for defects and guarantee?", "Liability for defects: statutory, seller, defect at handover, 2 years. Guarantee: voluntary, manufacturer or guarantor, function during the term."], ["The three options of three-way financing?", "Pay the final instalment, refinance the final instalment or return the vehicle."], ["Calculation scheme for financing?", "Price − down payment − trade-in = remaining amount + insurance = net loan + interest = total loan − final instalment = sum of instalments / term = monthly instalment."], ["Securities in car financing?", "Transfer of ownership by way of security (registration certificate II at the bank), salary assignment, guarantee, payment protection insurance, comprehensive cover, down payment."], ["What is in the SECCI form?", "Lender, type of credit, net loan amount, term, borrowing rate, effective annual rate, total amount, instalments, securities, right of withdrawal, early repayment."], ["Negative entries at SCHUFA (credit agency)?", "Terminated loan, payment order or enforcement, statement of assets, personal insolvency."], ["What applies to cash payments from 10.000 €?", "Money Laundering Act: identify the customer, document the transaction, report if suspicious."], ["Who is the owner in leasing and who puts it on the balance sheet?", "The lessor is the owner and capitalises it. The lessee is the possessor and books the instalments as an expense."], ["Mileage and residual value leasing?", "Mileage lease: settlement by kilometres driven, residual value risk with the lessor. Residual value lease: the lessee bears the residual value risk."], ["Which insurances are compulsory in leasing?", "Motor third-party liability and comprehensive cover."], ["What does motor third-party liability cover?", "Personal injury, property damage and financial loss caused to third parties."], ["What does partial cover (Teilkasko) cover?", "Fire, explosion, theft, storm, hail, lightning, flood, glass breakage, collision with game, marten bites, short circuit."], ["What does comprehensive cover (Vollkasko) cover in addition?", "Self-inflicted accident damage to your own vehicle and vandalism."], ["Why are there no no-claims classes in partial cover?", "The insured damage does not depend on the insured person's driving behaviour."], ["Economic total loss?", "The repair costs exceed the replacement value minus the residual value."], ["What does GAP insurance cover?", "In the event of total loss or theft, it covers the gap between the replacement value and the outstanding balance or lease settlement."], ["Advantages of warranty insurance for the dealership?", "Customer loyalty, workshop utilisation, commission, sales argument, lower goodwill costs."], ["When is an expenditure not (yet) an expense?", "When the consumption of value only occurs later: purchase of goods for stock or of a fixed asset. The expense only arises on sale/use or through depreciation."], ["How do you calculate imputed interest?", "Operationally necessary capital × imputed interest rate. Applied to all operationally necessary capital, including equity."], ["Examples of imputed risks?", "Bad debts, warranty and goodwill, shrinkage and theft in stores, loss in value of used cars. General entrepreneurial risk is not included; it is covered by profit."], ["What is fixed cost degression?", "As quantity increases, fixed costs are spread over more units. Fixed unit costs and thus total unit costs fall."], ["How do fixed and variable costs look in a diagram?", "Total fixed costs: horizontal line. Total variable costs: rising straight line from the origin. Total costs: rising line starting at fixed costs. Where the revenue line intersects it is the break-even point."], ["Should a product making a loss on a full-cost basis be dropped?", "Only if its contribution margin is negative. With a positive contribution margin it helps cover fixed costs. If it were dropped, the operating result would be worse."], ["Time, company and industry comparison?", "Time comparison: own figures from different periods. Company comparison: with other businesses. Industry comparison: with the industry average."], ["Debt ratio and fixed asset coverage II?", "Debt ratio =
