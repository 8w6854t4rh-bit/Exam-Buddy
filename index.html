 den Händler."], ["FF", "Leasing", "Leasing und Miete: drei Unterschiede?", "Leasing hat eine feste, längere Laufzeit ohne ordentliche Kündigung; der Leasingnehmer trägt Wartung, Versicherung und das Risiko von Untergang und Beschädigung; das Fahrzeug wird für ihn angeschafft."], ["FF", "Leasing", "Was ist erlasskonformes Leasing?", "Die Grundmietzeit liegt zwischen 40 % und 90 % der betriebsgewöhnlichen Nutzungsdauer. Dann wird das Fahrzeug steuerlich dem Leasinggeber zugerechnet und die Raten sind beim Leasingnehmer Betriebsausgaben."], ["FF", "Leasing", "Was ist das Andienungsrecht?", "Der Leasinggeber kann den Leasingnehmer am Vertragsende verpflichten, das Fahrzeug zum vereinbarten Restwert zu kaufen. Der Leasingnehmer selbst hat kein Recht auf den Kauf."], ["FF", "Leasing", "Voll- und Teilamortisation?", "Vollamortisation: Die Raten decken Anschaffungskosten, Zinsen und Gewinn des Leasinggebers komplett. Teilamortisation: Es bleibt ein Restwert offen, der am Ende gedeckt werden muss."], ["FF", "Leasing", "Welche Rolle spielt die Umsatzsteuer beim Leasing?", "Sie fällt auf jede Rate und die Sonderzahlung an, nicht auf einmal auf den Kaufpreis. Das schont die Liquidität; Unternehmer ziehen sie als Vorsteuer ab."], ["FF", "Leasing", "Warum bieten Autohäuser fast nur Kilometerleasing an?", "Der Kunde hat kein Restwertrisiko und klare Kosten. Abgerechnet werden nur Mehr- und Minderkilometer sowie Schäden über den normalen Verschleiß hinaus."], ["FF", "Leasing", "Was steht im Rückgabeprotokoll?", "Kilometerstand, Schäden außen und innen, Reifenzustand, Vollständigkeit von Zubehör, Schlüsseln und Papieren, Serviceheft, Unterschriften."], ["FF", "Leasing", "Was umfasst Full-Service-Leasing?", "Neben der Nutzung auch Wartung und Verschleißreparaturen, Reifen, oft Versicherung, Steuer und Ersatzwagen. Vorteil: feste, planbare Monatskosten."], ["FF", "Versicherung", "Laufzeit und Kündigung der Kfz-Versicherung?", "Ein Jahr, meist bis 31.12., Kündigung bis 30.11. Sonderkündigung bei Beitragserhöhung, nach einem Schaden und beim Fahrzeugwechsel."], ["FF", "Versicherung", "Was senkt den Kfz-Versicherungsbeitrag?", "Hohe Schadenfreiheitsklasse, günstige Typ- und Regionalklasse, wenig Kilometer, Garage, eingeschränkter Fahrerkreis, Selbstbeteiligung, Werkstattbindung."], ["FF", "Versicherung", "Was ist der Rabattschutz?", "Gegen Mehrbeitrag bleibt die Schadenfreiheitsklasse nach einem Schaden pro Jahr erhalten."], ["FF", "Versicherung", "Was bedeutet der Sicherungsschein?", "Die Kaskoleistung wird im Schadenfall an den Leasinggeber oder die Bank gezahlt, weil ihnen das Fahrzeug gehört bzw. sicherungsübereignet ist."], ["FF", "Versicherung", "Garantie, Gewährleistung, Kulanz?", "Gewährleistung (Sachmängelhaftung): gesetzliche Pflicht des Verkäufers. Garantie: freiwilliges Versprechen. Kulanz: freiwilliges Entgegenkommen ohne Rechtsanspruch, meist nach Ablauf der Fristen."], ["KUP", "Personal", "Quantitativer und qualitativer Personalbedarf?", "Quantitativ: wie viele Mitarbeiter gebraucht werden. Qualitativ: welche Qualifikationen sie haben müssen."], ["KUP", "Personal", "Interne und externe Personalbeschaffung: Vor- und Nachteile?", "Intern: schnell, günstig, motivierend, Bewerber bekannt; aber Betriebsblindheit, die alte Stelle wird frei, Neid. Extern: große Auswahl, neue Ideen; aber teurer, längere Einarbeitung, Risiko der Fehlbesetzung."], ["KUP", "Personal", "Ablauf der Personalbeschaffung?", "Bedarf feststellen, Stellenbeschreibung und Ausschreibung, Bewerbungen sichten, Vorstellungsgespräche, Auswahl mit Beteiligung des Betriebsrats, Arbeitsvertrag, Einarbeitung."], ["KUP", "Personal", "Wesentliche Inhalte eines Arbeitsvertrags?", "Vertragsparteien, Beginn (und Befristung), Arbeitsort, Tätigkeit, Entgelt, Arbeitszeit, Urlaub, Probezeit, Kündigungsfristen, Hinweis auf Tarifvertrag und Betriebsvereinbarungen."], ["KUP", "Personal", "Rechte und Pflichten des Arbeitnehmers?", "Rechte: Vergütung, Urlaub, Fürsorge, Zeugnis, Entgeltfortzahlung. Pflichten: Arbeitsleistung, Weisungen befolgen, Verschwiegenheit, Treue und Wettbewerbsverbot."], ["KUP", "Personal", "Einfaches und qualifiziertes Arbeitszeugnis?", "Einfach: Art und Dauer der Tätigkeit. Qualifiziert: zusätzlich Leistung und Verhalten. Es muss wahr und wohlwollend sein; bei Fehlern kann Berichtigung verlangt werden, notfalls vor dem Arbeitsgericht."], ["KUP", "Personal", "Wichtige Regeln des Arbeitszeitgesetzes?", "Werktäglich 8 Stunden, bis 10 Stunden mit Ausgleich; Pause 30 Minuten bei mehr als 6 Stunden, 45 Minuten bei mehr als 9 Stunden; 11 Stunden Ruhezeit."], ["KUP", "Personal", "Mutterschutz: Fristen?", "Schutzfrist 6 Wochen vor und 8 Wochen nach der Geburt (12 Wochen bei Früh- und Mehrlingsgeburten). Kündigungsverbot ab Beginn der Schwangerschaft bis 4 Monate nach der Entbindung."], ["KUP", "Personal", "Geldwerter Vorteil beim Firmenwagen (1-%-Methode)?", "Monatlich 1 % des Bruttolistenpreises plus 0,03 % je Entfernungskilometer zur Arbeit. Der Betrag erhöht das steuer- und sozialversicherungspflichtige Brutto und wird vom Netto wieder abgezogen."], ["KUP", "Personal", "Wer erhält welche Zahlung aus der Gehaltsabrechnung?", "Arbeitnehmer: Auszahlungsbetrag. Finanzamt: Lohnsteuer, Soli, Kirchensteuer. Krankenkasse: alle Sozialversicherungsbeiträge (Einzugsstelle). Bank oder Bausparkasse: vermögenswirksame Leistungen."], ["KUP", "Personal", "Personalkosten des Arbeitgebers?", "Bruttoentgelt + Arbeitgeberanteile zur Sozialversicherung + Beitrag zur Unfallversicherung + freiwillige Leistungen."], ["KUP", "Personal", "Ordentliche und außerordentliche Kündigung, Aufhebungsvertrag?", "Ordentlich: mit Frist. Außerordentlich: fristlos aus wichtigem Grund, innerhalb von 2 Wochen ab Kenntnis. Aufhebungsvertrag: einvernehmlich, ohne Frist, schriftlich."], ["KUP", "Personal", "Personen-, verhaltens- und betriebsbedingte Kündigung?", "Personenbedingt: Grund in der Person (lange Krankheit, Verlust der Fahrerlaubnis). Verhaltensbedingt: Pflichtverletzung, vorher Abmahnung. Betriebsbedingt: Arbeitsplatz fällt weg, Sozialauswahl nötig."], ["KUP", "Personal", "Kriterien der Sozialauswahl?", "Dauer der Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten, Schwerbehinderung."], ["KUP", "Personal", "Funktion der Abmahnung?", "Sie rügt ein konkretes Fehlverhalten, fordert zur Änderung auf und droht für den Wiederholungsfall die Kündigung an. Zum Beweis schriftlich."], ["KUP", "Personal", "Mit welcher Frist kündigt der Arbeitnehmer?", "Immer mit der Grundfrist von 4 Wochen zum 15. oder zum Monatsende, wenn Vertrag oder Tarif nichts anderes regeln. Die verlängerten Fristen gelten nur für den Arbeitgeber."], ["KUP", "Personal", "Rolle des Betriebsrats bei Kündigungen?", "Er muss vor jeder Kündigung angehört werden, sonst ist sie unwirksam. Er kann innerhalb einer Woche widersprechen (bei fristloser Kündigung 3 Tage)."], ["WiSo", "Arbeit", "Mantel- und Entgelttarifvertrag?", "Manteltarif: langfristige Arbeitsbedingungen (Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge). Entgelttarif: Höhe der Löhne und Ausbildungsvergütungen, kurze Laufzeit, weil sie regelmäßig an Preise und Konjunktur angepasst werden."], ["WiSo", "Arbeit", "Was heißt Allgemeinverbindlichkeit?", "Das Arbeitsministerium erklärt einen Tarifvertrag für alle Arbeitgeber und Arbeitnehmer der Branche für gültig, auch für nicht tarifgebundene."], ["WiSo", "Arbeit", "Streik, Aussperrung, Schlichtung?", "Streik: Arbeitsniederlegung der Arbeitnehmer. Aussperrung: Arbeitgeber verweigern Arbeit und Lohn. Schlichtung: Ein neutraler Schlichter macht einen Einigungsvorschlag."], ["WiSo", "Soziales", "Welche Risiken deckt die Sozialversicherung nicht und was hilft?", "Berufsunfähigkeit, Haftung für Schäden bei anderen, Unfälle in der Freizeit, Versorgungslücke im Alter. Abhilfe: Berufsunfähigkeits-, private Haftpflicht-, private Unfallversicherung, private Altersvorsorge."], ["WiSo", "Soziales", "Formen der privaten Altersvorsorge und ihre Förderung?", "Riester-Rente (Zulagen und Sonderausgabenabzug), betriebliche Altersversorgung (steuer- und beitragsfreie Entgeltumwandlung), Basisrente/Rürup (Sonderausgabenabzug)."], ["WiSo", "Soziales", "Die sieben Einkunftsarten?", "Land- und Forstwirtschaft, Gewerbebetrieb, selbstständige Arbeit, nichtselbstständige Arbeit, Kapitalvermögen, Vermietung und Verpachtung, sonstige Einkünfte."], ["WiSo", "Soziales", "Wie berechnet man das zu versteuernde Einkommen?", "Einnahmen − Werbungskosten (mindestens Pauschbetrag 1.230 €) = Einkünfte − Sonderausgaben − außergewöhnliche Belastungen = zu versteuerndes Einkommen. Erstattung = einbehaltene Lohnsteuer − festgesetzte Steuer."], ["KUP", "Inventur und Bilanz", "Inventur und Inventar?", "Inventur: die Tätigkeit, also das Zählen, Messen, Wiegen und Bewerten aller Vermögensteile und Schulden. Inventar: das Ergebnis, ein ausführliches Verzeichnis nach Art, Menge und Wert."], ["KUP", "Inventur und Bilanz", "Körperliche Inventur und Buchinventur?", "Körperlich: Bestände werden tatsächlich gezählt, gemessen oder gewogen (Fahrzeuge, Teile). Buchinventur: nicht greifbare Werte werden anhand von Belegen und Büchern ermittelt (Forderungen, Bankguthaben, Schulden)."], ["KUP", "Inventur und Bilanz", "Welche Inventurverfahren gibt es?", "Stichtagsinventur: innerhalb von 10 Tagen um den Bilanzstichtag. Verlegte Inventur: bis 3 Monate vorher oder 2 Monate danach, mit Fortschreibung oder Rückrechnung. Permanente Inventur: laufende Bestandsführung, jeder Artikel wird einmal im Jahr gezählt."], ["KUP", "Inventur und Bilanz", "Wann ist eine Inventur vorgeschrieben?", "Bei Gründung oder Übernahme, am Ende jedes Geschäftsjahres und bei Auflösung oder Verkauf des Unternehmens."], ["KUP", "Inventur und Bilanz", "Was besagt das Niederstwertprinzip?", "Von Anschaffungskosten und aktuellem Wert am Stichtag wird der niedrigere angesetzt. Beispiel: Ein Teil wurde für 100 € gekauft und ist nur noch 80 € wert, bilanziert werden 80 €. Nicht realisierte Gewinne dürfen nicht ausgewiesen werden."], ["KUP", "Inventur und Bilanz", "Wie ist das Inventar gegliedert?", "A Vermögen: Anlagevermögen, dann Umlaufvermögen, geordnet nach steigender Flüssigkeit. B Schulden: langfristige, dann kurzfristige, geordnet nach Fälligkeit. C Reinvermögen (Eigenkapital) = Vermögen − Schulden."], ["KUP", "Inventur und Bilanz", "Zusammenhang von Inventur, Inventar und Bilanz?", "Die Inventur liefert die Daten, das Inventar listet sie ausführlich auf, die Bilanz fasst sie in Kontoform kurz zusammen: Aktiva (Vermögen) und Passiva (Kapital)."], ["KUP", "Inventur und Bilanz", "Wie ist die Bilanz aufgebaut und warum sind beide Seiten gleich?", "Aktiva: Anlagevermögen, Umlaufvermögen (Mittelverwendung). Passiva: Eigenkapital, Fremdkapital (Mittelherkunft). Beide Seiten zeigen dasselbe Kapital aus zwei Blickwinkeln, das Eigenkapital gleicht als Restgröße aus."], ["KUP", "Inventur und Bilanz", "Die vier Bilanzveränderungen?", "Aktivtausch: nur Aktivkonten, Summe bleibt (Barabhebung). Passivtausch: nur Passivkonten, Summe bleibt (Verbindlichkeit wird Darlehen). Aktiv-Passiv-Mehrung: beide Seiten steigen (Kauf auf Ziel). Aktiv-Passiv-Minderung: beide sinken (Rechnung per Bank bezahlt)."], ["KUP", "Inventur und Bilanz", "Fremdkapitalquote?", "Fremdkapital / Gesamtkapital × 100. Je höher, desto abhängiger ist das Unternehmen von Gläubigern. Eigen- und Fremdkapitalquote ergeben zusammen 100 %."], ["KUP", "Konten und Abschluss", "Wie bucht man auf aktiven und passiven Bestandskonten?", "Aktivkonto: Anfangsbestand und Zugänge im Soll, Abgänge und Schlussbestand im Haben. Passivkonto genau umgekehrt: Anfangsbestand und Zugänge im Haben."], ["KUP", "Konten und Abschluss", "Grundbuch und Hauptbuch?", "Grundbuch (Journal): alle Buchungssätze in zeitlicher Reihenfolge. Hauptbuch: dieselben Buchungen sachlich geordnet auf den Konten (T-Konten)."], ["KUP", "Konten und Abschluss", "Bestandskonten und Erfolgskonten?", "Bestandskonten zeigen Vermögen und Schulden und werden über das Schlussbilanzkonto abgeschlossen. Erfolgskonten (Aufwand und Ertrag) verändern das Eigenkapital und werden über das GuV-Konto abgeschlossen."], ["KUP", "Konten und Abschluss", "Erfolgsneutral und erfolgswirksam?", "Erfolgsneutral: Nur Bestandskonten sind betroffen, das Eigenkapital bleibt gleich (Kauf auf Ziel). Erfolgswirksam: Ein Aufwands- oder Ertragskonto ist beteiligt, das Eigenkapital ändert sich (Miete, Verkauf)."], ["KUP", "Konten und Abschluss", "Warum gibt es die VAK-Buchung?", "Beim Verkauf wird der Erlös gebucht. Die VAK-Buchung stellt den Wareneinsatz zum Einstandspreis als Aufwand dagegen und mindert den Bestand. Erst Erlös minus VAK zeigt den Bruttoertrag."], ["KUP", "Konten und Abschluss", "Wie laufen die Erfolgskonten in den Abschluss?", "Betriebliche Aufwendungen und Erträge ergeben das Betriebsergebnis, neutrale das neutrale Ergebnis. Beide fließen ins GuV-Konto. Dessen Saldo (Gewinn oder Verlust) geht auf das Eigenkapital."], ["KUP", "Konten und Abschluss", "Wie prüft man einen Buchungssatz?", "Summe Soll = Summe Haben; mindestens ein Konto im Soll und eines im Haben; Zugang oder Abgang auf der richtigen Seite; passt die Buchung zum Beleg? Reihenfolge: erst Soll, dann Haben."], ["KUP", "Umsatzsteuer", "Welche Umsatzsteuersätze gibt es?", "Regelsatz 19 %. Ermäßigt 7 % für Güter des Grundbedarfs wie Lebensmittel, Bücher, Zeitungen und Nahverkehr. Steuerfrei sind z. B. Versicherungen, Bankzinsen, Mieten für Wohnraum, Briefporto."], ["KUP", "Umsatzsteuer", "Warum heißt die Umsatzsteuer auch Mehrwertsteuer?", "Besteuert wird auf jeder Stufe nur der Mehrwert, also die Differenz zwischen Verkaufs- und Einkaufspreis. Bemessungsgrundlage ist das Nettoentgelt. Getragen wird sie vom Endverbraucher."], ["KUP", "Umsatzsteuer", "Warum ist die Umsatzsteuer für das Unternehmen ein durchlaufender Posten?", "Es nimmt die Umsatzsteuer vom Kunden ein, zieht die gezahlte Vorsteuer ab und führt nur die Differenz an das Finanzamt ab. Sie ist weder Aufwand noch Ertrag und ändert den Gewinn nicht."], ["KUP", "Umsatzsteuer", "Vorsteuer, Umsatzsteuer, Zahllast?", "Vorsteuer: Steuer auf Eingangsrechnungen, Forderung an das Finanzamt. Umsatzsteuer: Steuer auf Ausgangsrechnungen, Schuld an das Finanzamt. Zahllast = Umsatzsteuer − Vorsteuer. Ist die Vorsteuer höher, entsteht ein Vorsteuerüberhang (Erstattung)."], ["KUP", "Umsatzsteuer", "Wie werden die Steuerkonten abgeschlossen?", "Das Konto Vorsteuer wird über das Konto Umsatzsteuer abgeschlossen (1770 an 1570). Die Zahllast wird überwiesen (1770 an 1200), am Jahresende als Verbindlichkeit in die Schlussbilanz übernommen."], ["KUP", "Umsatzsteuer", "Was ist die Umsatzsteuer-Voranmeldung?", "Die regelmäßige Meldung der Zahllast an das Finanzamt, in der Regel monatlich oder vierteljährlich, elektronisch bis zum 10. Tag nach Ablauf des Zeitraums."], ["FF", "Neuwagen", "Was zeigt die Portfolio-Analyse?", "Sie ordnet Modelle nach Marktwachstum und relativem Marktanteil: Fragezeichen (hohes Wachstum, kleiner Anteil), Stars (beides hoch), Cashcows (wenig Wachstum, hoher Anteil, bringen Geld), arme Hunde (beides niedrig)."], ["FF", "Neuwagen", "Welche Strategie passt zu welchem Portfolio-Feld?", "Fragezeichen: investieren oder aufgeben. Stars: investieren und ausbauen. Cashcows: Gewinne abschöpfen. Arme Hunde: auslaufen lassen."], ["FF", "Neuwagen", "Marktpotenzial, Marktvolumen, Marktanteil?", "Marktpotenzial: maximal mögliche Absatzmenge im Markt. Marktvolumen: tatsächlicher Absatz aller Anbieter. Marktanteil: eigener Absatz in Prozent des Marktvolumens."], ["FF", "Neuwagen", "Wie plant man die Verkaufszahl für das nächste Jahr?", "Erwartetes Marktvolumen im Marktgebiet × angestrebter Marktanteil = Planabsatz. Abgeglichen wird mit Vorjahreszahlen, Modellneuheiten und den Vorgaben des Herstellers."], ["FF", "Neuwagen", "Einfacher und realer Kapitalbedarf im Neuwagengeschäft?", "Einfach: Absatz × Einstandspreis × Standtage / 360. Real: Die Kapitalbindung verlängert sich um das Zahlungsziel an Kunden und verkürzt sich um das Zahlungsziel des Herstellers und um Anzahlungen."], ["FF", "Neuwagen", "Ablauf einer Neuwagenbestellung bis zur Auftragsbestätigung?", "Bedarfsermittlung und Beratung, Probefahrt, Konfiguration und Angebot, verbindliche Bestellung des Kunden, Prüfung von Bonität und Lieferbarkeit, Bestellung beim Hersteller, schriftliche Auftragsbestätigung innerhalb der Bindefrist."], ["FF", "Neuwagen", "Woraus besteht ein Verkäufergehalt?", "Fixum (Grundgehalt), Provision, Prämien und Boni (z. B. für Finanzierungen, Zielerreichung), dazu oft ein Dienstwagen als geldwerter Vorteil."], ["FF", "Neuwagen", "Umsatzprovision und Bruttoertragsprovision?", "Umsatzprovision: Prozentsatz vom Nettoverkaufspreis; verleitet zu hohen Nachlässen. Bruttoertragsprovision: Prozentsatz vom Bruttoertrag; der Verkäufer verdient mehr, wenn er wenig Nachlass gibt."], ["FF", "Neuwagen", "Warum ist die fristgemäße schriftliche Auftragsbestätigung wichtig?", "Erst sie nimmt die Bestellung des Kunden an und lässt den Kaufvertrag entstehen. Kommt sie nach Ablauf der Bindefrist, ist der Kunde nicht mehr gebunden; sie gilt dann als neues Angebot."], ["FF", "Neuwagen", "Pflichtangaben einer Neuwagen-Ausgangsrechnung?", "Name und Anschrift von Autohaus und Kunde, Steuernummer oder USt-IdNr., Rechnungsnummer und -datum, Lieferdatum, genaue Bezeichnung des Fahrzeugs mit Fahrgestellnummer, Nettobetrag, Steuersatz, Steuerbetrag, Bruttobetrag."], ["FF", "Neuwagen", "Warum fällt auf Zulassungsgebühren keine Umsatzsteuer an?", "Die amtliche Gebühr zahlt das Autohaus im Namen und für Rechnung des Kunden an die Behörde. Sie ist ein durchlaufender Posten. Die eigene Zulassungspauschale für den Service ist dagegen umsatzsteuerpflichtig."], ["FF", "Neuwagen", "Was ist ein interner Auftrag?", "Eine Leistung der Werkstatt für eine andere Abteilung des eigenen Hauses, z. B. Übergabeinspektion eines Neuwagens oder Aufbereitung eines GW. Sie wird intern ohne Umsatzsteuer verrechnet und belastet die empfangende Abteilung."], ["FF", "Neuwagen", "Wie bucht man den Einkauf eines Neuwagens mit Überführung?", "3000 Bestand Neuwagen + 3030 Bestand Überführung + 1570 Vorsteuer an 1600 Verbindlichkeiten."], ["FF", "Neuwagen", "Wann dürfen AGB vom Gesetz abweichen?", "Nur dort, wo das Gesetz nicht zwingend ist, und nur ohne unangemessene Benachteiligung des Kunden. Gegenüber Verbrauchern sind die Schutzvorschriften (z. B. 2 Jahre Sachmängelhaftung bei Neuware) nicht abdingbar; unter Kaufleuten ist mehr möglich."], ["FF", "Neuwagen", "Gewährleistungsfristen bei Neu- und Gebrauchtwagen?", "Neuwagen: 2 Jahre. Gebrauchtwagen an Verbraucher: Verkürzung auf 1 Jahr möglich. Gebrauchtwagen unter Unternehmern: Ausschluss möglich. Privat an privat: Ausschluss möglich, außer bei Arglist."], ["KUP", "Kennzahlen", "Wie lässt sich die Umsatzrentabilität verbessern?", "Kosten senken oder Erträge je Verkauf erhöhen (bessere Margen, mehr Service- und Teilegeschäft). Mehr Umsatz allein hilft nur, wenn auch der Gewinn mitwächst."]], "quiz": [["WiSo", "Ein 15-Jähriger kauft ohne Wissen der Eltern von seinem Taschengeld ein Spiel für 30 €. Der Vertrag ist …", ["nichtig, weil er minderjährig ist", "schwebend unwirksam bis zur Genehmigung", "wirksam, weil er mit eigenen Mitteln zahlt", "anfechtbar durch den Händler"], 2, "§ 110 BGB: mit frei überlassenen Mitteln bewirkt."], ["WiSo", "Eine Kundin hat ein Fahrrad bezahlt, holt es aber erst in drei Tagen ab. Bis dahin ist …", ["sie Eigentümerin und Besitzerin", "sie Eigentümerin, der Händler Besitzer", "der Händler Eigentümer und Besitzer", "der Händler Eigentümer, sie Besitzerin"], 2, "Eigentum geht erst mit Einigung und Übergabe über."], ["WiSo", "Welche Aussage zu AGB trifft zu?", ["AGB haben Vorrang vor individuellen Abreden", "Eine unwirksame Klausel macht den ganzen Vertrag nichtig", "AGB sparen Verhandlungsaufwand", "Kaufleute müssen fremde AGB immer akzeptieren"], 2, "Rationalisierungseffekt. Individuelle Abreden gehen vor."], ["WiSo", "  ["Krankenversicherung", "Unfallversicherung (Berufsgenossenschaft)", "Rentenversicherung", "Haftpflicht des Arbeitgebers"], 1, "Wegeunfall = gesetzliche Unfallversicherung."], ["WiSo", "Das Gehalt übersteigt die Beitragsbemessungsgrenze der Rentenversicherung. Folge:", ["Die Versicherungspflicht endet", "Für den übersteigenden Teil fällt kein Beitrag an", "Der Beitragssatz steigt", "Der Arbeitgeber zahlt allein"], 1, "Beiträge nur bis zur Grenze."], ["WiSo", "Ein Lohnsteuer-Freibetrag von 150 € im Monat bewirkt, dass …", ["150 € weniger Lohnsteuer anfallen", "die Lohnsteuer von einem um 150 € geringeren Betrag berechnet wird", "das Bruttogehalt um 150 € steigt", "keine Sozialabgaben auf 150 € anfallen"], 1, "Der Freibetrag mindert die Bemessungsgrundlage."], ["WiSo", "Was zählt zu den Werbungskosten?", ["Kirchensteuer", "Beiträge zur Rentenversicherung", "Fahrten zwischen Wohnung und Arbeitsstätte", "Spenden"], 2, "Die anderen sind Sonderausgaben."], ["WiSo", "Auf einem vollkommenen Markt sinkt der Preis, wenn …", ["die Nachfrage steigt, das Angebot bleibt", "das Angebot steigt, die Nachfrage bleibt", "das Angebot sinkt", "Nachfrage stärker steigt als das Angebot"], 1, "Mehr Angebot bei gleicher Nachfrage drückt den Preis."], ["WiSo", "Der Marktpreis liegt über dem Gleichgewichtspreis. Es entsteht ein …", ["Nachfrageüberhang", "Angebotsüberhang", "Verkäufermarkt", "Marktgleichgewicht"], 1, "Zu diesem Preis wird mehr angeboten als nachgefragt."], ["WiSo", "Wenige Anbieter, viele Nachfrager: Welche Marktform?", ["Polypol", "Angebotsoligopol", "Angebotsmonopol", "Nachfrageoligopol"], 1, "Typisch: Autohersteller."], ["WiSo", "Welches Merkmal passt zur sozialen Marktwirtschaft?", ["staatliche Produktionsplanung", "Tarifautonomie", "staatliche Preisfestsetzung für alle Güter", "Verbot von Privateigentum an Unternehmen"], 1, "Löhne handeln die Tarifparteien aus."], ["WiSo", "Was gehört nicht zum magischen Viereck?", ["Preisniveaustabilität", "hoher Beschäftigungsstand", " Sturm, Hagel. Vollkasko: zusätzlich selbst verschuldeter Unfall und Vandalismus", "Leasing: Leasinggeber ist Eigentümer und bilanziert, Raten sind Aufwand", "Barzahlung ab 10.000 €: Kunde identifizieren (Geldwäschegesetz)"]}]]], "lf": [["LF 2 · Kaufmännisch steuern und kontrollieren", [["Inventur und Inventar", ["Inventur = zählen und bewerten, Inventar = das Verzeichnis dazu.", "Körperliche Inventur (zählen) und Buchinventur (Belege).", "Verfahren: Stichtag (±10 Tage), verlegt (3 Monate vor, 2 Monate nach), permanent.", "Anlässe: Gründung, Ende des Geschäftsjahres, Auflösung.", "Niederstwertprinzip: der niedrigere Wert zählt.", "Inventar: Vermögen (nach Flüssigkeit), Schulden (nach Fälligkeit), Reinvermögen = Vermögen − Schulden."]], ["Bilanz", ["Aktiva: Anlage- und Umlaufvermögen. Passiva: Eigen- und Fremdkapital. Summen immer gleich.", "Kennzahlen: Eigenkapitalquote, Fremdkapitalquote, Anlagendeckung I und II.", "Aktivtausch und Passivtausch: Bilanzsumme bleibt. Aktiv-Passiv-Mehrung und -Minderung: Summe steigt oder sinkt."]], ["Konten und Abschluss", ["Aktivkonto: Anfangsbestand und Zugang im Soll. Passivkonto: im Haben.", "Grundbuch = zeitlich (Buchungssätze), Hauptbuch = sachlich (T-Konten).", "Bestandskonten → Schlussbilanz. Erfolgskonten → GuV → Eigenkapital.", "Erfolgswirksam, wenn Aufwand oder Ertrag beteiligt ist.", "Jeder Verkauf: Erlösbuchung + VAK-Buchung. Erlös − VAK = Bruttoertrag.", "Betriebsergebnis + neutrales Ergebnis = Gewinn oder Verlust."]], ["Umsatzsteuer", ["19 % Regelsatz, 7 % ermäßigt; Versicherungen, Zinsen, Wohnungsmiete steuerfrei.", "Mehrwertsteuer: besteuert wird der Mehrwert jeder Stufe, Träger ist der Endverbraucher.", "Durchlaufender Posten: kein Aufwand, kein Ertrag.", "Zahllast = Umsatzsteuer − Vorsteuer; Voranmeldung meist monatlich.", "Abschluss: 1770 an 1570, Zahllast 1770 an 1200."]]], "KUP"], ["LF 9 · Personal", [["Planung und Beschaffung", ["Quantitativ (wie viele) und qualitativ (welche Qualifikation). Ersatz-, Neu-, Minderbedarf.", "Bedarf = Soll − (Ist + Zugänge − Abgänge).", "Intern: schnell, günstig, motivierend. Extern: neue Ideen, größere Auswahl.", "Unzulässige Fragen: Schwangerschaft, Religion, Partei, Gewerkschaft.", "Arbeitsvertrag: Parteien, Beginn, Tätigkeit, Ort, Entgelt, Arbeitszeit, Urlaub, Probezeit, Fristen."]], ["Tarif und Schutzgesetze", ["Tarifautonomie, Friedenspflicht. Manteltarif (Bedingungen) und Entgelttarif (Geld).", "Ablauf: Verhandlung, Schlichtung, Urabstimmung 75 %, Streik, Einigung, Urabstimmung 25 %.", "Arbeitszeit: 8 Stunden, max. 10; Pause 30/45 Minuten; Ruhezeit 11 Stunden.", "Mutterschutz: 6 Wochen vor, 8 Wochen nach der Geburt; Kündigungsverbot.", "Urlaub: 24 Werktage, voll nach 6 Monaten, sonst 1/12 je Monat."]], ["Gehalt und Steuern", ["Brutto (+ geldwerter Vorteil) − Lohnsteuer − Soli − Kirchensteuer − Sozialversicherung = Netto − private Abzüge = Auszahlung.", "Sozialversicherung je zur Hälfte: KV 14,6 % + Zusatz, PV 3,6 %, RV 18,6 %, AV 2,6 %; Unfall nur Arbeitgeber.", "Firmenwagen: 1 % vom Bruttolistenpreis + 0,03 % je Entfernungskilometer.", "Zu versteuerndes Einkommen: Einkünfte − Werbungskosten − Sonderausgaben − außergewöhnliche Belastungen.", "Private Vorsorge: Berufsunfähigkeit, Haftpflicht, Riester, Betriebsrente."]], ["Beendigung", ["Kündigung, Aufhebungsvertrag, Fristablauf, Rente. Immer schriftlich.", "Ordentlich mit Frist; außerordentlich aus wichtigem Grund binnen 2 Wochen.", "Gründe: personen-, verhaltens- (Abmahnung), betriebsbedingt (Sozialauswahl).", "Besonderer Schutz: Schwangere, Betriebsrat, Schwerbehinderte, Azubis.", "Betriebsrat anhören; Klage binnen 3 Wochen; Zeugnis einfach oder qualifiziert."]]], "KUP"], ["LF 10 · Wertschöpfung steuern", [["Kosten- und Leistungsrechnung", ["Stufen: Kostenarten, Kostenstellen (BAB), Kostenträger (Kalkulation).", "Aufwand ≠ Kosten: neutral (betriebsfremd, periodenfremd, außerordentlich), Grund-, Anders-, Zusatzkosten.", "Einzelkosten direkt, Gemeinkosten über Schlüssel. Hauptkostenstellen: NW, GW, Teile, Werkstatt.", "Zuschlagssatz = Gemeinkosten / Einzelkosten × 100.", "Kalkulation vorwärts, rückwärts, Differenz; Zuschlag, Faktor, Handelsspanne."]], ["Deckungsbeitrag und Werkstatt", ["DB = Erlös − variable Kosten; Betriebsergebnis = DB − Fixkosten.", "Kurzfristige Preisuntergrenze = variable Kosten. Break-even = Fixkosten / Stück-DB.", "Mehrstufig: DB 1 (Bruttoertrag), DB 2, DB 3, Betriebsergebnis.", "Stundenverrechnungssatz = Schnittlohn × Werkstattindex; Index = Soll-Lohnerlöse / produktive Löhne."]], ["Controlling", ["Strukturbilanz: Anlage-/Umlaufvermögen, Eigen-/Fremdkapital.", "EK-Quote, Anlagendeckung, Liquidität 1 bis 3.", "Rentabilitäten: Eigenkapital (Gewinn / EK), Gesamtkapital ((Gewinn + FK-Zinsen) / GK), Umsatz (Gewinn / Umsatz), jeweils × 100.", "Umsatzrentabilität: Wie viel Cent Gewinn bleiben von jedem Euro Umsatz? Beispiel: 45.000 € Gewinn / 3.000.000 € Umsatz × 100 = 1,5 %.", "Goldene Bilanzregel, Leverage-Effekt.", "Betriebsergebnis + neutrales Ergebnis = Unternehmensergebnis.", "Lagerkennzahlen und Kennzahlen der Geschäftsfelder (Bruttoertrag, Standzeit)."]]], "KUP"], ["LF 6 · Neuwagen disponieren und verkaufen", [["Markt und Planung", ["Portfolio: Fragezeichen, Stars, Cashcows, arme Hunde (Marktwachstum und Marktanteil).", "Marktpotenzial (möglich), Marktvolumen (tatsächlich), Marktanteil (eigener Anteil).", "Planabsatz = erwartetes Marktvolumen × angestrebter Marktanteil.", "Kapitalbedarf = Absatz × Einstandspreis × Kapitalbindung in Tagen / 360."]], ["Verkauf und Vertrag", ["Ablauf: Beratung, Probefahrt, Angebot, verbindliche Bestellung, Prüfung, Auftragsbestätigung.", "Vertrag entsteht erst durch Auftragsbestätigung oder Lieferung in der Bindefrist (3 Wochen).", "Verkäufergehalt: Fixum + Provision + Prämien. Bruttoertragsprovision bremst Nachlässe.", "Bruttoertrag = Marge − Kundennachlass − Zugaben; Provision in Prozent davon."]], ["Rechnung und Buchung", ["Rechnung: Namen, Steuernummer, Nummer, Datum, Fahrgestellnummer, Netto, Steuersatz, Steuer, Brutto.", "Einkauf: 3000 + 3030 + 1570 an 1600. Verkauf: 1400 an 8000 + 8030 + 8200 + 1770. Dazu 7000 an 3000.", "Amtliche Zulassungsgebühr: durchlaufender Posten ohne Umsatzsteuer.", "Interner Auftrag: Werkstatt für eigene Abteilung, ohne Umsatzsteuer."]], ["Reklamation", ["Sachmängelhaftung: Neuwagen 2 Jahre, GW an Verbraucher mindestens 1 Jahr.", "Beweislastumkehr 12 Monate. Erst Nacherfüllung, dann Rücktritt oder Minderung.", "AGB dürfen Verbraucher nicht unangemessen benachteiligen.", "Gewährleistung gesetzlich, Garantie freiwillig, Kulanz ohne Anspruch."]]], "FF"], ["LF 7 · Gebrauchtwagen", [["Bewertung", ["Hereinnahmepreis: vom Marktpreis rückwärts abzüglich Bruttoertrag, Reparatur, Aufbereitung, Standkosten.", "Einflüsse: Alter, Kilometer, Zustand, Ausstattung, Farbe, Vorbesitzer, Marktlage.", "Technische Bewertung durch die Werkstatt, kaufmännische durch den GW-Verkauf (DAT, Schwacke).", "Zukaufquellen: Leasingrückläufer, Auktionen, Händler, Werkswagen, Börsen."]], ["Besteuerung und Kalkulation", ["Differenzbesteuerung § 25a: Ankauf ohne Vorsteuer; USt = Differenz × 19/119; kein Steuerausweis.", "Regelbesteuerung („MwSt ausweisbar“): Ankauf mit Vorsteuer, 19 % auf den Nettopreis.", "Erfolg = Marge netto − Reparatur − Aufbereitung − Standkosten.", "Verdeckter Preisnachlass: Überzahlung der Inzahlungnahme, trägt die Neuwagenabteilung.", "Buchungen: 3110 an 1200 · 1400 an 8110 + 8111 + 1770 · 7110 an 3110."]]], "FF"], ["LF 8 · Finanzdienstleistungen", [["Finanzierung", ["Standardfinanzierung: gleiche Raten bis null. Ballon-/Drei-Wege-Finanzierung: niedrige Raten + Schlussrate.", "Kreditfähig = geschäftsfähig. Kreditwürdig = Bonität (Einkommen, SCHUFA, Selbstauskunft).", "Sicherheiten: Sicherungsübereignung (ZB II bei der Bank), Gehaltsabtretung, Bürgschaft, Restschuldversicherung.", "Effektiver Jahreszins = alle Kosten pro Jahr. Annuität: Rate gleich, Zins sinkt, Tilgung steigt.", "Verbundgeschäft: Widerruf des Darlehens kippt auch den Kauf.", "Herstellerbank: Absatzförderung, Provision und Kundenbindung, günstige Zinsen und schnelle Zusage."]], ["Leasing", ["Leasinggeber Eigentümer, Leasingnehmer Besitzer; Raten = Aufwand, keine Bilanzierung beim Nehmer.", "Erlasskonform: Grundmietzeit 40–90 % der Nutzungsdauer.", "Kilometerleasing: Mehr-/Minderkilometer. Restwertleasing: Restwertrisiko beim Kunden, Andienungsrecht.", "Umsatzsteuer auf jede Rate. Vorzeitiges Ende: Aufhebung, Totalschaden, Diebstahl.", "Rückgabe: Protokoll mit Kilometern und Schäden. Full-Service: Wartung, Reifen, Versicherung inklusive."]], ["Absicherung", ["Haftpflicht (Pflicht), Teilkasko, Vollkasko. Laufzeit 1 Jahr, Kündigung bis 30.11.", "GAP: Differenz zwischen Ablösewert und Wiederbeschaffungswert. Restschuldversicherung: Tod, Arbeitsunfähigkeit, Arbeitslosigkeit.", "Sicherungsschein: Kaskoleistung geht an Bank oder Leasinggeber.", "Gewährleistung gesetzlich, Garantie freiwillig, Kulanz ohne Anspruch."]]], "FF"], ["LF 1 · Betrieb und Zusammenarbeit", [["Vertriebsstrukturen", ["Direkt: Hersteller verkauft selbst (Niederlassung, Agentur, online). Indirekt: über Vertragshändler im eigenen Namen und auf eigene Rechnung.", "Partner: Hersteller/Importeur, Niederlassung, Vertragshändler, Agent, Servicepartner.", "Vertikal-GVO: EU-Regel, die Hersteller-Händler-Verträge vom Kartellverbot freistellt.", "Selektiv: Händler nach Kriterien ausgewählt. Exklusiv: Gebietsschutz.", "Händlervertrag: Gebiet, Ziele, Standards, Marge und Boni, Laufzeit."]], ["Berufsausbildung", ["Duales System: Betrieb (Ausbildungsrahmenplan) + Berufsschule (Rahmenlehrplan). Grundlage BBiG.", "Vertrag schriftlich vor Beginn, Eintrag bei der IHK. Probezeit 1 bis 4 Monate.", "Ende: Bestehen der Prüfung oder Fristablauf; Kündigung nach der Probezeit nur aus wichtigem Grund oder vom Azubi mit 4 Wochen Frist.", "Jugendarbeitsschutz: 8 Stunden täglich, 40 Stunden pro Woche, Urlaub 30/27/25 Werktage."]], ["Mitbestimmung", ["Grundlage: Betriebsverfassungsgesetz. Betriebsrat ab 5 Wahlberechtigten, Amtszeit 4 Jahre; JAV 2 Jahre.", "Betriebsrat: wählen ab 16, wählbar ab 18 nach 6 Monaten. JAV: wählen unter 18 und alle Azubis; wählbar unter 25 und Azubis.", "Rechte: Information, Anhörung, Mitwirkung, Mitbestimmung (soziale Angelegenheiten).", "Betriebsvereinbarung: Vertrag Arbeitgeber und Betriebsrat. Betriebsversammlung: vierteljährlich, alle Beschäftigten."]], ["Grundlagen des Wirtschaftens", ["Bedürfnis → Bedarf (mit Kaufkraft) → Nachfrage (am Markt).", "Freie Güter kosten nichts, wirtschaftliche Güter sind knapp.", "Maximalprinzip: feste Mittel, größter Erfolg. Minimalprinzip: festes Ziel, kleinster Einsatz.", "Sektoren: Urerzeugung, Verarbeitung, Dienstleistung.", "Einfacher Kreislauf: Haushalte und Unternehmen, Güter- und Geldstrom gegenläufig."]], ["Rechtsformen, Handelsregister, Vollmachten", ["Personengesellschaften: OHG, KG, GmbH & Co. KG. Kapitalgesellschaften: GmbH (25.000 €), AG (50.000 €).", "OHG: alle haften voll. KG: Komplementär voll, Kommanditist mit Einlage. GmbH/AG: nur Gesellschaftsvermögen.", "Handelsregister beim Amtsgericht: A Personenunternehmen, B Kapitalgesellschaften. Deklaratorisch oder konstitutiv.", "Ist-, Kann-, Formkaufmann. Firma = Name des Kaufmanns im Geschäftsverkehr.", "Rangfolge der Vollmachten: Prokura (ppa., ins Register) vor allgemeiner Handlungsvollmacht (i. V.), Art- und Einzelvollmacht."]]], "WiSo"], ["LF 11 · Wirtschaftspolitik", [["Markt und Preis", ["Vollkommener Markt: homogene Güter, keine Präferenzen, Transparenz, schnelle Reaktion.", "Gleichgewichtspreis räumt den Markt. Darüber Angebotsüberhang (Käufermarkt), darunter Nachfrageüberhang.", "Preisfunktionen: Ausgleich, Signal, Lenkung, Auslese.", "Marktformen: Polypol, Oligopol, Monopol. Höchstpreis unter, Mindestpreis über dem Gleichgewicht."]], ["Ordnung und Wettbewerb", ["Soziale Marktwirtschaft: Markt + sozialer Ausgleich + Wettbewerbsschutz.", "Kooperation (Teilbereiche) und Konzentration (Konzern, Fusion); horizontal, vertikal, diagonal.", "Kartelle grundsätzlich verboten; Kartellamt: Kartellverbot, Missbrauchsaufsicht, Fusionskontrolle."]], ["Ziele, BIP, Konjunktur", ["Magisches Viereck: Preisstabilität, Beschäftigung, Außenwirtschaft, Wachstum. Sechseck: + Verteilung, Umwelt.", "BIP = Konsum + Staat + Investitionen + Außenbeitrag; nominal und real; Lohnquote.", "Phasen: Aufschwung, Boom, Abschwung, Tiefstand. Früh-, Präsenz-, Spätindikatoren.", "Antizyklische Fiskalpolitik: im Abschwung ausgeben, im Boom sparen."]], ["Geld und Außenwirtschaft", ["Inflation senkt die Kaufkraft; gemessen am Verbraucherpreisindex (Warenkorb).", "EZB: Preisstabilität; Offenmarkt, Fazilitäten, Mindestreserve; expansiv oder kontraktiv.", "Zahlungsbilanz: Leistungs-, Vermögensänderungs-, Kapitalbilanz. Außenbeitrag = Export − Import.", "Globalisierung: größere Märkte, aber Lohndruck und Abhängigkeit."]]], "WiSo"], ["LF 3 · Teile beschaffen und lagern", [["Rechtliche Grundlagen", ["Rechtsfähig ab Geburt; geschäftsfähig: 0–6 nicht, 7–17 beschränkt, ab 18 voll.", "Anfrage unverbindlich, Angebot bindend, Anpreisung kein Angebot. Freizeichnung: „freibleibend“.", "Kaufvertrag: Antrag + Annahme. Verpflichtung (Vertrag) und Erfüllung (liefern, übereignen, zahlen, abnehmen).", "Nichtig: Geschäftsunfähigkeit, Formmangel, Gesetzes- oder Sittenverstoß, Schein, Scherz. Anfechtbar: Irrtum, Täuschung, Drohung.", "Form: Schriftform, Beglaubigung, notarielle Beurkundung. AGB: vorformuliert, Individualabrede geht vor.", "Besitz = tatsächliche, Eigentum = rechtliche Herrschaft. Eigentumsvorbehalt bis zur vollständigen Zahlung."]], ["Beschaffung", ["Bezugsquellen: Lieferantendatei, Messen, Internet, Fachzeitschriften, Vertreter.", "Quantitativ: Bezugspreis vergleichen. Qualitativ: Kriterien gewichten (Scoring).", "Optimale Bestellmenge: Bestell- + Lagerkosten minimal.", "Meldebestand = Tagesverbrauch × Lieferzeit + Mindestbestand. Höchstbestand = Mindestbestand + Bestellmenge.", "Bestellpunktverfahren (bei Meldebestand) oder Bestellrhythmus (feste Termine)."]], ["Lager", ["Funktionen: Sicherung, Überbrückung, Spekulation, Umformung, Veredelung.", "Wareneingang: sofort äußere Prüfung, dann unverzüglich Art, Menge, Güte.", "Festplatz oder Freiplatz (chaotisch); FiFo oder LiFo; zentral oder dezentral; Eigen- oder Fremdlager; Just-in-time.", "Kennzahlen: Ø Lagerbestand, Umschlagshäufigkeit, Lagerdauer, Lagerzinssatz. Hoher Umschlag = kurze Lagerdauer = wenig gebundenes Kapital."]], ["Zahlung und Störungen", ["Lastschrift: Empfänger zieht ein. Dauerauftrag: fester Betrag, fester Termin.", "Skonto fast immer nutzen: 2 % für 20 Tage entsprechen etwa 36 % Jahreszins.", "Sachmängel: Beschaffenheit, Falsch-, Minderlieferung, Montage, Anleitung, Werbeaussage. Offen, versteckt, arglistig verschwiegen.", "Erst Nacherfüllung, dann Rücktritt, Minderung, Schadenersatz. Kaufleute rügen unverzüglich.", "Lieferungsverzug: Fälligkeit, Mahnung, Verschulden. Rechte: Lieferung + Verzögerungsschaden; nach Nachfrist Rücktritt oder Schadenersatz statt der Leistung."]]], "T1"], ["LF 4 · Teile und Zubehör verkaufen", [["Sortiment", ["Breit = viele Warengruppen, tief = viel Auswahl je Warengruppe.", "Kernsortiment bringt den Hauptumsatz, Randsortiment ergänzt.", "Regalzonen: Reck-, Sicht- (verkaufsstark), Greif-, Bückzone."]], ["Verkaufsgespräch", ["Phasen: Begrüßung, Bedarfsermittlung, Warendemonstration, Verkaufsargumentation, Abschluss, Verabschiedung.", "Fragen: offen (W-Fragen) zur Bedarfsermittlung, geschlossen zum Abschluss, Alternativ-, Suggestiv-, rhetorische Frage.", "Argumentation: Merkmal → Vorteil → Kundennutzen.", "Ergänzungsverkauf: passenden Zusatzartikel mit Nutzen anbieten.", "Nonverbal: Mimik, Gestik, Haltung, Blickkontakt."]]], "T1"], ["LF 5 · Full-Service-Unfallabwicklung", [["Versicherung", ["Haftpflichtschaden: Verursacher bzw. seine Versicherung zahlt. Kaskoschaden: eigene Versicherung zahlt.", "Haftpflichtansprüche: Reparatur, Gutachter, Wertminderung, Mietwagen oder Nutzungsausfall, Abschleppen, Pauschale.", "Kasko: nur Vertragsleistung abzüglich Selbstbeteiligung. Teilkasko ohne Schadenfreiheitsklasse.", "Beitrag: Schadenfreiheits-, Typ-, Regionalklasse, Fahrleistung, Fahrerkreis, Selbstbeteiligung, Werkstattbindung.", "Gefährdungshaftung: Halter haftet für die Betriebsgefahr."]], ["Abwicklung", ["Ablauf: Schadenaufnahme, RKÜ unterschreiben lassen, Gutachter, Freigabe der Versicherung, Mietwagen, Reparatur, Abrechnung mit der Versicherung.", "RKÜ/Sicherungsabtretung: Kunde tritt Anspruch ab, Autohaus rechnet direkt ab.", "Vorsteuerabzugsberechtigter Kunde: Versicherung zahlt netto, Kunde die Umsatzsteuer.", "Gutachter: bei Haftpflicht wählt der Geschädigte, bei Kasko der Versicherer."]], ["Schadenbegriffe", ["Technischer Totalschaden: nicht reparierbar. Wirtschaftlicher: Reparatur teurer als Wiederbeschaffungswert − Restwert.", "130-%-Regel: Reparatur bis 130 % des Wiederbeschaffungswerts bei fachgerechter Reparatur und Weiternutzung.", "Integritätsinteresse: Interesse, das eigene Fahrzeug zu behalten.", "Merkantile Wertminderung: Minderwert als Unfallwagen. Nutzungsausfall: Tagessatz ohne Mietwagen.", "Totalschaden Haftpflicht: Wiederbeschaffungswert − Restwert."]]], "T1"]]};

const KSTOP=new Set('werden wurde wurden eines einer einem einen nicht durch sowie dabei diese dieser dieses diesem immer schon jeweils zwischen danach bevor haben hatte koennen muessen sollte sollten weniger allem unter ueber gegen ohne beispiel sich ihre ihren ihrer seine seinen deren dessen welche welcher welches andere anderen anderer gibt steht eigenen eigene ganze ganz sondern damit daher deshalb jedoch etwas meist meistens grundsaetzlich bereits gilt also bzw. heisst nennt bleibt kommt kommen macht machen zahlt zahlen werden. darf duerfen'.split(' '));
const knorm=t=>t.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
const KRE=/[0-9A-Za-zÄÖÜäöüß][0-9A-Za-zÄÖÜäöüß%]*(?:[.,-][0-9A-Za-zÄÖÜäöüß%]+)*/g;
const kstem=n=>/\d/.test(n)?n.replace(/[.\s]/g,''):n.slice(0,Math.max(5,Math.min(n.length-2,8)));
function keywords(ans){const seen=new Set(),out=[];
  for(const m of ans.matchAll(KRE)){const raw=m[0],n=knorm(raw);const num=/\d/.test(n);
    if(!num&&(n.length<5||KSTOP.has(n)))continue;const st=kstem(n);if(seen.has(st))continue;seen.add(st);
    out.push({raw,st,score:(num?3:0)+(/^[A-ZÄÖÜ]/.test(raw)?2:0)+Math.min(n.length,12)/6})}
  if(out.length>8){const keep=new Set(out.slice().sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.st));return out.filter(x=>keep.has(x.st))}
  return out}
function kcheck(ans,user){const kw=keywords(ans),u=knorm(user).replace(/(\d)\.(?=\d{3})/g,'$1');
  const hits=new Set(kw.filter(k=>u.includes(k.st)).map(k=>k.st));return{kw,hits}}
function kmark(ans,hits){const out=[];let last=0;
  for(const m of ans.matchAll(KRE)){const st=kstem(knorm(m[0]));if(!hits.has(st))continue;out.push(ans.slice(last,m.index),$('mark',{text:m[0]}));last=m.index+m[0].length}
  out.push(ans.slice(last));return out}

 {tag:'KUP · Lernfeld 2',title:'Ein Neuwagen wird verkauft: Was macht die Buchhaltung?',why:'Fast jede Prüfung in den Unterstützungsprozessen lässt dich einen Fahrzeugverkauf buchen. Wer den Ablauf einmal gesehen hat, weiß, welches Konto wann dran ist.',
  go:['#buchen','Jetzt selbst buchen'],merke:['Beim Einkauf kommt das Auto in den Bestand, beim Verkauf wieder raus (VAK an Bestand).','Der Erlös ist immer der Nettobetrag, die Umsatzsteuer steht auf einem eigenen Konto.','Umsatzsteuer minus Vorsteuer ergibt die Zahllast ans Finanzamt.'],
  p:[
  {h:'Das Auto kommt an',bg:'out',s:cHouse(8,'Hersteller','#8d99c4',86)+cArrow(100,128,150)+cCar(150,94,'#4c6fe0')+cp(292,'vk',{flip:1,arm:'up'})+cDoc(248,20,'RECHNUNG'),say:[['r','Der Neuwagen ist da. Die Rechnung auch: 26.000 € netto.']],
   t:'Eingangsrechnung: Das Auto steht jetzt im Lager, bezahlt ist es noch nicht.',b:'Bestand Neuwagen 26.000 + Vorsteuer 4.940\nan Verbindlichkeiten 30.940'},
  {h:'Die Kundin schlägt zu',bg:'show',s:cCar(98,94,'#4c6fe0')+cp(52,'vk',{arm:'out'})+cp(272,'ku',{flip:1,arm:'up'}),say:[['l','Für 30.000 € netto gehört er Ihnen.'],['r','Abgemacht!']],

   t:'Das Auto ist weg, also muss es auch aus dem Bestand raus. Sein Einstandspreis wird jetzt zum Aufwand. VAK heißt verrechnete Anschaffungskosten.',b:'VAK Neuwagen 26.000\nan Bestand Neuwagen 26.000'},
  {h:'Das Geld ist da',s:cPC(26,'Zahlungseingang',[['Bank','35.700,00']],[['Forderungen','35.700,00']])+cp(232,'bh',{flip:1,arm:'out'})+cCoin(276,126)+cCoin(294,138)+cCoin(288,112),say:[['r','35.700 € sind auf dem Konto. Ich buche das gleich.']],

  {h:'Was bleibt hängen?',s:cSign(26,24,'Erlös 30.000 €',124)+cSign(26,56,'− Einsatz 26.000 €',124)+cSign(26,94,'= 4.000 €',124,'#bff0dc')+cp(230,'chef',{flip:1,arm:'out'})+cCoin(282,124)+cCoin(296,138),say:[['r','4.000 € Bruttoertrag. Davon zahlen wir Löhne, Miete und Strom.']],

 {tag:'KUP · Lernfeld 2',title:'Von der Inventur zur Bilanz und wieder zurück',why:'Inventur, Inventar und Bilanz werden gern verwechselt. In der Prüfung musst du die Reihenfolge kennen und wissen, was auf welcher Seite steht.',
  go:['#karten','Karten dazu lernen'],merke:['Inventur ist die Tätigkeit, Inventar die ausführliche Liste, Bilanz die Kurzfassung in Kontenform.','Aktiva zeigen, wo das Geld steckt. Passiva zeigen, woher es kommt.','Aktivkonten mehren sich im Soll, Passivkonten im Haben.'],
  p:[
  {h:'Zählen, messen, wiegen',s:cBox(150,126,5)+cBox(165,104,4)+cBox(180,82,3)+cp(70,'vk',{arm:'out'})+cDoc(96,60,'ZÄHLLISTE','#0a8a73'),say:[['l','Regal 4: 38 Ölfilter, 12 Bremsscheiben.']],
   t:'Inventur: Zum Ende des Geschäftsjahres wird alles erfasst, was da ist. Fahrzeuge und Teile werden gezählt, Bankguthaben, Forderungen und Schulden anhand der Belege geprüft.'},
  {h:'Das Inventar',s:cDoc(84,34,'VERMÖGEN','#0a8a73')+cDoc(140,34,'SCHULDEN','#d12f6f')+cDoc(196,34,'REINVERMÖGEN')+cp(40,'bh',{arm:'out'})+cArrow(128,112,138)+cArrow(184,112,194),say:[['l','Alles in eine Liste, mit Menge und Wert.']],
   t:'Das Inventar ist die ausführliche Aufstellung: Vermögen (nach Flüssigkeit geordnet) minus Schulden (nach Fälligkeit geordnet) ergibt das Reinvermögen, also das Eigenkapital.'},
  {h:'Die Bilanz',s:cPC(26,'Bilanz zum 31.12.',[['Anlagevermögen','400.000'],['Umlaufvermögen','600.000']],[['Eigenkapital','300.000'],['Fremdkapital','700.000']],['Aktiva','Passiva'])+cp(236,'bh',{flip:1,arm:'out'}),say:[['r','Links und rechts steht dieselbe Summe. Immer.']],
   t:'Die Bilanz ist die Kurzfassung in Kontenform. Links die Aktiva: Wofür wurde das Geld verwendet? Rechts die Passiva: Woher stammt es?'},
  {h:'Aus der Bilanz werden Konten',s:cPC(26,'Konto Bank',[['Anfangsbestand','50.000'],['Zugänge','+']],[['Abgänge','−'],['Schlussbestand','?']])+cp(236,'bh',{flip:1,arm:'up'}),say:[['r','Jeder Posten bekommt zu Jahresbeginn sein eigenes Konto.']],
   t:'Aktivkonten haben Anfangsbestand und Zugänge im Soll. Bei Passivkonten ist es umgekehrt: Anfangsbestand und Zugänge stehen im Haben.'},
  {h:'Das Jahr über wird gebucht',s:cDoc(40,50,'BELEG','#d9822b')+cArrow(88,76,112)+cSign(118,62,'Soll an Haben',104)+cp(268,'bh',{flip:1,arm:'out'})+cDesk(196,1,60),say:[['r','Keine Buchung ohne Beleg.']],
   t:'Jeder Geschäftsfall wird mit Beleg gebucht. Aufwände und Erträge laufen über Erfolgskonten und landen am Jahresende im Gewinn- und Verlustkonto.'},
  {h:'Der Jahresabschluss',s:cSign(20,30,'GuV: Gewinn',104,'#bff0dc')+cArrow(128,42,150)+cSign(156,30,'Eigenkapital',104)+cSign(88,76,'Schlussbilanz',112,'#ffe9a8')+cp(266,'chef',{flip:1,arm:'up'}),say:[['r','Und dann geht es mit der Inventur wieder von vorn los.']],
   t:'Der Gewinn aus der GuV erhöht das Eigenkapital. Die Schlussbestände aller Konten ergeben die Schlussbilanz, und die muss zu den Werten der Inventur passen.'}]},
 {tag:'KUP und WiSo · Lernfeld 9',title:'Von der Stellenanzeige zum ersten Arbeitstag',why:'Personalbeschaffung kommt in beiden Prüfungen vor. Gefragt werden vor allem die Reihenfolge, die Unterlagen und was im Gespräch erlaubt ist.',
  go:['#karten','Karten dazu lernen'],merke:['Reihenfolge: Bedarf, Ausschreibung, Auswahl, Gespräch, Vertrag, Einarbeitung.','Das AGG verbietet Benachteiligung, zum Beispiel wegen Alter, Geschlecht, Herkunft oder Religion.','Die wesentlichen Vertragsbedingungen müssen nachweisbar festgehalten werden (Nachweisgesetz).'],
  p:[
  {h:'Eine Stelle wird frei',s:cDesk(30)+cp(72,'chef',{mood:'flat',arm:'up'})+cCal(150,30,'?')+cP(248,{c:'#d9822b',flip:1,style:'long',hair:4,skin:3}),say:[['l','Unsere Serviceberaterin geht in Rente. Wir brauchen Ersatz.']],
   t:'Personalbedarf klären: Wie viele Leute fehlen, mit welcher Qualifikation, ab wann? Daraus entsteht die Stellenbeschreibung.'},
  {h:'Intern oder extern suchen?',s:cSign(18,30,'Intern: Aushang',124)+cSign(178,30,'Extern: Anzeige',124)+cp(80,'vk',{arm:'up'})+cp(240,'chef',{flip:1,arm:'up'}),say:[['r','Erst hängen wir die Stelle intern aus, dann schalten wir die Anzeige.']],
   t:'Intern: schnell, günstig, motiviert die Belegschaft. Extern: größere Auswahl und frische Ideen. Der Betriebsrat kann eine interne Ausschreibung verlangen.'},
  {h:'Bewerbungen sichten',s:cDoc(120,44,'LEBENSLAUF','#8a5ad6')+cDoc(140,54,'ZEUGNIS','#0a8a73')+cDoc(160,64,'ANSCHREIBEN')+cp(60,'bh',{arm:'out'})+cSign(198,26,'passt zum Profil?',114),say:[['l','Anschreiben, Lebenslauf, Zeugnisse. Wer passt zum Anforderungsprofil?']],
   t:'Vorauswahl nach dem Anforderungsprofil. Niemand darf wegen Alter, Geschlecht, Herkunft oder Religion aussortiert werden (AGG).'},
  {h:'Das Vorstellungsgespräch',bg:'show',s:cDesk(118)+cp(70,'chef',{arm:'out'})+cp(250,'neu',{flip:1,arm:'up'}),say:[['l','Warum möchten Sie zu uns?'],['r','Ich mag Autos und Menschen.']],
   t:'Erlaubt sind Fragen, die mit der Stelle zu tun haben. Unzulässig sind etwa Fragen nach Schwangerschaft, Religion oder Partei. Darauf muss man nicht wahrheitsgemäß antworten.'},
  {h:'Der Arbeitsvertrag',s:cDoc(140,28,'VERTRAG','#0a8a73')+cp(118,'chef',{arm:'out'})+cp(202,'neu',{flip:1,arm:'out'}),say:[['l','Willkommen im Team!']],
   t:'Im Vertrag stehen Beginn, Tätigkeit, Entgelt, Arbeitszeit, Urlaub und Kündigungsfristen. Die Probezeit dauert höchstens sechs Monate.'},
  {h:'Der erste Arbeitstag',s:cCal(24,34,'1.')+cDesk(96,1)+cp(70,'bh')+cp(240,'neu',{flip:1,arm:'out'})+cDoc(192,72,'UNTERLAGEN','#d9822b'),say:[['r','Hier sind meine Unterlagen.']],
   t:'Die Personalabteilung braucht unter anderem Steuer-ID, Sozialversicherungsnummer, Krankenkasse und Bankverbindung und meldet die Neue an. Dann beginnt die Einarbeitung.'}]},
 {tag:'KUP und WiSo · Lernfeld 9',title:'Vom Brutto zum Netto: die Gehaltsabrechnung',why:'Die Entgeltabrechnung ist eine typische Rechenaufgabe. Du musst wissen, was abgezogen wird, wer es bezahlt und wohin es fließt.',
  go:['#rechnen','Jetzt selbst rechnen'],merke:['Netto = Brutto minus Steuern minus Arbeitnehmeranteil zur Sozialversicherung.','Kranken-, Pflege-, Renten- und Arbeitslosenversicherung werden geteilt, die Unfallversicherung zahlt der Betrieb allein.','Den Betrieb kostet eine Stelle mehr als das Brutto: Der Arbeitgeberanteil kommt obendrauf.'],
  p:[
  {h:'3.000 € stehen im Vertrag',s:cDoc(140,36,'VERTRAG','#0a8a73')+cp(96,'neu',{arm:'up',mood:'wow'})+cSign(190,44,'3.000 € brutto',112,'#ffe9a8'),say:[['l','3.000 €! Und wie viel kommt davon bei mir an?']],
   t:'Brutto ist das vereinbarte Entgelt. Ausgezahlt wird das Netto. Die Beträge in dieser Geschichte sind gerundete Beispielwerte.'},
  {h:'Erst kommen die Steuern',bg:'out',s:cp(50,'neu',{arm:'out',mood:'flat'})+cCoin(104,104)+cArrow(122,104,196)+cHouse(204,'Finanzamt','#a08a6a',100)+cSign(100,30,'− 350 € Steuern',118),say:[['l','Lohnsteuer, eventuell Kirchensteuer und Soli.']],
   t:'Wie viel Lohnsteuer anfällt, hängt vor allem von der Steuerklasse und den Kinderfreibeträgen ab. Der Betrieb behält sie ein und führt sie ab.'},
  {h:'Dann die Sozialversicherung',s:cSign(14,22,'Kranken',70)+cSign(90,22,'Pflege',64)+cSign(160,22,'Rente',60)+cSign(226,22,'Arbeitslos',82)+cp(100,'neu',{arm:'up'})+cp(220,'chef',{flip:1,arm:'up'})+cSign(118,84,'halbe-halbe',86,'#bff0dc'),say:[['r','Diese vier Beiträge teilen wir uns.']],
   t:'Arbeitnehmer und Arbeitgeber tragen die Beiträge grundsätzlich je zur Hälfte. Im Beispiel gehen 630 € vom Brutto ab. Die Unfallversicherung zahlt der Betrieb allein.'},
  {h:'Das bleibt übrig',s:cPC(26,'Entgeltabrechnung',[['Brutto','3.000,00'],['Netto','2.020,00']],[['Steuern','− 350,00'],['Sozialversicherung','− 630,00']],['Verdienst','Abzüge'])+cp(236,'bh',{flip:1,arm:'out'}),say:[['r','2.020 € netto. Die überweisen wir zum Monatsende.']],
   t:'3.000 − 350 − 630 = 2.020 € netto. Gehen davon noch Vorschüsse oder vermögenswirksame Leistungen ab, bleibt der Auszahlungsbetrag.'},
  {h:'Was kostet die Stelle den Betrieb?',s:cSign(30,30,'Brutto 3.000 €',124)+cSign(30,62,'+ AG-Anteil 630 €',124)+cSign(30,100,'≈ 3.630 €',124,'#ffd3cc')+cp(232,'chef',{flip:1,arm:'out',mood:'flat'}),say:[['r','Mich kostet die Stelle mehr als 3.000 €.']],
   t:'Der Arbeitgeber zahlt seinen Anteil zur Sozialversicherung zusätzlich zum Brutto. Diese Personalkosten gehören in jede Kalkulation.'},
  {h:'Wohin fließt das Geld?',bg:'out',s:cp(36,'neu',{arm:'up'})+cCoin(70,70)+cHouse(100,'Finanzamt','#a08a6a',92)+cHouse(212,'Krankenkasse','#6f9bd6',98)+cSign(104,20,'Lohnsteuer',86)+cSign(212,20,'alle SV-Beiträge',104),say:[['l','Mein Netto kommt aufs Konto.']],
   t:'Der Betrieb überweist drei Mal: das Netto an die Mitarbeiterin, die Steuern ans Finanzamt und sämtliche Sozialversicherungsbeiträge an die Krankenkasse, die sie weiterverteilt.'}]},
 {tag:'FF · Lernfeld 7',title:'Ein Gebrauchter von privat: die Differenzbesteuerung',why:'In der Prüfung zum Fahrzeugvertrieb musst du erkennen, wie ein Gebrauchtwagen besteuert wird, und die Umsatzsteuer aus der Differenz herausrechnen.',
  go:['#rechnen','Jetzt selbst rechnen'],merke:['Ankauf von privat: keine Vorsteuer, deshalb Differenzbesteuerung nach § 25a UStG.','Die Differenz aus Verkaufs- und Einkaufspreis ist ein Bruttobetrag: durch 1,19 teilen.','Auf der Rechnung wird keine Umsatzsteuer ausgewiesen.'],
  p:[
  {h:'Ein Kunde bietet sein Auto an',bg:'out',s:cCar(100,94,'#d9822b')+cp(48,'kd',{arm:'out'})+cp(276,'vk',{flip:1}),say:[['l','Ich möchte meinen Wagen verkaufen. 11.000 € hätte ich gern.']],
   t:'Der Verkäufer ist Privatperson. Auf seinem Kaufvertrag steht keine Umsatzsteuer, also kann das Autohaus auch keine Vorsteuer abziehen.'},
  {h:'Prüfen und bewerten',bg:'out',s:cCar(96,94,'#d9822b')+cp(250,'vk',{flip:1,arm:'out'})+cDoc(26,38,'CHECKLISTE','#0a8a73')+cSign(170,24,'Händler-EK: 10.000 €',136),say:[['r','Scheckheft gepflegt, zwei Kratzer. Ich biete 10.000 €.']],
   t:'Vor dem Ankauf: Papiere, Scheckheft, Unfallschäden, Probefahrt. Der Händlereinkaufswert stammt aus einer Bewertung, zum Beispiel DAT oder Schwacke, abzüglich Aufbereitung.'},
  {h:'Der Ankauf wird gebucht',s:cPC(26,'Ankauf GW von privat',[['Bestand GW','differenzbest.'],['','10.000,00']],[['Bank','10.000,00']])+cp(236,'bh',{flip:1,arm:'out'}),say:[['r','Kein Vorsteuerkonto, weil keine Umsatzsteuer drauf war.']],
   t:'Der Wagen kommt mit dem vollen Kaufpreis in den Bestand der differenzbesteuerten Gebrauchtwagen.',b:'Bestand GW differenzbesteuert 10.000\nan Bank 10.000'},
  {h:'Der Wagen wird verkauft',bg:'show',s:cCar(98,94,'#d9822b')+cp(52,'vk',{arm:'out'})+cp(272,'ku',{flip:1,arm:'up'})+cSign(104,28,'12.380 €',84,'#ffe9a8'),say:[['l','Aufbereitet und mit neuer HU: 12.380 €.'],['r','Den nehme ich.']],
   t:'Besteuert wird nur die Differenz: Verkaufspreis 12.380 € minus Einkaufspreis 10.000 € = 2.380 €. Dieser Betrag enthält die Umsatzsteuer bereits.'},
  {h:'Die Steuer steckt in der Differenz',s:cSign(24,24,'Differenz 2.380 €',130)+cSign(24,56,'÷ 1,19 = 2.000 €',130)+cSign(24,94,'USt = 380 €',130,'#ffd3cc')+cp(226,'bh',{flip:1,arm:'out'}),say:[['r','Nur 380 € Umsatzsteuer statt 19 % auf alles.']],
   t:'2.380 ÷ 1,19 = 2.000 € Rohgewinn netto, 380 € Umsatzsteuer. Auf der Rechnung steht keine Umsatzsteuer, sondern der Hinweis auf die Sonderregelung für Gebrauchtgegenstände.',b:'Forderungen 12.380\nan Erlöse GW differenzbest. 10.000\n+ Mehrerlöse 2.000 + Umsatzsteuer 380'},
  {h:'Und wenn der Wagen von einer Firma kommt?',bg:'out',s:cHouse(14,'Firma','#8d99c4',80)+cCar(104,94,'#8a8f9c')+cp(270,'vk',{flip:1,arm:'up'})+cSign(190,24,'mit 19 % USt',104),say:[['r','Dann gilt die Regelbesteuerung.']],
   t:'Weist der Verkäufer Umsatzsteuer aus, zieht das Autohaus die Vorsteuer ab und berechnet beim Verkauf 19 % auf den gesamten Nettopreis.'}]},
 {tag:'FF · Lernfeld 6',title:'Bestellt, geliefert, reklamiert: Kaufvertrag und Mängel',why:'Kaufvertragsrecht ist ein Dauerbrenner in der Prüfung: Wie kommt der Vertrag zustande, und welche Rechte hat der Kunde bei einem Mangel in welcher Reihenfolge?',
  go:['#karten','Karten dazu lernen'],merke:['Kaufvertrag = Antrag und Annahme, zwei übereinstimmende Willenserklärungen.','Bei Mängeln zuerst Nacherfüllung, erst danach Rücktritt oder Minderung.','Gewährleistung ist gesetzlich, Garantie ist ein freiwilliges Zusatzversprechen.'],
  p:[
  {h:'Antrag und Annahme',bg:'show',s:cDesk(118)+cDoc(140,64,'BESTELLUNG')+cp(70,'kd',{arm:'out'})+cp(250,'vk',{flip:1,arm:'up'}),say:[['l','Ich bestelle den Wagen verbindlich.'],['r','Die Auftragsbestätigung kommt per Post.']],
   t:'Die unterschriebene Bestellung ist der Antrag des Kunden. Der Vertrag steht, sobald das Autohaus annimmt: durch Auftragsbestätigung oder durch Lieferung.'},
  {h:'Wer muss was?',s:cSign(20,26,'Verkäufer: liefern',128)+cSign(172,26,'Käufer: zahlen',128)+cp(84,'vk',{arm:'out'})+cp(236,'kd',{flip:1,arm:'out'})+cCoin(196,100),say:[['l','Mangelfreies Auto gegen Kaufpreis.']],
   t:'Der Verkäufer übergibt das Auto mangelfrei und verschafft das Eigentum. Der Käufer zahlt und nimmt ab. Beim Eigentumsvorbehalt bleibt das Autohaus Eigentümer, bis alles bezahlt ist.'},
  {h:'Die Übergabe',bg:'out',s:cCar(100,94,'#4c6fe0')+cp(50,'vk',{arm:'out'})+cp(274,'kd',{flip:1,arm:'up'})+cCal(232,20,'2 J.'),say:[['l','Schlüssel, Papiere, viel Freude!']],
   t:'Mit der Übergabe beginnt die Gewährleistung: zwei Jahre beim Neuwagen. Bei Gebrauchtwagen kann sie gegenüber Verbrauchern auf ein Jahr verkürzt werden.'},
  {h:'Ein Mangel taucht auf',bg:'out',s:cCar(110,94,'#4c6fe0')+cSign(120,40,'ruckel, ruckel',100,'#ffd3cc')+cp(56,'kd',{arm:'up',mood:'wow'}),say:[['l','Nach drei Monaten ruckelt das Getriebe!']],
   t:'Ein Sachmangel liegt vor, wenn das Auto nicht so ist wie vereinbart oder üblich. Zeigt er sich im ersten Jahr, wird beim Verbraucher vermutet, dass er schon bei der Übergabe da war.'},
  {h:'Zuerst: Nacherfüllung',s:cCar(96,94,'#4c6fe0')+cp(250,'vk',{flip:1,arm:'out',c:'#3d4f7c'})+cSign(20,24,'Reparatur',90,'#bff0dc')+cSign(120,24,'oder Ersatz',96),say:[['r','Wir reparieren das, für Sie kostenlos.']],
   t:'Der Käufer kann Nachbesserung oder Ersatzlieferung verlangen. Die Kosten trägt der Verkäufer. Nach dem zweiten erfolglosen Versuch gilt die Nachbesserung in der Regel als gescheitert.'},
  {h:'Wenn das nicht klappt',s:cSign(20,26,'Rücktritt',86)+cSign(110,26,'Minderung',90)+cSign(206,26,'Schadensersatz',108)+cp(100,'kd',{arm:'up',mood:'flat'})+cp(220,'chef',{flip:1,arm:'out'}),say:[['l','Dann möchte ich mein Geld zurück.']],
   t:'Erst jetzt darf der Käufer vom Vertrag zurücktreten oder den Preis mindern, gegebenenfalls zusätzlich Schadensersatz verlangen.'}]},
 {tag:'FF · Lernfeld 8',title:'Finanzieren oder leasen? Zwei Wege zum Neuwagen',why:'Im Verkaufsgespräch und in der Prüfung musst du beide Wege erklären und sagen können, wem das Auto jeweils gehört und wer welches Risiko trägt.',
  go:['#karten','Karten dazu lernen'],merke:['Finanzierung: Die Bank ist Sicherungseigentümerin, am Ende gehört das Auto dem Kunden.','Leasing: Der Leasinggeber bleibt Eigentümer, der Kunde zahlt für die Nutzung.','Restwertleasing: Das Restwertrisiko trägt der Leasingnehmer. Kilometerleasing: der Leasinggeber.'],
  p:[
  {h:'Der Wunsch',bg:'show',s:cCar(98,94,'#0a8a73')+cp(52,'ku',{arm:'up',mood:'flat'})+cp(274,'vk',{flip:1,arm:'out'})+cSign(110,28,'30.000 €',84,'#ffe9a8'),say:[['l','So viel habe ich nicht auf einmal.'],['r','Dann schauen wir uns zwei Wege an.']],
   t:'Wer nicht bar zahlt, kann finanzieren (Kredit) oder leasen (Nutzung auf Zeit). Das Autohaus vermittelt meist die Bank oder Leasinggesellschaft des Herstellers.'},
  {h:'Weg 1: die Finanzierung',bg:'out',s:cHouse(10,'Bank','#6f9bd6',84)+cArrow(98,112,128)+cCoin(142,112)+cp(190,'ku',{arm:'out'})+cDoc(232,54,'ZB TEIL II','#d12f6f')+cSign(186,20,'bleibt bei der Bank',128),say:[['r','Ich zahle monatliche Raten an die Bank.']],
   t:'Die Bank zahlt den Kaufpreis ans Autohaus. Die Kundin ist Halterin und Besitzerin, die Bank bis zur letzten Rate Sicherungseigentümerin. Deshalb behält sie die Zulassungsbescheinigung Teil II.'},
  {h:'Was kostet der Kredit?',s:cSign(20,24,'Sollzins',80)+cSign(108,24,'+ Nebenkosten',108)+cSign(60,60,'= effektiver Jahreszins',160,'#ffe9a8')+cp(266,'vk',{flip:1,arm:'out'}),say:[['r','Vergleichen Sie immer den effektiven Jahreszins.']],
   t:'Der effektive Jahreszins enthält alle Kreditkosten und macht Angebote vergleichbar. Varianten: klassischer Ratenkredit, Schlussratenfinanzierung und Drei-Wege-Finanzierung (am Ende zahlen, weiterfinanzieren oder zurückgeben).'},
  {h:'Weg 2: das Leasing',bg:'out',s:cHouse(10,'Leasing','#8a5ad6',84)+cCar(110,94,'#0a8a73')+cp(280,'ku',{flip:1,arm:'up'})+cSign(104,34,'gehört dem Leasinggeber',168),say:[['r','Ich fahre das Auto, aber es gehört mir nicht.']],
   t:'Die Leasinggesellschaft kauft das Auto und bleibt Eigentümerin. Die Kundin zahlt für die Nutzung: oft eine Sonderzahlung, dann feste Monatsraten über die vereinbarte Laufzeit.'},
  {h:'Kilometer oder Restwert?',s:cSign(8,20,'Kilometerleasing',146)+cSign(166,20,'Restwertleasing',146)+cSign(8,52,'Mehr-km kosten extra',146,'#bff0dc')+cSign(166,52,'Wertverlust: Kunde zahlt',146,'#ffd3cc')+cCar(100,94,'#0a8a73'),say:[['l','Bei der Rückgabe wird abgerechnet.']],
   t:'Kilometerleasing: Abgerechnet werden nur Mehr- und Minderkilometer und Schäden. Restwertleasing: Ist das Auto am Ende weniger wert als kalkuliert, zahlt der Leasingnehmer die Differenz.'},
  {h:'Was passt zu wem?',bg:'show',s:cp(60,'ku',{arm:'up'})+cSign(96,30,'Kaufen = behalten',128)+cSign(96,62,'Leasen = wechseln',128)+cp(266,'vk',{flip:1,arm:'out'}),say:[['l','Ich will das Auto lange fahren. Also finanzieren.']],
   t:'Finanzierung: Das Auto gehört am Ende dem Kunden. Leasing: niedrigere Raten und regelmäßig ein neues Auto, dafür Bindung an Laufzeit, Kilometer und Rückgabezustand. Unternehmer setzen die Leasingraten als Betriebsausgaben ab.'}]},
 {tag:'WiSo und KUP · Lernfeld 9',title:'Die Kündigung: Form, Fristen und Schutz',why:'Kündigungsfristen und Kündigungsschutz kommen in fast jeder WiSo-Prüfung vor, meist als kleiner Fall mit Datum.',
  go:['#quiz','Im Quiz testen'],merke:['Kündigung nur schriftlich auf Papier mit Unterschrift.','Grundfrist: vier Wochen zum 15. oder zum Monatsende, in der Probezeit zwei Wochen.','Klage gegen eine Kündigung: innerhalb von drei Wochen beim Arbeitsgericht.'],
  p:[
  {h:'Die Kündigung kommt',s:cDoc(140,40,'KÜNDIGUNG','#d12f6f')+cp(96,'chef',{arm:'out',mood:'flat'})+cp(224,'kd',{flip:1,mood:'wow',arm:'up'}),say:[['r','Per WhatsApp wäre das gar nicht gültig gewesen?']],
   t:'Eine Kündigung muss schriftlich erfolgen: auf Papier und eigenhändig unterschrieben. Mündlich, per E-Mail oder per Messenger ist sie unwirksam.'},
  {h:'Welche Frist gilt?',s:cCal(40,40,'15.')+cCal(104,40,'30.')+cSign(30,96,'4 Wochen vorher',130,'#ffe9a8')+cp(240,'bh',{flip:1,arm:'out'}),say:[['r','Vier Wochen zum 15. oder zum Monatsende.']],
   t:'Das ist die gesetzliche Grundfrist. Kündigt der Arbeitgeber, verlängert sie sich mit der Betriebszugehörigkeit, zum Beispiel auf einen Monat zum Monatsende ab zwei Jahren. In der Probezeit gelten zwei Wochen.'},
  {h:'Ordentlich oder fristlos?',s:cSign(8,26,'ordentlich: mit Frist',138)+cSign(152,26,'fristlos: wichtiger Grund',162,'#ffd3cc')+cp(90,'chef',{arm:'up'})+cp(236,'vk',{flip:1,mood:'flat'}),say:[['l','Fristlos geht nur bei schweren Verstößen.']],
   t:'Für die außerordentliche Kündigung braucht es einen wichtigen Grund, etwa Diebstahl. Sie muss innerhalb von zwei Wochen nach Bekanntwerden erklärt werden. Bei Fehlverhalten ist vorher in der Regel eine Abmahnung nötig.'},
  {h:'Das Kündigungsschutzgesetz',s:cSign(16,24,'personenbedingt',120)+cSign(16,54,'verhaltensbedingt',120)+cSign(16,84,'betriebsbedingt',120)+cp(256,'bh',{flip:1,arm:'up'})+cSign(184,26,'ein Grund muss her',128),say:[['r','Ohne einen dieser Gründe ist die Kündigung sozial ungerechtfertigt.']],
   t:'Das Gesetz gilt, wenn jemand länger als sechs Monate im Betrieb ist und dort mehr als zehn Beschäftigte arbeiten. Bei betriebsbedingten Kündigungen kommt die Sozialauswahl dazu.'},
  {h:'Wer ist besonders geschützt?',s:cP(50,{c:'#d12f6f',style:'long',hair:2})+cP(112,{c:'#0a8a73',hair:1,skin:2,arm:'up'})+cP(174,{c:'#d9822b',style:'bun',hair:0,skin:1})+cP(236,{c:'#4c6fe0',hair:3,arm:'up'})+cSign(76,20,'Sonderkündigungsschutz',168,'#bff0dc'),say:[['l','Für uns gelten strengere Regeln.']],
   t:'Schwangere und Mütter bis vier Monate nach der Geburt, Eltern in Elternzeit, schwerbehinderte Menschen (nur mit Zustimmung des Integrationsamts), Betriebsräte und Jugendvertreter, Auszubildende nach der Probezeit.'},
  {h:'Was tun nach der Kündigung?',bg:'out',s:cp(46,'kd',{arm:'out'})+cHouse(96,'Arbeitsgericht','#a08a6a',100)+cHouse(212,'Agentur','#6f9bd6',96)+cCal(120,6,'3 W.'),say:[['l','Ich lasse das prüfen, und zwar schnell.']],
   t:'Der Betriebsrat muss vor jeder Kündigung angehört werden, sonst ist sie unwirksam. Wer klagen will, hat drei Wochen Zeit. Außerdem: sofort bei der Agentur für Arbeit arbeitsuchend melden.'}]}
 ,{tag:'KUP · Lernfeld 10',title:'Lohnt sich die Aktion? Deckungsbeitrag und Gewinnschwelle',why:'Deckungsbeitrag, Preisuntergrenze und Break-even sind sichere Rechenpunkte. Die Formeln sind kurz, man muss nur wissen, welche Kosten wohin gehören.',
  go:['#rechnen','Jetzt selbst rechnen'],merke:['Deckungsbeitrag = Preis minus variable Kosten.','Gewinnschwelle = Fixkosten geteilt durch den Deckungsbeitrag je Stück.','Kurzfristige Preisuntergrenze = variable Kosten.'],
  p:[
  {h:'Die Idee',s:cDesk(30)+cp(72,'chef',{arm:'up'})+cS(120,30,'Wintercheck 60 €','#ffe9a8')+cp(250,'bh',{flip:1,mood:'flat'}),say:[['l','Ein Wintercheck für 60 € netto. Rechnet sich das?']],
   t:'Um das zu beantworten, werden die Kosten getrennt: Welche entstehen mit jedem einzelnen Check, und welche fallen ohnehin an?'},
  {h:'Variabel oder fix?',s:cS(14,26,'variabel: 35 € je Check','#bff0dc')+cS(14,58,'fix: 1.500 € Werbung','#ffd3cc')+cp(250,'bh',{flip:1,arm:'out'}),say:[['r','Material und Lohn je Check sind variabel, die Werbung ist fix.']],
   t:'Variable Kosten steigen mit jeder verkauften Einheit. Fixkosten bleiben gleich, egal ob 10 oder 100 Checks verkauft werden, zum Beispiel Werbung, Miete und Gehälter.'},
  {h:'Der Deckungsbeitrag',s:cS(26,24,'Preis 60 €')+cS(26,56,'− variable Kosten 35 €')+cS(26,94,'= 25 € je Check','#bff0dc')+cp(250,'bh',{flip:1,arm:'out'}),say:[['r','Jeder Check bringt 25 €, um die Fixkosten zu decken.']],
   t:'Der Deckungsbeitrag zeigt, was nach Abzug der variablen Kosten übrig bleibt. Erst wenn alle Fixkosten gedeckt sind, entsteht Gewinn.'},
  {h:'Ab wann lohnt es sich?',s:cPC(26,'Gewinnschwelle',[['Fixkosten','1.500,00'],['DB je Check','25,00']],[['1.500 ÷ 25','= 60'],['Checks','Break-even']],['Zahlen','Rechnung'])+cp(236,'bh',{flip:1,arm:'up'}),say:[['r','Mit dem 60. Check sind wir bei null, ab dem 61. im Plus.']],
   t:'Gewinnschwelle (Break-even) = Fixkosten ÷ Deckungsbeitrag je Stück. Hier: 1.500 ÷ 25 = 60 Checks.'},
  {h:'Wie tief darf der Preis sinken?',s:cS(20,26,'Untergrenze: 35 €','#ffd3cc')+cp(90,'kd',{arm:'up'})+cp(240,'chef',{flip:1,arm:'out',mood:'flat'}),say:[['l','Geht da noch was am Preis?'],['r','Unter 35 € lege ich bei jedem Check drauf.']],
   t:'Kurzfristige Preisuntergrenze sind die variablen Kosten. Langfristig muss der Preis auch die Fixkosten decken, sonst macht der Betrieb Verlust.'},
  {h:'Die Aktion läuft',s:cS(22,24,'100 Checks × 25 € = 2.500 €')+cS(22,56,'− Fixkosten 1.500 €')+cS(22,94,'= 1.000 € Ergebnis','#bff0dc')+cp(266,'chef',{flip:1,arm:'up'}),say:[['r','100 Checks verkauft. Das hat sich gelohnt.']],
   t:'Betriebsergebnis = gesamter Deckungsbeitrag minus Fixkosten. Im Autohaus wird das stufenweise gerechnet: DB 1 (Bruttoertrag), dann DB 2 und DB 3 nach Abzug weiterer zurechenbarer Kosten.'}]}
 ,{tag:'KUP · Lernfeld 10',title:'Wie gesund ist das Autohaus? Kennzahlen aus der Bilanz',why:'Kennzahlen kommen fast immer als Rechenaufgabe mit anschließender Beurteilung. Du brauchst die Formel und einen Satz dazu, was das Ergebnis bedeutet.',
  go:['#rechnen','Jetzt selbst rechnen'],merke:['Eigenkapitalquote = Eigenkapital ÷ Gesamtkapital × 100.','Goldene Bilanzregel: Anlagevermögen langfristig finanzieren.','Liquidität: flüssige Mittel im Verhältnis zu den kurzfristigen Schulden.','Umsatzrentabilität = Gewinn ÷ Umsatzerlöse × 100.'],
  p:[
  {h:'Die Bank fragt nach',bg:'show',s:cDesk(118)+cDoc(140,64,'BILANZ','#0a8a73')+cp(70,'bank',{arm:'out'})+cp(250,'chef',{flip:1,mood:'flat'}),say:[['l','Bevor wir den Kredit verlängern, schauen wir in Ihre Bilanz.']],
   t:'Kennzahlen machen Betriebe vergleichbar: mit dem Vorjahr, mit der Branche und mit den Anforderungen der Bank.'},
  {h:'Die Ausgangszahlen',s:cPC(26,'Bilanz (in Tsd. €)',[['Anlagevermögen','400'],['Umlaufvermögen','600']],[['Eigenkapital','300'],['Fremdkapital','700']],['Aktiva','Passiva'])+cp(236,'bh',{flip:1,arm:'out'}),say:[['r','Vom Fremdkapital sind 300 langfristig und 400 kurzfristig.']],
   t:'Gesamtkapital 1.000 Tsd. €. Im Umlaufvermögen stecken 400 Vorräte, 120 Forderungen und 80 flüssige Mittel.'},
  {h:'Eigenkapitalquote',s:cS(24,26,'300 ÷ 1.000 × 100')+cS(24,60,'= 30 %','#bff0dc')+cp(240,'bh',{flip:1,arm:'up'}),say:[['r','30 % gehören uns selbst.']],
   t:'Eigenkapitalquote = Eigenkapital ÷ Gesamtkapital × 100. Je höher sie ist, desto unabhängiger von Banken und desto krisenfester ist der Betrieb.'},
  {h:'Goldene Bilanzregel',s:cS(14,24,'Deckung I: 300 ÷ 400 = 75 %')+cS(14,56,'Deckung II: 600 ÷ 400 = 150 %','#bff0dc')+cp(266,'bank',{flip:1,arm:'up'}),say:[['r','Langfristiges Vermögen ist langfristig finanziert. Gut.']],
   t:'Anlagendeckung I = Eigenkapital ÷ Anlagevermögen. Anlagendeckung II nimmt das langfristige Fremdkapital dazu. Liegt sie über 100 %, ist die goldene Bilanzregel erfüllt.'},
  {h:'Liquidität',s:cS(14,22,'Liquidität 1: 80 ÷ 400 = 20 %')+cS(14,54,'Liquidität 2: 200 ÷ 400 = 50 %','#ffd3cc')+cS(14,86,'Liquidität 3: 600 ÷ 400 = 150 %')+cp(276,'bank',{flip:1,mood:'flat'}),say:[['r','Kurzfristig ist es bei Ihnen eng.']],
   t:'Stufe 1: flüssige Mittel, Stufe 2: plus Forderungen, Stufe 3: gesamtes Umlaufvermögen, jeweils geteilt durch die kurzfristigen Schulden. Als Faustregel sollte Stufe 2 bei etwa 100 % liegen.'},
  {h:'Rentabilität und Leverage',s:cS(14,14,'EK-Rendite: 45 ÷ 300 = 15 %','#bff0dc')+cS(14,44,'GK-Rendite: 80 ÷ 1.000 = 8 %')+cS(14,74,'FK-Zins: 35 ÷ 700 = 5 %')+cS(14,104,'Umsatzrendite: 45 ÷ 3.000 = 1,5 %','#ffe9a8')+cp(276,'chef',{flip:1,arm:'up'}),say:[['r','Der Kredit kostet 5 % und bringt 8 %.']],
   t:'Gewinn 45, Fremdkapitalzinsen 35, Umsatz 3.000. Umsatzrentabilität = Gewinn ÷ Umsatzerlöse × 100: Von jedem Euro Umsatz bleiben hier 1,5 Cent Gewinn. Gesamtkapitalrentabilität = (Gewinn + Zinsen) ÷ Gesamtkapital. Solange sie über dem Fremdkapitalzins liegt, hebt zusätzliches Fremdkapital die Eigenkapitalrendite (Leverage-Effekt). Kippt das Verhältnis, wirkt der Hebel nach unten.'}]}
 ,{tag:'WiSo · Lernfeld 11',title:'Wie entsteht ein Preis? Angebot und Nachfrage',why:'Preisbildung ist ein Klassiker der WiSo-Prüfung: Gleichgewichtspreis, Käufer- und Verkäufermarkt, Marktformen und staatliche Eingriffe.',
  go:['#quiz','Im Quiz testen'],merke:['Gleichgewichtspreis: angebotene Menge = nachgefragte Menge, der Markt wird geräumt.','Angebotsüberhang = Käufermarkt, Nachfrageüberhang = Verkäufermarkt.','Höchstpreis liegt unter, Mindestpreis über dem Gleichgewichtspreis.'],
  p:[
  {h:'Der Markt',bg:'out',s:cCar(96,94,'#d9822b')+cp(46,'vk',{arm:'out'})+cp(250,'ku',{flip:1,arm:'up'})+cp(292,'kd',{flip:1}),say:[['l','Ich will möglichst viel dafür.'],['r','Und wir möglichst wenig zahlen.']],
   t:'Auf dem Markt treffen Angebot und Nachfrage zusammen. Steigt der Preis, wird mehr angeboten und weniger nachgefragt. Sinkt er, ist es umgekehrt.'},
  {h:'Der Gleichgewichtspreis',s:cChart(24,14)+cp(236,'bh',{flip:1,arm:'out'}),say:[['r','Wo sich die Kurven schneiden, sind alle zufrieden, die zu diesem Preis kaufen oder verkaufen wollen.']],
   t:'Beim Gleichgewichtspreis sind angebotene und nachgefragte Menge gleich groß. Der Markt wird geräumt, die umgesetzte Menge ist am größten.'},
  {h:'Preis zu hoch',s:cChart(24,14,'hi')+cp(220,'vk',{flip:1,mood:'flat'})+cS(176,22,'Angebotsüberhang','#ffd3cc'),say:[['r','Meine Autos stehen sich die Reifen platt.']],
   t:'Liegt der Preis über dem Gleichgewicht, wird mehr angeboten als gekauft. Es entsteht ein Käufermarkt, die Anbieter müssen mit dem Preis runter.'},
  {h:'Preis zu niedrig',s:cChart(24,14,'lo')+cp(220,'ku',{flip:1,arm:'up',mood:'wow'})+cS(172,22,'Nachfrageüberhang','#ffd3cc'),say:[['r','Schon wieder alle weg!']],
   t:'Liegt der Preis darunter, wollen mehr Leute kaufen, als Ware da ist. Im Verkäufermarkt steigen die Preise. Beispiel: Fehlen Neuwagen, werden Gebrauchte teurer.'},
  {h:'Wie viele Anbieter gibt es?',s:cS(10,24,'Polypol: viele')+cS(112,24,'Oligopol: wenige')+cS(230,24,'Monopol: 1')+cp(56,'vk')+cp(92,'kd')+cp(160,'chef')+cp(196,'bank')+cp(268,'bh'),say:[['l','Je weniger Anbieter, desto mehr Macht über den Preis.']],
   t:'Polypol: viele Anbieter und Nachfrager, etwa bei Gebrauchtwagen. Oligopol: wenige große Anbieter, etwa Autohersteller oder Tankstellen. Monopol: ein einziger Anbieter.'},
  {h:'Der Staat greift ein',bg:'out',s:cp(44,'bank',{arm:'out'})+cS(96,26,'Höchstpreis: schützt Käufer','#bff0dc')+cS(96,58,'Mindestpreis: schützt Anbieter')+cS(96,96,'Kartellamt wacht','#ffe9a8'),say:[['l','Und Preisabsprachen sind verboten.']],
   t:'Ein Höchstpreis liegt unter dem Gleichgewichtspreis (Beispiel Mietpreisbremse), ein Mindestpreis darüber (Beispiel Mindestlohn). Das Kartellamt verbietet Absprachen und kontrolliert Fusionen.'}]}
 ,{tag:'WiSo · Lernfeld 11',title:'Auf und ab: Konjunktur, Staat und Zentralbank',why:'Konjunkturphasen, das magische Viereck und die Geldpolitik der EZB werden meist als Zuordnungs- oder Ankreuzaufgabe gefragt.',
  go:['#quiz','Im Quiz testen'],merke:['Vier Phasen: Aufschwung, Boom, Abschwung, Tiefstand.','Antizyklisch: Der Staat gibt im Abschwung mehr aus und spart im Boom.','EZB: Hauptziel Preisstabilität. Leitzins runter belebt, Leitzins rauf bremst.'],
  p:[
  {h:'Die Wirtschaft schwankt',s:cWave(20,24,0)+cp(266,'bh',{flip:1,arm:'out'}),say:[['r','Mal läuft es besser, mal schlechter. Das ist normal.']],
   t:'Die Konjunktur verläuft in Wellen um den langfristigen Wachstumstrend: Aufschwung, Boom (Hochkonjunktur), Abschwung (Rezession) und Tiefstand (Depression). Gemessen wird am realen Bruttoinlandsprodukt.'},
  {h:'Boom im Autohaus',bg:'show',s:cCar(98,94,'#e4472b')+cp(50,'vk',{arm:'up'})+cp(240,'ku',{flip:1,arm:'up'})+cp(284,'kd',{flip:1,arm:'up'}),say:[['l','Lieferzeit sechs Monate, und trotzdem unterschreiben alle.']],
   t:'Im Boom sind die Betriebe ausgelastet, Löhne und Preise steigen, Arbeitskräfte werden knapp. Frühindikatoren wie Auftragseingänge und Geschäftsklima zeigen schon vorher, wohin es geht.'},
  {h:'Der Abschwung',bg:'show',s:cCar(40,94,'#8a8f9c')+cCar(170,94,'#4c6fe0')+cp(160,'vk',{mood:'flat'}),say:[['l','Die Kunden halten ihr Geld zusammen.']],
   t:'Die Nachfrage sinkt, Lager füllen sich, es wird weniger investiert. Arbeitslosigkeit und Preise reagieren erst mit Verzögerung, sie sind Spätindikatoren.'},
  {h:'Der Staat steuert gegen',bg:'out',s:cHouse(14,'Staat','#8d99c4',90)+cCoin(124,104)+cCoin(142,116)+cArrow(158,110,196)+cCar(196,94,'#0a8a73'),say:[['l','Im Abschwung geben wir mehr aus und senken Steuern.']],
   t:'Antizyklische Fiskalpolitik: Im Abschwung stützt der Staat die Nachfrage, etwa mit Investitionen oder einer Kaufprämie. Im Boom soll er sparen und Schulden abbauen.'},
  {h:'Die EZB dreht am Zins',bg:'out',s:cHouse(14,'EZB','#6f9bd6',90)+cS(112,14,'Leitzins runter: belebt','#bff0dc')+cS(112,44,'Leitzins rauf: bremst','#ffd3cc')+cp(284,'bank',{flip:1}),say:[['r','Unser Hauptziel ist Preisstabilität.']],
   t:'Sinkt der Leitzins, werden Kredite billiger, es wird mehr gekauft und investiert (expansiv). Steigt er, wird Geld teurer und die Inflation gebremst (kontraktiv). Angestrebt werden rund 2 % Inflation.'},
  {h:'Das magische Viereck',s:cS(10,22,'stabile Preise')+cS(124,22,'hohe Beschäftigung')+cS(10,56,'Wachstum')+cS(86,56,'Gleichgewicht im Außenhandel')+cp(294,'chef',{flip:1,mood:'flat'}),say:[['r','Alle vier gleichzeitig? Das wäre Zauberei.']],
   t:'Die vier Ziele der Wirtschaftspolitik lassen sich nie alle zugleich voll erreichen, deshalb „magisch“. Mit gerechter Verteilung und Umweltschutz wird daraus das magische Sechseck.'}]}
 ,{tag:'WiSo · Lernfeld 1',title:'Ein Autohaus wird gegründet: Rechtsform, Register, Vollmachten',why:'Haftung, Handelsregister und Vollmachten gehören zum festen Stoff in WiSo. Gefragt wird meist: Wer haftet womit, und wer darf was unterschreiben?',
  go:['#karten','Karten dazu lernen'],merke:['Einzelunternehmen und OHG: Haftung auch mit dem Privatvermögen. GmbH: nur mit dem Gesellschaftsvermögen.','Handelsregister Abteilung A: Einzelkaufleute und Personengesellschaften. Abteilung B: Kapitalgesellschaften.','Prokura (ppa.) geht weiter als Handlungsvollmacht (i. V.) und steht im Handelsregister.'],
  p:[
  {h:'Die Idee',s:cp(100,'kd',{arm:'up'})+cp(220,'neu',{flip:1,arm:'up'})+cS(96,26,'Unser Autohaus','#ffe9a8'),say:[['l','Wir machen uns selbstständig!'],['r','Aber in welcher Rechtsform?']],
